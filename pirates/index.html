<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2aa7d8">
<title>Pirate Seas</title>
<meta name="apple-mobile-web-app-title" content="Pirate Seas">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--card:#fffdf6;--text:#1d1b3a;--dim:#5d5a80;--yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a;--red:#ff5a4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#3fb4ee,#bfeaff);color:var(--text);font-family:'Fredoka',system-ui,sans-serif;font-weight:600;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch;z-index:10}
.screen.on{display:flex}
#menu,#slots,#lobby{background:rgba(20,70,120,.22)}
.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:16px 18px 14px;width:min(470px,100%);box-shadow:0 8px 0 var(--ink);margin:auto;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.card.wide{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(40px,10vw,60px);line-height:.92;letter-spacing:1px;text-align:center;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-2deg)}
h1 span{color:var(--blue)}
h2{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:30px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.sub{text-align:center;color:var(--dim);margin:8px 0 10px;font-size:14px}
label{display:block;font-size:13px;color:var(--dim);margin:8px 0 4px;letter-spacing:.6px;text-transform:uppercase}
input[type=text],textarea{min-height:48px;width:100%;font:600 18px 'Fredoka',sans-serif;color:var(--ink);background:#eef6ff;border:3px solid var(--ink);border-radius:14px;padding:9px 12px;outline:none;user-select:text;-webkit-user-select:text}
textarea{font-size:13px;height:70px;resize:none}
.btn{display:block;width:100%;font:400 20px 'Lilita One',sans-serif;letter-spacing:.5px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:15px;padding:9px 10px;margin-top:9px;cursor:pointer;box-shadow:0 5px 0 var(--ink);min-height:48px;text-decoration:none;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.ghost{background:#fff}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.red{background:var(--red);color:#fff}
.btn.sm{font-size:16px;padding:4px 10px;margin:0;box-shadow:0 3px 0 var(--ink);display:inline-block;width:auto;min-width:48px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row2{display:flex;gap:9px}.row2 .btn{flex:1}
.join{display:flex;gap:9px;margin-top:9px}
.join input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Lilita One',sans-serif;font-size:22px;padding:6px}
.join .btn{width:auto;margin:0;padding:0 20px;flex:none}
.invite{background:#fff2b8;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:6px;text-align:center;font-size:15px}
.code{font-family:'Lilita One',sans-serif;font-size:48px;letter-spacing:9px;text-align:center;color:var(--blue);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin:0;cursor:pointer}
.plist{margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pl{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-size:15px;min-width:0}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl i{flex:none;width:16px;height:16px;border-radius:50%;background:currentColor;border:2.5px solid var(--ink)}
.pl small{margin-left:auto;color:var(--dim);font-size:12px}.pl.empty{opacity:.45;border-style:dashed}
.slot{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 10px;margin-top:8px}
.slot .si{flex:1;min-width:0;font-size:15px;line-height:1.25}.slot .si b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:18px;display:block}
.slot .si small{color:var(--dim);font-size:12px;display:block}
.slot .btn{margin:0}
.tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;font:400 16px 'Lilita One',sans-serif;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:4px 12px;min-height:48px;cursor:pointer}
.tab.on{background:var(--yellow);transform:translateY(-2px);box-shadow:0 3px 0 var(--ink)}
#mbody{max-height:calc(100vh - 190px);overflow:auto;-webkit-overflow-scrolling:touch;padding:2px}
.rowi{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;margin:6px 0;font-size:15px}
.rowi .n{flex:1;min-width:0;line-height:1.2}.rowi .n small{display:block;color:var(--dim);font-size:12px;font-weight:600}
.rowi .e{font-size:24px;width:32px;text-align:center}
.rowi .p{font-family:'Lilita One',sans-serif;font-size:17px;min-width:56px;text-align:right}
.up{color:#1a9a3a}.dn{color:#d63c2f}
.bar{height:12px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--green)}
.sec{font:400 17px 'Lilita One',sans-serif;margin:10px 2px 2px;color:var(--ink)}
.chipsel{display:inline-block;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);margin:3px;vertical-align:middle;cursor:pointer}.chipsel.on{box-shadow:0 0 0 4px var(--yellow);transform:scale(1.1)}
/* HUD */
#hud{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
body.playing #hud{display:block}
#hud>*{pointer-events:auto}
#zoneL,#zoneR{position:absolute;touch-action:none;pointer-events:auto}
#zoneL{left:0;bottom:0;width:46%;height:72%}#zoneR{right:0;top:0;width:54%;height:100%}
#chips{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:4px;pointer-events:none}
.chip{background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:12px;padding:1px 9px;font-size:14px;font-family:'Lilita One',sans-serif;font-weight:400;box-shadow:0 3px 0 var(--ink);align-self:flex-start;line-height:1.35}
#obj{position:absolute;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);max-width:34vw;text-align:center;font:400 15px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;pointer-events:none;line-height:1.15}
#tr{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;align-items:flex-start}
#tr .col{display:flex;flex-direction:column;gap:6px}
.ib{width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:20px;cursor:pointer;padding:0;line-height:1}
.ib:active{transform:translateY(3px);box-shadow:none}
#mini{width:104px;height:104px;border-radius:50%;border:3px solid var(--ink);background:#6cc8ee;box-shadow:0 3px 0 var(--ink);cursor:pointer;display:block}
#pills{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 62px);transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:46vw}
.pill{font:400 17px 'Lilita One',sans-serif;border:3px solid var(--ink);border-radius:24px;background:var(--yellow);padding:4px 16px;min-height:48px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:none;animation:bob .9s ease-in-out infinite alternate}
.pill.on{display:block}.pill.red{background:var(--red);color:#fff}
@keyframes bob{to{transform:translateY(-4px)}}
#joyBase{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:4px solid rgba(29,27,58,.55);background:rgba(255,255,255,.3);pointer-events:none;display:none}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#joyHint{position:absolute;left:max(36px,env(safe-area-inset-left));bottom:max(30px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:4px dashed rgba(29,27,58,.35);pointer-events:none}
#bAct{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);background:var(--pink);color:#fff;font:400 19px 'Lilita One',sans-serif;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;box-shadow:0 6px 0 var(--ink);touch-action:none;line-height:1.05;padding:4px}
#bAct:active,#bAct.dn2{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#bAct.off{filter:grayscale(.8);opacity:.7}
#bLeave{position:absolute;right:max(124px,calc(env(safe-area-inset-right) + 124px));bottom:max(16px,env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:#fff;font:400 20px 'Lilita One',sans-serif;box-shadow:0 4px 0 var(--ink);display:none;padding:0}
#uiHelm{position:absolute;right:max(184px,calc(env(safe-area-inset-right) + 184px));bottom:max(10px,env(safe-area-inset-bottom));width:132px;height:132px;display:none;touch-action:none}
#dial{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.35);border:4px solid rgba(29,27,58,.5);display:flex;align-items:center;justify-content:center;touch-action:none}
#dial svg{width:120px;height:120px;pointer-events:none}
#uiSail{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 108px);width:56px;height:140px;display:none;touch-action:none}
#sailTrack{position:absolute;left:18px;top:0;width:20px;height:100%;background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);touch-action:none}
#sailFill{position:absolute;left:0;bottom:0;width:100%;background:var(--blue);border-radius:8px}
#sailKnob{position:absolute;left:-12px;width:44px;height:26px;margin-bottom:-13px;border-radius:10px;background:var(--yellow);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font:400 12px 'Lilita One';text-align:center;line-height:20px}
#stnName{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);font:400 18px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-align:center;pointer-events:none;max-width:40vw;line-height:1.15}
body.modal-open #hud,body.modal-open #pins{visibility:hidden}
#pins{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-100%);font:400 13px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;white-space:nowrap;text-align:center;will-change:left,top}
.pin .hp{width:54px;height:8px;border:2px solid var(--ink);border-radius:5px;background:#fff;margin:1px auto 0;overflow:hidden}.pin .hp i{display:block;height:100%;background:var(--red)}
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-30px) scale(.8);opacity:0;z-index:25;text-align:center;font:400 clamp(26px,6vw,46px) 'Lilita One',sans-serif;color:var(--yellow);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);pointer-events:none;transition:.3s cubic-bezier(.3,1.6,.5,1);width:90vw}
#banner small{display:block;font-size:.42em;color:#fff;-webkit-text-stroke:3px var(--ink);margin-top:2px}
#banner.on{opacity:1;transform:translate(-50%,0) scale(1)}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120px);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 16px;border-radius:15px;z-index:30;transition:transform .25s cubic-bezier(.3,1.6,.5,1);max-width:90vw;text-align:center;font-size:15px;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
#board{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;display:none;text-align:center;font:400 28px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;pointer-events:none}
#board .bar{width:220px;margin:6px auto;height:18px}
#rotate{position:fixed;inset:0;background:linear-gradient(#3fb4ee,#bfeaff);z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px;font:400 28px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#rotate .ph{font-size:76px;animation:rot 1.6s ease-in-out infinite;-webkit-text-stroke:0}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (max-height:400px){.screen{padding-top:max(5px,env(safe-area-inset-top));padding-bottom:4px}h1{font-size:30px}}
.imp{align-items:stretch;flex-wrap:wrap}.imp textarea{flex:2 1 150px;height:auto;min-height:48px;margin-top:9px}.imp .btn{flex:1 1 90px}
@media (max-width:480px){.imp textarea{flex:1 1 100%}}
@media (orientation:portrait){body.playing.touch #rotate{display:flex}}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:24}
.kbd{font-size:13px;color:var(--dim);line-height:1.5}
@media (max-height:500px){.card{padding:10px 14px 10px}h1{font-size:34px;transform:none}.sub{margin:4px 0 6px;font-size:13px}.btn{padding:3px 8px;margin-top:6px;font-size:17px}label{margin:4px 0 2px}.code{font-size:34px}#mbody{max-height:calc(100vh - 170px)}.slot{margin-top:5px;padding:3px 8px}h2{font-size:24px;margin:0}.card h2+#slotList{margin-top:0}
 #mini{width:84px;height:84px}.ib{width:48px;height:48px}#bAct{width:84px;height:84px;font-size:16px}#bLeave{right:max(112px,calc(env(safe-area-inset-right) + 112px))}#uiHelm{width:112px;height:112px;right:max(168px,calc(env(safe-area-inset-right) + 168px))}#dial svg{width:100px;height:100px}#uiSail{height:112px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 94px)}.chip{font-size:13px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="pins"></div>

<div id="hud">
  <div id="zoneL"></div><div id="zoneR"></div>
  <div id="joyHint"></div><div id="joyBase"><div id="joyKnob"></div></div>
  <div id="chips"><div class="chip" id="cGold">💰 0</div><div class="chip" id="cCargo">🎒 0/20</div><div class="chip" id="cLvl">⭐ Lv1</div><div class="chip" id="cHp">⚓ 100%</div></div>
  <div id="obj"></div>
  <div id="tr"><div class="col"><button class="ib" id="bMenu" aria-label="menu">☰</button><button class="ib" id="bMute" aria-label="sound">🔊</button></div><canvas id="mini" width="208" height="208"></canvas></div>
  <div id="pills"><button class="pill" id="bPort">⚓ PORT</button><button class="pill" id="bAshore">🏝 GO ASHORE</button><button class="pill" id="bShip">⛵ BACK TO SHIP</button><button class="pill red" id="bBoard">⚔ BOARD!</button></div>
  <div id="uiHelm"><div id="dial"><svg viewBox="0 0 120 120" id="wheelSvg"><g id="wheelG" style="transform-origin:60px 60px"><circle cx="60" cy="60" r="46" fill="none" stroke="#1d1b3a" stroke-width="14"/><circle cx="60" cy="60" r="46" fill="none" stroke="#c98a4b" stroke-width="8"/><g stroke="#1d1b3a" stroke-width="12" stroke-linecap="round"><path d="M60 8V112M8 60H112M23 23L97 97M97 23L23 97"/></g><g stroke="#c98a4b" stroke-width="6" stroke-linecap="round"><path d="M60 8V112M8 60H112M23 23L97 97M97 23L23 97"/></g><circle cx="60" cy="60" r="12" fill="#ffd23f" stroke="#1d1b3a" stroke-width="5"/><circle cx="60" cy="9" r="6" fill="#ff5a4d" stroke="#1d1b3a" stroke-width="3"/></g></svg></div></div>
  <div id="uiSail"><div id="sailTrack"><div id="sailFill"></div><div id="sailKnob">SAIL</div></div></div>
  <button id="bLeave" aria-label="leave station">✕</button>
  <button id="bAct">ACTION</button>
  <div id="stnName"></div>
</div>

<div id="menu" class="screen on">
  <div class="card">
    <h1>PIRATE<br><span>SEAS</span></h1>
    <div class="sub">Crew one ship with friends. Sail, trade, battle, find treasure!</div>
    <div id="invite" class="invite" style="display:none">You've been invited to crew <b id="invCode"></b></div>
    <label for="name">Your pirate name</label>
    <input id="name" type="text" maxlength="10" placeholder="Name" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="btnInvite" class="btn pink" style="display:none">JOIN THE CREW</button>
    <button id="btnPlay" class="btn">⚓ SET SAIL</button>
    <div class="join"><input id="joinCode" type="text" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="btnJoin" class="btn ghost">JOIN</button></div>
    <div class="row2"><button id="btnHelp" class="btn ghost">How to play</button><a class="btn ghost" href="../">◀ Arcade</a></div>
  </div>
</div>

<div id="slots" class="screen"><div class="card">
  <h2>YOUR VOYAGES</h2>
  <div id="slotList"></div>
  <label>Backup / move to another phone</label>
  <div class="row2 imp"><textarea id="impText" placeholder="Paste a save code here to import" spellcheck="false"></textarea><button id="btnImp" class="btn ghost">Import</button><button id="btnSlotsBack" class="btn ghost">Back</button></div>
</div></div>

<div id="lobby" class="screen"><div class="card">
  <h2 id="lobTitle">THE CREW</h2>
  <div id="lobHint" class="sub" style="margin:0"></div>
  <div id="codeWrap"><div class="code" id="lobCode">----</div></div>
  <div class="plist" id="plist"></div>
  <button id="btnNet" class="btn blue">🌐 INVITE FRIENDS (go online)</button>
  <button id="btnShare" class="btn pink">📲 SHARE INVITE LINK</button>
  <div class="row2"><button id="btnStart" class="btn green">SET SAIL ▶</button><button id="btnLeave1" class="btn ghost" style="flex:.5">Back</button></div>
</div></div>

<div id="modal" class="screen"><div class="card wide">
  <div class="tabs" id="tabs"></div><div id="mbody"></div>
  <button id="mclose" class="btn ghost">Close</button>
</div></div>

<div id="board"><div id="boardT">BOARDING!</div><div class="bar"><i id="boardBar"></i></div><div style="font-size:16px">TAP ACTION!</div></div>
<div id="banner"></div><div id="toast"></div><div id="fade"></div>
<div id="rotate"><div class="ph">📱</div>Rotate your phone sideways</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  if(c.startsWith('PS0:'))return JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));
