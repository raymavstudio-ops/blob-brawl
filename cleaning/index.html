<html lang="en">

<style>
:root{--ink:#1d1b3a;--card:#fffdf6;--dim:#5d5a80;--yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a;--orange:#ffa23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#7fd0ff,#d8f5ff);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;font-weight:600;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch;z-index:20}
.screen.on{display:flex}
#title{z-index:25}
#panel{z-index:30;background:rgba(29,27,58,.38)}
#result{z-index:28;background:rgba(29,27,58,.45)}
.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:16px 18px 14px;width:min(480px,100%);box-shadow:0 8px 0 var(--ink);margin:auto;animation:pop .3s cubic-bezier(.3,1.6,.5,1);max-height:calc(100vh - 20px);display:flex;flex-direction:column}
.card.wide{width:min(700px,100%)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(44px,11vw,64px);line-height:.92;letter-spacing:1px;text-align:center;color:#4cc9ff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-3deg)}
h1 span{color:var(--yellow)}
h2{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:32px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.sub{text-align:center;color:var(--dim);margin:8px 0 10px;font-size:15px}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px;letter-spacing:.6px;text-transform:uppercase}
input[type=text],textarea{min-height:44px;width:100%;font:600 18px 'Fredoka',sans-serif;color:var(--ink);background:#eef6ff;border:3px solid var(--ink);border-radius:14px;padding:9px 13px;outline:none;user-select:text;-webkit-user-select:text}

input[type=text]:focus,textarea:focus{background:#fff;box-shadow:0 0 0 4px rgba(76,201,255,.45)}
.btn{display:block;width:100%;font:400 20px 'Lilita One',sans-serif;letter-spacing:.5px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:15px;padding:10px;margin-top:9px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-height:48px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.ghost{background:#fff}
.btn.sm{font-size:16px;padding:6px 12px;margin-top:0;min-height:48px;width:auto;box-shadow:0 4px 0 var(--ink)}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.join{display:flex;gap:10px;margin-top:9px}
.join input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Lilita One',sans-serif;font-size:22px;padding:8px}
.join .btn{width:auto;margin:0;padding:0 22px;flex:none}
.invite{background:#fff2b8;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:6px;text-align:center;font-size:15px}
.slots{display:grid;gap:8px;margin:8px 0}
.slot-c{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:15px;background:#fff;border:3px solid var(--ink);cursor:pointer;min-height:56px}
.slot-c.sel{background:#fff2b8;box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.slot-c .si{font-size:28px;width:38px;text-align:center}
.slot-c small{display:block;color:var(--dim);font-size:12px;font-weight:600}
.slot-c b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:17px}
.code{font-family:'Lilita One',sans-serif;font-size:50px;letter-spacing:10px;text-align:center;color:var(--blue);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin:0;cursor:pointer}
.pbody{overflow:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding:2px}
.ptabs{display:flex;gap:6px;margin:4px 0 8px;overflow-x:auto;flex:none}
.ptab{flex:none;font:400 15px 'Lilita One',sans-serif;padding:6px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;min-height:48px}
.ptab.sel{background:var(--yellow)}
.ptab.lock{opacity:.5}
.lr{display:flex;align-items:center;gap:10px;padding:7px 10px;border:3px solid var(--ink);border-radius:14px;background:#fff;margin-bottom:7px}
.lr .ico{flex:none;width:44px;height:44px;font-size:30px;display:flex;align-items:center;justify-content:center}
.lr .tx{flex:1;min-width:0;font-size:15px;line-height:1.15}
.lr .tx small{display:block;color:var(--dim);font-size:12px;font-weight:600;margin-top:2px}
.lr.done{background:#e4ffd8}.lr.cur{background:#fff2b8}.lr.lock{opacity:.6;background:#eceaf5}
.lr .btn{margin:0;flex:none;width:auto;min-width:84px;padding:4px 12px;font-size:16px}
.ribbon{display:inline-block;background:var(--pink);color:#fff;font:400 12px 'Lilita One',sans-serif;border:2px solid var(--ink);border-radius:9px;padding:0 6px;margin-left:4px;vertical-align:middle}
.bar{height:12px;border:2.5px solid var(--ink);border-radius:8px;background:#e6e8f2;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green);width:0}
.note{font-size:13px;color:var(--dim);text-align:center;margin:6px 0}
.stars{letter-spacing:1px;color:#ffb300;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:2px solid var(--ink);background:#eef;margin-left:4px}
.pill.g{background:#d6ffc9}.pill.r{background:#ffd0d0}
/* HUD */
#hud,#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:6}
body.playing #hud{display:block}
body.pan #hud,body.pan #touch,body.pan #reticle{visibility:hidden}
body.playing.touch.mode-job #touch{display:block}
body:not(.mode-job) .jobOnly{display:none!important}
body:not(.mode-hub) .hubOnly{display:none!important}
.chip{position:absolute;display:flex;align-items:center;gap:7px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 11px;font:600 15px 'Fredoka',sans-serif;box-shadow:0 3px 0 var(--ink);min-height:34px;white-space:nowrap}
#topL{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px}
#topL .chip{position:static}
.xpbar{width:54px;height:10px;border:2.5px solid var(--ink);border-radius:6px;background:#e6e8f2;overflow:hidden}.xpbar i{display:block;height:100%;width:0;background:var(--blue)}
#topC{position:absolute;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);width:min(250px,34vw);background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:2px 9px 4px;text-align:center;font-size:13px;line-height:1.1}
#topC b{font:400 15px 'Lilita One',sans-serif}
#pbar{position:relative;height:16px;border:2.5px solid var(--ink);border-radius:9px;background:#e6e8f2;overflow:hidden;margin-top:2px}
#pbar i{display:block;height:100%;width:0;background:linear-gradient(#8cf0ff,#4cc9ff)}
#pbar span{position:absolute;inset:0;font:400 12px/12px 'Lilita One',sans-serif;color:var(--ink);text-align:center;letter-spacing:.5px}
#timer{position:absolute;left:50%;transform:translateX(-50%);top:max(62px,calc(env(safe-area-inset-top) + 58px));font-size:12px;min-height:26px;padding:0 10px}
#timer.ok{background:#d6ffc9}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:max(92px,calc(env(safe-area-inset-top) + 88px));background:#fff2b8;border:3px solid var(--ink);border-radius:14px;padding:4px 12px;font-size:14px;max-width:min(420px,60vw);text-align:center;box-shadow:0 3px 0 var(--ink);display:none;pointer-events:auto}
#topR{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
.rb{width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:21px;cursor:pointer;padding:0;position:relative}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.rb.arm{background:var(--pink);color:#fff;font:400 14px 'Lilita One',sans-serif}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.mgrid .full{grid-column:1/-1}
.rb .bdg{position:absolute;right:-6px;top:-8px;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:10px;font:400 12px 'Lilita One',sans-serif;padding:0 5px;display:none}
#roomChip{right:max(8px,env(safe-area-inset-right));top:max(62px,calc(env(safe-area-inset-top) + 60px));font-size:12px;min-height:28px;padding:1px 9px;display:none}
#tools{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:4px;pointer-events:auto;background:rgba(255,255,255,.6);padding:4px;border-radius:18px;border:3px solid var(--ink);align-items:center}
.tb{position:relative;width:48px;height:48px;border-radius:12px;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:25px;cursor:pointer;padding:0}
.tb.sel{background:#fff2b8;border-color:#e0457b;transform:translateY(-6px);box-shadow:0 5px 0 var(--ink)}
.tb .k{position:absolute;left:3px;top:-1px;font:600 11px 'Fredoka',sans-serif;color:var(--dim)}
.tb .nz{position:absolute;right:1px;bottom:-2px;font:400 12px 'Lilita One',sans-serif;background:var(--yellow);border:2px solid var(--ink);border-radius:7px;padding:0 4px;line-height:13px}
body.touch .tb .k{display:none}
#tankW{width:12px;height:48px;border:3px solid var(--ink);border-radius:8px;background:#fff;position:relative;overflow:hidden;margin-left:2px}
#tankW i{position:absolute;left:0;right:0;bottom:0;background:#ff9fd6;height:100%}
#liftB{position:absolute;right:max(14px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:8px;pointer-events:auto}
#liftB .rb{touch-action:none}
#finBtn{pointer-events:auto;position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:none;width:auto;min-width:96px;font-size:17px;margin:0}
#tip{position:absolute;pointer-events:auto;display:none;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 9px;font-size:13px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;z-index:7;cursor:pointer}
#hubBar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));display:none;gap:10px;pointer-events:auto}
#hubBar .btn{width:auto;margin:0;min-width:104px;padding:8px 14px}
body.mode-hub #hubBar{display:flex}
#hubInfo{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(54px,calc(env(safe-area-inset-top) + 52px));font-size:12px;max-width:min(300px,46vw);white-space:normal;line-height:1.15;padding:3px 9px;pointer-events:auto;cursor:pointer;min-height:30px;display:block}
.jbase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:4px solid rgba(29,27,58,.55);background:rgba(255,255,255,.3);display:none}
.jknob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#reticle{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 3px var(--ink),inset 0 0 0 2px var(--ink);pointer-events:none;display:none;z-index:7}
#reticle::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:var(--ink);border-radius:50%}
#reticle.bad{border-color:#ff7a5a}#reticle.far{border-color:#ffd23f}
#pops .tag{position:absolute;transform:translate(-50%,-100%);font:600 13px 'Fredoka',sans-serif;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:0 8px;white-space:nowrap}
#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.pop{position:absolute;transform:translate(-50%,-50%);font:400 22px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;animation:rise 1.3s ease-out forwards;white-space:nowrap}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-64px}}
#fade{position:fixed;inset:0;background:#1d1b3a;opacity:0;pointer-events:none;z-index:35;transition:opacity .28s}
#fade.on{opacity:1}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%) translateY(-160px);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 16px;border-radius:15px;z-index:40;transition:transform .25s cubic-bezier(.3,1.6,.5,1);max-width:88vw;text-align:center;font-size:15px;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
#rotate{position:fixed;inset:0;background:linear-gradient(#7fd0ff,#d8f5ff);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px;font:400 28px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#rotate .ph{font-size:76px;animation:rot 1.6s ease-in-out infinite;-webkit-text-stroke:0}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.touch.playing #rotate{display:flex}}
#lvlpop{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:31;display:none;text-align:center;pointer-events:none}
#lvlpop.on{display:block;animation:lv 2.4s ease-out forwards}
#lvlpop b{font:400 54px 'Lilita One',sans-serif;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);display:block}
#lvlpop span{font:400 20px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
@keyframes lv{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
/* results */
#rcard{width:min(760px,100%)}
#baWrap{position:relative;width:100%;aspect-ratio:16/9;max-height:46vh;border:4px solid var(--ink);border-radius:16px;overflow:hidden;background:#cde;touch-action:none;cursor:ew-resize;margin:auto}
#baWrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#baAfter{clip-path:inset(0 0 0 50%)}
#baLine{position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 0 2px var(--ink);pointer-events:none}
#baKnob{position:absolute;top:50%;left:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);font:400 16px/32px 'Lilita One',sans-serif;text-align:center;pointer-events:none}
.balab{position:absolute;top:6px;background:#fff;border:2.5px solid var(--ink);border-radius:10px;font:400 14px 'Lilita One',sans-serif;padding:0 8px;pointer-events:none}
.rgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:center}
.rstars{font-size:40px;text-align:center;line-height:1}
.rline{display:flex;justify-content:space-between;font-size:15px;padding:1px 0}
.rline b{font-family:'Lilita One',sans-serif;font-weight:400}
.cust{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:14px;line-height:1.2;margin:6px 0}
@media (max-height:420px){h1{font-size:34px!important;transform:none}.sub{margin:3px 0 3px;font-size:13px}.card{padding:8px 14px 8px;border-radius:20px}.btn{padding:3px 8px;margin-top:6px;font-size:17px}input[type=text]{padding:2px 12px}.slots{margin:4px 0;gap:5px}.slot-c{min-height:50px;padding:4px 10px}.code{font-size:34px}label{margin:3px 0 2px}.join{margin-top:6px}h2{font-size:24px;margin-bottom:2px}.ptabs{margin:2px 0 4px}.lr{padding:4px 8px;margin-bottom:5px}#tcard{width:min(780px,100%);display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}.tcol{min-width:0}.rstars{font-size:30px}.rline{font-size:13px}.cust{font-size:12px;padding:3px 8px;margin:3px 0}}
@media (max-height:420px){#pcard .sub{display:none}.ptab{min-height:44px;padding:2px 10px;font-size:14px}.ptabs{margin:0 0 4px}#pcard>.btn,#pcard .row2 .btn{min-height:44px;margin-top:5px;padding:2px 8px}.mgrid .btn{margin-top:0}#pcard h2{font-size:22px;margin-bottom:2px}.lr .btn.sm{min-height:44px}.card{padding:8px 14px 8px;max-height:calc(100vh - 10px)}.lr .ico{width:36px;font-size:26px}}
@media (max-height:380px){.chip{min-height:30px;padding:2px 9px;font-size:14px}#toast{top:56px}#hint{top:82px;font-size:12px;padding:2px 10px}#baWrap{max-height:40vh}}
@media (max-width:760px) and (max-height:420px){#topC{width:min(210px,30vw)}.tb{width:44px;height:44px;font-size:22px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="pops"></div>
<div id="reticle"></div>

<div id="hud">
  <div id="topL"><div class="chip" id="cMoney">💰 <b id="vMoney">0</b></div><div class="chip" id="cLvl">Lv <b id="vLvl">1</b><div class="xpbar"><i id="xpFill"></i></div></div></div>
  <div id="topC" class="jobOnly"><b id="jName">Job</b><div id="pbar"><i id="pFill"></i><span id="pTxt">0%</span></div></div>
  <div class="chip jobOnly" id="timer">⏱ 0:00</div>
  <div id="hint"></div>
  <div id="topR"><button class="rb" id="bMute" aria-label="sound">🔊</button><button class="rb" id="bMenu" aria-label="menu">☰</button><button class="rb jobOnly" id="bQuit" aria-label="quit">✕</button></div>
  <div class="chip" id="roomChip"></div>
  <div class="chip hubOnly" id="hubInfo"></div>
  <div id="tools" class="jobOnly flex"></div>
  <div id="liftB"><button class="rb" id="bUp" aria-label="lift up">▲</button><button class="rb" id="bDown" aria-label="lift down">▼</button></div>
  <button class="btn green jobOnly" id="finBtn">✔ FINISH</button>
  <div id="tip"></div>
  <div id="hubBar"><button class="btn" id="hbBoard">📋 JOBS</button><button class="btn pink" id="hbShop">🛒 SHOP</button><button class="btn blue" id="hbStyle">👕 STYLE</button></div>
</div>
<div id="touch"><div id="joyBase" class="jbase"><div class="jknob"></div></div></div>
<div id="lvlpop"><b>LEVEL UP!</b><span id="lvtxt"></span></div>

<div id="title" class="screen on">
  <div class="card" id="tcard"><div class="tcol">
    <h1 class="tl">BLOB<br><span>CLEANING</span></h1>
    <div class="sub">Power-wash, scrub &amp; sparkle. Calm, satisfying, no fail.</div>
    <div id="invite" class="invite" style="display:none">You've been invited to clean together: <b id="invCode"></b></div>
    <label for="name">Your name</label>
    <input id="name" type="text" maxlength="10" placeholder="Name" autocomplete="off" autocapitalize="off" spellcheck="false">

async function decodeSave(str){str=String(str).trim().replace(/\s+/g,'');const pre=str.slice(0,4);if(pre!=='CL0:'&&pre!=='CL1:')throw new Error('bad code');
  const bin=atob(str.slice(4));let bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(pre==='CL1:'){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer())}

const _TA=new THREE.Vector3(),_TD=new THREE.Vector3(),_TN=new THREE.Vector3(),_TP=new THREE.Vector3();
const _CP=new THREE.Vector3(),_CL=new THREE.Vector3(),_CD=new THREE.Vector3();
function cands(P0,N0){const out=[];let hx=N0.x,hz=N0.z,hl=Math.hypot(hx,hz);if(hl<.3){hx=P0.x;hz=P0.z;hl=Math.hypot(hx,hz)||1}hx/=hl;hz/=hl;
  for(const d of[1.5,2.4,3.4,4.6,6.2])for(const ang of[0,.5,-.5,1,-1,1.5,-1.5])for(const dy of[0,.7,-.5,1.5]){const c=Math.cos(ang),s=Math.sin(ang),dx=hx*c+hz*s,dz=-hx*s+hz*c;out.push([P0.x+dx*d,P0.y+N0.y*d*(Math.abs(ang)>1.2?.2:.7)+dy,P0.z+dz*d])}
  for(const az of[0,.4,-.4,.8,-.8,1.2,-1.2,2.4,-2.4,Math.PI])for(const d of[2.2,3.4,4.8])for(const dy of[0,1.2]){out.push([P0.x+Math.sin(az)*d,P0.y+dy+.3,P0.z+Math.cos(az)*d])}
  return out}
function reachCell(p,idx,doSpray){const t=p.type[idx],tool=DT[t].tool,g=gearTool(SAVE,tool),lm=liftMax(SAVE.gear.lift);
  const cu=((idx%p.gx)+.5)/p.gx,cv=(((idx/p.gx)|0)+.5)/p.gy;cellWorld(p,idx,_TP);const P0=_TP.clone();p_norm(p,cu,_TN);const N0=_TN.clone();
  for(const X of cands(P0,N0)){
    let th=Math.atan2(X[0],X[2]);if(J.def.arc)th=clamp(th,J.def.arc[0],J.def.arc[1]);const T=footT(th),gap=clamp(Math.hypot(X[0],X[2])-T,.9,5.2),lift=clamp(X[1]-.68,0,lm);
    ME.th=th;ME.gap=gap;ME.lift=lift;pose();ME.x=ME.tx;ME.z=ME.tz;ME.y=ME.ty;ME.yaw=Math.atan2(P0.x-ME.x,P0.z-ME.z);
    camDesired(_CP,_CL);_CD.copy(P0).sub(_CP);const cd=_CD.length();_CD.multiplyScalar(1/cd);const ch=castFrom(_CP,_CD,cd+.5);
    if(!ch||ch.object!==p.mesh||!ch.uv)continue;let du=(ch.uv.x-cu)*p.gx;if(p.wrap&&Math.abs(du)>p.gx/2)du-=Math.sign(du)*p.gx;const dv=(ch.uv.y-cv)*p.gy;if(Math.abs(du)>1.3||Math.abs(dv)>1.3)continue;
    const H=ch.point;nozzleOrigin(ME.x,ME.y+(lift>.03?.1:0),ME.z,ME.yaw,H.x,H.y,H.z,_TA);_TD.copy(H).sub(_TA);const dist=_TD.length();if(dist>g.range-.05||dist<.04)continue;_TD.multiplyScalar(1/dist);
    const nh=castFrom(_TA,_TD,dist+.3);if(nh&&nh.object!==p.mesh&&nh.distance<dist-.12)continue;
    if(!doSpray)return{ok:1,th,gap,lift,dist,tool};
    for(let k=0;k<90&&p.q[idx];k++){const r=sprayPanel(p,ch.uv.x,ch.uv.y,tool,g.r,g.rate,.1);if(!r.hit)break}
    if(!p.q[idx])return{ok:1,th,gap,lift,dist,tool}}
  return null}

function whyFail(p,idx){const t=p.type[idx],tool=DT[t].tool,g=gearTool(SAVE,tool),lm=liftMax(SAVE.gear.lift);const R={camNone:0,camOther:{},uv:0,range:0,blocked:{},ok:0,rangeMax:g.range};
  const cu=((idx%p.gx)+.5)/p.gx,cv=(((idx/p.gx)|0)+.5)/p.gy;cellWorld(p,idx,_TP);const P0=_TP.clone();p_norm(p,cu,_TN);const N0=_TN.clone();
  for(const X of cands(P0,N0)){
    let th=Math.atan2(X[0],X[2]);if(J.def.arc)th=clamp(th,J.def.arc[0],J.def.arc[1]);const T=footT(th),gap=clamp(Math.hypot(X[0],X[2])-T,.9,5.2),lift=clamp(X[1]-.68,0,lm);
    ME.th=th;ME.gap=gap;ME.lift=lift;pose();ME.x=ME.tx;ME.z=ME.tz;ME.y=ME.ty;ME.yaw=Math.atan2(P0.x-ME.x,P0.z-ME.z);
    camDesired(_CP,_CL);_CD.copy(P0).sub(_CP);const cd=_CD.length();_CD.multiplyScalar(1/cd);const ch=castFrom(_CP,_CD,cd+.5);
    if(!ch){R.camNone++;continue}if(ch.object!==p.mesh){const k=ch.ground?'ground':(ch.object.userData.panel?'panel'+ch.object.userData.panel.i:'solid@'+ch.object.position.toArray().map(v=>+v.toFixed(1)).join(','));R.camOther[k]=(R.camOther[k]||0)+1;continue}
    let du=(ch.uv.x-cu)*p.gx;const dv=(ch.uv.y-cv)*p.gy;if(Math.abs(du)>1.3||Math.abs(dv)>1.3){R.uv++;continue}
    const H=ch.point;nozzleOrigin(ME.x,ME.y+(lift>.03?.1:0),ME.z,ME.yaw,H.x,H.y,H.z,_TA);_TD.copy(H).sub(_TA);const dist=_TD.length();if(dist>g.range-.05||dist<.04){R.range++;continue}_TD.multiplyScalar(1/dist);
    const nh=castFrom(_TA,_TD,dist+.3);if(nh&&nh.object!==p.mesh&&nh.distance<dist-.12){const k=nh.ground?'ground':(nh.object.userData.panel?'panel'+nh.object.userData.panel.i:'solid@'+nh.object.position.toArray().map(v=>+v.toFixed(1)).join(','));R.blocked[k]=(R.blocked[k]||0)+1;continue}R.ok++}
  R.P=[+P0.x.toFixed(2),+P0.y.toFixed(2),+P0.z.toFixed(2)];R.N=[+N0.x.toFixed(2),+N0.y.toFixed(2),+N0.z.toFixed(2)];R.tool=tool;return R}
function leftReport(){const out=[];for(const p of J.panels)if(p.left){let n=0;for(let i=0;i<p.q.length&&n<2;i++)if(p.type[i]&&p.q[i]){out.push({panel:p.i,idx:i,why:whyFail(p,i)});n++}}return out}
function autoClean(doSpray=true){if(!J)return null;const out={cells:0,ok:0,fail:[],byTool:{},trash:0,trashFail:0};
  for(const p of J.panels)for(let idx=0;idx<p.q.length;idx++){if(!p.type[idx]||!p.q[idx])continue;out.cells++;const tool=DT[p.type[idx]].tool;out.byTool[tool]=(out.byTool[tool]||0)+1;
    if(!doSpray){const r=reachCell(p,idx,false);if(r)out.ok++;else out.fail.push([p.i,idx,tool,+_TP.x.toFixed(2),+_TP.y.toFixed(2),+_TP.z.toFixed(2)]);continue}
    if(!p.q[idx]){out.ok++;continue}const r=reachCell(p,idx,true);if(r)out.ok++;else out.fail.push([p.i,idx,tool,+_TP.x.toFixed(2),+_TP.y.toFixed(2),+_TP.z.toFixed(2)])}
  const g=gearTool(SAVE,'grab');ME.tool='grab';
  for(const t of J.trash){if(t.st)continue;out.trash++;let done=false;for(const gp of[1,2,3,4.5]){const th=Math.atan2(t.x,t.z);ME.th=th;ME.gap=clamp(Math.hypot(t.x,t.z)-footT(th)-gp+2,.9,5.2);ME.lift=0;pose();ME.x=ME.tx;ME.z=ME.tz;ME.y=0;ME.yaw=Math.atan2(t.x-ME.x,t.z-ME.z);
      nozzleOrigin(ME.x,0,ME.z,ME.yaw,t.x,t.y,t.z,_TA);const dist=_TA.distanceTo(_TP.set(t.x,t.y,t.z));if(dist<g.range){if(doSpray){const R={hit:{point:_TP.clone(),ground:true},A:_TA.clone(),d:dist,dir:_TD};doSprayLocal(null,R,.1);if(t.st)done=true}else done=true;break}}
    if(!done)out.trashFail++}
  if(doSpray)flushPanels();out.left=J.leftCells;out.trashLeft=J.trashLeft;out.progress=jobProgress();out.clean=jobClean();return out}

function regionTest(){if(!J)return null;const p=J.panels.find(q=>q.cnt>30&&q.kind==='plane');if(!p)return null;const before=p.q.slice();let ci=0,cj=0,best=-1;for(let j=2;j<p.gy-2;j++)for(let i=2;i<p.gx-2;i++){const idx=j*p.gx+i;if(p.type[idx]&&DT[p.type[idx]].tool==='jet'){ci=i;cj=j;best=idx;break}}
  if(best<0)return{skip:'no jet dirt'};const u=(ci+.5)/p.gx,v=(cj+.5)/p.gy,g=gearTool(SAVE,'jet');for(let k=0;k<20;k++)sprayPanel(p,u,v,'jet',g.r,g.rate,.1);flushPanels();
  let changed=0,outside=0,wrong=0;const rE=Math.max(g.r,Math.max(p.csx,p.csy)*.8);for(let i=0;i<p.q.length;i++){if(p.q[i]!==before[i]){changed++;const x=(i%p.gx+.5-(ci+.5))*p.csx,y=(((i/p.gx)|0)+.5-(cj+.5))*p.csy;if(Math.hypot(x,y)>rE+1e-6)outside++;if(DT[p.type[i]].tool!=='jet')wrong++}}
