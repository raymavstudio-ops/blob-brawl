<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7fd3ff">
<title>Card Clash</title>
<meta name="apple-mobile-web-app-title" content="Card Clash">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--paper:#fffef7;--dim:#5d5a80;--yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a;--orange:#ffa23f;--red:#ff5d6c;--purple:#b388ff;
 --cw:clamp(84px,calc((100vh - 52px)*.285),112px);--ch:calc(var(--cw)*1.4);--sl:max(6px,env(safe-area-inset-left));--sr:max(6px,env(safe-area-inset-right));--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;color:var(--ink);background:#7fd3ff;touch-action:manipulation}
body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text!important;user-select:text!important}
button{font-family:inherit;color:var(--ink);cursor:pointer}
button:disabled{cursor:default}
#stage{position:fixed;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#6cc6ff 0%,#b5e8ff 52%,#d9f5ff 62%)}
#bg svg{position:absolute;left:0;bottom:0;width:100%;height:58%}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.92;animation:drift linear infinite}
.cloud:before,.cloud:after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:46%;height:150%;left:14%;top:-60%}.cloud:after{width:36%;height:120%;right:14%;top:-40%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.sun{position:absolute;right:11%;top:9%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#fff7b0,#ffd23f 70%);box-shadow:0 0 0 8px rgba(255,236,120,.35),0 0 0 18px rgba(255,236,120,.18)}
.screen{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch;padding:max(6px,var(--st)) var(--sr) max(6px,var(--sb)) var(--sl)}
.screen.on{display:block}
h1,h2,h3{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0}
/* ---- buttons / panels ---- */
.btn{display:block;width:100%;font:400 20px 'Lilita One',sans-serif;letter-spacing:.4px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;min-height:50px;margin-top:9px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.blue{background:var(--blue)}.btn.go{background:var(--green)}.btn.ghost{background:#fff}
.btn.sm{font-size:17px;min-height:48px;padding:6px 10px}
.btn:disabled{background:#cfd3e6;color:#80849f;box-shadow:0 3px 0 #80849f;border-color:#80849f}
.mini{min-width:48px;min-height:48px;font:400 18px 'Lilita One';background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:0 10px}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.mini.red{background:#ffd0d4}
.mt{font-size:15px;line-height:1.3;color:var(--dim);margin:8px 0}
#modal{position:fixed;inset:0;background:rgba(29,27,58,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:8px}
#modal.on{display:flex}
.mbox{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);padding:14px 16px 16px;max-height:calc(100vh - 16px);overflow:auto;width:min(94vw,520px);animation:pop .22s cubic-bezier(.3,1.6,.5,1)}
.mbox.sm{width:min(92vw,370px)}.mbox.wide{width:min(96vw,680px)}
.mbox h3{font-size:26px;color:var(--ink);text-align:center;margin-bottom:4px}
.mbox input[type=text],.mbox textarea{width:100%;font:600 18px 'Fredoka';color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;min-height:48px;outline:none;text-transform:uppercase;text-align:center;letter-spacing:4px}
.mbox textarea{text-transform:none;letter-spacing:0;font-size:13px;text-align:left;margin-top:6px;word-break:break-all}
.mbox input#pn{text-transform:none;letter-spacing:0;text-align:left}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(14px + var(--sb));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#arc{position:fixed;left:var(--sl);top:max(4px,var(--st));z-index:120;display:flex;align-items:center;justify-content:center;height:48px;min-width:84px;padding:0 10px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);color:var(--ink);text-decoration:none;font:400 16px 'Lilita One'}
#mute{position:fixed;right:var(--sr);top:max(4px,var(--st));z-index:120;width:52px;height:48px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);font-size:22px;padding:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
#rot{position:fixed;inset:0;z-index:500;background:linear-gradient(160deg,#4cc9ff,#b388ff);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:400 28px 'Lilita One';text-align:center;gap:10px;padding:20px;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
#rot i{font-size:70px;font-style:normal;display:block;animation:rotp 1.6s ease-in-out infinite}
@keyframes rotp{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:700px){#rot{display:flex}}
/* ---- title ---- */
#s-title.on{display:flex;align-items:center;justify-content:center}
.tt{width:min(660px,100%);text-align:center;margin:auto;padding:54px 0 6px}
.logo{font-size:clamp(46px,13vh,78px);line-height:.92;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-2deg);letter-spacing:1px}
.logo span{color:var(--pink);display:inline-block;transform:rotate(3deg) translateY(2px);margin-left:8px}
.tag{margin:8px 0 2px;font-size:15px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px var(--ink)}
#ttBlobs{display:flex;justify-content:center;gap:6px;height:clamp(54px,15vh,84px);margin:2px 0 6px}
.tb{height:100%;aspect-ratio:1/1.1;animation:bob 1.3s ease-in-out infinite;animation-delay:var(--d)}
.tb svg{width:100%;height:100%;overflow:visible}
@keyframes bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-8px) scaleY(1.05)}}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;padding:4px 6px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);font:400 17px 'Lilita One';line-height:1.1}
.tbtn small{font:600 12px 'Fredoka';color:var(--dim);margin-top:1px}
.tbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tbtn:disabled{background:#e9ecf7;color:#8a8eaa;box-shadow:0 3px 0 #8a8eaa;border-color:#8a8eaa}
#bCont{background:var(--green)}#bNew{background:var(--yellow)}#bDuel{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}#bDaily{background:var(--blue)}
#bCont:disabled{background:#e9ecf7}
#bCont small,#bDuel small,#bDaily small{color:var(--ink)}
#prof{position:fixed;right:calc(var(--sr) + 60px);top:max(4px,var(--st));height:48px;z-index:120;display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:0 10px;font-size:14px}
#prof b{font:400 16px 'Lilita One'}#prof span{background:#fff2b8;border-radius:8px;padding:1px 6px;font-size:13px}
/* ---- lobby ---- */
.sh{display:flex;align-items:center;justify-content:center;min-height:54px}
#s-lobby h2,#s-col h2,#s-duelb h2{font-size:30px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.lob{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;max-width:760px;margin:6px auto}
.lcol,.rcol{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:10px}
.lhead{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.code{font:400 38px 'Lilita One';letter-spacing:6px;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;cursor:pointer;line-height:1}.code.solo{font-size:30px;color:var(--blue)}
.lhead .btn{width:auto;margin:0;flex:none}
.lrow{display:flex;align-items:center;gap:6px;min-height:54px;border-radius:14px;padding:3px 6px;background:#f2f4ff;margin-top:5px;border:3px solid transparent}
.lrow.me{background:#fff2b8;border-color:var(--ink)}.lrow.empty{background:rgba(255,255,255,.4);border:3px dashed #aab;color:var(--dim);font-size:14px;justify-content:center}
.lb{width:42px;height:46px;flex:none}.lb svg{width:100%;height:100%;overflow:visible}
.ln{flex:1;min-width:0;font:400 17px 'Lilita One';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc{display:flex;gap:4px}.lcls{font-size:14px;white-space:nowrap}
.cbtn{width:48px;height:48px;font-size:22px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:0}
.cbtn.on{background:var(--cc);transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.cinfo{margin-top:8px;border-left:6px solid;background:#fff;border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.25}
.rcol .btn{margin-top:8px}.opt{display:flex;align-items:center;justify-content:space-between;font:400 18px 'Lilita One';min-height:48px}
.opt.tg input{appearance:none;-webkit-appearance:none;width:56px;height:48px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);position:relative;margin:0}.opt.tg input:checked{background:var(--green)}.opt.tg input:checked:after{content:'✓';position:absolute;inset:0;text-align:center;font:400 28px/42px 'Lilita One'}.stp{display:flex;align-items:center;gap:8px}.stp b{font:400 24px 'Lilita One';min-width:24px;text-align:center}
.atx{font-size:14px;color:var(--dim);line-height:1.3;margin:2px 0 4px}.atx.wait{text-align:center;padding:10px 0}
.resume{background:#d9f2ff;border:3px solid var(--ink);border-radius:12px;padding:8px;font-size:15px;line-height:1.3}
.party{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.party span{background:#fff2b8;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;font-size:14px}
.slot{display:flex;align-items:center;gap:6px;background:#f2f4ff;border:3px solid transparent;border-radius:14px;padding:6px;margin-top:6px;flex-wrap:wrap}
.slot.cur{border-color:var(--ink);background:#fff2b8}.si{flex:1;min-width:140px;display:flex;flex-direction:column}.si span{font-size:13px;color:var(--dim)}.sb{display:flex;gap:4px}
.gh{font:400 18px 'Lilita One';margin:10px 0 4px;color:var(--dim)}
.goal{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}.goal span{flex:1}.goal b{min-width:44px;text-align:right}
.gb{flex:1;max-width:120px;height:12px;background:#dfe3f5;border:2px solid var(--ink);border-radius:8px;overflow:hidden}.gb i{display:block;height:100%;background:var(--green)}
.help p{margin:6px 0;font-size:15px;line-height:1.3}
/* ---- game shell ---- */
#s-game{padding:0;overflow:hidden}
#s-game.nsc{overflow-y:auto;overflow-x:hidden}
#top{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:6px;padding:2px 66px 0 calc(var(--sl) + 90px);background:linear-gradient(180deg,rgba(29,27,58,.45),rgba(29,27,58,0))}
#s-game:not(.nsc) #top{position:absolute;left:0;right:0;top:0}
#top button{height:48px;min-width:48px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);font:400 17px 'Lilita One';padding:0 8px}
#topInfo{flex:1;min-width:60px;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap}
.tl{font:400 17px 'Lilita One';color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;overflow:hidden;text-overflow:ellipsis}
.chip2{background:var(--yellow);border:2px solid var(--ink);border-radius:9px;padding:0 6px;font-size:12px;font-weight:700}
.pillt{font:400 17px 'Lilita One';color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;white-space:nowrap}
#view{position:absolute;left:0;right:0;top:52px;bottom:0}
#s-game.nsc #view{position:relative;top:0;min-height:calc(100% - 52px);padding:2px var(--sr) 12px var(--sl)}
#bnr{position:absolute;left:0;right:0;top:34%;text-align:center;font:400 clamp(40px,12vh,68px) 'Lilita One';-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);pointer-events:none;opacity:0;z-index:40}
#bnr.on{animation:bn 1.35s ease-out}
@keyframes bn{0%{opacity:0;transform:scale(.4) rotate(-6deg)}14%{opacity:1;transform:scale(1.12) rotate(-2deg)}24%{transform:scale(1) rotate(-2deg)}78%{opacity:1}100%{opacity:0;transform:translateY(-24px) scale(1)}}
/* ---- cards ---- */
.card{--fd:12px;--fn:13px;position:relative;width:var(--cw);height:var(--ch);background:#fffdf3;border:3px solid var(--ink);border-radius:12px;display:flex;flex-direction:column;padding:4px 4px 0;box-shadow:0 3px 0 rgba(29,27,58,.5);flex:none;overflow:visible;font-weight:600;line-height:1.08}
.card .cost{position:absolute;left:-7px;top:-8px;width:calc(var(--cw)*.28);height:calc(var(--cw)*.28);min-width:26px;min-height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9be4ff,#2f8fe0);border:3px solid var(--ink);color:#fff;font:400 17px/1 'Lilita One';display:flex;align-items:center;justify-content:center;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;z-index:2}
.card .cn{font:400 var(--fn)/1.1 'Lilita One';text-align:center;padding:0 2px 0 14px;height:calc(var(--fn)*1.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.card.upg .cn{color:#1a9a3a}
.card .art{height:calc(var(--cw)*.38);margin:2px 0;border:2px solid var(--ink);border-radius:9px;background:radial-gradient(circle at 50% 35%,#fff 0,color-mix(in srgb,var(--cc) 55%,#fff) 55%,var(--cc) 130%);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.28);overflow:hidden}
.card .art span{filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.card .cdsc{flex:1;font-size:var(--fd);text-align:center;display:flex;align-items:center;justify-content:center;padding:1px 2px;color:#2b2950;overflow:hidden}
.card .mod{color:#12a03c;font-weight:700}
.card .ct{height:calc(var(--fd) + 5px);margin:0 -4px;font-size:max(12px,calc(var(--fd)*.92));line-height:calc(var(--fd) + 5px);text-align:center;color:#fff;background:var(--tc,#888);border-top:2px solid var(--ink);border-radius:0 0 8px 8px;white-space:nowrap;overflow:hidden;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.t-A{--tc:#ef5560}.t-B{--tc:#3aa8e8}.t-S{--tc:#4cc254}.t-P{--tc:#9b6cf0}.t-C{--tc:#6d6585}
.r-u{border-color:#2a74d6;box-shadow:0 3px 0 #2a74d6}.r-r{border-color:#e0a000;box-shadow:0 0 0 2px #fff0a0,0 3px 0 #b87a00;background:linear-gradient(135deg,#fffbe0,#fff6c4 40%,#fffdf3 60%,#fff2b0)}
.card.dim{filter:grayscale(.55) brightness(.9)}
.card.back{display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)*.5);border-color:var(--ink);box-shadow:0 0 0 3px #fff inset,0 3px 0 rgba(29,27,58,.5);padding:0}
.card.locked{background:#d7daea;align-items:center;justify-content:center;color:#7d819e}.card.locked .lk{font-size:30px}.card.locked .cn{padding:0;color:#7d819e}.card.locked .ct{background:#9a9eb8;position:absolute;bottom:0;left:0;right:0;margin:0}
.card.big{--cw:170px;--fd:16px;--fn:21px}.card.big .art{font-size:60px}.card.big .cost{font-size:26px;left:-10px;top:-11px}
.card.rw{--cw:calc(var(--cw0,92px))}
.hand{position:absolute;left:calc(var(--sl) + 86px);right:calc(var(--sr) + 114px);bottom:0;height:calc(var(--ch) + 24px);touch-action:none;bottom:var(--sb)}
.hand .card{position:absolute;bottom:16px;transform:translateY(var(--y,0)) rotate(var(--rot,0));transform-origin:50% 130%;transition:transform .16s,filter .16s;cursor:pointer;touch-action:none}
.hand .card.sel{transform:translateY(-34px) scale(1.14) rotate(0deg);z-index:60!important;box-shadow:0 0 0 4px var(--yellow),0 8px 0 rgba(29,27,58,.4)}
.hand .card.drag{z-index:80!important;transition:none;box-shadow:0 12px 20px rgba(0,0,0,.35);pointer-events:none}
@media (hover:hover){.hand .card:hover:not(.sel):not(.drag){transform:translateY(-22px) scale(1.08) rotate(0deg);z-index:55!important}}
.fly{position:fixed;left:0;top:0;z-index:65;pointer-events:none;--cw:92px}
#prev{position:fixed;inset:0;background:rgba(29,27,58,.62);display:none;align-items:center;justify-content:center;z-index:210}
#prev.on{display:flex}
.pvbox{display:flex;gap:18px;align-items:center;max-width:96vw;padding:8px}
.pvk{background:var(--paper);border:4px solid var(--ink);border-radius:16px;padding:10px 12px;max-width:290px;max-height:calc(100vh - 24px);overflow:auto}
.pvh{font:400 22px 'Lilita One'}.pvs{font-size:13px;color:var(--dim);margin-bottom:6px}.kw{font-size:14px;line-height:1.25;margin:5px 0}.kw b{color:#2a74d6}
.cgrid{display:flex;flex-wrap:wrap;gap:12px 10px;justify-content:center;padding:10px 6px 4px;--cw:92px}
.cgrid .card{cursor:pointer}.cgrid.c1{--cw:84px}.cgrid .rc,.cgrid .cc{cursor:pointer}
.cgrid .rc:active .card{transform:scale(.96)}
/* ---- battle ---- */
#bf{position:absolute;left:0;right:0;top:0;bottom:calc(var(--ch) + 24px + var(--sb));overflow:visible}
#bf:before{content:'';position:absolute;left:0;right:0;bottom:0;height:44%;background:linear-gradient(180deg,#9be05a,#6fc13d);border-top:4px solid #3e8a24;border-radius:60% 60% 0 0/22px 22px 0 0;opacity:.95}
.side{position:absolute;top:0;bottom:0;display:flex;align-items:flex-end;padding-bottom:6px}
#allies{left:var(--sl);width:38%;justify-content:center;gap:2px}
#foes{right:var(--sr);width:60%;justify-content:center;gap:2px}
.ent{position:relative;display:flex;flex-direction:column;align-items:center;flex:0 1 auto;min-width:0;width:84px;transition:opacity .5s,max-width .6s .4s,width .6s .4s}
#allies[data-n="1"] .ent{width:104px}#allies[data-n="2"] .ent{width:92px}#allies[data-n="3"] .ent{width:76px}#allies[data-n="4"] .ent{width:64px}
#foes[data-n="1"] .ent{width:130px}#foes[data-n="2"] .ent{width:112px}#foes[data-n="3"] .ent{width:98px}#foes[data-n="4"] .ent{width:88px}#foes[data-n="5"] .ent{width:74px}
.ent.big{width:150px!important}
.ent.dead.foe{opacity:0;pointer-events:none;width:0!important;overflow:hidden}
.ent.dead.ally{opacity:.55;filter:grayscale(1)}
.ent .top{height:30px;display:flex;align-items:flex-end;justify-content:center;gap:3px;width:100%;position:relative}
.ent em{font:400 12px/1.25 'Lilita One';font-style:normal;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:0 5px;white-space:nowrap}

/* ---------- combat primitives ---------- */
function calcDmg(src,tgt,base,o={}){let d=base;if(!o.raw){d+=(src&&src.st&&src.st.str)||0;if(src&&src.st&&src.st.weak)d=Math.floor(d*.75);if(tgt.st.vuln)d=Math.floor(d*(src&&hasR(src,'phrog')?1.75:1.5));if(o.mult)d*=o.mult}return Math.max(0,Math.floor(d))}
function addSt(e,k,n){e.st[k]=(e.st[k]||0)+n;if(!e.st[k])delete e.st[k];ev({k:'st',t:e.id,s:k,n})}
function gainBlk(e,n){n=Math.max(0,n);if(!n)return;e.blk+=n;ev({k:'blk',t:e.id,n})}
function heal(e,n){if(e.hp<=0||n<=0)return 0;const h=Math.min(n,e.mhp-e.hp);e.hp+=h;ev({k:'heal',t:e.id,n:h});return h}
function hurt(src,tgt,base,o={}){if(tgt.hp<=0)return 0;let d=calcDmg(src,tgt,base,o),ab=0;
 if(!o.pierce){ab=Math.min(tgt.blk,d);tgt.blk-=ab;d-=ab}
 tgt.hp=Math.max(0,tgt.hp-d);
 ev({k:'hit',s:src?src.id:null,t:tgt.id,n:d,b:ab,th:o.th?1:0,px:o.pierce?1:0});
 if(src&&src.id[0]==='p')src.dd+=d;
 if(d>0&&tgt.id[0]==='p'&&!tgt.h1){tgt.h1=1;if(hasR(tgt,'puzzle')&&tgt.hp>0)drawCards(tgt,3)}
 if(src&&!o.th&&!o.pierce&&!o.raw&&tgt.st.thorns&&src.hp>0)hurt(tgt,src,tgt.st.thorns,{raw:1,th:1});
 if(tgt.hp<=0)die(tgt,src);
 return d}
function die(t,src){ev({k:'die',t:t.id});if(t.id[0]==='m'&&src&&src.id[0]==='p')src.k++}
function debuff(src,t,k,n){addSt(t,k,n);if(k==='vuln'&&src&&hasR(src,'belt'))addSt(t,'weak',1)}
function drawCards(p,n){let got=0;for(let i=0;i<n;i++){if(!p.draw.length){if(!p.disc.length)break;p.draw=shuffle(p.disc);p.disc=[];ev({k:'shuf',t:p.id})}
 const c=p.draw.pop();if(p.hand.length>=10)p.disc.push(c);else p.hand.push(c);got++}
 if(got)ev({k:'draw',t:p.id,n:got})}
function canPlay(p,i){const c=p.hand[i];if(!c)return false;const d=cd(c);if(d.fl.includes('u'))return false;return d.c==='X'||p.en>=d.c}
/* ---------- run creation ---------- */
function dailySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function newRun(plist,o){o=o||{};const seed=o.seed||((Math.random()*2147483647)|0);
 G={v:1,mode:'coop',rid:'r'+Date.now().toString(36)+(seed&255).toString(16),seed,rng:seed|0,asc:o.asc||0,daily:o.daily?1:0,mod:'',act:1,ph:'map',pos:null,players:[],map:null,b:null,pp:{},ev:null,res:null,t0:Date.now(),n:0,nodes:0};
 if(G.daily)G.mod=MODK[seed%MODK.length];
 G.players=plist.map((p,i)=>mkPlayer(i,p));
 for(const p of G.players){if(G.asc>=3)p.gold=80;if(G.asc>=4)p.deck.push('regret');
  if(G.mod==='glass'){p.mhp=Math.floor(p.mhp*.7);p.hp=p.mhp}
  if(G.mod==='frugal'){p.gold=0;addRelic(p,'berry')}
  if(G.mod==='storm'){addRelic(p,'lantern');addRelic(p,'ring')}}
 G.map=genMap();setMap();emit()}
function genMap(){const FL=9,LN=5,nodes=[];for(let f=0;f<FL;f++)nodes.push({});
 const node=(f,l)=>nodes[f][l]||(nodes[f][l]={l,t:'F',to:[]});
 const starts=shuffle([0,1,2,3,4]).slice(0,4);
 for(const s of starts){let l=s;for(let f=0;f<7;f++){const n=node(f,l);let l2=Math.max(0,Math.min(LN-1,l+ri(3)-1));node(f+1,l2);if(!n.to.includes(l2))n.to.push(l2);l=l2}}
 for(const k in nodes[7])node(8,2),nodes[7][k].to=[2];
 const map=[];
 for(let f=0;f<FL;f++){const arr=Object.values(nodes[f]).sort((a,b)=>a.l-b.l);
  for(const n of arr){if(f===0)n.t='F';else if(f===8)n.t='B';else if(f===7)n.t='C';else if(f===4)n.t='T';else{const r=rnd();n.t=r<.47?'F':r<.7?'?':r<.82&&f>=2?'E':r<.9&&f>=2?'$':r<.98?'C':'F'}}
  map.push(arr)}
 /* guarantee at least one shop and elite mid-map */
 const mid=[1,2,3,5,6];let hasS=false,hasE=false;for(const f of mid)for(const n of map[f]){if(n.t==='$')hasS=true;if(n.t==='E')hasE=true}
 const ch=(t)=>{const f=mid[2+ri(3)];const n=pick(map[f]);if(n)n.t=t};if(!hasS)ch('$');if(!hasE)ch('E');
 return map}
function nodeAt(f,l){return G.map[f].find(n=>n.l===l)}
function mapOptions(){if(!G.pos)return G.map[0].map(n=>({f:0,l:n.l}));const cur=nodeAt(G.pos.f,G.pos.l);return cur.to.map(l=>({f:G.pos.f+1,l}))}
function setMap(){G.ph='map';G.b=null;G.pp={};G.ev=null;S.mapSnap=JSON.stringify(G);if(typeof persistRun==='function')persistRun(true)}
/* ---------- relics ---------- */
function addRelic(p,id){if(p.relics.includes(id))return;p.relics.push(id);
 if(id==='mushroom'){p.mhp+=10;p.hp+=10}else if(id==='berry'){p.mhp+=7;p.hp+=7}else if(id==='coin')p.gold+=100;
 else if(id==='whet'||id==='paint'){const idx=[];p.deck.forEach((c,i)=>{if(c.endsWith('+'))return;const t=cd(c).t;if(id==='whet'?t==='A':(t==='B'||t==='S'))idx.push(i)});shuffle(idx);for(const i of idx.slice(0,2))p.deck[i]+='+'}}
function randRelic(p,rar){const own=new Set(G.players.flatMap(x=>x.relics));let pool=RELKEYS.filter(k=>!p.relics.includes(k)&&(!rar||RELICS[k][3]===rar));if(!pool.length)pool=RELKEYS.filter(k=>!p.relics.includes(k));
 const w=[];for(const k of pool){const r=RELICS[k][3];const n=r==='c'?5:r==='u'?3:1;for(let i=0;i<n;i++)w.push(k)}return w.length?pick(w):null}
/* ---------- card pools ---------- */
function colOf(p){const c=HOST.cols[p.id];return c&&c.length?c:(HOST.cols.p0||null)}
function poolFor(p,rar){const col=colOf(p);const have=col?new Set(col):null;
 return CARDLIST.filter(c=>c.cls!=='C'&&c.id!=='shiv'&&(c.cls===p.cls||c.cls==='N')&&(!rar||c.r===rar)&&(!have||have.has(c.id)||c.cls==='N'&&false)).map(c=>c.id)}
function randCard(p,rar){let pool=poolFor(p,rar);if(!pool.length)pool=poolFor(p,'c');if(!pool.length)pool=starterDeck(p.cls);return pick(pool)}
function rollRarity(kind){const r=rnd();if(kind==='B')return r<.35?'u':'r';if(kind==='E')return r<.45?'c':r<.85?'u':'r';return r<.6?'c':r<.93?'u':'r'}
function genCards(p,kind,n){const out=[];let guard=0;while(out.length<n&&guard++<40){const c=randCard(p,rollRarity(kind));if(!out.includes(c))out.push(c)}return out}
/* ---------- battles ---------- */
function mkFoe(id){const b=G.b,d=EN[id],n=G.players.length;let hp=d.hp[0]+ri(d.hp[1]-d.hp[0]+1);
 hp*=1+.45*(n-1);hp*=1+.05*G.asc;if(G.mod==='fat')hp*=1.35;if(d.t==='e'&&G.players.every(p=>hasR(p,'insect')))hp*=.75;

function botPlan(p){const duel=G.mode==='duel',fo=foesOf(p);if(!fo.length)return null;
 let inc=duel?7:0;if(!duel)for(const f of fo){const m=EN[f.def].mv[f.mk];if(m&&m.a&&(f.tg===p.id||f.tg==='all'))inc+=calcDmg(f,p,m.a[0])*m.a[1]}
 const need=Math.max(0,inc-p.blk),tf=fo.slice().sort((a,b)=>(a.hp+a.blk)-(b.hp+b.blk))[0];
 const al=alliesOf(p),hurtAl=al.slice().sort((a,b)=>a.hp/a.mhp-b.hp/b.mhp)[0];let best=null,bs=0;
 p.hand.forEach((c,i)=>{if(!canPlay(p,i))return;const d=cd(c);let v=0,x=d.c==='X'?p.en:0;
  for(const t of d.fx){const n=t.n;switch(t.k){case'dmg':v+=n*t.h*(tf&&tf.hp<=n*t.h?1.6:1);break;case'dmgall':v+=n*fo.length;break;case'blk':v+=Math.min(need,n)*1.3+(need?0:1);break;case'tblk':v+=Math.min(need,n)*1.2+n*.3;break;case'ablk':v+=n*.5;break;
   case'heal':v+=Math.min(p.mhp-p.hp,n)*.8;break;case'theal':v+=Math.min(hurtAl.mhp-hurtAl.hp,n)*.9;break;case'tmheal':for(const a of al)v+=Math.min(a.mhp-a.hp,n)*.7;break;
   case'draw':v+=n*3;break;case'en':v+=n*4;break;case'str':case'dex':case'tstr':v+=7*n;break;case'vuln':case'weak':v+=3.5*n;break;case'vulnall':case'weakall':v+=3*n*fo.length;break;case'poison':v+=n*2.2;break;case'poisonall':v+=n*2*fo.length;break;
   case'thorns':case'regen':case'ritual':case'metal':case'flame':case'toxic':case'cuts':case'tthorns':case'tregen':case'surge':v+=(p.tn<=3?10:4)*Math.min(n,3)/2+3;break;case'barricade':v+=8;break;
   case'shiv':v+=n*3;break;case'bodyslam':v+=p.blk;break;case'xdmg':v+=n*x;break;case'xdmgall':v+=n*x*fo.length;break;case'drain':v+=n*1.5;break;case'selfdmg':v-=n;break;case'disc':v-=1;break;case'pdmg':v+=tf?(tf.st.poison||0):0;break;case'dblpoison':v+=tf?(tf.st.poison||0)*1.5:0;break;case'cleanse':v+=(p.st.weak||p.st.vuln||p.st.poison)?5:0;break}}
  const cost=d.c==='X'?Math.max(1,x):Math.max(.5,d.c);const sc=v/cost;if(v>0&&sc>bs){bs=sc;best={i,d}}});
 if(!best)return null;const tt=tgtType(best.d);let tid=null;if(tt==='foe')tid=tf.id;else if(tt==='ally')tid=hurtAl.id;return{i:best.i,tid}}

function deckLegal(cls,cards,col){if(!CLS[cls]||!Array.isArray(cards)||cards.length<DUEL_MIN||cards.length>DUEL_MAX)return false;const cnt={};
 for(const c of cards){const id=c.endsWith('+')?c.slice(0,-1):c;const d=CARDS[id];if(!d||d.cls==='C'||id==='shiv'||(d.cls!==cls&&d.cls!=='N'))return false;if(col&&!col.includes(id))return false;cnt[id]=(cnt[id]||0)+1;
  const lim=d.r==='r'?1:(d.r==='u'?2:(CLS[cls].start.split(',').some(s=>s.split('*')[0]===id)?5:3));if(cnt[id]>lim)return false}return true}
function autoDeck(cls,col){const st=starterDeck(cls),pool=CARDLIST.filter(c=>(c.cls===cls||c.cls==='N')&&c.cls!=='C'&&c.id!=='shiv'&&col.includes(c.id)&&!CLS[cls].start.includes(c.id));
 const out=[];const cnt={};const add=id=>{const d=CARDS[id],lim=d.r==='r'?1:d.r==='u'?2:3;cnt[id]=(cnt[id]||0);if(cnt[id]<lim){cnt[id]++;out.push(id);return true}return false};
 const sc=pool.filter(c=>c.cls===cls).sort((a,b)=>'rcu'.indexOf(a.r)-'rcu'.indexOf(b.r)||0);
 for(const s of ['slash','guard','bash','rally','zap','ward','hex','focus','stab','dodge','dart','quick','thump','bubble','mend','smite']){if(CARDS[s].cls===cls)add(s)}
 const shuffled=pool.slice().sort(()=>Math.random()-.5);for(const c of shuffled){if(out.length>=17)break;add(c.id)}
 let g=0;while(out.length<DUEL_MIN&&g++<60){const s=st[g%st.length];if(!add(s))out.push(s)}
 return out.slice(0,DUEL_MAX)}

 for(const p of L.players)if(p.bot){const cls=CK[(Math.random()*4)|0];S.duelB.dk[p.id]={cls,cards:autoDeck(cls,P.col)}}
