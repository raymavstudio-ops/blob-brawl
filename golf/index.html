<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5ec2ff">
<title>Blob Golf</title>
<meta name="apple-mobile-web-app-title" content="Blob Golf">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--card:#fffdf6;--text:#1d1b3a;--dim:#5d5a80;--yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#5ec2ff,#c9f0ff);color:var(--text);font-family:'Fredoka',system-ui,sans-serif;font-weight:600;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch;z-index:4}
.screen.on{display:flex}
.card{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:20px 20px 16px;width:min(460px,100%);box-shadow:0 9px 0 var(--ink);margin:auto;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(46px,12vw,66px);line-height:.92;letter-spacing:1px;text-align:center;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-3deg)}
h1 span{color:var(--green)}
.sub{text-align:center;color:var(--dim);margin:10px 0 12px;font-size:15px}
h2{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:34px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 5px;letter-spacing:.6px;text-transform:uppercase}
input[type=text]{width:100%;font:600 19px 'Fredoka',sans-serif;color:var(--ink);background:#eef6ff;border:3px solid var(--ink);border-radius:16px;padding:11px 14px;outline:none;user-select:text;-webkit-user-select:text}
input[type=text]:focus{background:#fff;box-shadow:0 0 0 4px rgba(76,201,255,.45)}
.btn{display:block;width:100%;font:400 21px 'Lilita One',sans-serif;letter-spacing:.5px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:12px;margin-top:11px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.ghost{background:#fff}.btn.green{background:var(--green)}
a.btn{text-align:center;text-decoration:none}.back{font-size:17px;background:#e6ecff}
.btn[disabled]{opacity:.45;pointer-events:none}
.join{display:flex;gap:10px;margin-top:11px}
.join input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Lilita One',sans-serif;font-size:23px;padding:9px}
.join .btn{width:auto;margin:0;padding:0 22px;flex:none}
.invite{background:#fff2b8;border:3px solid var(--ink);border-radius:16px;padding:9px 14px;margin-bottom:6px;text-align:center;font-size:15px}
.code{font-family:'Lilita One',sans-serif;font-size:54px;letter-spacing:10px;text-align:center;color:var(--blue);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin:0;cursor:pointer}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.mode{border:3px solid var(--ink);border-radius:18px;padding:9px 6px 8px;text-align:center;background:#fff;cursor:pointer;transition:.12s;box-shadow:0 4px 0 var(--ink)}
.mode .e{font-size:30px;line-height:1.1}.mode .t{font-family:'Lilita One',sans-serif;font-size:15px;margin-top:3px}
.mode.sel{background:var(--yellow);transform:translateY(-3px) rotate(-2deg);box-shadow:0 7px 0 var(--ink)}
.mode.ro{cursor:default}
.mdesc{font-size:14px;color:var(--dim);text-align:center;margin:10px 0 0;min-height:36px;line-height:1.3}
.plist{margin:10px 0 4px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:#fff;border:3px solid var(--ink);font-size:16px;min-width:0}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl i{flex:none;width:18px;height:18px;border-radius:50%;background:currentColor;border:2.5px solid var(--ink)}
.pl small{margin-left:auto;color:var(--dim);font-size:12px}.pl.empty{opacity:.45;border-style:dashed}
.switch{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:9px 14px;border-radius:16px;background:#fff;border:3px solid var(--ink);font-size:15px;cursor:pointer}
.switch span.t{flex:none;width:50px;height:28px;border-radius:14px;background:#d6d6e6;border:2.5px solid var(--ink);position:relative;transition:.15s}
.switch span.t:after{content:'';position:absolute;left:2px;top:2px;width:19px;height:19px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);transition:.15s}
.switch.on span.t{background:var(--green)}.switch.on span.t:after{left:22px}
.res{display:grid;gap:7px;margin:10px 0}
.rk{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:16px;background:#fff;border:3px solid var(--ink);font-size:18px;min-width:0}
.rk:first-child{background:var(--yellow);transform:rotate(-1deg);box-shadow:0 4px 0 var(--ink)}
.rk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .n{margin-left:auto;font-family:'Lilita One',sans-serif;font-size:22px;text-align:right;white-space:nowrap}
.rk .n small{display:block;font:600 12px 'Fredoka',sans-serif;color:var(--dim)}
.rk .m{font-size:24px;width:30px;text-align:center}
.rk i{flex:none;width:16px;height:16px;border-radius:50%;background:currentColor;border:2.5px solid var(--ink)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.btn,input[type=text],.mode,.switch{min-height:48px}
/* scorecard */
.scw{overflow-x:auto;margin:6px 0 2px}
.sc{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;background:#fff;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.sc th,.sc td{padding:3px 3px;text-align:center;border-bottom:1.5px solid #e6e3f2;min-width:22px}
.sc th{background:var(--yellow);font:400 14px 'Lilita One',sans-serif;border-bottom:2.5px solid var(--ink)}
.sc tr.par td{color:var(--dim);background:#f3f1ff}
.sc td.nm{text-align:left;white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis;padding-left:7px}
.sc td.nm i{display:inline-block;width:11px;height:11px;border-radius:50%;background:currentColor;border:2px solid var(--ink);margin-right:4px;vertical-align:-1px}
.sc td.cur,.sc th.cur{background:#fff2b8}
.sc td.tot{font-family:'Lilita One',sans-serif;font-size:15px}
.sc tr:last-child td{border-bottom:0}
.sc .s{display:inline-block;min-width:20px;line-height:20px;border-radius:50%}
.sc .u{background:#b7f08f;box-shadow:0 0 0 2px var(--ink)}.sc .o{color:#d8304f}.sc .hio{background:var(--yellow);box-shadow:0 0 0 2px var(--ink)}
#cardScr{padding-top:max(58px,env(safe-area-inset-top))}
#cardScr .card{width:min(540px,100%);padding:12px 16px 12px}
#cardNote{text-align:center;color:var(--dim);font-size:14px;margin-top:6px}
#results .card{width:min(520px,100%)}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:2}
body.ingame #hud{display:block}
#holeCard{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:3px 12px 5px;line-height:1.15}
.hc1{font:400 22px 'Lilita One',sans-serif}.hc1 b{font-weight:400;color:#ff4fa0}.hc1 span{font-size:15px;color:var(--dim)}
.hc2{font-size:12px;color:var(--dim);font-weight:700;white-space:nowrap}
.hc3{font:400 16px 'Lilita One',sans-serif}.hc3 b{font-weight:400;color:#2f9e1f}
#timer{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);font:400 26px 'Lilita One',sans-serif;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);display:none;white-space:nowrap}
#timer.low{color:#ff5277}
#feed{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 38px);display:flex;flex-direction:column;align-items:center;gap:4px}
.fd{background:rgba(255,253,246,.94);border:2.5px solid var(--ink);border-radius:12px;padding:2px 10px;font-size:13px;white-space:nowrap}
#chips{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 9px;font-size:13px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;max-width:150px}
.chip{min-width:0}#chips{max-width:calc(100vw - 12px)}@media (max-width:520px){.chip{padding:3px 6px;gap:4px;font-size:12px}.chip span{max-width:44px}#chips{gap:4px}}
.chip.me{background:#fff2b8}.chip span{overflow:hidden;text-overflow:ellipsis}
.chip i{flex:none;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);background:currentColor}
.chip b{font:400 17px 'Lilita One',sans-serif}.chip.done b{color:#2f9e1f}.chip.dnf b{color:#d8304f}
#power{position:absolute;left:max(14px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);width:26px;height:min(44vh,200px);border:3px solid var(--ink);border-radius:14px;background:#fff;overflow:hidden;display:none;box-shadow:0 4px 0 var(--ink)}
#powerFill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#7ee36a,#ffd23f 55%,#ff5277)}
#powerTxt{position:absolute;left:max(46px,calc(env(safe-area-inset-left) + 32px));top:50%;transform:translateY(-50%);font:400 22px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;display:none}
body.aiming #power,body.aiming #powerTxt{display:block}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 44px);font-size:14px;background:rgba(255,253,246,.92);border:2.5px solid var(--ink);border-radius:12px;padding:3px 12px;white-space:nowrap;display:none}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;opacity:0;transform:scale(.6);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
#banner.on{opacity:1;transform:none}
#bBig{font:400 clamp(38px,9vw,74px) 'Lilita One',sans-serif;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);line-height:1}
#bSub{font:700 18px 'Fredoka',sans-serif;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;margin-top:6px}
#labels{position:absolute;inset:0}
.lbl{position:absolute;left:0;top:0;font:700 12px 'Fredoka',sans-serif;color:var(--ink);background:#fff;padding:1px 7px;border-radius:9px;border:2px solid var(--ink);white-space:nowrap;will-change:transform}
#topBtns{position:fixed;top:max(8px,env(safe-area-inset-top));right:calc(max(10px,env(safe-area-inset-right)) + 56px);display:none;gap:8px;z-index:6}
body.ingame #topBtns{display:flex}
.tb,#mute{width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:20px;padding:0;cursor:pointer}
.tb.on{background:var(--yellow)}
body.carding #camBtn{display:none}
#mute{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:6}
#rotate{position:fixed;inset:0;background:linear-gradient(#5ec2ff,#c9f0ff);z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px;font:400 28px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#rotate .ph{font-size:76px;animation:rot 1.6s ease-in-out infinite;-webkit-text-stroke:0}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.ingame.touch #rotate{display:flex}}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120px);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:9px 18px;border-radius:16px;z-index:30;transition:transform .25s cubic-bezier(.3,1.6,.5,1);max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
@media (max-height:500px) and (orientation:landscape){#lobby .card{width:min(800px,100%);display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}#lobby .plist{margin-top:0}
}
@media (min-width:560px) and (orientation:landscape){#results .card{width:min(880px,100%)}#resGrid{display:grid;grid-template-columns:.85fr 1.15fr;gap:12px;align-items:start}#results .res{margin:4px 0}}
@media (max-height:420px){h1{font-size:32px!important;line-height:.95;transform:none}.card .sub{margin:4px 0 2px;font-size:13px}label{margin:4px 0 3px}.btn{padding:4px 8px;margin-top:7px;font-size:18px}input[type=text]{padding:4px 12px}.card{padding:10px 14px}.join{margin-top:8px}.join input{padding:5px}.code{font-size:30px}.modes{margin-top:6px}.mode{padding:5px 4px}.mode .e{font-size:18px}.mdesc{font-size:12px;margin-top:5px}.plist{margin:6px 0 2px;gap:5px}.pl{padding:4px 10px}.switch{padding:5px 12px;margin-top:5px}
  .rk{padding:3px 10px;font-size:15px}.rk .n{font-size:18px}.rk .m{font-size:18px}.sc{font-size:12px}.sc th{font-size:13px}.sc th,.sc td{padding:2px 2px}h2{font-size:26px;margin-bottom:2px}.hc1{font-size:19px}.hc3{font-size:14px}}
@media (max-height:540px){.pl{gap:7px;padding:7px 10px;font-size:15px}.res{gap:5px;margin:8px 0}h2{font-size:28px}.card{padding:12px 16px}h1{font-size:40px}.sub{margin:6px 0 6px}.code{font-size:38px}.mode .e{font-size:22px}.mdesc{min-height:0}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="labels"></div>
  <div id="holeCard"><div class="hc1">HOLE <b id="hNum">1</b><span id="hOf">/9</span></div><div class="hc2"><span id="hPar">PAR 3</span> · <span id="hName"></span></div><div class="hc3">STROKE <b id="hStroke">0</b><span id="hMax">/8</span></div></div>
  <div id="timer"></div>
  <div id="feed"></div>
  <div id="power"><div id="powerFill"></div></div><div id="powerTxt"></div>
  <div id="hint"></div>
  <div id="chips"></div>
  <div id="banner"><div id="bBig"></div><div id="bSub"></div></div>
</div>
<div id="topBtns"><button id="quitBtn" class="tb" aria-label="leave">✕</button><button id="camBtn" class="tb" aria-label="camera">🗺️</button></div>
<button id="mute" aria-label="sound">🔊</button>

<div id="menu" class="screen on">
  <div class="card">
    <h1>BLOB<br><span>GOLF</span></h1>
    <div class="sub">Wacky mini-golf for 1–4 blobs — everyone putts at once!</div>
    <div id="invite" class="invite" style="display:none">You've been invited to room <b id="invCode"></b></div>
    <label for="name">Your name</label>
    <input id="name" type="text" maxlength="10" placeholder="Name" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="btnInvite" class="btn pink" style="display:none">JOIN THE GAME</button>
    <button id="btnHost" class="btn">HOST A GAME</button>
    <div class="join"><input id="joinCode" type="text" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="btnJoin" class="btn ghost">JOIN</button></div>
    <button id="btnSolo" class="btn ghost">PLAY VS BOTS</button>
    <a class="btn ghost back" href="../">◀ ARCADE</a>
  </div>
</div>

<div id="lobby" class="screen">
  <div class="card"><div>
    <div id="codeWrap"><div class="sub" style="margin:0">Room code</div><div class="code" id="lobCode">----</div></div>
    <div id="lobHint" class="sub" style="margin:2px 0 4px"></div>
    <button id="btnShare" class="btn pink">📲 SHARE INVITE LINK</button>
    <div class="modes" id="modes"></div>
    <div class="mdesc" id="mdesc"></div>
  </div><div>
    <div class="plist" id="plist"></div>
    <div class="switch" id="botSwitch"><span>Fill empty spots with bots</span><span class="t"></span></div>
    <div class="row2"><button id="btnStart" class="btn green">TEE OFF!</button><button id="btnLeave1" class="btn ghost" style="flex:.55">Leave</button></div>
  </div></div>
</div>

<div id="cardScr" class="screen">
  <div class="card">
    <h2 id="cardTitle">HOLE 1</h2>
    <div class="scw" id="cardTable"></div>
    <div id="cardNote"></div>
    <button id="btnNext" class="btn green">NEXT HOLE ▶</button>
  </div>
</div>

<div id="results" class="screen">
  <div class="card">
    <h2 id="resTitle">FINAL SCORES</h2>
    <div class="sub" id="resSub" style="margin:0"></div>
    <div id="resGrid"><div class="res" id="resList"></div><div class="scw" id="resTable"></div></div>
    <div class="row2"><button id="btnAgain" class="btn">PLAY AGAIN</button><button id="btnLeave2" class="btn ghost">Leave</button></div>
  </div>
</div>

<div id="rotate"><div class="ph">📱</div>Rotate your phone sideways</div>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================= constants ================= */
const COLORS=['#4cc9ff','#ff6fb5','#8be04e','#ffa23f'];
const BOT_NAMES=['Putts','Chippy','Bogey','Birdie'];
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}];
const PREFIX='blobarcade-golf-';
const R=.25,CUPR=.4,G=14,DT=1/240,PDT=1/240,MAXV=21,VCAP=26,MAXS=8,HOLE_TIMER=60,INTRO=3.2,CARD=8;
const PI=Math.PI,TAU=PI*2;
const MODES={full:{name:'Full Course',e:'⛳',n:9,desc:'All 9 wacky holes: windmill, slider bridge, big air, half-pipe and more.'},
  quick:{name:'Quick Round',e:'⚡',n:3,desc:'3 random holes for a speedy coffee-break match.'}};
const $=id=>document.getElementById(id);
const IS_TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
if(IS_TOUCH)document.body.classList.add('touch');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)};
const vib=p=>{try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(p)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function startGame(){
  if(!S.players.length)return;
  const n=MODES[S.mode].n,all=[0,1,2,3,4,5,6,7,8];
  if(n>=9)S.holes=all;else{const a=all.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}S.holes=a.slice(0,n).sort((x,y)=>x-y)}
  S.sc={};for(const p of S.players)S.sc[p.id]=S.holes.map(()=>null);
  enterHole(0);
}
function teeSpots(Hh,n){const a=fieldDir(Hh,Hh.tee[0],Hh.tee[1],8),px=-Math.sin(a),pz=Math.cos(a),out=[];for(let i=0;i<n;i++){const o=(i-(n-1)/2)*.72;out.push([Hh.tee[0]+px*o,Hh.tee[1]+pz*o])}return out}
function enterHole(i){
  S.hi=i;H=HOLES[S.holes[i]];S.ht=0;S.tl=-1;S.introT=INTRO;S.doneT=0;acc=0;
  const sp=teeSpots(H,S.players.length);S.players.forEach((p,k)=>{p.b=newBall(p.id,sp[k][0],sp[k][1],H);p.ai=null;p.tg=null;p.v={x:p.b.x,y:p.b.y,z:p.b.z}});
  R3.setHole(H);setPhase('intro');emit({k:'whoosh'});pushSnap();
}
function nextHole(){if(S.role==='client')return;if(S.hi+1<S.holes.length)enterHole(S.hi+1);else{setPhase('end');emit({k:'end'});pushSnap()}}
// Bot planning: phase 1 scores a wide fan of shots (dead-on), phase 2 re-tests the 10 best with the bot's own aim/power error
// (+-angle, +-power) so bots prefer shots that still work when slightly off. Work is spread over frames and finishes before tShot.
function planShot(p){
  const b=p.b,a0=fieldDir(H,b.x,b.z,14),a1=Math.atan2(H.cup[1]-b.z,H.cup[0]-b.x),tShot=S.ht+1.3,cands=[];
  for(let i=0;i<16;i++)for(const v of[4,7,11,15,20])cands.push([a0+i*TAU/16,v]);
  for(let o=-.1;o<=.101;o+=.025)for(const v of[3,5,7.5,10,13,16,19])cands.push([a0+o,v]);
  for(const o of[-.04,0,.04])for(const v of[3,5,8,12])cands.push([a1+o,v]);
  return{cands,i:0,top:[],t2:0,best:null,tShot,start:fieldAt(H,b.x,b.z)};
}
function shotScore(job,b,a,v){const r=simShot(H,b.x,b.y,b.z,Math.cos(a)*v,Math.sin(a)*v,job.tShot,6);
  if(r.st==='sunk')return-30;if(r.st==='splash')return job.start+9;let s=fieldAt(H,r.x,r.z);const g=ground(H,r.x,r.z,0);if(g&&g.t==='sand')s+=.6;return s}
function botThink(p,dt){
  const b=p.b;if(!b||b.st!=='rest'){if(b&&b.st!=='move')p.ai=null;return}
  if(!p.ai)p.ai={wait:.8+Math.random()*1.4,job:null};
  const a=p.ai;
  if(!a.job){a.wait-=dt;if(a.wait<=0)a.job=planShot(p);return}
  const j=a.job;
  if(!j.best){
    const rem=(j.cands.length-j.i)+(10-j.t2)*4,left=Math.max(1,(j.tShot-S.ht-.25)/Math.max(dt,1/120));let n=Math.max(4,Math.ceil(rem/left));
    while(n>0&&j.i<j.cands.length){const c=j.cands[j.i++];c[2]=shotScore(j,b,c[0],c[1]);j.top.push(c);n--}
    if(j.i>=j.cands.length){j.top.sort((x,y)=>x[2]-y[2]);j.top.length=Math.min(10,j.top.length);
      while(n>0&&j.t2<j.top.length){const c=j.top[j.t2++];const e=.04;
        c[3]=.4*c[2]+.15*(shotScore(j,b,c[0]-e,c[1])+shotScore(j,b,c[0]+e,c[1])+shotScore(j,b,c[0],c[1]*.94)+shotScore(j,b,c[0],Math.min(MAXV,c[1]*1.06)));n-=4}
      if(j.t2>=j.top.length){j.best=j.top.reduce((m,c)=>!m||c[3]<m[3]?c:m,null)||[fieldDir(H,b.x,b.z,14),8]}}
    return}
  if(S.ht<j.tShot)return;
  const[ang,v]=j.best;
  const close=j.start<3?.6:1,bad=Math.random()<.1?2.2:1;
  const A=ang+gauss()*p.skill*close*bad,V=clamp(v*(1+gauss()*.05*bad),1,MAXV);
  doShot(p,Math.cos(A)*V,Math.sin(A)*V);p.ai=null;
}
function hostUpdate(dt){
  if(S.ph==='intro'){S.ht+=dt;const before=Math.ceil(S.introT);S.introT-=dt;if(S.introT<=0){setPhase('play');emit({k:'go'})}else if(Math.ceil(S.introT)<before&&before<=3)emit({k:'tick'})}
  else if(S.ph==='play'){
    acc+=dt;let n=0;const balls=S.players.map(p=>p.b);
    while(acc>=DT&&n<48){acc-=DT;n++;S.ht+=DT;for(const b of balls)stepBall(H,b,S.ht,DT,HC);ballPairs(balls,HC)}
    if(acc>DT*48)acc=0;
    for(const p of S.players)if(p.bot)botThink(p,dt);else if(p.conn&&p.conn._gone)p.bot=true;
    if(S.tl>=0){const lt=Math.ceil(S.tl);S.tl-=dt;if(Math.ceil(S.tl)<lt&&lt<=5&&lt>0)emit({k:'tick'});
      if(S.tl<=0){S.tl=0;for(const p of S.players){const b=p.b;if(b.st==='rest'||b.st==='move')dnf(b,Math.min(maxS()+1,b.strokes+2))}}}
    if(S.ht>240&&S.tl<0){S.tl=30;emit({k:'timer',s:30})}
    if(S.players.every(p=>p.b.st==='sunk'||p.b.st==='dnf')){S.doneT+=dt;if(S.doneT>1.8){S.cardT=CARD;setPhase('card');pushSnap()}}
  }else if(S.ph==='card'){S.cardT-=dt;if(S.cardT<=0)nextHole()}
}

/* ================= networking ================= */
const ST=['rest','move','sunk','dnf'];
const r3=v=>Math.round(v*1000)/1000,r2=v=>Math.round(v*100)/100;
let netT=0;
function pushSnap(){
  if(!conns.length){evq=[];return}
  const m={t:'s',ph:S.ph,hi:S.hi,hl:S.holes,ht:r3(S.ht),tl:r2(S.tl),it:r2(S.introT),ct:r2(S.cardT),
    b:S.players.map(p=>{const b=p.b;return b?[p.id,r3(b.x),r3(b.y),r3(b.z),r2(b.vx),r2(b.vy),r2(b.vz),Math.max(0,ST.indexOf(b.st)),b.strokes]:[p.id]}),
    sc:S.players.map(p=>[p.id,...(S.sc[p.id]||[])]),ev:evq};
  evq=[];bcast(m);
}
function addBotsTo(n){const used=S.players.map(p=>p.ci);while(S.players.length<n){let ci=0;while(used.includes(ci))ci++;used.push(ci);S.players.push(mk(S.nextId++,BOT_NAMES[ci],ci,true))}}
function syncBots(){S.players=S.players.filter(p=>!p.bot);if(S.role==='solo'||S.botFill)addBotsTo(4);S.players.sort((a,b)=>a.ci-b.ci)}
const roster=()=>S.players.map(p=>({id:p.id,name:p.name,ci:p.ci,bot:p.bot}));
function sendLobby(){bcast({t:'lobby',code:S.code,mode:S.mode,botFill:S.botFill,players:roster()});renderLobby()}
function freeCi(){const u=S.players.filter(p=>!p.bot).map(p=>p.ci);let c=0;while(u.includes(c))c++;return c}
function hostGame(tries=0){
  audio();cleanupNet();S.role='host';S.code=genCode();S.players=[];conns=[];S.botFill=false;const gen=++S.gen;toast('Creating room…');
  try{peer=new Peer(PREFIX+S.code,{config:{iceServers:ICE}})}catch(e){toast('Network not available');S.role=null;return}
  const pr=peer;
  pr.on('open',()=>{if(gen!==S.gen)return;const p=mk(S.nextId++,getName(),0,false);S.me=p.id;S.players=[p];syncBots();setPhase('lobby');renderLobby()});
  pr.on('connection',c=>{if(gen!==S.gen)return;c.on('data',m=>hostMsg(c,m));c.on('close',()=>dropConn(c));c.on('error',()=>dropConn(c))});
  pr.on('error',e=>{if(gen!==S.gen)return;if(e.type==='unavailable-id'&&tries<5)hostGame(tries+1);else if(S.ph==='menu'){toast('Could not create room ('+e.type+')');cleanupNet();S.role=null}else toast('Network hiccup: '+e.type)});
  pr.on('disconnected',()=>{if(gen===S.gen&&!pr.destroyed){try{pr.reconnect()}catch(e){}}});
}
function hostMsg(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    if(conn._p)return;const humans=S.players.filter(p=>!p.bot).length;
    if(inGame()){send(conn,{t:'full',why:'Game in progress — try again in a moment'});setTimeout(()=>conn.close(),300);return}
    if(humans>=4){send(conn,{t:'full',why:'Room is full'});setTimeout(()=>conn.close(),300);return}
    S.players=S.players.filter(p=>!p.bot);const p=mk(S.nextId++,String(m.name||'Player').slice(0,10),freeCi(),false,conn);
    conn._p=p;conns.push(conn);S.players.push(p);syncBots();send(conn,{t:'welcome',id:p.id});
    if(S.ph==='end')setPhase('lobby');sendLobby();toast(p.name+' joined!');
  }else if(m.t==='shot'&&conn._p){const p=conn._p,c=v=>clamp(+v||0,-MAXV,MAXV);if(!p.bot)doShot(p,c(m.vx),c(m.vz))}
}
function dropConn(conn){
  const p=conn._p;conns=conns.filter(c=>c!==conn);if(!p)return;conn._p=null;
  if(S.ph==='lobby'||S.ph==='end'){S.players=S.players.filter(q=>q!==p);delete S.sc[p.id];syncBots();if(S.ph==='lobby')sendLobby()}
  else{p.bot=true;p.conn=null;p.ai=null;bcast({t:'roster',players:roster()})}
  toast(p.name+' left'+(inGame()?' — a bot takes over':''));
}
function joinGame(code){
  audio();code=(code||'').toUpperCase().trim();if(!/^[A-Z]{4}$/.test(code)){toast('Enter the 4-letter code');return}
  cleanupNet();S.role='client';S.code=code;S.players=[];toast('Connecting…');const gen=++S.gen;
  try{peer=new Peer(undefined,{config:{iceServers:ICE}})}catch(e){toast('Network not available');S.role=null;return}
  const pr=peer,name=getName();let ok=false;
  const fail=msg=>{if(ok||gen!==S.gen)return;toast(msg);leave()};
  const to=setTimeout(()=>fail('Could not connect. Check the code and try again'),15000);
  pr.on('open',()=>{if(gen!==S.gen)return;const c=pr.connect(PREFIX+code,{reliable:true});hostConn=c;
    c.on('open',()=>{ok=true;clearTimeout(to);send(c,{t:'join',name})});
    c.on('data',m=>{if(gen===S.gen)clientMsg(m)});
    c.on('close',()=>{if(gen===S.gen&&S.role==='client'){toast('Host left the game');leave()}})});
  pr.on('error',e=>{if(gen!==S.gen)return;if(e.type==='peer-unavailable')fail('Room '+code+' not found');else if(!ok)fail('Network error: '+e.type)});
}
function applyRoster(list){S.players=list.map(q=>{const p=pById(q.id)||mk(q.id,q.name,q.ci,q.bot);p.name=q.name;p.ci=q.ci;p.bot=q.bot;return p})}
function clientMsg(m){
  if(!m)return;
  if(m.t==='welcome')S.me=m.id;
  else if(m.t==='full'){toast(m.why);leave()}
  else if(m.t==='lobby'){S.code=m.code;S.botFill=m.botFill;S.mode=m.mode;applyRoster(m.players);if(S.ph!=='lobby')setPhase('lobby');renderLobby()}
  else if(m.t==='roster')applyRoster(m.players);
  else if(m.t==='s'){
    const newHole=m.hl.join()!==S.holes.join()||m.hi!==S.hi||H!==HOLES[m.hl[m.hi]];
    S.holes=m.hl;S.hi=m.hi;
    if(newHole){H=HOLES[S.holes[S.hi]];R3.setHole(H);S.ht=m.ht}
    else if(Math.abs(S.ht-m.ht)>.25)S.ht=m.ht;else S.ht+=(m.ht-S.ht)*.2;
    S.tl=m.tl;S.introT=m.it;S.cardT=m.ct;
    for(const e of m.b){const p=pById(e[0]);if(!p||e.length<2)continue;
      if(!p.b||newHole){p.b=newBall(p.id,e[1],e[3],H);p.v={x:e[1],y:e[2],z:e[3]}}
      const b=p.b,ost=b.st;[,b.x,b.y,b.z,b.vx,b.vy,b.vz]=e;b.st=ST[e[7]];b.strokes=e[8];b.snapT=time;
      if(p.id===S.me&&(b.st!=='rest'||b.strokes!==p.sentStrokes))pendingShot=0;
      if(ost!==b.st&&b.st==='rest'&&ost==='move'&&Math.hypot(p.v.x-b.x,p.v.z-b.z)>2.5)p.v={x:b.x,y:b.y,z:b.z}}
    for(const r of m.sc)S.sc[r[0]]=r.slice(1);
    for(const e of m.ev)fx(e);
    if(m.ph!==S.ph)setPhase(m.ph);
  }
}
function cleanupNet(){try{if(hostConn)hostConn.close()}catch(e){}try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}peer=null;hostConn=null;conns=[]}
function leave(){S.gen++;S.role=null;cleanupNet();S.players=[];S.me=-1;H=HOLES[2];R3.setHole(H);setPhase('menu')}
function soloGame(){audio();cleanupNet();S.gen++;S.role='solo';S.code='';conns=[];const p=mk(S.nextId++,getName(),0,false);S.me=p.id;S.players=[p];syncBots();setPhase('lobby');renderLobby()}

/* ================= UI ================= */
function setPhase(ph){
  const was=S.ph;S.ph=ph;
  const on=(id,v)=>$(id).classList.toggle('on',v);
  on('menu',ph==='menu');on('lobby',ph==='lobby');on('cardScr',ph==='card');on('results',ph==='end');
  document.body.classList.toggle('ingame',inGame());document.body.classList.toggle('carding',ph==='card');
  if(ph==='card')buildCard();if(ph==='end')buildResults();
  if(ph==='intro'){S.cam='follow';$('camBtn').classList.remove('on');$('feed').innerHTML='';banner(H.name.toUpperCase(),'Hole '+(H.idx+1)+' · Par '+H.par,INTRO-.3,'#ffd23f')}
  if(inGame()){wake();if(document.activeElement)document.activeElement.blur()}
  if(ph!=='play')cancelAim();

}
function renderLobby(){

    if(isHost)d.onclick=()=>{S.mode=k;if(solo)renderLobby();else sendLobby()};mw.appendChild(d)}
  $('mdesc').textContent=MODES[S.mode].desc;

  for(let i=0;i<4;i++){const p=S.players.find(q=>q.ci===i),d=document.createElement('div');
    if(p){d.className='pl';d.innerHTML=`<i style="color:${COLORS[p.ci]}"></i><span>${esc(p.name)}</span><small>${p.id===S.me?'you':p.bot?'bot':''}</small>`}

function totals(p){let t=0,par=0;S.holes.forEach((h,i)=>{const s=(S.sc[p.id]||[])[i];if(s!=null){t+=s;par+=HOLES[h].par}});return{t,d:t-par}}
const fmtD=d=>d===0?'E':(d>0?'+':'')+d;
function scoreTable(cur){
  let h='<table class="sc"><tr><th>Hole</th>'+S.holes.map((x,i)=>`<th class="${i===cur?'cur':''}">${x+1}</th>`).join('')+'<th>Tot</th></tr>';
  h+='<tr class="par"><td class="nm">Par</td>'+S.holes.map((x,i)=>`<td class="${i===cur?'cur':''}">${HOLES[x].par}</td>`).join('')+`<td>${S.holes.reduce((a,x)=>a+HOLES[x].par,0)}</td></tr>`;
  for(const p of S.players){const sc=S.sc[p.id]||[],T=totals(p);
    h+=`<tr><td class="nm"><i style="color:${COLORS[p.ci]}"></i>${esc(p.name)}</td>`+S.holes.map((x,i)=>{const s=sc[i];if(s==null)return`<td class="${i===cur?'cur':''}">·</td>`;
      const c=s===1?'hio':s<HOLES[x].par?'u':s>HOLES[x].par?'o':'';return`<td class="${i===cur?'cur':''}"><span class="s ${c}">${s}</span></td>`}).join('')+`<td class="tot">${T.t}<small> ${fmtD(T.d)}</small></td></tr>`}
  return h+'</table>';
}
function buildCard(){
  $('cardTitle').textContent='HOLE '+(H.idx+1)+' DONE';$('cardTable').innerHTML=scoreTable(S.hi);
  const last=S.hi+1>=S.holes.length,host=S.role!=='client';
  $('btnNext').style.display=host?'block':'none';$('btnNext').textContent=last?'FINAL SCORES ▶':'NEXT HOLE ▶';
}
function rankList(){return[...S.players].sort((a,b)=>totals(a).t-totals(b).t||(S.sc[b.id]||[]).filter(s=>s===1).length-(S.sc[a.id]||[]).filter(s=>s===1).length)}
function buildResults(){
  const rk=rankList(),w=rk[0],meds=['🥇','🥈','🥉','🎖️'];if(!w)return;const T=totals(w);
  const tied=rk.filter(p=>totals(p).t===T.t),isTie=tied.length>1;
  $('resTitle').textContent=isTie?"IT'S A TIE!":(w.id===S.me?'YOU WIN!':esc(w.name).toUpperCase()+' WINS!');
  $('resSub').textContent=(isTie?(tied.length>2?tied.length+'-way tie':tied.map(p=>p.name).join(' & '))+' · ':'')+T.t+' strokes ('+fmtD(T.d)+')'+(S.role==='client'?' · waiting for host':'');
  $('resList').innerHTML=rk.map((p,i)=>{const t=totals(p);return`<div class="rk"><span class="m">${meds[i]}</span><i style="color:${COLORS[p.ci]}"></i><span class="nm">${esc(p.name)}</span><span class="n">${t.t}<small>${fmtD(t.d)}</small></span></div>`}).join('');
  $('resTable').innerHTML=scoreTable(-1);
  $('btnAgain').style.display=S.role==='client'?'none':'block';
}

/* ================= aiming input ================= */
const cv=$('cv');
const aim={id:null,sx:0,sy:0,cx:0,cy:0,power:0,dx:0,dz:1,on:false};
function canAim(){const p=me();return S.ph==='play'&&p&&p.b&&p.b.st==='rest'&&!(pendingShot&&time<pendingShot)}
function cancelAim(){aim.id=null;aim.on=false;aim.power=0;document.body.classList.remove('aiming')}
cv.addEventListener('pointerdown',e=>{if(!canAim()||aim.id!==null)return;e.preventDefault();aim.id=e.pointerId;aim.sx=aim.cx=e.clientX;aim.sy=aim.cy=e.clientY;aim.on=true;aim.power=0;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
addEventListener('pointermove',e=>{if(e.pointerId!==aim.id)return;aim.cx=e.clientX;aim.cy=e.clientY;computeAim()},{passive:true});

function update(dt){
  time+=dt;
  if(S.role==='host'||S.role==='solo'){
    if(inGame())hostUpdate(dt);
    for(const p of S.players)if(p.b){p.v.x=p.b.x;p.v.y=p.b.y;p.v.z=p.b.z}

  }else if(S.role==='client'){
    if(isPlaying())S.ht+=dt;if(S.ph==='card')S.cardT-=dt;if(S.tl>0&&S.ph==='play')S.tl=Math.max(0,S.tl-dt);
    const k=1-Math.exp(-dt*14);

  }

  hud(dt);
}
