<style>
:root{--ink:#1d1b3a;--card:#fffdf6;--dim:#5d5a80;--yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a;--orange:#ffa23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#7fd0ff,#d8f5c8);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;font-weight:600;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch;z-index:20}
.screen.on{display:flex}
#title{background:linear-gradient(180deg,rgba(127,208,255,.0),rgba(216,245,200,.0));z-index:25}
#panel{z-index:30;background:rgba(29,27,58,.38)}
.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:16px 18px 14px;width:min(480px,100%);box-shadow:0 8px 0 var(--ink);margin:auto;animation:pop .3s cubic-bezier(.3,1.6,.5,1);max-height:calc(100vh - 20px);display:flex;flex-direction:column}
.card.wide{width:min(660px,100%)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(44px,11vw,64px);line-height:.92;letter-spacing:1px;text-align:center;color:#8be04e;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-3deg)}
h1 span{color:var(--yellow)}
h2{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:32px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.sub{text-align:center;color:var(--dim);margin:8px 0 10px;font-size:15px}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px;letter-spacing:.6px;text-transform:uppercase}
input[type=text],textarea{width:100%;font:600 18px 'Fredoka',sans-serif;color:var(--ink);background:#eef6ff;border:3px solid var(--ink);border-radius:14px;padding:9px 13px;outline:none;user-select:text;-webkit-user-select:text}
textarea{font-size:13px;height:110px;resize:none;word-break:break-all}
input[type=text]:focus,textarea:focus{background:#fff;box-shadow:0 0 0 4px rgba(76,201,255,.45)}
.btn{display:block;width:100%;font:400 20px 'Lilita One',sans-serif;letter-spacing:.5px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:15px;padding:10px;margin-top:9px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-height:48px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.ghost{background:#fff}
.btn.sm{font-size:16px;padding:6px 12px;margin-top:0;min-height:48px;width:auto;box-shadow:0 4px 0 var(--ink)}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.join{display:flex;gap:10px;margin-top:9px}
.join input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Lilita One',sans-serif;font-size:22px;padding:8px}
.join .btn{width:auto;margin:0;padding:0 22px;flex:none}
.invite{background:#fff2b8;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:6px;text-align:center;font-size:15px}
.slots{display:grid;gap:8px;margin:8px 0}
.slot-c{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:15px;background:#fff;border:3px solid var(--ink);cursor:pointer;min-height:56px}
.slot-c.sel{background:#fff2b8;box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.slot-c .si{font-size:28px;width:38px;text-align:center}
.slot-c small{display:block;color:var(--dim);font-size:12px;font-weight:600}
.slot-c b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:17px}
.code{font-family:'Lilita One',sans-serif;font-size:50px;letter-spacing:10px;text-align:center;color:var(--blue);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin:0;cursor:pointer}
.pbody{overflow:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding:2px}
.ptabs{display:flex;gap:6px;margin:4px 0 8px;overflow-x:auto;flex:none}
.ptab{flex:none;font:400 15px 'Lilita One',sans-serif;padding:6px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;min-height:48px}
.ptab.sel{background:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.cell{position:relative;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px 4px 4px;text-align:center;cursor:pointer;min-height:84px}
.cell .ci{font-size:30px;line-height:1.15;height:40px;display:flex;align-items:center;justify-content:center}
.cell .ci img{width:38px;height:38px;object-fit:contain}
.cell .cn{font-size:12px;line-height:1.1;margin-top:1px}
.cell .cq{position:absolute;right:4px;top:2px;font:400 14px 'Lilita One',sans-serif;background:var(--yellow);border:2px solid var(--ink);border-radius:9px;padding:0 5px;min-width:22px}
.cell.sel{background:#fff2b8;box-shadow:0 3px 0 var(--ink)}
.cell.dim{opacity:.4}
.cell .seedb{position:absolute;left:3px;top:3px;font-size:13px}
.lr{display:flex;align-items:center;gap:10px;padding:7px 10px;border:3px solid var(--ink);border-radius:14px;background:#fff;margin-bottom:7px}
.lr .ico{flex:none;width:44px;height:44px;font-size:30px;display:flex;align-items:center;justify-content:center}
.lr .ico img{width:40px;height:40px;object-fit:contain}
.lr .tx{flex:1;min-width:0;font-size:15px;line-height:1.15}
.lr .tx small{display:block;color:var(--dim);font-size:12px;font-weight:600;margin-top:2px}
.lr.done{background:#e4ffd8}.lr.cur{background:#fff2b8}
.bar{height:12px;border:2.5px solid var(--ink);border-radius:8px;background:#e6e8f2;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green);width:0}
.hearts{letter-spacing:1px;font-size:15px;color:#ff4f81}
.speech{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;margin:8px 0;font-size:16px;line-height:1.25}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:2px solid var(--ink);background:#eef;margin-left:4px}
.pill.g{background:#d6ffc9}.pill.r{background:#ffd0d0}
.note{font-size:13px;color:var(--dim);text-align:center;margin:6px 0}
/* HUD */
#hud,#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:6}
body.playing #hud{display:block}
body.pan #hud,body.pan #touch,body.pan #tags,body.pan #fishUI{visibility:hidden}
body.playing.touch #touch{display:block}
.chip{position:absolute;display:flex;align-items:center;gap:7px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 11px;font:600 15px 'Fredoka',sans-serif;box-shadow:0 3px 0 var(--ink);min-height:34px;white-space:nowrap}
#topL{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px}
#topL .chip{position:static}
#cLvl{cursor:pointer;pointer-events:auto}
.xpbar{width:54px;height:10px;border:2.5px solid var(--ink);border-radius:6px;background:#e6e8f2;overflow:hidden}.xpbar i{display:block;height:100%;width:0;background:var(--blue)}
#topC{left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);font-size:14px;pointer-events:auto;cursor:pointer}
#quest{left:max(8px,env(safe-area-inset-left));top:max(50px,calc(env(safe-area-inset-top) + 46px));max-width:min(300px,52vw);font-size:12px;white-space:normal;line-height:1.15;padding:3px 9px;pointer-events:auto;cursor:pointer;min-height:30px}
#quest b{color:#e0457b}
#buffs{position:absolute;left:50%;transform:translateX(-50%);top:max(46px,calc(env(safe-area-inset-top) + 44px));display:flex;gap:5px}
.bf{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:0 7px;font-size:13px;min-height:26px;display:flex;align-items:center;gap:3px}
#roomChip{right:max(8px,env(safe-area-inset-right));top:max(60px,calc(env(safe-area-inset-top) + 58px));font-size:12px;min-height:28px;padding:1px 9px;display:none}
#topR{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
.rb{width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:21px;cursor:pointer;padding:0;position:relative}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.rb .bdg{position:absolute;right:-6px;top:-8px;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:10px;font:400 12px 'Lilita One',sans-serif;padding:0 5px;display:none}
#hot{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:2px;pointer-events:auto;background:rgba(255,255,255,.55);padding:3px;border-radius:16px;border:3px solid var(--ink)}
.hs{position:relative;width:48px;height:48px;border-radius:11px;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:25px;cursor:pointer;padding:0}
.hs img{width:36px;height:36px;object-fit:contain;pointer-events:none}
.hs.sel{background:#fff2b8;border-color:#e0457b;transform:translateY(-5px);box-shadow:0 5px 0 var(--ink)}
.hs .q{position:absolute;right:1px;bottom:-1px;font:400 12px 'Lilita One',sans-serif;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:0 4px;line-height:14px}
.hs .k{position:absolute;left:3px;top:0;font:600 12px 'Fredoka',sans-serif;color:var(--dim)}
.hs.zero{opacity:.5}
body.touch .hs .k{display:none}
#actBtn{pointer-events:auto;position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--ink);touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;line-height:1}
#actBtn:active,#actBtn.held{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#actBtn #actIco{font-size:28px;line-height:1.05}
#actBtn #actIco img{width:34px;height:34px;object-fit:contain}
#actBtn b{font:400 15px 'Lilita One',sans-serif;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;letter-spacing:.4px}
#actBtn.off{background:#b9b7cf;filter:saturate(.5)}
.jbase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:4px solid rgba(29,27,58,.55);background:rgba(255,255,255,.3);display:none}
.jknob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#jhint{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:84px;font-size:12px;color:rgba(29,27,58,.6);background:rgba(255,255,255,.55);padding:2px 9px;border-radius:9px}
#tags,#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.tag{position:absolute;transform:translate(-50%,-100%);font:600 13px 'Fredoka',sans-serif;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:0 8px;white-space:nowrap;will-change:left,top}
.tag.npc{background:#fff2b8}
.tag.sp{white-space:normal;width:max-content;max-width:170px;text-align:center;font-size:12px;line-height:1.15;border-radius:12px;padding:3px 9px}
.tag small{font-size:11px;color:#e0457b}
.pop{position:absolute;transform:translate(-50%,-50%);font:400 22px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;animation:rise 1.3s ease-out forwards;white-space:nowrap}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-64px}}
#fishUI{position:fixed;right:max(120px,calc(env(safe-area-inset-right) + 118px));top:50%;transform:translateY(-50%);display:none;z-index:8;pointer-events:auto;align-items:flex-end;gap:8px}
#fishUI.on{display:flex}
#fbar{position:relative;width:46px;height:min(250px,64vh);border:4px solid var(--ink);border-radius:16px;background:linear-gradient(#aee6ff,#4fb6f0);overflow:hidden;box-shadow:0 5px 0 var(--ink);touch-action:none}
#fzone{position:absolute;left:0;right:0;background:rgba(126,227,106,.78);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
#ffish{position:absolute;left:5px;width:30px;height:30px;font-size:24px;line-height:30px;text-align:center}
#fprog{width:16px;height:min(250px,64vh);border:3px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden;position:relative}
#fprog i{position:absolute;left:0;right:0;bottom:0;background:var(--orange);height:0}
#fmsg{position:fixed;left:50%;top:26%;transform:translateX(-50%);font:400 36px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);display:none;z-index:8;pointer-events:none}
#fmsg.on{display:block}
#fade{position:fixed;inset:0;background:#1d1b3a;opacity:0;pointer-events:none;z-index:35;transition:opacity .28s}
#fade.on{opacity:1}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%) translateY(-160px);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 16px;border-radius:15px;z-index:40;transition:transform .25s cubic-bezier(.3,1.6,.5,1);max-width:88vw;text-align:center;font-size:15px;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
#rotate{position:fixed;inset:0;background:linear-gradient(#7fd0ff,#d8f5c8);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px;font:400 28px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#rotate .ph{font-size:76px;animation:rot 1.6s ease-in-out infinite;-webkit-text-stroke:0}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.touch.playing #rotate{display:flex}}
#lvlpop{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:31;display:none;text-align:center;pointer-events:none}
#lvlpop.on{display:block;animation:lv 2.4s ease-out forwards}
#lvlpop b{font:400 54px 'Lilita One',sans-serif;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);display:block}
#lvlpop span{font:400 20px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
@keyframes lv{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
@media (max-height:420px){h1{font-size:34px!important;transform:none}.sub{margin:3px 0 3px;font-size:13px}.card{padding:8px 14px 8px;border-radius:20px}.btn{padding:3px 8px;margin-top:6px;font-size:17px}input[type=text]{padding:4px 12px}.slots{margin:4px 0;gap:5px}.slot-c{min-height:50px;padding:4px 10px}.code{font-size:34px}label{margin:3px 0 2px}.join{margin-top:6px}.join input{padding:4px}h2{font-size:24px;margin-bottom:2px}.ptabs{margin:2px 0 4px}.grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}.cell{min-height:76px}.lr{padding:4px 8px;margin-bottom:5px}#tcard{width:min(780px,100%);display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}.tcol{min-width:0}}
@media (max-height:380px){.chip{min-height:30px;padding:2px 9px;font-size:14px}#quest{top:44px}#toast{top:56px}}
html,body{background:linear-gradient(#5ec2ff,#c9f0ff)}
h1{color:#4cc9ff}
h1 span{color:#ffd23f}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:29}
body.pan #hud,body.pan #touch,body.pan #tags,body.pan #meter,body.pan #fmsg,body.pan #feed{visibility:hidden}
#bait{pointer-events:auto;position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(118px,calc(env(safe-area-inset-bottom) + 114px));min-width:62px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font:400 15px 'Lilita One',sans-serif;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px}

#baitpop.on{display:block}
#baitpop .lr{margin-bottom:5px;padding:4px 8px;cursor:pointer}
#meter{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:clamp(200px,calc(100vw - 330px),380px);display:none;z-index:7;pointer-events:none}
#meter.on{display:block}
#pbar,#cbar{height:16px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;position:relative;margin-bottom:6px}

#tzone{position:absolute;top:0;bottom:0;background:rgba(126,227,106,.85);border-left:3px solid var(--ink);border-right:3px solid var(--ink)}

#fmsg{position:fixed;left:50%;top:24%;transform:translateX(-50%);font:400 clamp(30px,8vw,46px) 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);display:none;z-index:8;pointer-events:none;white-space:nowrap;text-align:center}
#fmsg.on{display:block;animation:fm .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes fm{from{transform:translateX(-50%) scale(.4);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

async function encodeSave(obj){const json=JSON.stringify(obj);let bytes=new TextEncoder().encode(json),pre='FB0:';
  if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer());pre='FB1:'}catch(e){pre='FB0:';bytes=new TextEncoder().encode(json)}}
  let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return pre+btoa(s)}
async function decodeSave(str){str=String(str).trim().replace(/\s+/g,'');const pre=str.slice(0,4);if(pre!=='FB0:'&&pre!=='FB1:')throw new Error('bad code');
  const bin=atob(str.slice(4));let bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(pre==='FB1:'){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer())}
  const s=JSON.parse(new TextDecoder().decode(bytes));if(!s||typeof s!=='object'||!s.gear||!s.bait)throw new Error('bad save');return migrate(s)}

const aimRing=new THREE.Mesh(new THREE.RingGeometry(.5,.62,24),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.8,depthWrite:false,side:THREE.DoubleSide}));aimRing.rotation.x=-Math.PI/2;aimRing.visible=false;aimRing.renderOrder=4;scene.add(aimRing);
const aimDots=[];for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.07,6,5),new THREE.MeshBasicMaterial({color:0xffffff}));m.visible=false;scene.add(m);aimDots.push(m)}
function updAim(){const d=castDist(FS.pw),[dx,dz]=aimDir(ME.aim),tx=ME.x+dx*d,tz=ME.z+dz*d,ok=curScn.ok(tx,tz),sweet=FS.pw>.55&&FS.pw<.82,sd=(1-rod().acc)*.1*d+(sweet?0:.04*d);

const camPos=new V3(),camLook=new V3();let camInit=false,photoK=0;
function placeCamera(dt,t){const sc=curScn,c=sc.cam,tgt=new V3(ME.x,ME.y,ME.z);
  photoK+=((FS.st==='catch'?1:0)-photoK)*Math.min(1,dt*4);
  let pos,look;
  if(c.top){pos=new V3(ME.x*.8,ME.y+c.h,ME.z+c.back);look=new V3(ME.x*.8,ME.y+.5,ME.z-1)}
  else{const bobx=ME.rig&&ME.rig.st==='float'?ME.rig.tgt.x:ME.x;const fk=FS.st==='fight'?.5:FS.st==='wait'||FS.st==='bite'||FS.st==='cast'?.3:0;
    pos=new V3(ME.x*.9+(ME.aim*.8),ME.y+c.h-(fk*.3),ME.z+c.back-(ME.onBoat?.2:0));
    look=new V3(lerp(ME.x,bobx,fk)+ME.aim*2,ME.y+.5-1.2*fk*0,ME.z+c.look*(1-fk*.4)+(ME.rig&&FS.st!=='idle'&&FS.st!=='charge'?(ME.rig.st==='float'||ME.rig.st==='fight'?(ME.rig.bob.position.z-ME.z)*fk*.8:0):0))}
  if(photoK>.01){const [fx,fz]=[Math.sin(ME.ry),Math.cos(ME.ry)];const pp=new V3(ME.x+fx*4.6+fz*-1.4,ME.y+2.1,ME.z+fz*4.6+fx*1.4),pl=new V3(ME.x-fz*.5,ME.y+1.8,ME.z+fx*.5);if(ME.onBoat){pp.y+=ME.boat?ME.boat.position.y:0}pos.lerp(pp,photoK);look.lerp(pl,photoK)}
  const k=camInit?Math.min(1,dt*(c.top?5:4.5)):1;camPos.lerp(pos,k);camLook.lerp(look,k);camInit=true;
  // never go under the water or the ground, nor inside the terrain
  camera.position.copy(camPos);if(camera.position.y<(ME.y||0)+.7)camera.position.y=(ME.y||0)+.7;
  // shake (decays EVERY frame)
  if(G.shake>0){camera.position.x+=(Math.random()-.5)*G.shake;camera.position.y+=(Math.random()-.5)*G.shake;G.shake*=Math.exp(-dt*7);if(G.shake<.002)G.shake=0}
  camera.lookAt(camLook)}

    if(boat){if(!r.boat){r.boat=makeBoatMesh(p.boat-1);sc.g.add(r.boat)}r.boat.visible=true;if(r.av.root.parent!==r.boat.userData.deck)r.boat.userData.deck.add(r.av.root);floatBoat(r.boat,p.x,p.z,G.time,Math.PI);animAvatar(r.av,dt,0,0,.2,(p.try||Math.PI)-Math.PI,0,t)}
