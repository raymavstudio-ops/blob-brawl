<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script>(function(){var v=navigator.vibrate&&navigator.vibrate.bind(navigator);if(v)navigator.vibrate=function(p){try{if(!navigator.userActivation||navigator.userActivation.hasBeenActive)return v(p)}catch(e){}return false}})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Blob Supermarket</title>
<meta name="apple-mobile-web-app-title" content="Blob Supermarket">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--card:#fffdf6;--dim:#5d5a80;--yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a;--red:#ff4d6d;--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#7fc8ff,#d8f3d0);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;font-weight:600;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:var(--ink)}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(14px,var(--sr)) 10px max(14px,var(--sl));overflow:auto;-webkit-overflow-scrolling:touch;z-index:10}
.screen.on{display:flex}.screen.dim{background:rgba(29,27,58,.35)}
.card{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:18px 20px 14px;width:min(500px,100%);box-shadow:0 9px 0 var(--ink);margin:auto;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.card.wide{width:min(780px,100%)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(40px,10vw,58px);line-height:.92;letter-spacing:1px;text-align:center;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
h1 span{color:var(--pink);font-size:.74em;letter-spacing:0}
h2{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:28px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.sub{text-align:center;color:var(--dim);margin:8px 0 10px;font-size:14px}
label{display:block;font-size:13px;color:var(--dim);margin:8px 0 4px;letter-spacing:.6px;text-transform:uppercase}
input[type=text],textarea{width:100%;font:600 18px 'Fredoka',sans-serif;color:var(--ink);background:#eef6ff;border:3px solid var(--ink);border-radius:16px;padding:9px 14px;outline:none;user-select:text;-webkit-user-select:text;min-height:48px}
textarea{font-size:13px;height:80px;resize:none;word-break:break-all}
.btn{display:block;width:100%;font:400 20px 'Lilita One',sans-serif;letter-spacing:.5px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:9px;margin-top:8px;cursor:pointer;box-shadow:0 5px 0 var(--ink);text-align:center;text-decoration:none;min-height:48px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.ghost{background:#fff}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.red{background:#ff8fa3}
.btn.sm{font-size:16px;padding:5px 10px;margin-top:6px}
.btn small{display:block;font:600 12px 'Fredoka',sans-serif;color:var(--dim);-webkit-text-stroke:0;margin-top:1px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.join{display:flex;gap:10px;margin-top:8px}
.join input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Lilita One',sans-serif;font-size:22px;padding:6px}
.join .btn{width:auto;margin:0;padding:0 22px;flex:none}
.invite{background:#fff2b8;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;margin:6px 0;text-align:center;font-size:15px}
.code{font-family:'Lilita One',sans-serif;font-size:46px;letter-spacing:10px;text-align:center;color:var(--blue);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin:0}
.tcols{display:flex;gap:18px;align-items:center}.tcols>div{flex:1;min-width:0}
.slot{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:18px;padding:7px 10px;background:#fff;margin-top:8px;box-shadow:0 4px 0 var(--ink);cursor:pointer;min-height:56px}
.slot.sel{background:#fff2b8}.slot .ic{font-size:28px;width:40px;text-align:center}
.slot .inf{flex:1;min-width:0}.slot .inf b{font:400 18px 'Lilita One';display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .inf span{font-size:13px;color:var(--dim)}.slot.empty{opacity:.75}
.slotbtns{display:flex;gap:6px}.slotbtns .btn{width:auto;margin:0;padding:4px 10px;font-size:15px;min-width:48px}
.colors{display:flex;gap:10px;justify-content:center;margin:4px 0}
.colors div{width:48px;height:48px;border-radius:50%;border:4px solid var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.colors div.sel{transform:translateY(-4px) scale(1.08);outline:4px solid var(--yellow)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{min-height:48px;min-width:48px;padding:4px 10px;border:3px solid var(--ink);border-radius:14px;background:#fff;font:400 15px 'Lilita One';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 0 var(--ink)}
.chip.sel{background:var(--yellow)}.chip.lock{opacity:.5}
.recap{background:#eaf9ff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.35;margin:8px 0;text-align:left}
.recap b{font:400 16px 'Lilita One'}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
body.playing #hud{display:block}
.pane{background:rgba(255,253,246,.95);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink)}
#top{position:absolute;left:max(6px,var(--sl));right:max(6px,var(--sr));top:max(5px,env(safe-area-inset-top));display:flex;gap:5px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:48px;height:48px;flex:none;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ib:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}.ib.sel{background:var(--yellow)}
.tc{height:48px;padding:0 9px;display:flex;align-items:center;gap:5px;font:400 17px 'Lilita One';cursor:pointer;white-space:nowrap;background:rgba(255,253,246,.95);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink)}
.tc .v{line-height:1.05}.tc small{font:600 12px 'Fredoka';display:block;color:var(--dim);line-height:1}
#spacer{flex:1;pointer-events:none!important}
#players{display:flex;gap:4px}.pl{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink)}
#leftcol{position:absolute;left:max(6px,var(--sl));top:calc(max(5px,env(safe-area-inset-top)) + 56px);width:216px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
#goalchip{padding:4px 10px;pointer-events:auto;cursor:pointer;font-size:12px;line-height:1.2}
#goalchip b{font:400 13px 'Lilita One';color:#7b5cff;display:block}
#goalchip .gp{height:8px;border-radius:5px;background:#e1dff0;border:2px solid var(--ink);margin-top:3px;overflow:hidden}#goalchip .gp i{display:block;height:100%;background:var(--green)}
#alertchip{padding:4px 10px;pointer-events:auto;cursor:pointer;font:400 13px 'Lilita One';display:none;min-height:34px;align-items:center;align-self:flex-start;max-width:216px}
#alertchip.on{display:flex}
#mini{position:absolute;right:max(6px,var(--sr));top:calc(max(5px,env(safe-area-inset-top)) + 56px);width:112px;height:84px;pointer-events:auto;cursor:pointer;background:#fffdf6;border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink)}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(4px,var(--sb));display:flex;gap:6px;pointer-events:auto}
.bb{width:58px;height:54px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font:400 12px 'Lilita One';line-height:1.05;position:relative}
.bb i{font-style:normal;font-size:20px;line-height:1.1}.bb:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.bb .nb{position:absolute;right:-5px;top:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;border:2px solid var(--ink);font:400 12px 'Lilita One';display:none;align-items:center;justify-content:center;padding:0 3px}
.bb .nb.on{display:flex}
#actwrap{position:absolute;right:max(10px,var(--sr));bottom:calc(max(4px,var(--sb)) + 2px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#bAct{pointer-events:auto;width:84px;height:84px;border-radius:50%;background:var(--yellow);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);font:400 15px 'Lilita One';line-height:1.05;cursor:pointer;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
#bAct i{font-style:normal;font-size:26px}#bAct.held,#bAct:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}#bAct.off{background:#d9d6e8;opacity:.8}
#bDrop{pointer-events:auto;display:none}#bDrop.on{display:flex}
#joyBase{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;background:rgba(255,255,255,.4);border:4px solid rgba(29,27,58,.55);display:none;z-index:5;pointer-events:none}
#joyBase .jknob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
#dpad{position:absolute;left:max(10px,var(--sl));bottom:calc(max(4px,var(--sb)) + 4px);display:none;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:3px;pointer-events:auto}
#dpad.on{display:grid}#dpad button{width:46px;height:46px;border-radius:12px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:18px;padding:0;cursor:pointer}
#placebar{position:absolute;right:max(8px,var(--sr));bottom:calc(max(4px,var(--sb)) + 6px);display:none;gap:6px;pointer-events:auto;align-items:center;flex-direction:column}
#placebar.on{display:flex}#placebar .ib{width:56px;height:56px}
#placeinfo{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,var(--sb));padding:5px 12px;font-size:14px;display:none;text-align:center;max-width:56vw;pointer-events:none}
#placeinfo.on{display:block}
#cbar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,var(--sb));display:none;gap:5px;padding:5px;pointer-events:auto;align-items:center}
#cbar.on{display:flex}#cbar .ib{width:50px;height:50px;font-size:18px}#cbar .tx{font:400 14px 'Lilita One';max-width:140px;line-height:1.1;padding:0 6px}
#serve{position:absolute;left:max(228px,calc(50% - 170px));top:calc(max(5px,env(safe-area-inset-top)) + 56px);width:min(340px,calc(100vw - 352px));min-width:250px;padding:5px 8px;display:none;pointer-events:auto}
#serve.on{display:block}
#serve .sh{display:flex;align-items:center;gap:6px;font:400 15px 'Lilita One'}#serve .sh span{flex:1}
#serve .items{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;min-height:30px}
#serve .it{min-width:34px;height:34px;border:3px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
#serve .it.done{background:#c6f3c0;opacity:.7}#serve .it b{position:absolute;right:-4px;bottom:-6px;font:400 11px 'Lilita One';background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:0 3px}
#serve .btns{display:flex;gap:6px}#serve .btns .btn{margin:0;flex:1;font-size:18px;padding:4px;min-height:48px}
.bub{position:absolute}
#ftexts,#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.ft{position:absolute;font:400 20px 'Lilita One';color:#ffd23f;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;transform:translate(-50%,-50%);white-space:nowrap}
.ft.g{color:#8ef07a}.ft.r{color:#ff7a8e}.ft.w{color:#fff}
.mini{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:48px;padding:0 8px;border:3px solid var(--ink);border-radius:12px;background:#fff;font:400 16px 'Lilita One';cursor:pointer;box-shadow:0 3px 0 var(--ink);flex:none}
.mini:active{transform:translateY(2px)}.mini.g{background:var(--green)}.mini.r{background:#ff8fa3}.mini.y{background:var(--yellow)}.mini.b{background:var(--blue)}.mini[disabled],.mini.off{opacity:.45;pointer-events:none}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:rgba(29,27,58,.35);padding:max(8px,env(safe-area-inset-top)) max(10px,var(--sr)) max(8px,var(--sb)) max(10px,var(--sl))}
#panel.on{display:flex}
#pcard{background:var(--card);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);width:min(820px,100%);max-height:100%;display:flex;flex-direction:column;margin:auto;animation:pop .25s cubic-bezier(.3,1.6,.5,1);overflow:hidden}
#phead{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px 5px 14px;border-bottom:3px solid var(--ink);background:#fff2b8}
#ptitle{font:400 22px 'Lilita One';flex:none}
#ptabs{display:flex;gap:5px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:none}
#pbody{padding:10px 12px 12px;flex:1;font-size:14px;overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
#pfoot{flex:none;padding:6px 10px;border-top:3px solid var(--ink);background:#fff8e0;display:none;align-items:center;gap:8px;flex-wrap:wrap}#pfoot.on{display:flex}
small{font-size:12px}body.pan #hud{visibility:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(182px,1fr));gap:8px}
.cardm{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px 8px;position:relative}
.cardm h4{margin:0 0 2px;font:400 16px 'Lilita One';display:flex;align-items:center;gap:5px}.cardm .big{font-size:26px}
.cardm.lock{opacity:.6;background:#eee}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td{padding:3px 4px;border-bottom:1px solid #e2e0f0}.tbl td:last-child{text-align:right;font-weight:700}
.prow{display:flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:3px 6px;margin-bottom:5px;min-height:54px}
.prow .ic{font-size:26px;width:34px;text-align:center;flex:none}.prow .nm{flex:1;min-width:0;line-height:1.15}.prow .nm b{font:400 15px 'Lilita One';display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prow .nm span{font-size:12px;color:var(--dim)}
.prow .pv{font:400 17px 'Lilita One';min-width:62px;text-align:center}
.stepper{display:flex;align-items:center;gap:4px}.stepper .mini{min-width:44px;height:44px;padding:0 6px}
.good{color:#1f9d3a}.bad{color:#d6334f}.mid{color:#c98a00}
.bar{height:9px;border-radius:6px;background:#e1dff0;border:2px solid var(--ink);overflow:hidden;flex:1;margin:3px 0}.bar i{display:block;height:100%}
.sumrow{display:flex;justify-content:space-between;font-size:16px;padding:3px 0;border-bottom:2px dashed #d8d5ec}.sumrow b{font:400 18px 'Lilita One'}
.sumbig{font:400 40px 'Lilita One';text-align:center;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.stars{font-size:24px;letter-spacing:2px;text-align:center}
#banner{position:fixed;left:0;right:0;top:26%;text-align:center;pointer-events:none;z-index:6;display:none}
#banner .t{font:400 clamp(30px,7vw,56px) 'Lilita One';color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);line-height:1}
#banner .s{font:700 17px 'Fredoka';color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;margin-top:6px}
#rotate{position:fixed;inset:0;background:linear-gradient(#7fc8ff,#d8f3d0);z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px;font:400 28px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#rotate .ph{font-size:76px;animation:rot 1.6s ease-in-out infinite;-webkit-text-stroke:0}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.playing.touch #rotate,body.playing.narrow #rotate{display:flex}}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120px);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:7px 16px;border-radius:16px;z-index:50;transition:transform .25s cubic-bezier(.3,1.6,.5,1);max-width:90vw;text-align:center;font-size:15px;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;background:linear-gradient(#7fc8ff,#d8f3d0);font:400 34px 'Lilita One';color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
@media (max-height:460px){
 h1{font-size:38px}h2{font-size:22px}.card{padding:10px 14px 8px;border-radius:22px}.btn{font-size:17px;padding:5px;margin-top:6px}.sub{margin:4px 0 6px;font-size:13px}
 .code{font-size:34px}.tc{font-size:15px;padding:0 7px}.colors div{width:44px;height:44px}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
 #bAct{width:76px;height:76px}.bb{width:54px;height:50px}#mini{width:100px;height:76px}
 .chip{min-height:44px;padding:2px 8px;font-size:14px;min-width:44px}#newgame label{margin:4px 0 2px}#newgame .colors div{width:40px;height:40px}#newgame .btn{min-height:44px}
}
@media (max-width:560px){#top{flex-wrap:wrap}.tc{padding:0 6px;font-size:14px}}
</style>
</head>
<body>
<div id="loading">Stocking shelves…</div>
<canvas id="gl"></canvas>
<div id="ftexts"></div><div id="tags"></div>
<div id="joyBase"><div class="jknob"></div></div>
<div id="hud">
 <div id="top">
  <button class="ib" id="bMenu" aria-label="menu">☰</button>
  <div class="tc" id="cMoney"><span>💰</span><div class="v" id="vMoney">$0</div></div>
  <div class="tc" id="cTime"><span id="vSun">☀️</span><div class="v"><span id="vTime">7:00</span><small id="vDay">Day 1</small></div></div>
  <div class="tc" id="cLvl"><span>⭐</span><div class="v"><span id="vLvl">Lv 1</span><small id="vRep">★★☆☆☆</small></div></div>
  <div id="spacer"></div>
  <div id="players"></div>
  <button class="ib" id="bSpeed" aria-label="speed">▶</button>
  <button class="ib" id="mute" aria-label="sound">🔊</button>
 </div>
 <div id="leftcol"><div id="goalchip" class="pane"></div><div id="alertchip" class="pane"></div></div>
 <canvas id="mini" width="224" height="168"></canvas>
 <div id="dpad"><span></span><button data-d="u" aria-label="up">▲</button><span></span><button data-d="l" aria-label="left">◀</button><span></span><button data-d="r" aria-label="right">▶</button><span></span><button data-d="d" aria-label="down">▼</button><span></span></div>
 <div id="serve" class="pane"></div>
 <div id="placebar"><button class="ib" id="bRot" aria-label="rotate">⟳</button><button class="ib" id="bNo" aria-label="cancel">✕</button><button class="ib" id="bOk" aria-label="place" style="background:var(--green)">✓</button></div>
 <div id="placeinfo" class="pane"></div>
 <div id="cbar" class="pane"></div>

/* ---------------- grid ---------------- */
let W=null;
const OCC=new Int16Array(GWID*GDEP);
const gi=(cx,cz)=>(cz-GZ0)*GWID+(cx-GX0);
const inGrid=(cx,cz)=>cx>=GX0&&cx<GX0+GWID&&cz>=GZ0&&cz<GZ0+GDEP;
const SZ=()=>SIZES[W?W.size:0];
function blk(cx,cz){const Z=SZ(),w=Z.w,d=Z.d;
 if(cz>=1&&cz<=3)return cx<-4||cx>w+3;
 if(cz===0){if(cx<-1||cx>w)return cx<-4||cx>w+3;return!(cx===3||cx===4)}

 return OCC[gi(cx,cz)]!==0}
const inStore=(cx,cz)=>{const Z=SZ();return cx>=0&&cx<Z.w&&cz>=-Z.d&&cz<=-1};
const noBuild=(cx,cz)=>(cx<=1&&cz>=-2&&cz<=-1)||(cx>=3&&cx<=4&&cz>=-2&&cz<=-1);
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
const FR=[[0,1],[1,0],[0,-1],[-1,0]];
const dimsOf=(k,r)=>{const f=FXD[k];return r&1?[f.d,f.w]:[f.w,f.d]};
function fxCells(f){const[fw,fd]=dimsOf(f.k,f.r),o=[];for(let j=0;j<fd;j++)for(let i=0;i<fw;i++)o.push([f.x+i,f.z+j]);return o}
const fxCenter=f=>{const[fw,fd]=dimsOf(f.k,f.r);return[f.x+fw/2,f.z+fd/2]};
function loc2w(f,lx,lz){const[cx,cz]=fxCenter(f),a=f.r*Math.PI/2,c=Math.cos(a),s=Math.sin(a);return[cx+lx*c+lz*s,cz-lx*s+lz*c]}

function fxFront(f){const fr=FR[f.r&3],cs=fxCells(f),own=new Set(cs.map(c=>c[0]+','+c[1])),o=[];for(const[x,z] of cs){const nx=x+fr[0],nz=z+fr[1];if(!own.has(nx+','+nz))o.push([nx,nz])}return o}
function fxBack(f){const fr=FR[f.r&3],cs=fxCells(f),own=new Set(cs.map(c=>c[0]+','+c[1])),o=[];for(const[x,z] of cs){const nx=x-fr[0],nz=z-fr[1];if(!own.has(nx+','+nz))o.push([nx,nz])}return o}
/* checkout geometry: customer cell, cashier cell, register */
function coFront(f){// front cell of "belt" column (local col 0 => local x -.5)
 const fr=FR[f.r&3];if(f.k==='self'){return[f.x+fr[0],f.z+fr[1]]}
 const[wx,wz]=loc2w(f,-.5,1),[bx,bz]=loc2w(f,-.5,-1);return[Math.floor(wx),Math.floor(wz)]}
function coBack(f){const[bx,bz]=loc2w(f,-.5,-1);return[Math.floor(bx),Math.floor(bz)]}
function queueCells(f){const fr=FR[f.r&3],h=coFront(f),o=[];let x=h[0],z=h[1];for(let i=0;i<5;i++){if(blk(x,z)||!inStore(x,z))break;o.push([x,z]);x+=fr[0];z+=fr[1]}return o}
function bfs(sx,sz,tx,tz,maxN=900){// returns [[cx,cz]...] excluding start, or null
 if(!inGrid(sx,sz)||!inGrid(tx,tz))return null;if(blk(tx,tz)){return null}
 const prev=new Int32Array(GWID*GDEP).fill(-2),q=[gi(sx,sz)];prev[q[0]]=-1;const goal=gi(tx,tz);
 for(let h=0;h<q.length;h++){const c=q[h];if(c===goal)break;const x=c%GWID+GX0,z=(c/GWID|0)+GZ0;for(const[dx,dz] of D4){const nx=x+dx,nz=z+dz;if(!inGrid(nx,nz))continue;const n=gi(nx,nz);if(prev[n]!==-2)continue;if(blk(nx,nz)&&n!==goal)continue;
   prev[n]=c;q.push(n)}}

/* layout validity: all access cells reachable from the door */
function layoutOk(){const r=reach(3,1);const R=(x,z)=>r[gi(x,z)];if(!R(3,0)||!R(4,0))return'Entrance blocked';

  if(k.kind==='checkout'||k.kind==='self'){const q=queueCells(f);if(q.length<2&&f.k==='checkout')return'Checkout needs a queue lane';if(q.length<1)return'Checkout needs a queue lane';if(!R(q[0][0],q[0][1]))return'Checkout unreachable';if(f.k==='checkout'){const b=coBack(f);if(blk(b[0],b[1])||!R(b[0],b[1]))return'Cashier needs room behind the counter'}}
  else{let ok=false;for(const[x,z] of fxFront(f))if(inGrid(x,z)&&!blk(x,z)&&R(x,z))ok=true;if(!ok)return'Shelf front would be blocked'}}
