<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5ec2ff">
<title>Critter Quest</title>
<meta name="apple-mobile-web-app-title" content="Critter Quest">
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--card:#fffdf6;--text:#1d1b3a;--dim:#5d5a80;--yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a;--orange:#ffa23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#5ec2ff,#c9f0ff);color:var(--text);font-family:'Fredoka',system-ui,sans-serif;font-weight:600;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch;z-index:10}
.screen.on{display:flex}
.screen.dim{background:rgba(29,27,58,.35)}
.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:18px 20px 16px;width:min(460px,100%);box-shadow:0 9px 0 var(--ink);margin:auto;position:relative}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
body.nopop .pop{animation:none}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(44px,11vw,64px);line-height:.92;letter-spacing:1px;text-align:center;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-3deg)}
h1 span{color:var(--blue)}
h2{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:32px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.sub{text-align:center;color:var(--dim);margin:10px 0 10px;font-size:15px}
label{display:block;font-size:13px;color:var(--dim);margin:8px 0 5px;letter-spacing:.6px;text-transform:uppercase}
input[type=text],textarea{min-height:48px;width:100%;font:600 18px 'Fredoka',sans-serif;color:var(--ink);background:#eef6ff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;outline:none;user-select:text;-webkit-user-select:text}
textarea{font-size:13px;height:84px;resize:none;word-break:break-all}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:400 20px 'Lilita One',sans-serif;letter-spacing:.5px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:10px;margin-top:10px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-height:48px;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.blue{background:var(--blue)}
.btn.ghost{background:#fff}
.btn.green{background:var(--green)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row2{display:flex;gap:10px}.row2>.btn{flex:1}
.join{display:flex;gap:10px;margin-top:10px}
.join input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Lilita One',sans-serif;font-size:22px;padding:8px;min-height:48px;margin:0}
.join .btn{width:auto;margin:0;padding:0 20px;flex:none}
.invite{background:#fff2b8;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;margin-top:8px;text-align:center;font-size:15px}
.hb{position:fixed;z-index:6;min-width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font:400 18px 'Lilita One',sans-serif;color:var(--ink);display:none;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.T{top:max(8px,env(safe-area-inset-top))}
#arcadeW{left:max(10px,env(safe-area-inset-left))}
#coins{left:calc(max(10px,env(safe-area-inset-left)) + 118px);pointer-events:none;background:#fff2b8}
#lead{left:calc(max(10px,env(safe-area-inset-left)) + 228px);pointer-events:auto;padding:0 10px 0 4px;width:200px;justify-content:flex-start}
i.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffd23f 45%,#e8a100);border:2px solid var(--ink);vertical-align:-.12em}
#lead img{width:40px;height:40px;flex:none}
#lead .ln{flex:1;min-width:0;font:600 13px 'Fredoka',sans-serif;line-height:1.05}
#lead .ln b{font:400 15px 'Lilita One',sans-serif;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{right:calc(max(10px,env(safe-area-inset-right)) + 60px);background:var(--yellow)}
#mute{right:max(10px,env(safe-area-inset-right));width:48px;padding:0;font-size:20px}
#room{right:max(10px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 58px);font:600 13px 'Fredoka',sans-serif;height:auto;min-height:0;padding:4px 10px;pointer-events:none;background:#e6fbff;border-radius:12px}
#aBtn{right:max(22px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;background:var(--pink);color:#fff;font-size:34px;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;box-shadow:0 6px 0 var(--ink);touch-action:none}
body:not(.mWorld) #ctx,body.ovl #ctx{display:none!important}
#aBtn.off{filter:grayscale(.7) brightness(1.05);opacity:.75}
#ctx{position:fixed;z-index:6;right:max(14px,env(safe-area-inset-right));bottom:calc(max(22px,env(safe-area-inset-bottom)) + 106px);width:112px;text-align:center;font:400 15px 'Lilita One',sans-serif;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 4px;display:none;pointer-events:none}
body.mWorld:not(.ovl) #arcadeW,body.mWorld:not(.ovl) #coins,body.mWorld:not(.ovl) #lead,body.mWorld:not(.ovl) #menuBtn,body.mWorld #mute,body.mBattle #mute{display:flex}
body.mWorld.touch:not(.ovl) #aBtn{display:flex}
body.mWorld.net:not(.ovl) #room{display:flex}
body.ovl #mute{display:none!important}
#joyBase{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:4px solid rgba(29,27,58,.6);background:rgba(255,255,255,.35);display:none;z-index:5;pointer-events:none}
#joyBase i{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#joyHint{position:fixed;left:max(24px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));font:600 13px 'Fredoka',sans-serif;color:rgba(29,27,58,.7);background:rgba(255,255,255,.6);padding:3px 10px;border-radius:10px;display:none;z-index:5;pointer-events:none}
body.mWorld.touch:not(.ovl) #joyHint.on{display:block}
#tags,#floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#tags{z-index:3}#floaters{z-index:7}
.tag{position:absolute;transform:translate(-50%,-100%);font:600 13px 'Fredoka',sans-serif;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:1px 8px;white-space:nowrap}
.fl{position:absolute;transform:translate(-50%,-50%);font:400 30px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);white-space:nowrap}
.fl.big{font-size:34px;color:var(--yellow)}.fl.bad{color:#ff6b6b}.fl.good{color:#7ee36a}.fl.sm{font-size:22px}
#banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);font:400 clamp(28px,6vw,46px) 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);white-space:nowrap;pointer-events:none;z-index:6;opacity:0}
/* battle */
#bui{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}
body.mBattle #bui{display:block}
.icard{position:absolute;background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:5px 12px 7px;width:min(270px,37vw)}
#foeCard{top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left))}
#myCard{right:max(10px,env(safe-area-inset-right));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 126px)}
.icard .nm{font:400 18px 'Lilita One',sans-serif;display:flex;align-items:center;gap:6px;white-space:nowrap}
.icard .nm .lv{margin-left:auto;font-size:16px}
.tb{display:inline-block;font:600 12px 'Fredoka',sans-serif;color:#fff;padding:1px 7px;border-radius:8px;border:2px solid var(--ink);text-shadow:0 1px 0 rgba(0,0,0,.35);white-space:nowrap}
.hpbar{height:12px;border:2.5px solid var(--ink);border-radius:8px;background:#e7e3ef;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;background:#4bd36b;width:100%}
.hpt{font-size:12px;display:flex;justify-content:space-between;color:var(--dim);margin-top:1px}
.xpbar{height:7px;border:2px solid var(--ink);border-radius:6px;background:#e7e3ef;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:var(--blue);width:0}
#bpanel{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));height:116px;display:flex;gap:10px;pointer-events:auto}
#bmsg{flex:1;min-width:0;background:var(--card);border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:9px 16px;font:600 18px 'Fredoka',sans-serif;line-height:1.3;overflow:hidden;cursor:pointer}
#bact,#bmoves{flex:none;display:none;gap:8px}
#bact{width:min(330px,47vw);grid-template-columns:1.2fr 1fr 1fr;grid-template-rows:1fr 1fr}
#bmoves{width:min(440px,60vw);grid-template-columns:1fr 1fr 54px;grid-template-rows:1fr 1fr}
#bact.on,#bmoves.on{display:grid}
.bb{border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font:400 17px 'Lilita One',sans-serif;color:var(--ink);min-height:48px;cursor:pointer;background:#fff;padding:2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.bb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.bb[disabled]{opacity:.4;pointer-events:none}
.bb.fight{grid-row:span 2;background:var(--pink);color:#fff;font-size:26px;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill}
.bb small{font:600 12px 'Fredoka',sans-serif;opacity:.9}
.bb.mv{color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;font-size:16px}
.bb.mv small{-webkit-text-stroke:0;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.bb.back{grid-row:span 2;font-size:15px}
#lvlPop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:12;display:none;width:min(300px,80vw);padding:10px 16px 12px;pointer-events:none}
#lvlPop table{width:100%;border-collapse:collapse;font-size:16px}
#lvlPop td{padding:1px 4px}#lvlPop td:last-child{text-align:right;color:#2a9d3a}
#wipe{position:fixed;inset:0;z-index:15;display:none;pointer-events:none;background:repeating-linear-gradient(115deg,var(--ink) 0 34px,#2c2960 34px 68px)}
/* lists */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-right:58px}
.tab{min-height:48px;padding:0 12px;border:3px solid var(--ink);border-radius:14px;background:#fff;font:400 16px 'Lilita One',sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tab.sel{background:var(--yellow)}
.xbtn{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:14px;border:3px solid var(--ink);background:#fff;font:400 22px 'Lilita One',sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.wide{width:min(900px,100%)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px}
.cc{display:flex;gap:8px;align-items:center;border:3px solid var(--ink);border-radius:16px;padding:5px 10px 5px 5px;background:#fff;min-height:64px;cursor:pointer;text-align:left;font:600 13px 'Fredoka',sans-serif;color:var(--ink);width:100%}
.cc img{width:52px;height:52px;flex:none}
.cc .in{flex:1;min-width:0}
.cc .in b{font:400 17px 'Lilita One',sans-serif;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc.empty{border-style:dashed;opacity:.5;justify-content:center;cursor:default}
.cc.lead{background:#fff7d6}
.cc.dead{background:#f1e9ee}
.cc.sel{outline:4px solid var(--pink)}
.irow{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;background:#fff;margin-top:8px;font-size:14px}
.irow .ic{font-size:26px;width:36px;text-align:center}
.irow .d{flex:1;min-width:0}.irow .d b{font:400 17px 'Lilita One',sans-serif;display:block}
.irow .btn{width:auto;margin:0;padding:0 16px;font-size:17px}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0 10px}
#dlgBtns{display:flex;flex-wrap:wrap;gap:0 10px}#dlgBtns .btn{flex:1 1 200px;width:auto}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:10px}
.dx{border:3px solid var(--ink);border-radius:14px;background:#fff;text-align:center;font-size:12px;padding:3px}
.dx img{width:56px;height:56px;display:block;margin:0 auto}
.dx.un img{filter:brightness(0) opacity(.3)}
.dx.no{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.stats div{background:#eef6ff;border:2.5px solid var(--ink);border-radius:12px;text-align:center;font-size:12px;padding:3px}
.stats b{display:block;font:400 18px 'Lilita One',sans-serif}
.mvl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mvl div{border:2.5px solid var(--ink);border-radius:12px;padding:3px 8px;color:#fff;font:400 15px 'Lilita One',sans-serif;-webkit-text-stroke:.8px var(--ink);paint-order:stroke fill}
.mvl small{font:600 12px 'Fredoka',sans-serif;-webkit-text-stroke:0;display:block}
.det{display:flex;gap:12px;align-items:center}
.det img{width:96px;height:96px;flex:none}
.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.st{border:3px solid var(--ink);border-radius:18px;background:#fff;text-align:center;padding:4px 4px 6px;cursor:pointer;box-shadow:0 4px 0 var(--ink);font-size:12px;color:var(--ink);font-family:'Fredoka',sans-serif;min-height:48px}
.st img{width:58px;height:58px;display:block;margin:0 auto}
.st b{font:400 18px 'Lilita One',sans-serif;display:block}
.st.sel{background:var(--yellow);transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
#starter{align-items:flex-end}
#starter .card{margin:auto auto 0;width:min(700px,100%)}
.switch{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:8px 14px;border-radius:16px;background:#fff;border:3px solid var(--ink);font-size:15px;cursor:pointer;min-height:48px;width:100%;color:var(--ink);font-family:'Fredoka',sans-serif;font-weight:600}
.switch span.t{flex:none;width:50px;height:28px;border-radius:14px;background:#d6d6e6;border:2.5px solid var(--ink);position:relative}
.switch span.t:after{content:'';position:absolute;left:2px;top:2px;width:19px;height:19px;border-radius:50%;background:#fff;border:2.5px solid var(--ink)}
.switch.on span.t{background:var(--green)}.switch.on span.t:after{left:22px}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tbox{border:3px dashed var(--ink);border-radius:16px;padding:8px;min-height:90px;text-align:center;font-size:13px}
.tbox.ok{background:#e4ffd9;border-style:solid}
.plist{display:grid;gap:6px;max-height:44vh;overflow:auto;margin-top:8px}
#rotate{position:fixed;inset:0;background:linear-gradient(#5ec2ff,#c9f0ff);z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px;font:400 28px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#rotate .ph{font-size:76px;-webkit-text-stroke:0}
@media (orientation:portrait){body.touch.mWorld #rotate,body.touch.mBattle #rotate{display:flex}}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120px);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 18px;border-radius:16px;z-index:30;transition:transform .25s cubic-bezier(.3,1.6,.5,1);max-width:90vw;text-align:center;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
#slots{display:flex;gap:6px;margin-top:8px}
#slots button{flex:1;min-height:48px;font:400 13px 'Lilita One',sans-serif;line-height:1.15;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:3px 4px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
#slots button small{display:block;font:600 11px Fredoka,sans-serif;color:#6b6890}
#slots button.sel{background:var(--yellow)}
#slots button.sel small{color:var(--ink)}
#titleTop{display:flex;justify-content:flex-start;margin:-6px 0 4px}
#titleTop .btn{width:auto;margin:0;padding:0 14px;font-size:16px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:400 30px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;z-index:50}
@media (max-height:500px) and (orientation:landscape){
  #title .card{width:min(780px,100%);display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;align-items:center}
  #title .lcol{grid-row:span 1}
  .card{padding:10px 14px}
  .tabs{gap:4px;flex-wrap:nowrap}.tab{padding:0 7px;font-size:14px;flex:1 1 auto}
  h1{font-size:50px;transform:rotate(-2deg)}h2{font-size:26px}
  .sub{margin:4px 0 4px;font-size:13px}
  .btn{margin-top:7px;padding:4px 8px;font-size:18px}
  label{margin:4px 0 3px}
  input[type=text]{padding:6px 12px}
  .starters .st img{width:46px;height:46px}
  #starter .card h2{font-size:22px;margin:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading">Loading…</div>
<div id="tags"></div>
<div id="floaters"></div>
<div id="banner"></div>

<a id="arcadeW" class="hb T" href="../">◀ Arcade</a>
<div id="coins" class="hb T"><i class="coin"></i> <span id="coinN">0</span></div>
<button id="lead" class="hb T"><img id="leadImg" alt=""><div class="ln"><b id="leadN"></b><div class="hpbar" style="margin-top:2px;height:9px"><i id="leadHp"></i></div></div></button>
<button id="menuBtn" class="hb T">☰ MENU</button>
<button id="mute" class="hb T" aria-label="sound">🔊</button>
<div id="room" class="hb"></div>
<button id="aBtn" class="hb">A</button>
<div id="ctx"></div>
<div id="joyBase"><i></i></div>
<div id="joyHint" class="on">◀ drag to walk</div>

<div id="bui">
  <div id="foeCard" class="icard"><div class="nm"><span id="foeN"></span><span id="foeT"></span><span class="lv" id="foeL"></span></div><div class="hpbar"><i id="foeHp"></i></div></div>
  <div id="myCard" class="icard"><div class="nm"><span id="myN"></span><span id="myT"></span><span class="lv" id="myL"></span></div><div class="hpbar"><i id="myHp"></i></div><div class="hpt"><span>HP</span><span id="myHpT"></span></div><div class="xpbar"><i id="myXp"></i></div></div>
  <div id="bpanel">
    <div id="bmsg"></div>
    <div id="bact">
      <button class="bb fight" data-a="fight">FIGHT</button>

    b.innerHTML=`${esc(m.n)}<small>${TYPES[m.t].e} ${m.p?'POW '+m.p:'Status'}${e>1?' · Super!':e<1?' · Weak':''}</small>`;b.onclick=()=>{SFX.click();submit({k:'move',i})};el.appendChild(b)});
  for(let i=c.mv.length;i<4;i++){const b=document.createElement('button');b.className='bb';b.disabled=true;b.textContent='—';el.appendChild(b)}

  $('bact').classList.remove('on');el.classList.add('on')}
function submit(act){
  hidePanels();
  if(B.kind==='wild'){const foeAct=lcur(1).hp>0?aiPick(1):{k:'none'};const ev=resolveTurn([act,foeAct],Math.random);playEvents(ev,afterTurn);return}
  const pv=B.pv;if(pv.ref){pv.acts[0]=act;tryResolve()}else sendTo(pv.opp,{t:'pAct',act,turn:pv.turn});
  if(!(pv.ref&&!pv.acts[0]))setMsg(`Waiting for ${B.sides[1].name}…`)}
function tryResolve(){const pv=B.pv;if(!pv.acts[0]||!pv.acts[1]||B.over)return;const acts=pv.acts;pv.acts=[null,null];
  const ev=resolveTurn(acts,Math.random);pv.turn++;sendTo(pv.opp,{t:'pRes',ev:flipEv(ev),turn:pv.turn});playEvents(ev,afterTurn)}
function flipEv(ev){return ev.map(e=>{const o=Object.assign({},e);if(o.s!==undefined)o.s=1-o.s;if(o.k==='end'&&o.w>=0)o.w=1-o.w;if(o.t)o.t=o.t.replace(/\{([SN])(\d)\}/g,(_,a,i)=>`{${a}${1-i}}`);return o})}
function onAction(a){

  if(a==='run'){if(B.kind==='wild')return submit({k:'run'});return showDialog('Give up?','<div class="sub">Forfeit this battle?</div>',[{t:'GIVE UP',c:'pink',f:()=>submit({k:'forfeit'})},{t:'Keep fighting',c:'ghost'}])}
  if(a==='catch'){const o=SV.items.orb|0,so=SV.items.superorb|0;if(!o&&!so){toast('No Capture Orbs! Buy some at the Shop.');return}
    if(o&&so)return showDialog('Throw which orb?','',[{t:`🔵 Capture Orb ×${o}`,f:()=>submit({k:'catch',it:'orb'})},{t:`🟣 Super Orb ×${so}`,c:'blue',f:()=>submit({k:'catch',it:'superorb'})},{t:'Cancel',c:'ghost'}]);
    return submit({k:'catch',it:o?'orb':'superorb'})}
  if(a==='item'){const its=['potion','superpotion','revive'].filter(k=>SV.items[k]>0);if(!its.length){toast('No healing items! Buy some at the Shop.');return}
    showDialog('Use an item',`<div class="sub" style="margin:0">Pick an item</div>`,its.map(k=>({t:`${ITEMS[k].e} ${ITEMS[k].n} ×${SV.items[k]}`,c:'ghost',f:()=>pickTarget(k)})).concat([{t:'Cancel',c:'ghost'}]))}}
function pickTarget(it){const team=B.sides[0].team;const ok=c=>it==='revive'?c.hp<=0:c.hp>0&&c.hp<maxHp(c);
  const list=team.map((c,i)=>({c,i})).filter(x=>ok(x.c));if(!list.length){toast(it==='revive'?'Nobody needs reviving!':'Everyone is already healthy!');return}
  showDialog('Use on…',critList(list.map(x=>x.c),'pk'),[{t:'Cancel',c:'ghost'}],{onPick:(k)=>{closeDialog();submit({k:'item',it,i:list[k].i})}})}
function pickSwap(forced){const team=B.sides[0].team,list=team.map((c,i)=>({c,i})).filter(x=>x.c.hp>0&&x.i!==B.sides[0].act);
  if(!list.length){if(forced)return;toast('No other critters can battle!');return}
  showDialog(forced?'Send out who?':'Swap to…',critList(list.map(x=>x.c),'pk'),forced?[]:[{t:'Cancel',c:'ghost'}],{noClose:forced,onPick:k=>{closeDialog();SFX.click();submit({k:'swap',i:list[k].i})}})}
function endFlow(){
  const e=B.end||{w:-1,how:'run'};const evs=[];
  if(B.kind==='wild'){
    if(e.how==='ko'&&e.w===1){evs.push(msg(`${SV.name} is out of critters!`),msg('You hurry back to town to rest…'));SFX.lose()}
    if(e.how==='ko'&&e.w===0)SFX.win();
    for(const u of B.evos){const c=SV.party.find(x=>x.u===u);if(!c||!SP[c.s].evo)continue;const to=SP[c.s].evo[0];
      evs.push({k:'wait',d:.3},msg(`What? ${cname(c)} is evolving!`),{k:'evo',u,from:c.s,to},msg(`Congrats! ${SP[c.s].n} evolved into ${SP[to].n}!`))}
  }else{
    const win=e.w===0,coins=e.w<0?0:win?(B.pv.norm?120:150):25;SV.coins+=coins;
    evs.push(msg(e.w<0?'The battle ended with no winner.':win?`You beat ${B.sides[1].name}! +${coins} coins`:`${B.sides[1].name} wins! +${coins} coins for trying`));if(win)SFX.win();else SFX.lose()}
  B.evos=[];evs.push({k:'wait',d:.4});
  playEvents(evs,()=>exitBattle(e))}
function exitBattle(e){

  if(key){if(how==='run'){G.locks.delete(key);if(G.net)bcastNet({t:'unlock',key})}else{G.gone.add(key);G.locks.delete(key);if(G.net)bcastNet({t:'gone',key})}}
  startWipe(()=>{
    if(B){for(const v of B.vis)if(v.o)arena.remove(v.o)}B=null;EP.q=[];
    if(lost){healAll();SV.coins=Math.floor(SV.coins*.9);P.x=healPos.x;P.z=healPos.z+2.5;trail.length=0}

    G.lockMove=false;G.grace=3;setMode('world');saveGame();updHud();$('lvlPop').style.display='none';
    if(lost)setTimeout(()=>showDialog('Rested up','<div class="sub">💖 Your critters were healed at the Heal Spot.</div>',[{t:'OK'}]),50)});
}
function updCards(snap){

  for(const s of[0,1]){const v=B.vis[s],c=B.sides[s].team[v.act];if(!c)continue;const pre=s?'foe':'my';
    $(pre+'N').textContent=s===1&&B.kind==='wild'?SP[c.s].n:cname(c);$(pre+'L').textContent='Lv '+v.lv;
    const T=TYPES[SP[c.s].t];const tb=$(pre+'T');tb.className='tb';tb.style.background=T.c;tb.textContent=T.e+' '+T.n;
    if(snap){v.show=v.hp}}}
function updBattleUI(dt){
  if(!B)return;
  for(const s of[0,1]){const v=B.vis[s];const sp=Math.max(v.mx*.9,6)*dt;if(v.show>v.hp)v.show=Math.max(v.hp,v.show-sp);else v.show=Math.min(v.hp,v.show+sp);
    const k=clamp(v.show/v.mx,0,1),bar=$(s?'foeHp':'myHp');bar.style.width=(k*100)+'%';bar.style.background=k>.5?'linear-gradient(#7af08a,#3cc157)':k>.2?'linear-gradient(#ffe066,#f2b51c)':'linear-gradient(#ff8a8a,#e8434e)';

  $('myCard').style.visibility=B.vis[0].on?'visible':'hidden';$('foeCard').style.visibility=B.vis[1].on&&!B.camEvo?'visible':'hidden';updCards(false);
  if(B.msg!==undefined){B.msgT+=dt;const n=Math.min(B.msg.length,Math.floor(B.msgT*60));if(n!==B.msgN){B.msgN=n;$('bmsg').textContent=B.msg.slice(0,n)}}
  if(B.lvlT>0){B.lvlT-=dt;if(B.lvlT<=0)$('lvlPop').style.display='none'}

const WIPE={on:false,t:0,ph:0,mid:null};
function startWipe(mid){WIPE.on=true;WIPE.t=0;WIPE.ph=0;WIPE.mid=mid;$('wipe').style.display='block'}
function updWipe(dt){if(!WIPE.on)return;WIPE.t+=dt;const d=.42,k=Math.min(1,WIPE.t/d),el=$('wipe');
  if(WIPE.ph===0){const b=-25+ease(k)*155;el.style.clipPath=`polygon(-25% 0,${b}% 0,${b-25}% 100%,-25% 100%)`;if(k>=1){WIPE.ph=1;WIPE.t=0;const m=WIPE.mid;WIPE.mid=null;try{m&&m()}catch(e){console.error(e)}}}
  else{const a=-25+ease(k)*155;el.style.clipPath=`polygon(${a}% 0,130% 0,130% 100%,${a-25}% 100%)`;if(k>=1){WIPE.on=false;el.style.display='none'}}}

const PREFIX='blobarcade-critters-';
const NET={role:null,peer:null,conns:[],host:null,gen:0,code:'',id:0,ci:0,players:new Map(),sendT:0,nextId:2};
function genCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.random()*a.length|0];return s}
function send(c,m){try{if(c&&c.open)c.send(m)}catch(e){}}
function netCleanup(){try{if(NET.host)NET.host.close()}catch(e){}try{if(NET.peer&&!NET.peer.destroyed)NET.peer.destroy()}catch(e){}NET.peer=null;NET.host=null;NET.conns=[]}
function clearPlayers(){for(const p of NET.players.values())dropPlayerObj(p);NET.players.clear()}
function dropPlayerObj(p){if(p.o)world.remove(p.o.g);if(p.f)world.remove(p.f);if(p.tag)p.tag.remove();p.o=null}
function netLeave(manual){NET.gen++;netCleanup();clearPlayers();G.net=false;NET.role=null;NET.code='';G.locks.clear();clockOff=0;wildCache.T=-1;document.body.classList.remove('net');
  if(G.trade){G.trade=null;closeDialog()}opponentLeft(!!manual);if(manual)toast('You left the world')}
function netUI(){document.body.classList.toggle('net',G.net);$('room').textContent=G.net?`🌍 ${NET.code} · ${NET.players.size+1} player${NET.players.size?'s':''}`:'';if($('menu').classList.contains('on')&&menuTab==='friends')renderMenu()}
function setMe(ci){NET.ci=ci;P.ci=ci;if(meBlob){world.remove(meBlob.g)}meBlob=makeBlob(ci);world.add(meBlob.g)}
function hostGame(tries=0){
  if(typeof Peer==='undefined'){toast('Online play is unavailable right now');return}
  if(G.net&&!tries){toast('Already online');return}
  netCleanup();clearPlayers();NET.role='host';NET.code=genCode();NET.nextId=2;const gen=++NET.gen;toast('Opening your world…');
  let pr;try{pr=NET.peer=new Peer(PREFIX+NET.code,{config:{iceServers:ICE}})}catch(e){toast('Network not available');NET.role=null;return}
  pr.on('open',()=>{if(gen!==NET.gen)return;NET.id=1;setMe(0);G.net=true;netUI();toast('World open! Code '+NET.code);clockOff=0;if($('menu').classList.contains('on'))renderMenu()});
  pr.on('connection',c=>{if(gen!==NET.gen)return;c.on('data',m=>{if(gen===NET.gen)hostMsg(c,m)});c.on('close',()=>{if(gen===NET.gen)dropConn(c)});c.on('error',()=>{if(gen===NET.gen)dropConn(c)})});
  pr.on('error',e=>{if(gen!==NET.gen)return;if(e.type==='unavailable-id'&&tries<5)hostGame(tries+1);else if(!G.net){toast('Could not open world ('+e.type+')');netCleanup();NET.role=null}else toast('Network hiccup: '+e.type)});
  pr.on('disconnected',()=>{if(gen===NET.gen&&!pr.destroyed){try{pr.reconnect()}catch(e){}}});
}
function freeCi(){const used=[NET.ci,...[...NET.players.values()].map(p=>p.ci)];let c=0;while(used.includes(c))c++;return c}
function rosterMsg(){return{t:'roster',code:NET.code,players:[{id:NET.id,name:SV.name,ci:NET.ci},...[...NET.players.values()].map(p=>({id:p.id,name:p.name,ci:p.ci}))]}}
function sendRoster(){const m=rosterMsg();for(const c of NET.conns)send(c,m);netUI()}
function addPlayer(id,name,ci){let p=NET.players.get(id);if(p){p.name=name;if(p.ci!==ci){p.ci=ci;if(p.o)world.remove(p.o.g);p.o=makeBlob(ci);world.add(p.o.g)}return p}
  p={id,name,ci,x:0,z:9,rx:0,rz:9,yaw:0,ryaw:0,m:0,b:0,lead:'',o:makeBlob(ci),f:null,fsid:null,tag:document.createElement('div')};p.tag.className='tag';p.tag.style.borderColor=COLORS[ci];$('tags').appendChild(p.tag);world.add(p.o.g);NET.players.set(id,p);return p}
function hostMsg(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='hello'){if(conn._id)return;if(NET.players.size>=3){send(conn,{t:'full'});setTimeout(()=>conn.close(),300);return}
    const id=NET.nextId++,ci=freeCi();conn._id=id;NET.conns.push(conn);const p=addPlayer(id,String(m.name||'Friend').slice(0,10),ci);p.conn=conn;
    send(conn,{t:'welcome',id,ci,code:NET.code,now:Date.now(),gone:[...G.gone],locks:[...G.locks]});sendRoster();toast(p.name+' joined your world!');SFX.coin();return}
  if(!conn._id)return;m.from=conn._id;
  if(m.to&&m.to!==NET.id){const p=NET.players.get(m.to);if(p&&p.conn)send(p.conn,m);return}
  if(m.t==='pos'||m.t==='lock'||m.t==='unlock'||m.t==='gone')for(const c of NET.conns)if(c!==conn)send(c,m);
  onMsg(m)}
function dropConn(conn){NET.conns=NET.conns.filter(c=>c!==conn);const id=conn._id;if(!id)return;conn._id=0;const p=NET.players.get(id);if(!p)return;dropPlayerObj(p);NET.players.delete(id);
  for(const [k,v] of G.locks)if(v===id)G.locks.delete(k);toast(p.name+' left');sendRoster();onPlayerGone(id)}
function onPlayerGone(id){if(B&&B.kind==='pvp'&&B.pv&&B.pv.opp===id)opponentLeft();if(G.trade&&G.trade.id===id){G.trade=null;closeDialog();toast('Trade cancelled — friend left')}}
function joinGame(code){
  code=String(code||'').toUpperCase().trim();if(!/^[A-Z]{4}$/.test(code)){toast('Enter the 4-letter code');return}
  if(typeof Peer==='undefined'){toast('Online play is unavailable right now');return}
  if(G.net)netLeave();netCleanup();clearPlayers();NET.role='client';NET.code=code;const gen=++NET.gen;toast('Connecting to '+code+'…');
  let pr;try{pr=NET.peer=new Peer(undefined,{config:{iceServers:ICE}})}catch(e){toast('Network not available');NET.role=null;return}
  let ok=false;const fail=msg=>{if(ok||gen!==NET.gen)return;toast(msg);netLeave()};const to=setTimeout(()=>fail('Could not connect. Check the code and try again'),15000);
  pr.on('open',()=>{if(gen!==NET.gen)return;const c=pr.connect(PREFIX+code,{reliable:true});NET.host=c;
    c.on('open',()=>{if(gen!==NET.gen)return;ok=true;clearTimeout(to);send(c,{t:'hello',name:SV.name})});
    c.on('data',m=>{if(gen===NET.gen)onMsg(m)});
    c.on('close',()=>{if(gen===NET.gen&&NET.role==='client'){toast('The host left — you are playing solo now');netLeave()}})});
  pr.on('error',e=>{if(gen!==NET.gen)return;if(e.type==='peer-unavailable')fail('World '+code+' not found');else if(!ok)fail('Network error: '+e.type)});
}
function sendTo(id,m){m.to=id;m.from=NET.id;if(NET.role==='host'){if(id===NET.id)onMsg(m);else{const p=NET.players.get(id);if(p&&p.conn)send(p.conn,m)}}else send(NET.host,m)}
function bcastNet(m){m.from=NET.id;if(NET.role==='host')for(const c of NET.conns)send(c,m);else send(NET.host,m)}
function onMsg(m){
  if(!m||typeof m!=='object')return;const from=m.from;
  switch(m.t){
  case'welcome':NET.id=m.id;setMe(m.ci);clockOff=m.now-Date.now();G.gone=new Set(m.gone||[]);G.locks=new Map(m.locks||[]);G.net=true;wildCache.T=-1;netUI();toast('Joined world '+NET.code+'!');SFX.coin();break;
  case'full':toast('That world is full (4 players max)');netLeave();break;
  case'roster':{if(NET.role!=='client')break;const ids=new Set();for(const q of m.players){if(q.id===NET.id)continue;ids.add(q.id);addPlayer(q.id,q.name,q.ci)}
    for(const [id,p] of[...NET.players]){if(!ids.has(id)){dropPlayerObj(p);NET.players.delete(id);toast(p.name+' left');onPlayerGone(id)}}netUI();break}
  case'pos':{const p=NET.players.get(m.id);if(!p)break;const first=!p.seen;p.x=+m.x||0;p.z=+m.z||0;p.yaw=+m.y||0;p.m=!!m.m;p.b=!!m.b;p.lead=SP[m.l]?m.l:'';if(first){p.rx=p.x;p.rz=p.z;p.ryaw=p.yaw;p.seen=true}break}
  case'lock':G.locks.set(m.key,m.id||from);break;
  case'unlock':G.locks.delete(m.key);break;
  case'gone':G.gone.add(m.key);G.locks.delete(m.key);break;
  case'chal':{const p=NET.players.get(from);if(!p)break;if(G.mode!=='world'||G.ui||G.lockMove||B){sendTo(from,{t:'chalAns',ok:false,why:'busy'});break}
    showDialog(`${p.name} challenges you!`,`<div class="sub">${m.norm?'⚖ Fair battle — every critter is Lv 30':'⚔ Full-power battle with your own team'}</div>`,
      [{t:'ACCEPT',c:'pink',f:()=>{if(!NET.players.get(from)){toast('They left');return}G.lockMove=true;G.awaitStart=Date.now();sendTo(from,{t:'chalAns',ok:true,team:pvpTeam(m.norm)});toast('Starting battle…')}},
       {t:'Decline',c:'ghost',f:()=>sendTo(from,{t:'chalAns',ok:false})}],{noClose:true});SFX.encounter();break}
  case'chalAns':{const pc=G.pendingChal;if(!pc||pc.id!==from)break;G.pendingChal=null;if(!m.ok){toast(m.why==='busy'?'They are busy right now':'Challenge declined');break}
    if(G.mode!=='world'||B){sendTo(from,{t:'pCancel'});break}const mine=pvpTeam(pc.norm);sendTo(from,{t:'pStart',teams:[m.team,mine],norm:pc.norm});startPvp(true,from,pc.norm,[mine,m.team]);break}
  case'pStart':G.awaitStart=0;startPvp(false,from,!!m.norm,m.teams);break;
  case'pCancel':G.awaitStart=0;G.lockMove=false;toast('Battle cancelled');break;
  case'pAct':if(B&&B.kind==='pvp'&&B.pv.ref&&from===B.pv.opp&&m.act){B.pv.acts[1]=m.act;tryResolve()}break;
  case'pRes':if(B&&B.kind==='pvp'&&!B.pv.ref&&from===B.pv.opp&&Array.isArray(m.ev)){B.pv.turn=m.turn;playEvents(m.ev,afterTurn)}break;
  case'tReq':{const p=NET.players.get(from);if(!p)break;if(G.mode!=='world'||G.ui||B||G.trade){sendTo(from,{t:'tAns',ok:false});break}
    showDialog(`${p.name} wants to trade!`,'<div class="sub">Swap one critter each. You both confirm before anything happens.</div>',[{t:'OPEN TRADE',c:'green',f:()=>{sendTo(from,{t:'tAns',ok:true});openTrade(from)}},{t:'Decline',c:'ghost',f:()=>sendTo(from,{t:'tAns',ok:false})}],{noClose:true});break}
  case'tAns':if(m.ok){if(G.mode==='world'&&!B)openTrade(from)}else toast('Trade declined');break;
  case'tOffer':{const T=G.trade;if(!T||T.id!==from||T.done||!m.c||!SP[m.c.s])break;T.theirs=m.c;T.okMe=false;T.okThem=false;renderTrade();break}
  case'tOk':{const T=G.trade;if(!T||T.id!==from||T.done)break;if(T.theirs&&m.mine===T.theirs.u&&m.theirs===T.mine){T.okThem=true;tradeCheck();if(G.trade)renderTrade()}break}
  case'tCancel':if(G.trade&&G.trade.id===from){G.trade=null;closeDialog();toast('Trade cancelled')}break;
  }}

  STARTERS.forEach((s,i)=>{const o=buildCritter(s);o.position.set((i-1)*2.5,.2,i===1?-.4:0);o.scale.setScalar(SP[s].d.sz*1.35);o.rotation.y=-(i-1)*.25;arena.add(o);starterObjs.push(o)});
  $('stList').innerHTML=STARTERS.map((s,i)=>`<button class="st" data-s="${i}"><img src="${portrait(s)}" alt=""><b>${SP[s].n}</b>${tbadge(SP[s].t)}</button>`).join('');
  starterPick=null;$('btnPick').disabled=true;$('btnPick').textContent='CHOOSE';setMode('starter')}
$('stList').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;starterPick=+b.dataset.s;SFX.click();
  document.querySelectorAll('.st').forEach((x,i)=>x.classList.toggle('sel',i===starterPick));$('btnPick').disabled=false;$('btnPick').textContent='CHOOSE '+SP[STARTERS[starterPick]].n.toUpperCase()+'!';
  const o=starterObjs[starterPick];if(o){const y=o.position.y;tween(.5,k=>{o.position.y=y+Math.sin(k*Math.PI)*.7;o.rotation.y=-(starterPick-1)*.25+k*6.283})}});
$('btnPick').onclick=()=>{if(starterPick===null)return;SFX.lvl();const c=newCritter(STARTERS[starterPick],5,SV.name);giveCritter(c);SV.started=true;saveGame();clearStarterObjs();
  startWipe(()=>{const af=G.afterStart;G.afterStart=null;goWorld(af);setTimeout(()=>showDialog(`${SP[c.s].n} joined you!`,`<div class="det" style="justify-content:center"><img src="${portrait(c.s)}" alt=""></div><div class="sub">Walk into wild critters in the tall grass to battle and catch them.<br>Heal 💖 and Shop 🛒 are here in town. You have 5 Capture Orbs!</div>`,[{t:"LET'S GO!"}]),60)})};
function goWorld(after){
  if(!meBlob)setMe(NET.ci||0);const p=SV.pos||{x:0,z:9};P.x=p.x;P.z=p.z;if(blocked(P.x,P.z,.45)){P.x=0;P.z=9}trail.length=0;camT.set(P.x,0,P.z);
  G.biome=biomeAt(P.x,P.z);if(G.biome==='water')G.biome='beach';banner={t:2.6,text:BIOMES[G.biome].n};G.lockMove=false;G.grace=2;setMode('world');if(after)after()}
function enterGame(after){audio();unlock();let name=$('name').value.trim().slice(0,10)||'Trainer';try{localStorage.setItem('cq_name',name)}catch(e){}
  if(!SV)SV=newSave(name);else SV.name=name;
  if(SV.party.length)startWipe(()=>goWorld(after));else{G.afterStart=after;startWipe(showStarter)}}
function peekSlot(n){try{const s=JSON.parse(localStorage.getItem(slotKey(n))||'null');if(s&&s.v===1&&Array.isArray(s.party)&&s.party.length)return s}catch(e){}return null}
function pickSlot(n){SLOT=n;SAVE_KEY=slotKey(n);try{localStorage.setItem('cq_slot',String(n))}catch(e){}
  SV=loadSave();try{$('name').value=(SV&&SV.name)||localStorage.getItem('cq_name')||''}catch(e){}
  $('btnPlay').textContent=SV&&SV.party.length?'CONTINUE ('+SV.party.length+' critter'+(SV.party.length>1?'s':'')+')':'NEW ADVENTURE';
  $('slots').innerHTML=[1,2,3].map(i=>{const s=peekSlot(i);return `<button data-n="${i}" class="${i===n?'sel':''}" aria-label="Save slot ${i}">SLOT ${i}<small>${s?esc(s.name||'Trainer')+' · '+s.party.length+' crit'+(s.party.length>1?'s':''):'Empty'}</small></button>`}).join('')}
$('slots').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;SFX.click();pickSlot(+b.dataset.n)});
$('btnPlay').onclick=()=>enterGame();
$('btnHost').onclick=()=>enterGame(()=>hostGame());
$('btnJoin').onclick=()=>{const c=$('joinCode').value.toUpperCase().trim();if(!/^[A-Z]{4}$/.test(c)){toast('Enter the 4-letter code');return}enterGame(()=>joinGame(c))};
$('joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('btnJoin').click()});
let inviteCode='';
$('btnInvite').onclick=()=>enterGame(()=>joinGame(inviteCode));

/* ================= input ================= */
const K={};const typing=()=>document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
addEventListener('keydown',e=>{if(typing())return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();K[k]=true;
  if(e.repeat)return;
  if(G.mode==='world'){if((k==='e'||k==='enter'||k===' ')&&!G.ui)pressA();if(k==='escape'||k==='m'){if($('dlg').classList.contains('on')){if(!dlgOpts.noClose)closeDialog()}else if($('menu').classList.contains('on'))closeMenu();else openMenu()}}
  else if(G.mode==='battle'){if(k==='enter'||k===' ')$('bmsg').click();if(B&&B.ui==='act'){if(k==='f'||k==='1'&&!$('bmoves').classList.contains('on'))onAction('fight')}
    if($('bmoves').classList.contains('on')&&/^[1-4]$/.test(k)){const b=$('bmoves').children[+k-1];if(b&&!b.disabled)b.click()}if(k==='escape'&&$('bmoves').classList.contains('on'))showActions()}});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false;joyReset()});
const joy={id:null,ox:0,oy:0,x:0,y:0};
function joyReset(){joy.id=null;joy.x=joy.y=0;$('joyBase').style.display='none'}
glc.addEventListener('pointerdown',e=>{if(G.mode!=='world'||G.ui||G.lockMove)return;if(e.clientX>innerWidth*.7&&e.pointerType!=='mouse')return;if(joy.id!==null)return;e.preventDefault();
  joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;const b=$('joyBase');b.style.display='block';b.style.left=joy.ox+'px';b.style.top=joy.oy+'px';b.firstChild.style.transform='translate(0,0)';$('joyHint').classList.remove('on')});
addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const L=58,d=Math.hypot(dx,dy);if(d>L){dx=dx/d*L;dy=dy/d*L}joy.x=dx/L;joy.y=dy/L;$('joyBase').firstChild.style.transform=`translate(${dx}px,${dy}px)`},{passive:true});
const pEnd=e=>{if(e.pointerId===joy.id)joyReset()};addEventListener('pointerup',pEnd);addEventListener('pointercancel',pEnd);
$('aBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pressA()});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if((G.mode==='world'||G.mode==='battle')&&!e.target.closest('.screen'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ================= main loop ================= */
function update(dt){
  dt=Math.min(.05,Math.max(0,dt));G.dt=dt;G.t+=dt;
  updTweens(dt);updGT(dt);updEP(dt);updWipe(dt);
  if(G.mode==='world'||G.mode==='title')updateWorld(dt);
  if(G.mode==='battle'){updBattleUI(dt);netTick(dt)}
  if(G.mode==='starter')starterObjs.forEach((o,i)=>animCritter(o,G.t+i,dt,false));
  if(G.mode==='battle'||G.mode==='starter'){AP.update(dt);AP2.update(dt);const f=decor.beach&&decor.beach.userData.foam;if(f)f.position.z=-8.2+Math.sin(G.t*1.2)*.3}else WP.update(dt);
  updFloaters(dt);
  G.shake=Math.max(0,G.shake-dt*G.shake*4-dt*.6);
  if(banner.t>0){banner.t-=dt;const el=$('banner');if(el.textContent!==banner.text)el.textContent=banner.text;el.style.opacity=G.mode==='world'?clamp(Math.min(banner.t,2.6-banner.t)*3,0,1):0}
  if(G.awaitStart&&Date.now()-G.awaitStart>12000){G.awaitStart=0;G.lockMove=false;toast('Battle did not start')}
  if(G.pendingChal&&Date.now()-G.pendingChal.t>30000){G.pendingChal=null}
}
let last=performance.now();
function frame(t){const dt=(t-last)/1000;last=t;try{update(dt);render()}catch(e){console.error(e)}requestAnimationFrame(frame)}

/* ================= boot ================= */
try{
  buildWorld();resize();
  pickSlot(SLOT);
  const h=location.hash.replace('#','').toUpperCase();if(/^[A-Z]{4}$/.test(h)){inviteCode=h;$('invite').style.display='block';$('invCode').textContent=h;$('btnInvite').style.display='flex';$('joinCode').value=h;$('btnPlay').classList.add('ghost')}
  $('tPics').innerHTML=['embit','sproutle','dribble','zipzap'].map(s=>`<img src="${portrait(s)}" alt="" style="width:64px;height:64px">`).join('');
  setMode('title');$('loading').remove();requestAnimationFrame(frame);
}catch(e){console.error(e);$('loading').textContent='Oops — could not start 3D. Try reloading.'}
window.__game={G,P,NET,get SV(){return SV},set SV(v){SV=v},get B(){return B},EP,update,render,SP,SIDS,MOVES,wildCache,SLOTS,PATCHES,startWild,refreshWild,wildPos,
  newCritter,giveCritter,saveGame,loadSave,exportCode,importCode,hostGame,joinGame,sendTo,openMenu,closeMenu,showDialog,closeDialog,pressA,onAction,submit,setMode,goWorld,enterGame,
  stats,xpFor,maxHp,lcur,portrait,doHeal,openShop,buy,challenge,friendMenu,openTrade,netLeave,K,joy,BCAM,aCam,wCam,MYPOS,FOEPOS,
  THREE,buildCritter,animCritter,world,arena,wildObjs,collide,blocked,BOXES,platMeshes,get meBlob(){return meBlob},get follower(){return follower},get starterObjs(){return starterObjs},showStarter,TW,renderer};
