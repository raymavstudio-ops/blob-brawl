   -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-3deg)}

</style>

<script>
'use strict';
/* ================= constants ================= */
const W=1280,H=720,R=18;
const COLORS=['#4cc9ff','#ff6fb5','#8be04e','#ffa23f'];
const BOT_NAMES=['Zap','Pixel','Bolt','Nova'];
const MODES={
  blast:{name:'Blaster',e:'🔫',time:150,goal:15,desc:'Free-for-all shooter. Kills & gems level up your gun (up to triple shot). First to 15 kills wins.'},
  tag:{name:'Glow Tag',e:'🏃',time:120,desc:'One player is IT. Runners score every second, IT scores per tag. Double points in the last 30s!'},
  infect:{name:'Lights Out',e:'🧟',time:90,desc:'Hide in the dark! Zombies infect survivors and get radar pings. Last ones alive win.'}
};
const MODE_KEYS=['blast','tag','infect'];
const STREAK=['','','DOUBLE KILL!','TRIPLE KILL!','RAMPAGE!','UNSTOPPABLE!'];
const WALLS=[[600,330,80,60],[240,150,170,30],[870,150,170,30],[240,540,170,30],[870,540,170,30],[190,300,30,120],[1060,300,30,120],[520,90,30,90],[730,540,30,90]];
// gun levels: rate(s), dmg, bullets, spread, bullet radius
const GUN_SIDE=11,GUN_REACH=34; // barrel tip: 11px to the blob's right, 34px ahead (matches the 3D gun model)
const GUN=[[.30,20,1,0,5],[.22,20,1,0,5],[.24,17,2,.11,5],[.24,16,3,.15,5],[.18,19,3,.15,7]];
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}];
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const IS_TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
if(IS_TOUCH)document.body.classList.add('touch');

/* ================= state ================= */
const S={ph:'menu',role:null,mode:'blast',players:[],me:-1,stars:[],bullets:[],tl:120,count:0,botFill:true,code:'',nextId:1,spawnT:2,starId:1,feed:[],gen:0};
let peer=null,hostConn=null,conns=[];
let parts=[],texts=[],shake=0,time=0,hurt=0;
const inp={ix:0,iy:0,ax:1,ay:0,fire:false,dash:false};

function mk(id,name,ci,bot,conn){
  return {id,name,ci,bot:!!bot,conn:conn||null,x:W/2,y:H/2,vx:0,vy:0,fx:1,fy:0,tx:W/2,ty:H/2,ix:0,iy:0,ax:1,ay:0,fire:false,
    it:false,stun:0,safe:0,score:0,dashT:0,dashCd:0,boost:0,dashReq:false,dx:1,dy:0,ai:{t:0,side:1,wx:W/2,wy:H/2,wt:0},dashing:false,trail:0,
    hp:100,dead:0,lvl:1,xp:0,kills:0,deaths:0,fireCd:0,shield:0,rapid:0,itT:0};
}
const isPlaying=()=>S.ph==='count'||S.ph==='play';

/* ================= audio ================= */
let ac=null,muted=false;
function audio(){ if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(ac&&ac.state!=='running')ac.resume().catch(()=>{}); }
function beep(f,d,type='sine',v=.12,slide=0,delay=0){
  if(!ac||muted||ac.state!=='running')return; const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
const SFX={
  tag(){beep(220,.35,'sawtooth',.2,-160);beep(90,.4,'square',.15,-40)},
  star(){beep(880,.12,'triangle',.14);beep(1320,.18,'triangle',.14,0,.07)},
  bolt(){beep(300,.3,'square',.1,600)},
  heal(){beep(520,.15,'sine',.15,200);beep(780,.2,'sine',.12,200,.1)},
  dash(){beep(500,.16,'sawtooth',.07,-380)},
  shot(m){beep(m?760:600,.07,'square',m?.05:.018,-420)},
  hit(){beep(180,.08,'square',.08,-80)},
  boom(){beep(140,.5,'sawtooth',.22,-110);beep(60,.6,'square',.15,-20)},
  lvl(){beep(523,.1,'square',.08);beep(784,.1,'square',.08,0,.08);beep(1046,.2,'square',.08,0,.16)},
  tick(){beep(660,.1,'square',.08)},
  go(){beep(990,.4,'square',.12,300)},
  ping(){beep(1400,.25,'sine',.08,-600)},
  end(){beep(523,.2,'triangle',.15);beep(659,.2,'triangle',.15,0,.15);beep(784,.4,'triangle',.15,0,.3)}
};
// Procedural arcade music: bass + arpeggio + drums, scheduled ahead with a lookahead timer. Plays only during a match.
const MUSIC=(()=>{
  let step=0,next=0,noise=null;const BPM=144,SP=60/BPM/4;
  const PROG={up:[[48,55,60,64],[45,52,57,60],[41,48,53,57],[43,50,55,59]],dark:[[45,52,57,60],[41,48,53,57],[43,50,55,58],[40,47,52,55]]};
  const hz=n=>440*Math.pow(2,(n-69)/12);
  function hat(t,v){if(!noise){noise=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t)}
  function note(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
  function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)}
  setInterval(()=>{
    if(!ac||ac.state!=='running'||muted||S.ph!=='play'){next=0;return}
    if(next<ac.currentTime)next=ac.currentTime+.05;
    const dark=S.mode==='infect',prog=PROG[dark?'dark':'up'],hurry=S.tl<30;
    while(next<ac.currentTime+.2){
      const bar=Math.floor(step/16)%4,s=step%16,ch=prog[bar],sp=hurry?SP*.85:SP;
      if(s%4===0)kick(next);
      if(!dark&&s%2===1)hat(next,.05);
      if(s%4===2||(s===14))note(hz(ch[0]-12),next,sp*1.8,'triangle',.16);
      if(s%2===0)note(hz(ch[(s/2)%4]+12),next,sp*1.6,dark?'sine':'square',dark?.035:.025);
      next+=sp;step++}
  },60);
})();
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';audio()};
addEventListener('pointerdown',audio,{capture:true});addEventListener('touchend',audio,{capture:true});

/* ================= helpers ================= */
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)}
function genCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.random()*a.length|0];return s}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function getName(){let n=$('name').value.trim().slice(0,10);if(!n)n='Player'+(Math.random()*90+10|0);try{localStorage.setItem('gt_name',n)}catch(e){}return n}
function send(conn,m){try{if(conn&&conn.open)conn.send(m)}catch(e){}}
function bcast(m){for(const c of conns)send(c,m)}
const me=()=>S.players.find(p=>p.id===S.me);
const pById=id=>S.players.find(p=>p.id===id);

function resolveWalls(p){
  p.x=Math.max(R,Math.min(W-R,p.x));p.y=Math.max(R,Math.min(H-R,p.y));
  for(const w of WALLS){
    const cx=Math.max(w[0],Math.min(p.x,w[0]+w[2])),cy=Math.max(w[1],Math.min(p.y,w[1]+w[3]));
    const dx=p.x-cx,dy=p.y-cy,d2=dx*dx+dy*dy;
    if(d2<R*R){
      if(d2>.0001){const d=Math.sqrt(d2),k=(R-d)/d;p.x+=dx*k;p.y+=dy*k}
      else{ // centre inside rect: push out along the shortest axis
        const l=p.x-w[0],r=w[0]+w[2]-p.x,t=p.y-w[1],b=w[1]+w[3]-p.y,m=Math.min(l,r,t,b);
        if(m===l)p.x=w[0]-R;else if(m===r)p.x=w[0]+w[2]+R;else if(m===t)p.y=w[1]-R;else p.y=w[1]+w[3]+R;
      }
    }
  }
}
function inWall(x,y,pad){return WALLS.some(w=>x>w[0]-pad&&x<w[0]+w[2]+pad&&y>w[1]-pad&&y<w[1]+w[3]+pad)}
function clearLine(a,b){const d=dist(a,b),n=Math.ceil(d/16);for(let i=1;i<n;i++){const t=i/n;if(inWall(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,2))return false}return true}

/* ================= particles / fx ================= */
function burst(x,y,col,n,sp,life){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*(.5+Math.random()*.5),m:life,c:col,s:2+Math.random()*4})}if(parts.length>500)parts.splice(0,parts.length-500)}
function floatText(x,y,t,c,big){texts.push({x,y,t,c,l:1,big})}
function fx(e){
  const mine=e.id===S.me||e.a===S.me||e.b===S.me;
  switch(e.k){
  case 'tag':burst(e.x,e.y,'#ff3d6e',34,420,.7);burst(e.x,e.y,'#fff',16,260,.5);shake=mine?9:3;SFX.tag();floatText(e.x,e.y-34,'TAGGED!','#ff3d6e');if(mine&&navigator.vibrate)navigator.vibrate(80);break;
  case 'infect':burst(e.x,e.y,'#7dff4d',30,380,.7);shake=mine?9:3;SFX.tag();floatText(e.x,e.y-34,'INFECTED!','#7dff4d');if(mine&&navigator.vibrate)navigator.vibrate(80);break;
  case 'star':burst(e.x,e.y,'#ffe14d',14,240,.5);floatText(e.x,e.y-20,e.v||'+5','#ffe14d');if(e.id===S.me)SFX.star();break;
  case 'bolt':burst(e.x,e.y,'#4dffb0',18,300,.5);floatText(e.x,e.y-20,'SPEED!','#4dffb0');if(e.id===S.me)SFX.bolt();break;
  case 'heal':burst(e.x,e.y,'#ff5577',18,260,.5);floatText(e.x,e.y-20,'+HP','#ff7799');if(e.id===S.me)SFX.heal();break;
  case 'rapid':burst(e.x,e.y,'#ff9a2e',18,300,.5);floatText(e.x,e.y-20,'RAPID FIRE!','#ffb02e');if(e.id===S.me)SFX.bolt();break;
  case 'dash':{const p=pById(e.id);if(p)burst(p.x,p.y,COLORS[p.ci],10,160,.35);if(e.id===S.me)SFX.dash();break}
  case 'shot':{SFX.shot(e.id===S.me);const p=pById(e.id);if(p){p.recoil=.09;const ax=p.ax||0,ay=p.ay||0;burst(p.x-ay*GUN_SIDE+ax*GUN_REACH,p.y+ax*GUN_SIDE+ay*GUN_REACH,'#fff3a0',3,90,.1)}break}
  case 'hit':{burst(e.x,e.y,'#fff',6,200,.25);const v=pById(e.b);if(v)v.flash=.12;
    if(e.b===S.me){hurt=.35;shake=Math.max(shake,4);SFX.hit();if(navigator.vibrate)navigator.vibrate(25)}else if(e.a===S.me)SFX.hit();
    if(e.d&&(e.a===S.me||e.b===S.me))floatText(e.x+(Math.random()-.5)*16,e.y-12,'-'+e.d,e.b===S.me?'#ff3d6e':'#ffffff');break}
  case 'spark':burst(e.x,e.y,COLORS[e.c]||'#fff',4,140,.2);break;
  case 'kill':{const v=pById(e.b),k=pById(e.a);burst(e.x,e.y,v?COLORS[v.ci]:'#fff',44,480,.8);burst(e.x,e.y,'#fff',14,300,.5);shake=mine?9:0;SFX.boom();
    if(e.s>=2&&k){floatText(W/2,H/2-80,(k.id===S.me?'':k.name+': ')+STREAK[Math.min(e.s,5)],'#ffd23f',2);if(k.id===S.me)SFX.lvl()}
    S.feed.unshift({a:k?k.name:'?',ac:k?COLORS[k.ci]:'#fff',b:v?v.name:'?',bc:v?COLORS[v.ci]:'#fff',l:4.5});S.feed.length=Math.min(S.feed.length,4);
    if(e.a===S.me)floatText(e.x,e.y-30,'ELIMINATED!','#fff',1);if(e.b===S.me&&navigator.vibrate)navigator.vibrate([60,40,90]);break}
  case 'lvl':if(e.id===S.me){SFX.lvl();const p=me();if(p)floatText(p.x,p.y-50,'LEVEL '+e.v+'!','#b6ff3b',1)}break;
  case 'rush':floatText(W/2,H/2-60,'DOUBLE POINTS!','#ffb02e',2);SFX.lvl();break;
  case 'ping':{const p=me();if(p&&p.it)SFX.ping();break}
  case 'tick':SFX.tick();break;
  case 'go':SFX.go();break;
  case 'end':SFX.end();break;
  }
}
let evq=[];
function emit(e){fx(e);evq.push(e)}

/* ================= game simulation (host / solo) ================= */
const SPAWNS=[[110,90],[W-110,H-90],[W-110,90],[110,H-90]];
function startGame(){
  if(S.players.length<2){toast('Need at least 2 players');return}
  S.players.forEach((p,i)=>{Object.assign(p,{x:SPAWNS[i][0],y:SPAWNS[i][1],vx:0,vy:0,it:false,stun:0,safe:0,score:0,dashT:0,dashCd:0,boost:0,ix:0,iy:0,
    dashReq:false,fire:false,hp:100,dead:0,lvl:1,xp:0,kills:0,deaths:0,fireCd:0,shield:0,rapid:0,itT:0,streak:0});p.tx=p.x;p.ty=p.y});
  if(S.mode!=='blast')S.players[Math.random()*S.players.length|0].it=true;
  S.stars=[];S.bullets=[];S.feed=[];S.spawnT=1.2;S.count=3.99;S.tl=MODES[S.mode].time;S.lastTick=4;S.rushed=false;S.lastPing=0;
  setPhase('count');pushSnap(true);
}
function endGame(){
  if(S.mode==='infect')for(const p of S.players)if(!p.it){p.score+=15;floatText(p.x,p.y-40,'+15 SURVIVOR','#b6ff3b')}
  S.bullets=[];emit({k:'end'});setPhase('end');pushSnap(true);
}
function nearestPickup(b,types){let best=null,bd=1e9;for(const s of S.stars){if(!types.includes(s.type))continue;const d=Math.hypot(s.x-b.x,s.y-b.y);if(d<bd){bd=d;best=s}}return best}
function edgeRepel(b,o){const m=150;if(b.x<m)o.x+=(m-b.x)/m*2.5;if(b.x>W-m)o.x-=(b.x-(W-m))/m*2.5;if(b.y<m)o.y+=(m-b.y)/m*2.5;if(b.y>H-m)o.y-=(b.y-(H-m))/m*2.5}
function wander(b,dt){const a=b.ai;a.wt-=dt;if(a.wt<=0||Math.hypot(a.wx-b.x,a.wy-b.y)<40){a.wt=2.5;const f=randFree();a.wx=f.x;a.wy=f.y}return{x:a.wx-b.x,y:a.wy-b.y}}
function botThink(b,dt){
  const a=b.ai;a.t-=dt;if(a.t<=0){a.t=.8+Math.random();a.side=Math.random()<.5?-1:1}
  let o={x:0,y:0};b.fire=false;
  if(S.mode==='blast'){
    let tgt=null,td=1e9;for(const q of S.players){if(q!==b&&q.dead<=0){const d=dist(q,b);if(d<td){td=d;tgt=q}}}
    let goal=b.hp<50?nearestPickup(b,[2]):null;
    if(!goal&&(!tgt||td>520))goal=nearestPickup(b,[0,3,1]);
    if(tgt){
      const los=clearLine(b,tgt);
      if(los&&td<640){const t=td/900;const ang=Math.atan2(tgt.y+tgt.vy*t-b.y,tgt.x+tgt.vx*t-b.x)+(Math.random()-.5)*.26;b.ax=Math.cos(ang);b.ay=Math.sin(ang);b.fire=true}
      if(!goal){const ux=(tgt.x-b.x)/td,uy=(tgt.y-b.y)/td;
        if(!los){o.x=ux;o.y=uy}else{const want=td>340?1:td<200?-1:0;o.x=ux*want-uy*a.side*.9;o.y=uy*want+ux*a.side*.9}}
      if(td<160&&b.hp<40&&b.dashCd<=0&&Math.random()<.04)b.dashReq=true;
    }
    if(goal){o.x=goal.x-b.x;o.y=goal.y-b.y}
    if(!tgt&&!goal)o=wander(b,dt);
    edgeRepel(b,o);
  }else if(b.it){
    let best=null,bd=1e9;for(const q of S.players){if(q!==b&&!q.it&&q.safe<=0){const d=dist(q,b);if(d<bd){bd=d;best=q}}}
    const sees=S.mode!=='infect'||bd<380||(S.tl%8)>6.5;
    if(best&&sees){const lead=Math.min(.3,bd/800);o.x=best.x+best.vx*lead-b.x;o.y=best.y+best.vy*lead-b.y;
      if(bd<230&&bd>80&&b.dashCd<=0&&Math.random()<.025)b.dashReq=true}
    else o=wander(b,dt);
  }else{
    let th=null,d=1e9;for(const q of S.players){if(q.it&&q.stun<=0){const dd=dist(q,b);if(dd<d){d=dd;th=q}}}
    if(th&&d<300){
      let ax=b.x-th.x,ay=b.y-th.y;const n=Math.hypot(ax,ay)||1;ax/=n;ay/=n;
      o.x=ax-ay*a.side*.7;o.y=ay+ax*a.side*.7;edgeRepel(b,o);
      if(d<110&&b.dashCd<=0&&Math.random()<.05)b.dashReq=true;
    }else{const g=nearestPickup(b,[0,1]);if(g&&S.mode==='tag'){o.x=g.x-b.x;o.y=g.y-b.y}else o=wander(b,dt)}
  }
  const n=Math.hypot(o.x,o.y);if(n>1){o.x/=n;o.y/=n}
  b.ix=o.x;b.iy=o.y;
  if(S.mode==='blast'&&!b.fire&&n>.2){const l=Math.hypot(o.x,o.y);b.ax=o.x/l;b.ay=o.y/l} // not shooting: face travel direction instead of a stale aim
}
function respawn(p){
  let best=SPAWNS[0],bd=-1;
  for(const s of SPAWNS){let m=1e9;for(const q of S.players)if(q!==p&&q.dead<=0)m=Math.min(m,Math.hypot(q.x-s[0],q.y-s[1]));if(m>bd){bd=m;best=s}}
  p.x=best[0];p.y=best[1];p.hp=100;p.shield=1.8;p.dead=0;p.vx=p.vy=0;p.fireCd=.3;
}
function stepPlayer(p,dt){
  if(p.dead>0){p.dead-=dt;if(p.dead<=0)respawn(p);return}
  p.dashCd=Math.max(0,p.dashCd-dt);p.safe=Math.max(0,p.safe-dt);p.boost=Math.max(0,p.boost-dt);p.shield=Math.max(0,p.shield-dt);p.rapid=Math.max(0,p.rapid-dt);p.fireCd-=dt;
  if(p.stun>0){p.stun-=dt;p.vx=p.vy=0;p.dashT=0;p.dashReq=false;return}
  let ix=p.ix,iy=p.iy;const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
  if(m>.12){p.fx=ix/m;p.fy=iy/m}
  if(p.dashReq){p.dashReq=false;if(p.dashCd<=0){p.dashT=.17;p.dashCd=1.8;p.dx=p.fx;p.dy=p.fy;emit({k:'dash',id:p.id})}}
  let vx,vy;
  if(p.dashT>0){p.dashT-=dt;vx=p.dx*720;vy=p.dy*720}
  else{
    let sp=236;
    if(S.mode==='tag'&&p.it)sp=p.itT>8?300:262;
    if(S.mode==='infect'&&p.it)sp=246;
    if(S.mode==='blast')sp=230-(p.lvl-1)*5;
    sp*=(p.boost>0?1.35:1)*(p.bot?.93:1);vx=ix*sp;vy=iy*sp;
  }
  p.vx=vx;p.vy=vy;
  const steps=Math.max(1,Math.ceil(Math.hypot(vx,vy)*dt/10));
  for(let i=0;i<steps;i++){p.x+=vx*dt/steps;p.y+=vy*dt/steps;resolveWalls(p)}
  if(S.mode==='blast'&&p.fire&&p.fireCd<=0&&S.ph==='play')shoot(p);
}
function shoot(p){
  const g=GUN[p.lvl-1];let am=Math.hypot(p.ax,p.ay);if(am<.01){p.ax=p.fx;p.ay=p.fy;am=1}
  const base=Math.atan2(p.ay,p.ax),bc=Math.cos(base),bs=Math.sin(base),mx=p.x-bs*GUN_SIDE+bc*GUN_REACH,my=p.y+bc*GUN_SIDE+bs*GUN_REACH;
  for(let i=0;i<g[2];i++){const a=base+(i-(g[2]-1)/2)*g[3],c=Math.cos(a),s=Math.sin(a);
    S.bullets.push({x:mx,y:my,vx:c*900,vy:s*900,o:p.id,ci:p.ci,d:g[1],r:g[4],l:.8})}
  p.fireCd=g[0]*(p.rapid>0?.5:1)*(p.bot?1.35:1);
  emit({k:'shot',id:p.id});
}
function kill(v,k){
  v.dead=2.2;v.deaths++;v.lvl=Math.max(1,v.lvl-1);v.xp=0;v.hp=0;v.boost=v.rapid=0;
  v.streak=0;
  if(k){k.kills++;k.streak=(k.streak||0)+1;k.score=k.kills;k.hp=Math.min(100,k.hp+25);if(k.lvl<5){k.lvl++;emit({k:'lvl',id:k.id,v:k.lvl})}}
  emit({k:'kill',x:v.x,y:v.y,a:k?k.id:-1,b:v.id,s:k?k.streak:0});
  if(k&&k.kills>=MODES.blast.goal)endGame();
}
function updateBullets(dt){
  for(let i=S.bullets.length-1;i>=0;i--){
    const b=S.bullets[i];if(!b)continue; // a kill can end the game (endGame clears S.bullets) mid-loop
    b.l-=dt;let gone=b.l<=0;
    const n=Math.max(1,Math.ceil(900*dt/12));
    for(let s=0;s<n&&!gone;s++){
      b.x+=b.vx*dt/n;b.y+=b.vy*dt/n;
      if(b.x<0||b.x>W||b.y<0||b.y>H||inWall(b.x,b.y,0)){gone=true;emit({k:'spark',x:b.x,y:b.y,c:b.ci});break}
      for(const q of S.players){
        if(q.id===b.o||q.dead>0||Math.hypot(q.x-b.x,q.y-b.y)>R+b.r)continue;
        gone=true;
        if(q.shield>0){emit({k:'spark',x:b.x,y:b.y,c:q.ci});break}
        q.hp-=b.d;q.x+=b.vx*.006;q.y+=b.vy*.006;resolveWalls(q);
        emit({k:'hit',x:b.x,y:b.y,a:b.o,b:q.id,d:b.d});
        if(q.hp<=0)kill(q,pById(b.o));
        break;
      }
    }
    if(gone)S.bullets.splice(i,1);
  }
}
function randFree(){for(let i=0;i<40;i++){const x=80+Math.random()*(W-160),y=80+Math.random()*(H-160);if(!inWall(x,y,34))return{x,y}}return{x:W/2,y:80}}
function rollPickup(){
  const r=Math.random();
  if(S.mode==='blast')return r<.42?0:r<.67?2:r<.84?3:1;
  return r<.78?0:1;
}
function simulate(dt){
  if(S.ph==='count'){
    S.count-=dt;const c=Math.ceil(S.count);if(c<S.lastTick&&c>0){S.lastTick=c;emit({k:'tick'})}
    if(S.count<=0){for(const p of S.players)p.dashReq=false;setPhase('play');emit({k:'go'})}
    return;
  }
  S.tl-=dt;
  for(const p of S.players){
    if(p.bot&&p.dead<=0)botThink(p,dt);
    else if(p.conn&&time-(p.inT||0)>.5){p.ix=p.iy=0;p.fire=false} // stale input from a laggy/backgrounded phone
    stepPlayer(p,dt);
  }
  if(S.mode==='blast')updateBullets(dt);
  if(S.ph!=='play')return;
  const rush=S.mode==='tag'&&S.tl<30?2:1;
  if(rush>1&&!S.rushed){S.rushed=true;emit({k:'rush'})}
  if(S.mode==='tag'){
    const it=S.players.find(p=>p.it);
    if(it){it.itT+=dt;
      if(it.stun<=0)for(const q of S.players){
        if(q!==it&&q.safe<=0&&dist(q,it)<R*2+3){
          it.score+=3*rush;it.it=false;it.safe=1.7;it.itT=0;q.it=true;q.stun=1.0;q.dashT=0;q.itT=0;
          emit({k:'tag',x:(q.x+it.x)/2,y:(q.y+it.y)/2,a:it.id,b:q.id});break;
        }
      }
    }
    for(const p of S.players)p.score+=(p.it?.4:1)*dt*rush;
  }else if(S.mode==='infect'){
    for(const z of S.players){if(!z.it||z.stun>0)continue;
      for(const q of S.players){if(!q.it&&dist(q,z)<R*2+3){q.it=true;q.stun=.8;z.score+=5;emit({k:'infect',x:q.x,y:q.y,a:z.id,b:q.id})}}}
    for(const p of S.players)if(!p.it)p.score+=dt;
    const pc=Math.floor(S.tl/8);if(pc!==S.lastPing){S.lastPing=pc;emit({k:'ping'})}
    if(!S.players.some(p=>!p.it)){endGame();return}
  }
  S.spawnT-=dt;const maxP=S.mode==='blast'?5:4;
  if(S.spawnT<=0&&S.stars.length<maxP){S.spawnT=S.mode==='blast'?2:2.5;const f=randFree();S.stars.push({id:S.starId++,type:rollPickup(),x:f.x,y:f.y})}
  for(let i=S.stars.length-1;i>=0;i--){
    const s=S.stars[i];
    for(const p of S.players){
      if(p.dead>0||p.stun>0||Math.hypot(p.x-s.x,p.y-s.y)>=R+16)continue;
      if(s.type===2&&p.hp>=100)continue;
      if(s.type===0){
        if(S.mode==='blast'){p.xp++;emit({k:'star',id:p.id,x:s.x,y:s.y,v:'+XP'});if(p.xp>=3&&p.lvl<5){p.xp=0;p.lvl++;emit({k:'lvl',id:p.id,v:p.lvl})}}
        else{const v=5*rush;p.score+=v;emit({k:'star',id:p.id,x:s.x,y:s.y,v:'+'+v})}
      }else if(s.type===1){p.boost=4;emit({k:'bolt',id:p.id,x:s.x,y:s.y})}
      else if(s.type===2){p.hp=Math.min(100,p.hp+45);emit({k:'heal',id:p.id,x:s.x,y:s.y})}
      else{p.rapid=5;emit({k:'rapid',id:p.id,x:s.x,y:s.y})}
      S.stars.splice(i,1);break;
    }
  }
  if(S.tl<=0)endGame();
}
const r1=v=>Math.round(v*10)/10,r2=v=>Math.round(v*100)/100;
function pushSnap(force){
  if(!conns.length){evq=[];return}
  bcast({t:'s',ph:S.ph,mode:S.mode,tl:r1(S.tl),c:r1(S.count),
    p:S.players.map(p=>[p.id,r1(p.x),r1(p.y),p.it?1:0,r1(p.stun),r1(p.safe),r1(p.score),p.dashT>0?1:0,r1(p.boost),r1(p.dashCd),r1(p.vx),r1(p.vy),
      Math.max(0,Math.round(p.hp)),r1(p.dead),p.lvl,r2(p.ax),r2(p.ay),r1(p.shield),r1(p.rapid),p.kills,p.deaths,p.xp,p.itT>8?1:0]),
    k:S.stars.map(s=>[s.id,s.type,r1(s.x),r1(s.y)]),
    b:S.bullets.map(b=>[Math.round(b.x),Math.round(b.y),Math.round(b.vx),Math.round(b.vy),b.ci,b.r]),ev:evq});
  evq=[];
}

/* ================= lobby / network ================= */
function addBotsTo(n){
  const used=S.players.map(p=>p.ci);
  while(S.players.length<n){let ci=0;while(used.includes(ci))ci++;used.push(ci);S.players.push(mk(S.nextId++,BOT_NAMES[ci],ci,true))}
}
function syncBots(){
  S.players=S.players.filter(p=>!p.bot);
  if(S.role==='solo'||S.botFill)addBotsTo(4);
  S.players.sort((a,b)=>a.ci-b.ci);
}
function lobbyMsg(){return{t:'lobby',code:S.code,mode:S.mode,botFill:S.botFill,players:S.players.map(p=>({id:p.id,name:p.name,ci:p.ci,bot:p.bot}))}}
function sendLobby(){bcast(lobbyMsg());renderLobby()}
function freeCi(){const u=S.players.filter(p=>!p.bot).map(p=>p.ci);let c=0;while(u.includes(c))c++;return c}

function hostGame(tries=0){
  audio();cleanupNet();S.role='host';S.code=genCode();S.players=[];conns=[];S.botFill=false;const gen=++S.gen;
  toast('Creating room…');
  try{peer=new Peer('glowtag-'+S.code,{config:{iceServers:ICE}})}catch(e){toast('Network not available');S.role=null;return}
  const pr=peer;
  pr.on('open',()=>{if(gen!==S.gen)return;
    const p=mk(S.nextId++,getName(),0,false);S.me=p.id;S.players=[p];syncBots();setPhase('lobby');renderLobby();});
  pr.on('connection',c=>{if(gen===S.gen)onConn(c)});
  pr.on('error',e=>{if(gen!==S.gen)return;
    if(e.type==='unavailable-id'&&tries<5)hostGame(tries+1);
    else if(S.ph==='menu'){toast('Could not create room ('+e.type+')');cleanupNet();S.role=null}
    else toast('Network hiccup: '+e.type);});
  pr.on('disconnected',()=>{if(gen===S.gen&&!pr.destroyed){try{pr.reconnect()}catch(e){}}});
}
function onConn(conn){
  conn.on('data',m=>hostMsg(conn,m));
  conn.on('close',()=>dropConn(conn));
  conn.on('error',()=>dropConn(conn));
}
function hostMsg(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    if(conn._p)return;
    const humans=S.players.filter(p=>!p.bot).length;
    if(isPlaying()){send(conn,{t:'full',why:'Game in progress — try again in a moment'});setTimeout(()=>conn.close(),300);return}
    if(humans>=4){send(conn,{t:'full',why:'Room is full'});setTimeout(()=>conn.close(),300);return}
    S.players=S.players.filter(p=>!p.bot);
    const p=mk(S.nextId++,String(m.name||'Player').slice(0,10),freeCi(),false,conn);
    conn._p=p;conns.push(conn);S.players.push(p);syncBots();
    send(conn,{t:'welcome',id:p.id});
    if(S.ph==='end'){S.ph='lobby';setPhase('lobby')}
    sendLobby();toast(p.name+' joined!');
  }else if(m.t==='in'&&conn._p){
    const p=conn._p,c=v=>Math.max(-1,Math.min(1,+v||0));
    p.ix=c(m.ix);p.iy=c(m.iy);p.ax=c(m.ax);p.ay=c(m.ay);p.fire=!!m.f;p.inT=time;if(m.d&&S.ph==='play')p.dashReq=true;
  }
}
function dropConn(conn){
  const p=conn._p;conns=conns.filter(c=>c!==conn);if(!p)return;conn._p=null;
  if(S.ph==='lobby'||S.ph==='end'){S.players=S.players.filter(q=>q!==p);syncBots();if(S.ph==='lobby')sendLobby()}
  else{p.bot=true;p.conn=null}
  toast(p.name+' left'+(isPlaying()?' — a bot takes over':''));
}
function joinGame(code){
  audio();code=(code||'').toUpperCase().trim();if(!/^[A-Z]{4}$/.test(code)){toast('Enter the 4-letter code');return}
  cleanupNet();S.role='client';S.code=code;S.players=[];toast('Connecting…');const gen=++S.gen;
  try{peer=new Peer(undefined,{config:{iceServers:ICE}})}catch(e){toast('Network not available');S.role=null;return}
  const pr=peer,name=getName();let ok=false;
  const fail=msg=>{if(ok||gen!==S.gen)return;toast(msg);leave()};
  const to=setTimeout(()=>fail('Could not connect. Check the code and try again'),15000);
  pr.on('open',()=>{if(gen!==S.gen)return;
    const c=pr.connect('glowtag-'+code,{reliable:true});hostConn=c;
    c.on('open',()=>{ok=true;clearTimeout(to);send(c,{t:'join',name})});
    c.on('data',m=>{if(gen===S.gen)clientMsg(m)});
    c.on('close',()=>{if(gen===S.gen&&S.role==='client'){toast('Host left the game');leave()}});
  });
  pr.on('error',e=>{if(gen!==S.gen)return;if(e.type==='peer-unavailable')fail('Room '+code+' not found');else if(!ok)fail('Network error: '+e.type)});
}
function clientMsg(m){
  if(!m)return;
  if(m.t==='welcome'){S.me=m.id}
  else if(m.t==='full'){toast(m.why);leave()}
  else if(m.t==='lobby'){
    S.code=m.code;S.botFill=m.botFill;S.mode=m.mode;
    S.players=m.players.map(q=>{const p=S.players.find(o=>o.id===q.id)||mk(q.id,q.name,q.ci,q.bot);p.name=q.name;p.ci=q.ci;p.bot=q.bot;return p});
    if(S.ph!=='lobby')setPhase('lobby');renderLobby();
  }else if(m.t==='s'){
    S.tl=m.tl;S.count=m.c;S.mode=m.mode;
    for(const e of m.p){
      const p=pById(e[0]);if(!p)continue;
      const wasDead=p.dead>0;
      [,p.tx,p.ty]=e;p.it=!!e[3];p.stun=e[4];p.safe=e[5];p.score=e[6];p.dashing=!!e[7];p.boost=e[8];p.dashCd=e[9];p.vx=e[10];p.vy=e[11];
      p.hp=e[12];p.dead=e[13];p.lvl=e[14];if(p.id!==S.me){p.ax=e[15];p.ay=e[16]}p.shield=e[17];p.rapid=e[18];p.kills=e[19];p.deaths=e[20];p.xp=e[21];p.frenzy=e[22];
      if(!p.seen||wasDead&&p.dead<=0||m.ph==='count'){p.x=p.tx;p.y=p.ty;p.seen=true}
    }
    S.stars=m.k.map(s=>({id:s[0],type:s[1],x:s[2],y:s[3]}));
    S.bullets=m.b.map(b=>({x:b[0],y:b[1],vx:b[2],vy:b[3],ci:b[4],r:b[5]}));
    for(const e of m.ev)fx(e);
    if(m.ph!==S.ph){if(m.ph==='count')S.feed=[];setPhase(m.ph)}
  }
}
function cleanupNet(){
  try{if(hostConn)hostConn.close()}catch(e){}try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}
  peer=null;hostConn=null;conns=[];
}
function leave(){
  S.gen++;S.role=null;cleanupNet();S.players=[];S.me=-1;S.stars=[];S.bullets=[];setPhase('menu');
}
function soloGame(){
  audio();cleanupNet();S.gen++;S.role='solo';S.code='';conns=[];
  const p=mk(S.nextId++,getName(),0,false);S.me=p.id;S.players=[p];syncBots();setPhase('lobby');renderLobby();

let view={sc:1,ox:0,oy:0};
function readInput(){
  const blast=S.mode==='blast';
  let ix=(keys['d']||(!blast&&keys['arrowright'])?1:0)-(keys['a']||(!blast&&keys['arrowleft'])?1:0);
  let iy=(keys['s']||(!blast&&keys['arrowdown'])?1:0)-(keys['w']||(!blast&&keys['arrowup'])?1:0);
  if(joy.id!==null&&(Math.abs(joy.x)>.1||Math.abs(joy.y)>.1)){ix=joy.x;iy=joy.y}
  inp.ix=ix;inp.iy=iy;inp.fire=false;
  if(!blast)return;
  const m=me();
  const kx=(keys['arrowright']?1:0)-(keys['arrowleft']?1:0),ky=(keys['arrowdown']?1:0)-(keys['arrowup']?1:0);
  if(aim.id!==null){const mg=Math.hypot(aim.x,aim.y);if(mg>.2){
    let ax=aim.x/mg,ay=aim.y/mg;
    if(m){let best=null,bc=Math.cos(.45);for(const q of S.players){if(q===m||q.dead>0)continue;const dx=q.x-m.x,dy=q.y-m.y,d=Math.hypot(dx,dy);if(d<1||d>650)continue;const c=(dx*ax+dy*ay)/d;if(c>bc){bc=c;best=[dx/d,dy/d]}}
      if(best){ax=ax*.35+best[0]*.65;ay=ay*.35+best[1]*.65;const l=Math.hypot(ax,ay);ax/=l;ay/=l}} // aim assist: snap toward an enemy near the aim line
    inp.ax=ax;inp.ay=ay;inp.fire=mg>.35}}
  else if(kx||ky){const l=Math.hypot(kx,ky);inp.ax=kx/l;inp.ay=ky/l;inp.fire=true}
  else if(mouse.seen&&m){
    let wx,wy;
    if(window.R3&&R3.ok){const w=R3.screenToWorld(mouse.x,mouse.y);if(!w)return;wx=w.x;wy=w.y}
    else{const d=Math.min(devicePixelRatio||1,DPR_CAP);wx=(mouse.x*d-view.ox)/view.sc;wy=(mouse.y*d-view.oy)/view.sc}
    const dx=wx-m.x,dy=wy-m.y,l=Math.hypot(dx,dy);if(l>4){inp.ax=dx/l;inp.ay=dy/l}inp.fire=mouse.down;
  }
  else if(Math.hypot(ix,iy)>.15){const l=Math.hypot(ix,iy);inp.ax=ix/l;inp.ay=iy/l} // not aiming: face where you walk
}

  g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=3;g.beginPath();g.arc(W/2,H/2,170,0,6.283);g.stroke();

  }

}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,R,0,6.283);ctx.fill();

  if(playing)for(const q of parts){
    const a=Math.max(0,q.l/q.m),c=cc(q.c);
    if(q.s>=R*.3&&q.vx===0&&q.vy===0){if(nt>=MAXP)continue;P2.pos[nt*3]=X(q.x);P2.pos[nt*3+1]=.25;P2.pos[nt*3+2]=Z(q.y);P2.col[nt*3]=c.r;P2.col[nt*3+1]=c.g;P2.col[nt*3+2]=c.b;nt++}
    else{if(n>=MAXP)continue;P1.pos[n*3]=X(q.x);P1.pos[n*3+1]=.3+(1-a)*.8;P1.pos[n*3+2]=Z(q.y);P1.col[n*3]=c.r;P1.col[n*3+1]=c.g;P1.col[n*3+2]=c.b;n++}
  }
  for(const [P,k] of [[P1,n],[P2,nt]]){P.geo.setDrawRange(0,k);P.geo.attributes.position.needsUpdate=true;P.geo.attributes.color.needsUpdate=true}

  const asp=camera.aspect,zoom=(S.mode==='blast'?1.08:1)*(asp<1.5?1.5/asp:1);
  if(playing&&m){
    const tx=Math.max(-AX+7,Math.min(AX-7,X(m.x))),tz=Math.max(-AZ+4.6,Math.min(AZ-2.6,Z(m.y)));
    if(m.dead<=0)camT.lerp(tmpV.set(tx,0,tz),Math.min(1,dt*5));
    camera.position.set(camT.x,10.2*zoom,camT.z+7.8*zoom);
  }else if(playing){camT.lerp(tmpV.set(0,0,0),dt*3);camera.position.set(0,22,15)}
  else{const a=t*.08;camT.set(0,0,0);camera.position.set(Math.sin(a)*20,14,Math.cos(a)*20)}
  if(shake>0){const a=Math.min(shake,12)*.012;camera.position.x+=Math.sin(t*61)*a;camera.position.z+=Math.cos(t*53)*a}
  camera.lookAt(camT);
  renderer.render(scene,camera);
}
const ray=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),-.5),hit=new THREE.Vector3(),ndc=new THREE.Vector2();
window.R3={ok:true,render,renderer,scene,camera,pm,K,
  project(x,y,h){tmpV.set(X(x),h,Z(y)).project(camera);if(tmpV.z>1)return null;return{x:(tmpV.x+1)/2*innerWidth,y:(1-tmpV.y)/2*innerHeight}},
  screenToWorld(cx,cy){ndc.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(ndc,camera);if(!ray.ray.intersectPlane(plane,hit))return null;return{x:(hit.x+AX)/K,y:(hit.z+AZ)/K}},
  hide(){glc.style.display='none'}};
}catch(e){console.error('3D renderer failed, using 2D',e)}
</script>
