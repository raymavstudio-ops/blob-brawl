<!doctype html>
<html lang="en">
<head>
<script>(function(){var v=navigator.vibrate&&navigator.vibrate.bind(navigator);if(v)navigator.vibrate=function(p){try{if(!navigator.userActivation||navigator.userActivation.hasBeenActive)return v(p)}catch(e){}return false}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8fd16a">
<title>Blob Mining</title>
<meta name="apple-mobile-web-app-title" content="Blob Mining">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--card:#fffdf6;--dim:#5d5a80;--yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a;--orange:#ffa23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#7fd0ff,#cfeec0);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;font-weight:600;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch;z-index:20}
.screen.on{display:flex}
#title{z-index:25;background:linear-gradient(180deg,rgba(29,27,58,.0),rgba(29,27,58,.18))}
#panel{z-index:30;background:rgba(29,27,58,.42)}
.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:14px 18px 12px;width:min(480px,100%);box-shadow:0 8px 0 var(--ink);margin:auto;animation:pop .3s cubic-bezier(.3,1.6,.5,1);max-height:calc(100vh - 20px);display:flex;flex-direction:column}
.card.wide{width:min(700px,100%)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(44px,11vw,64px);line-height:.92;letter-spacing:1px;text-align:center;color:#ffb347;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-3deg)}
h1 span{color:#7fe0ff}
h2{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:30px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.sub{text-align:center;color:var(--dim);margin:8px 0 10px;font-size:15px}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px;letter-spacing:.6px;text-transform:uppercase}
input[type=text],textarea{width:100%;font:600 18px 'Fredoka',sans-serif;color:var(--ink);background:#eef6ff;border:3px solid var(--ink);border-radius:14px;padding:9px 13px;outline:none;user-select:text;-webkit-user-select:text}
textarea{font-size:13px;height:110px;resize:none;word-break:break-all}
input[type=text]:focus,textarea:focus{background:#fff;box-shadow:0 0 0 4px rgba(76,201,255,.45)}
.btn{display:block;width:100%;font:400 20px 'Lilita One',sans-serif;letter-spacing:.5px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:15px;padding:10px;margin-top:9px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-height:48px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.ghost{background:#fff}.btn.org{background:var(--orange)}
.btn.sm{font-size:16px;padding:6px 12px;margin-top:0;min-height:48px;width:auto;box-shadow:0 4px 0 var(--ink);flex:none}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.join{display:flex;gap:10px;margin-top:9px}
.join input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Lilita One',sans-serif;font-size:22px;padding:8px}
.join .btn{width:auto;margin:0;padding:0 22px;flex:none}
.invite{background:#fff2b8;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:6px;text-align:center;font-size:15px}
.slots{display:grid;gap:8px;margin:8px 0}
.slot-c{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:15px;background:#fff;border:3px solid var(--ink);cursor:pointer;min-height:56px}
.slot-c.sel{background:#fff2b8;box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.slot-c .si{font-size:28px;width:38px;text-align:center}
.slot-c small{display:block;color:var(--dim);font-size:12px;font-weight:600}
.slot-c b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:17px}
.code{font-family:'Lilita One',sans-serif;font-size:50px;letter-spacing:10px;text-align:center;color:var(--blue);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin:0;cursor:pointer}
.pbody{overflow:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding:2px}
.ptabs{display:flex;gap:6px;margin:4px 0 8px;overflow-x:auto;flex:none}
.ptab{flex:none;font:400 15px 'Lilita One',sans-serif;padding:6px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;min-height:48px}
.ptab.sel{background:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cell{position:relative;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px 4px 4px;text-align:center;min-height:84px}
.cell .ci{height:38px;display:flex;align-items:center;justify-content:center}
.cell .cn{font-size:12px;line-height:1.1;margin-top:2px}
.cell .cq{position:absolute;right:4px;top:2px;font:400 14px 'Lilita One',sans-serif;background:var(--yellow);border:2px solid var(--ink);border-radius:9px;padding:0 5px;min-width:22px}
.lr{display:flex;align-items:center;gap:10px;padding:7px 10px;border:3px solid var(--ink);border-radius:14px;background:#fff;margin-bottom:7px}
.lr .ico{flex:none;width:44px;height:44px;font-size:28px;display:flex;align-items:center;justify-content:center}
.lr .tx{flex:1;min-width:0;font-size:15px;line-height:1.15}
.lr .tx small{display:block;color:var(--dim);font-size:12px;font-weight:600;margin-top:2px}
.lr.done{background:#e4ffd8}.lr.cur{background:#fff2b8}.lr.lock{opacity:.55}
.bar{height:12px;border:2.5px solid var(--ink);border-radius:8px;background:#e6e8f2;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green);width:0}
.note{font-size:13px;color:var(--dim);text-align:center;margin:6px 0}
.oi{display:inline-block;width:26px;height:26px;border-radius:8px;background:var(--c);border:3px solid var(--ink);box-shadow:inset 3px 3px 0 rgba(255,255,255,.55),inset -3px -3px 0 rgba(0,0,0,.18);vertical-align:middle;position:relative}
.oi.bar_{border-radius:4px;height:18px;margin:4px 0;transform:skewX(-14deg)}
.oi.pol{transform:rotate(45deg) scale(.82);border-radius:6px}
.oi.tool{background:#c98a4b}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:2px solid var(--ink);background:#eef;margin-left:4px}
.pill.g{background:#d6ffc9}.pill.r{background:#ffd0d0}.pill.y{background:#fff2b8}
/* HUD */
#hud,#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:6}
body.playing #hud{display:block}
body.pan #hud,body.pan #touch,body.pan #tags,body.pan #bossbar{visibility:hidden}
body.playing.touch #touch{display:block}
.chip{position:absolute;display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:2px 10px;font:600 15px 'Fredoka',sans-serif;box-shadow:0 3px 0 var(--ink);min-height:34px;white-space:nowrap}
#topL{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px}
#topL .chip{position:static}
#cLvl{pointer-events:auto;cursor:pointer}
.xpbar{width:40px;height:10px;border:2.5px solid var(--ink);border-radius:6px;background:#e6e8f2;overflow:hidden}.xpbar i{display:block;height:100%;width:0;background:var(--blue)}
#topC{left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);flex-direction:column;align-items:stretch;gap:2px;padding:3px 10px;min-width:150px;pointer-events:auto;cursor:pointer}
#packRow{display:flex;align-items:center;gap:6px;font-size:14px}
#packBar{flex:1;height:12px;border:2.5px solid var(--ink);border-radius:7px;background:#e6e8f2;overflow:hidden;min-width:70px}#packBar i{display:block;height:100%;width:0;background:#ffa23f}
#hearts{font-size:14px;letter-spacing:1px;line-height:1;text-align:center;color:#ff4f81}
#quest{left:max(8px,env(safe-area-inset-left));top:max(48px,calc(env(safe-area-inset-top) + 44px));max-width:min(230px,34vw);font-size:12px;white-space:normal;line-height:1.15;padding:3px 9px;pointer-events:auto;cursor:pointer;min-height:30px}
#quest b{color:#e0457b}
#topR{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
.rb{width:46px;height:46px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:20px;cursor:pointer;padding:0;position:relative}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.rb .bdg{position:absolute;right:-6px;top:-8px;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:10px;font:400 12px 'Lilita One',sans-serif;padding:0 5px;display:none}
#roomChip{right:max(8px,env(safe-area-inset-right));top:max(60px,calc(env(safe-area-inset-top) + 58px));font-size:12px;min-height:26px;padding:1px 9px;display:none;z-index:2}
#mini{position:absolute;right:max(30px,calc(env(safe-area-inset-right) + 22px));top:max(92px,calc(env(safe-area-inset-top) + 90px));width:76px;height:76px;border:3px solid var(--ink);border-radius:12px;background:#27223a;box-shadow:0 3px 0 var(--ink);pointer-events:none}
#dmeter{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(92px,calc(env(safe-area-inset-top) + 90px));width:14px;height:140px;border:3px solid var(--ink);border-radius:8px;background:#fff;box-shadow:0 3px 0 var(--ink);pointer-events:none}
#hot{position:absolute;left:50%;transform:translateX(-50%);bottom:max(6px,env(safe-area-inset-bottom));display:flex;gap:2px;pointer-events:auto;background:rgba(255,255,255,.6);padding:3px;border-radius:15px;border:3px solid var(--ink)}
.hs{position:relative;width:46px;height:46px;border-radius:11px;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:23px;cursor:pointer;padding:0}
.hs.sel{background:#fff2b8;border-color:#e0457b;transform:translateY(-5px);box-shadow:0 5px 0 var(--ink)}
.hs .q{position:absolute;right:0;bottom:-2px;font:400 12px 'Lilita One',sans-serif;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:0 4px;line-height:14px}
.hs .k{position:absolute;left:3px;top:0;font:600 12px 'Fredoka',sans-serif;color:var(--dim)}
.hs.zero{opacity:.45}
body.touch .hs .k{display:none}
.abtn{pointer-events:auto;position:absolute;border-radius:50%;border:4px solid var(--ink);color:#fff;box-shadow:0 6px 0 var(--ink);touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1;font-family:'Lilita One',sans-serif}
.abtn:active,.abtn.held{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.abtn span{font-size:30px;line-height:1.05}.abtn b{font:400 14px 'Lilita One',sans-serif;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
#mineBtn{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:92px;height:92px;background:var(--pink)}
#jumpBtn{right:max(112px,calc(env(safe-area-inset-right) + 110px));bottom:max(14px,env(safe-area-inset-bottom));width:64px;height:64px;background:var(--blue)}
#placeBtn{right:max(112px,calc(env(safe-area-inset-right) + 110px));bottom:max(92px,calc(env(safe-area-inset-bottom) + 88px));width:58px;height:58px;background:#8be04e;color:var(--ink)}
#cartBtn{right:max(14px,env(safe-area-inset-right));bottom:max(116px,calc(env(safe-area-inset-bottom) + 112px));width:56px;height:56px;background:#b583ff}
#cartBtn.off,#placeBtn.off{filter:grayscale(.8);opacity:.6}
#useBtn{pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);bottom:max(66px,calc(env(safe-area-inset-bottom) + 62px));display:none;font:400 20px 'Lilita One',sans-serif;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:6px 18px;box-shadow:0 5px 0 var(--ink);min-height:48px;white-space:nowrap}
#useBtn.on{display:block}
#useBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 1px 0 var(--ink)}
.jbase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:4px solid rgba(29,27,58,.55);background:rgba(255,255,255,.3);display:none}
.jknob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#tags,#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.tag{position:absolute;transform:translate(-50%,-100%);font:600 13px 'Fredoka',sans-serif;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:0 8px;white-space:nowrap;will-change:left,top}
.tag.st{background:#fff2b8;font:400 15px 'Lilita One',sans-serif;padding:0 10px}
.pop{position:absolute;transform:translate(-50%,-50%);font:400 20px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;animation:rise 1.2s ease-out forwards;white-space:nowrap}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-56px}}
#bossbar{position:fixed;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 60px));transform:translateX(-50%);width:min(300px,44vw);z-index:7;display:none;text-align:center;pointer-events:none}
#bossbar b{font:400 17px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;display:block}
#bossbar .bar{height:16px;margin-top:2px;background:#fff}#bossbar .bar i{background:#ff5a5a}
#bossbar.on{display:block}
#vign{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 55%,rgba(10,6,24,0) 30%,rgba(10,6,24,.55) 100%);opacity:0;transition:opacity .4s}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 90px 24px rgba(255,60,80,.55);opacity:0}
#warn{position:fixed;left:50%;top:46%;transform:translateX(-50%);font:400 30px 'Lilita One',sans-serif;color:#ffd23f;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);display:none;z-index:8;pointer-events:none;white-space:nowrap}
#warn.on{display:block}
#fade{position:fixed;inset:0;background:#1d1b3a;opacity:0;pointer-events:none;z-index:35;transition:opacity .28s}
#fade.on{opacity:1}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%) translateY(-160px);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 16px;border-radius:15px;z-index:40;transition:transform .25s cubic-bezier(.3,1.6,.5,1);max-width:88vw;text-align:center;font-size:15px;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
#rotate{position:fixed;inset:0;background:linear-gradient(#7fd0ff,#cfeec0);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px;font:400 28px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#rotate .ph{font-size:76px;animation:rot 1.6s ease-in-out infinite;-webkit-text-stroke:0}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.touch #rotate{display:flex}body.touch.playing #rotate{display:flex}}
@media (max-width:520px) and (orientation:portrait){#rotate{display:flex}}
#lvlpop{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:31;display:none;text-align:center;pointer-events:none}
#lvlpop.on{display:block;animation:lv 2.4s ease-out forwards}
#lvlpop b{font:400 50px 'Lilita One',sans-serif;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);display:block}
#lvlpop span{font:400 20px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
@keyframes lv{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
@media (max-height:420px){h1{font-size:34px!important;transform:none}.sub{margin:3px 0 3px;font-size:13px}.card{padding:8px 14px 8px;border-radius:20px}.btn{padding:3px 8px;margin-top:6px;font-size:17px}input[type=text]{padding:4px 12px;min-height:44px}.slots{margin:4px 0;gap:5px}.slot-c{min-height:50px;padding:4px 10px}.code{font-size:34px}label{margin:3px 0 2px}.join{margin-top:6px}.join input{padding:4px}h2{font-size:24px;margin-bottom:2px}.ptabs{margin:2px 0 4px}.grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}.cell{min-height:76px}.lr{padding:4px 8px;margin-bottom:5px}#tcard{width:min(780px,100%);display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}.tcol{min-width:0}}
@media (max-height:420px){#pcard h2{font-size:22px;margin:0 0 2px}#pcard .sub{margin:0 0 2px!important;font-size:12px}.card{max-height:calc(100vh - 6px)}#panel{padding-top:3px;padding-bottom:3px}.ptab{padding:2px 12px}.card>.btn,.card>.row2 .btn{margin-top:5px;min-height:44px}}
@media (min-width:760px){#tcard{width:min(780px,100%);display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}.tcol{min-width:0}}
@media (max-height:380px){.chip{min-height:30px;padding:1px 8px;font-size:14px}#quest{top:42px}#toast{top:56px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vign"></div><div id="hurt"></div>
<div id="tags"></div><div id="pops"></div>

<div id="hud">
  <div id="topL"><div class="chip" id="cCoin">💰 <b id="vCoin">0</b></div><div class="chip" id="cDepth">⬇ <b id="vDepth">0</b>m</div><div class="chip" id="cLvl">Lv <b id="vLvl">1</b><div class="xpbar"><i id="xpFill"></i></div></div></div>
  <div class="chip" id="topC"><div id="packRow">🎒 <div id="packBar"><i id="packFill"></i></div><span id="packTxt">0/20</span></div><div id="hearts"></div></div>
  <div class="chip" id="quest"></div>
  <div id="topR"><button class="rb" id="bMute" aria-label="sound">🔊</button><button class="rb" id="bBag" aria-label="backpack">🎒</button><button class="rb" id="bMenu" aria-label="menu">☰<span class="bdg" id="bdg">!</span></button></div>
  <div class="chip" id="roomChip"></div>
  <canvas id="mini" width="76" height="76"></canvas><canvas id="dmeter" width="14" height="140"></canvas>
  <div id="hot"></div>
  <button id="useBtn"></button>
  <button class="abtn" id="mineBtn"><span>⛏️</span><b>MINE</b></button>
  <button class="abtn" id="jumpBtn"><span>⤴</span></button>
  <button class="abtn" id="placeBtn"><span id="placeIco">🔦</span></button>
  <button class="abtn" id="cartBtn"><span>📦</span></button>
</div>
<div id="touch"><div id="joyBase" class="jbase"><div class="jknob"></div></div></div>
<div id="bossbar"><b id="bossName">Boss</b><div class="bar"><i id="bossFill"></i></div></div>
<div id="warn"></div>
<div id="lvlpop"><b>LEVEL UP!</b><span id="lvtxt"></span></div>

<div id="title" class="screen on">

function netCleanup(){try{if(NET.host)NET.host.close()}catch(e){}try{if(NET.peer&&!NET.peer.destroyed)NET.peer.destroy()}catch(e){}NET.peer=null;NET.host=null;NET.conns=[]}

function hostGame(tries=0){if(typeof Peer==='undefined'){toast('Online play is unavailable right now');return}if(NET.role==='client'){toast('Leave this mine first');return}if(NET.role==='host'&&!tries){toast('Already hosting: '+NET.code);return}
  netCleanup();clearPlayers();NET.role='host';NET.code=genCode();NET.nextId=2;NET.id=1;const gen=++NET.gen;toast('Opening your mine…');
  let pr;try{pr=NET.peer=new Peer(PREFIX+NET.code,{config:{iceServers:ICE}})}catch(e){toast('Network not available');NET.role=null;return}
  pr.on('open',()=>{if(gen!==NET.gen)return;netUI();toast('Mine open! Code '+NET.code);history.replaceState(null,'',location.pathname+location.search+'#'+NET.code)});
  pr.on('connection',c=>{if(gen!==NET.gen)return;c.on('data',m=>{if(gen===NET.gen)hostMsg(c,m)});c.on('close',()=>{if(gen===NET.gen)dropConn(c)});c.on('error',()=>{if(gen===NET.gen)dropConn(c)})});
  pr.on('error',e=>{if(gen!==NET.gen)return;if(e.type==='unavailable-id'&&tries<5)hostGame(tries+1);else if(!pr.open){toast('Could not open mine ('+e.type+')');netCleanup();NET.role=null;netUI()}else toast('Network hiccup: '+e.type)});
  pr.on('disconnected',()=>{if(gen===NET.gen&&!pr.destroyed){try{pr.reconnect()}catch(e){}}})}

function hostMsg(conn,m){if(!m||typeof m!=='object')return;
  if(m.t==='hello'){if(conn._id)return;if(NET.players.size>=3){send(conn,{t:'roomfull'});setTimeout(()=>conn.close(),300);return}
    const id=NET.nextId++;conn._id=id;NET.conns.push(conn);const p=addPlayer(id,String(m.name||'Friend').slice(0,10),clamp(m.ci|0,0,7),HATS[m.hat]?m.hat:'none',m.lvl|0);p.conn=conn;
    send(conn,{t:'welcome',id,code:NET.code,now:Date.now(),w:worldMsg(),host:SAVE.name});sendRoster();toast(p.name+' joined your mine!');SFX.coin();return}
  const id=conn._id;if(!id)return;const p=NET.players.get(id);if(!p)return;
  switch(m.t){
  case'pos':p.tx=fin(+m.x,p.tx);p.ty=fin(+m.y,p.ty);p.face=m.f>=0?1:-1;p.aim=fin(+m.a);p.mining=!!m.m;p.moving=!!m.mv;p.grounded=!!m.g;p.tier=m.tr|0;p.pet=String(m.pet||'');p.rail=!!m.rl;p.sw=fin(+m.sw,.42);if(!p.seen){p.seen=true;p.x=p.tx;p.y=p.ty}break;
  case'dig':{const idx=m.idx|0;if(idx>=0&&idx<W*H){hostDig(idx,clamp(+m.dmg||0,0,60),id);lastDigT=G.t}break}
  case'hitc':{const c=CRE.get(m.id);if(c)damageCre(c,clamp(+m.d||0,0,200),id,+m.kx||0,3);break}
  case'req':{const r=hostExec(m.k,m.a||{},id);send(conn,{t:'res',id:m.id,r});break}
  case'pay':WORLD.money+=clamp(m.n|0,0,5000);ecoDirty();break;
  case'prof':addPlayer(id,String(m.name||p.name).slice(0,10),clamp(m.ci|0,0,7),HATS[m.hat]?m.hat:'none',p.lvl);sendRoster();break}}
function dropConn(conn){NET.conns=NET.conns.filter(c=>c!==conn);const id=conn._id;if(!id)return;conn._id=0;const p=NET.players.get(id);if(!p)return;dropPlayer(p);toast(p.name+' left');sendRoster()}
function joinGame(code){code=String(code||'').toUpperCase().trim();if(!/^[A-Z]{4}$/.test(code)){toast('Enter the 4-letter code');return}if(typeof Peer==='undefined'){toast('Online play is unavailable right now');return}
  if(NET.role)netLeave(true);netCleanup();clearPlayers();NET.role='client';NET.code=code;NET.id=0;const gen=++NET.gen;toast('Connecting to '+code+'…');
  let pr;try{pr=NET.peer=new Peer(undefined,{config:{iceServers:ICE}})}catch(e){toast('Network not available');NET.role=null;return}
  let ok=false;const fail=msg=>{if(ok||gen!==NET.gen)return;toast(msg);netLeave(false)};const to=setTimeout(()=>fail('Could not connect. Check the code and try again'),15000);
  pr.on('open',()=>{if(gen!==NET.gen)return;const c=pr.connect(PREFIX+code,{reliable:true});NET.host=c;
    c.on('open',()=>{if(gen!==NET.gen)return;ok=true;clearTimeout(to);send(c,{t:'hello',name:SAVE.name,ci:SAVE.ci,hat:SAVE.hat,lvl:SAVE.lvl})});
    c.on('data',m=>{if(gen===NET.gen)onMsg(m)});
    c.on('close',()=>{if(gen===NET.gen&&NET.role==='client'){saveNow();toast('The host left. Your progress is saved — you are back in your own mine.',4500);netLeave(false)}})});
  pr.on('error',e=>{if(gen!==NET.gen)return;if(e.type==='peer-unavailable')fail('Mine '+code+' not found');else if(!ok)fail('Network error: '+e.type)})}

  case'welcome':{NET.id=m.id;const w=m.w;WORLD={seed:w.seed,edits:w.edits||{},money:w.money||0,store:w.store||{},bossDown:w.bossDown||{},pads:w.pads||[],site:w.site||null,epoch:Date.now()};CRE.clear();PRJ.length=0;TNT.length=0;dmgMap.clear();loadWorld(WORLD);
