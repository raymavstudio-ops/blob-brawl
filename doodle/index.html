<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c58a52">
<title>Doodle Guess</title>
<meta name="apple-mobile-web-app-title" content="Doodle Guess">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1b3a;--paper:#fffef7;--dim:#5d5a80;--rule:rgba(84,140,220,.22);--margin:rgba(255,105,120,.5);
  --yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a;--orange:#ffa23f;--red:#ff5d6c;--purple:#b388ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;color:var(--ink);background-color:#c58a52;
  background-image:radial-gradient(ellipse at 50% 40%,rgba(255,236,200,.28),rgba(60,25,0,.32) 85%),var(--grain,none),
  repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 158px,rgba(70,35,10,.35) 158px 160px,rgba(255,220,170,.18) 160px 161px,rgba(0,0,0,0) 161px 320px),
  linear-gradient(180deg,#cf9560,#c0814a)}
body *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{user-select:text!important;-webkit-user-select:text!important}
button{font-family:inherit;color:var(--ink);cursor:pointer}
/* ---------- desk props ---------- */
#desk{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#desk svg{position:absolute;filter:drop-shadow(0 6px 4px rgba(50,20,0,.35))}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
/* ---------- generic screens / paper cards ---------- */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:2;
  padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:flex}
.paper{position:relative;background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 34px,var(--margin) 34px,var(--margin) 36px,transparent 36px),linear-gradient(180deg,transparent 27px,var(--rule) 27px);
  background-size:100% 100%,100% 28px;border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink),0 22px 34px rgba(50,20,0,.35)}
.card{width:min(470px,100%);padding:26px 22px 18px 46px;margin:auto;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.card:before{content:'';position:absolute;left:28px;right:28px;top:-15px;height:30px;pointer-events:none;
  background:radial-gradient(ellipse 5px 13px at 50% 50%,#c9ccd9 0 3px,var(--ink) 3.5px 5.5px,transparent 6px) 0 0/30px 30px repeat-x}
.tape{position:absolute;width:86px;height:26px;background:rgba(255,210,63,.72);border-left:2px dashed rgba(0,0,0,.08);border-right:2px dashed rgba(0,0,0,.08);pointer-events:none}
.tape.a{right:-22px;top:20px;transform:rotate(38deg)}.tape.b{left:-24px;bottom:22px;transform:rotate(32deg);background:rgba(255,111,181,.6)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
.title{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(46px,11vw,64px);line-height:.9;text-align:center;letter-spacing:1px;color:var(--blue);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-3deg)}
.title span{color:var(--pink);display:inline-block;transform:rotate(4deg) translateY(2px)}
.squig{display:block;margin:4px auto 0;width:170px;height:16px}
.sub{text-align:center;color:var(--dim);margin:8px 0 10px;font-size:15px;line-height:1.3}
h2{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0 0 4px;font-size:36px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
label{display:block;font-size:13px;color:var(--dim);margin:8px 0 5px;letter-spacing:.6px;text-transform:uppercase}
input[type=text]{width:100%;font:600 18px 'Fredoka',sans-serif;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;outline:none;min-height:48px}
input[type=text]:focus{box-shadow:0 0 0 4px rgba(76,201,255,.45)}
.btn{display:block;width:100%;font:400 21px 'Lilita One',sans-serif;letter-spacing:.5px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:11px;margin-top:10px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-height:48px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.blue{background:var(--blue)}
.btn.ghost{background:#fff}.btn.green{background:var(--green)}
a.btn{text-align:center;text-decoration:none}.back{font-size:17px;background:#e9eeff}
.btn[disabled]{opacity:.45;pointer-events:none}
.join{display:flex;gap:10px;margin-top:10px}
.join input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Lilita One',sans-serif;font-size:23px;padding:7px}
.join .btn{width:auto;margin:0;padding:0 22px;flex:none}
.invite{background:#fff2b8;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:4px;text-align:center;font-size:15px;transform:rotate(-1deg)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:8px 0 0;height:78px}
.hero .av{width:70px;height:74px;animation:bob 1.6s ease-in-out infinite}
.hero .av:nth-child(2){width:84px;height:88px;animation-delay:-.5s}.hero .av:nth-child(3){animation-delay:-1s}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(.96,1.04)}}
.menuGrid{display:block}
/* ---------- lobby ---------- */
.code{font-family:'Lilita One',sans-serif;font-size:50px;letter-spacing:10px;text-align:center;color:var(--blue);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin:0;cursor:pointer;line-height:1.05}
.setrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.setrow .lbl{flex:1;font-size:15px}
.seg{display:flex;gap:6px}
.seg button{min-width:52px;height:48px;border:3px solid var(--ink);border-radius:14px;background:#fff;font:400 18px 'Lilita One',sans-serif;box-shadow:0 3px 0 var(--ink);padding:0 8px}
.seg button.sel{background:var(--yellow);transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.seg.ro button{pointer-events:none}.seg.ro button:not(.sel){opacity:.45}
.plist{margin:10px 0 2px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pl{display:flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-size:16px;min-width:0;height:48px}
.pl .av{width:40px;height:42px;flex:none}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{margin-left:auto;color:var(--dim);font-size:12px;flex:none}
.pl.empty{opacity:.5;border-style:dashed;background:rgba(255,255,255,.5)}
.pl.empty .av{opacity:.35;filter:grayscale(1)}
/* ---------- results ---------- */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:10px 0 6px}
.pod{display:flex;flex-direction:column;align-items:center;width:31%;max-width:130px;min-width:0}
.pod .av{width:76px;height:80px;margin-bottom:-6px;position:relative;z-index:1}
.pod.p1 .av{width:96px;height:100px;animation:bob 1.1s ease-in-out infinite}
.pod .nm{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.pod .blk{width:100%;border:3px solid var(--ink);border-radius:12px 12px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;
  font:400 30px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.pod .blk small{font:700 15px 'Fredoka',sans-serif;-webkit-text-stroke:0;color:var(--ink);background:#fff;border-radius:8px;padding:0 6px;border:2px solid var(--ink)}
.p1 .blk{height:104px;background:var(--yellow)}.p2 .blk{height:76px;background:#cfd6ea}.p3 .blk{height:56px;background:#f0a868}
.medal{font-size:26px;line-height:1;margin-bottom:2px}
.rest{display:grid;gap:5px;margin:6px 0}
.rk{display:flex;align-items:center;gap:8px;padding:2px 12px 2px 4px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-size:16px}
.rk .av{width:36px;height:38px}.rk b{margin-left:auto;font:400 20px 'Lilita One',sans-serif}
.awards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 2px}
.aw{background:#fff2b8;border:2.5px solid var(--ink);border-radius:12px;padding:3px 9px;font-size:13px;transform:rotate(-1.5deg)}
.aw:nth-child(2){background:#d9f2ff;transform:rotate(1deg)}.aw:nth-child(3){background:#ffe0ef}
/* ---------- game app ---------- */
#app{position:fixed;left:0;top:0;width:100%;height:100%;display:none;flex-direction:column;gap:6px;z-index:2;
  padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#app.on{display:flex}
#top{flex:none;display:flex;align-items:center;gap:7px;height:54px;padding-right:58px}
.tbtn{flex:none;width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font:400 20px 'Lilita One',sans-serif;padding:0;display:grid;place-items:center}
.tbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tbtn.arm{background:var(--red);color:#fff}
#roundPill{flex:none;font:400 17px 'Lilita One',sans-serif;background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:0 10px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 4px 0 var(--ink);transform:rotate(-2deg)}
#roundPill small{font:700 12px 'Fredoka',sans-serif}
#hint{flex:1;min-width:0;height:48px;background:#fff;border:3px solid var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden;padding:0 10px;box-shadow:0 4px 0 var(--ink)}
#hint .lab{flex:none;font:400 14px 'Lilita One',sans-serif;color:#fff;background:var(--pink);border:2px solid var(--ink);border-radius:9px;padding:2px 7px;-webkit-text-stroke:.6px var(--ink)}
#hint .lab.ok{background:var(--green);color:var(--ink);-webkit-text-stroke:0}
#hint .msg{font:400 19px 'Lilita One',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tiles{display:flex;align-items:flex-end;gap:calc(var(--fs,22px)*.16);min-width:0}
#tiles i{font-style:normal;display:block;width:calc(var(--fs,22px)*.82);text-align:center;font:400 var(--fs,22px)/1 'Lilita One',sans-serif;border-bottom:3px solid var(--ink);height:calc(var(--fs,22px)*1.12);color:var(--ink)}
#tiles i.r{color:#e03b8a}#tiles i.sp{border:0;width:calc(var(--fs,22px)*.45)}
#hint .cnt{flex:none;font-size:12px;color:var(--dim)}
#timer{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);
  background:conic-gradient(var(--tc,#4cc9ff) calc(var(--p,1)*360deg),#eceaf6 0)}
#timer span{width:36px;height:36px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;font:400 18px 'Lilita One',sans-serif}
#timer.hurry{--tc:#ff5d6c;animation:shakeT .5s infinite}
@keyframes shakeT{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#main{flex:1;min-height:0;display:flex;gap:8px;position:relative}
#stage{position:relative;flex:1 1 auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#paper{position:relative;width:400px;height:300px;flex:none;border-radius:14px;border:4px solid var(--ink);background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 7%,var(--margin) 7%,var(--margin) calc(7% + 2px),transparent calc(7% + 2px)),linear-gradient(180deg,transparent calc(100% - 1.5px),var(--rule) calc(100% - 1.5px));
  background-size:100% 100%,100% 6.25%;box-shadow:0 7px 0 var(--ink),0 16px 26px rgba(50,20,0,.35)}
#paper canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:10px;touch-action:none;display:block}
body.artist #paper canvas{cursor:crosshair}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:10px;background:rgba(255,254,247,.9);z-index:3;text-align:center;padding:8px;overflow:auto}
.ov.on{display:flex}
.ov h3{font:400 clamp(20px,4.2vmin,30px) 'Lilita One',sans-serif;margin:0;color:var(--yellow);-webkit-text-stroke:1.6px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.ov .av{width:76px;height:80px;animation:bob 1.3s ease-in-out infinite}
.ov p{margin:0;color:var(--dim);font-size:15px}
.words{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.wbtn{flex:1 1 120px;max-width:200px;min-height:48px;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 5px 0 var(--ink);padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px}
.wbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.wbtn b{font:400 20px 'Lilita One',sans-serif;line-height:1.05}
.wbtn small{font-size:12px;border:2px solid var(--ink);border-radius:8px;padding:0 6px;background:var(--green)}
.wbtn.m small{background:var(--yellow)}.wbtn.h small{background:var(--pink);color:#fff}
.bigword{font:400 clamp(26px,6vmin,46px) 'Lilita One',sans-serif;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);line-height:1.05;transform:rotate(-2deg)}
.gains{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:460px}
.gn{display:flex;align-items:center;gap:4px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:1px 9px 1px 2px;font-size:14px}
.gn .av{width:28px;height:30px;animation:none}.gn b{color:#1f9e4a}.gn.z b{color:var(--dim)}
#banner{position:absolute;left:50%;top:24%;z-index:6;pointer-events:none;font:400 clamp(34px,9vmin,64px) 'Lilita One',sans-serif;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);white-space:nowrap;
  transform:translate(-50%,-50%) rotate(-4deg);display:none}
#banner.on{display:block;animation:ban 1.7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.3) rotate(-14deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08) rotate(-4deg);opacity:1}80%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}100%{transform:translate(-50%,-80%) scale(.9) rotate(-4deg);opacity:0}}
.bigpop{position:absolute;left:50%;top:44%;z-index:7;pointer-events:none;font:400 clamp(40px,10vmin,72px) 'Lilita One',sans-serif;color:var(--green);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);animation:bigp 1.3s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bigp{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{transform:translate(-50%,-70%) scale(1);opacity:1}100%{transform:translate(-50%,-110%) scale(.9);opacity:0}}
.cpop{position:fixed;z-index:41;pointer-events:none;font:400 22px 'Lilita One',sans-serif;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);animation:cpop 1.2s ease-out both}
@keyframes cpop{0%{transform:translate(-50%,0) scale(.4);opacity:0}20%{transform:translate(-50%,-14px) scale(1.2);opacity:1}100%{transform:translate(-50%,-56px) scale(1);opacity:0}}
/* tools */
#tools{display:none;flex:none;gap:6px;align-content:start;justify-content:center}
body.artist #tools{display:grid}
.tool{width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:0;display:grid;place-items:center;position:relative}
.tool svg{width:30px;height:30px}
.tool.sel{background:var(--yellow);transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#tColor .sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;background:conic-gradient(#ff4d5e,#ffd23f,#5ccf4a,#4cc9ff,#a76cf0,#ff4d5e)}
#tColor .sw i{display:block;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
#tDone{display:none;background:var(--green);font:400 13px 'Lilita One',sans-serif}
body.solo #tDone{display:grid}
#pop{position:absolute;z-index:9;display:none;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px;gap:6px;grid-template-columns:repeat(4,48px);box-shadow:0 6px 0 var(--ink),0 14px 22px rgba(0,0,0,.25)}
#pop.on{display:grid}
#pop button{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);padding:0;display:grid;place-items:center;background:#fff}
#pop button.sel{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
#pop button.sz{border-radius:14px}#pop button.sz i{display:block;border-radius:50%;background:var(--ink)}
#pop button.sz.sel{background:var(--yellow);box-shadow:none}
/* side: players + chat */
#side{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
#chips{display:flex;flex-direction:column;gap:5px;overflow:auto;flex:none;max-height:42%;padding:7px 2px 3px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:5px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:1px 8px 1px 2px;min-width:0;flex:none;position:relative;box-shadow:0 2px 0 var(--ink)}
.chip .av{width:32px;height:34px;flex:none}
.chip .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.chip .sc{font:400 16px 'Lilita One',sans-serif;flex:none}
.chip .bd{position:absolute;left:22px;top:-6px;font-size:13px;line-height:1}
.chip.me{border-color:var(--ink);background:#eef8ff}
.chip.ok{background:#d6f7c9}.chip.art{background:#fff2b8}
#chat{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 6px;border-radius:14px;border:3px solid var(--ink);background-color:var(--paper);box-shadow:0 5px 0 rgba(29,27,58,.35);
  background-image:linear-gradient(180deg,transparent 23px,rgba(84,140,220,.16) 23px);background-size:100% 24px;display:flex;flex-direction:column;gap:6px}
.note{align-self:flex-start;max-width:100%;padding:4px 10px 6px;border-radius:2px 10px 2px 2px;font-size:14px;line-height:1.25;overflow-wrap:anywhere;box-shadow:0 3px 0 rgba(29,27,58,.18),1px 1px 0 rgba(29,27,58,.25);position:relative;
  background:linear-gradient(225deg,rgba(0,0,0,.1) 7px,transparent 7px),var(--nc,#fff6a8);transform:rotate(-.8deg)}
.note:nth-child(even){transform:rotate(.7deg)}
.note .who{display:block;font-size:12px;color:rgba(29,27,58,.68)}
.note.sec{opacity:.8;border:2px dashed rgba(29,27,58,.45)}
.sys{align-self:center;text-align:center;font-size:13px;padding:3px 10px;border-radius:12px;background:#fff;border:2px solid var(--ink);max-width:100%}
.sys.ok{background:var(--green)}.sys.close{background:#ffd9a8;border-style:dashed}.sys.dim{background:#eceaf6;border-color:#9b98b3;color:var(--dim)}
.sys.tip{background:#fff2b8;transform:rotate(-1deg);font-size:14px;padding:8px 12px}
#gform{flex:none;display:flex;gap:6px}
#gform input{flex:1;min-width:0;font-size:16px;padding:8px 12px;border-radius:14px}
#gform input:disabled{background:#eceaf6;color:var(--dim)}
#gsend{flex:none;width:48px;height:48px;border-radius:14px;border:3px solid var(--ink);background:var(--pink);box-shadow:0 4px 0 var(--ink);padding:0;display:grid;place-items:center}
#gsend svg{width:24px;height:24px}
#gsend:disabled{filter:grayscale(1);opacity:.6}
body.solo #gform{display:none}
/* landscape */
body.land #side{width:clamp(170px,29vw,330px);flex:none}
body.land.artist #side{width:clamp(150px,23vw,300px)}
body.land #tools{grid-template-columns:48px;grid-auto-rows:48px}
body.land #tools.two{grid-template-columns:48px 48px}
/* portrait */
body.port #main{flex-direction:column;gap:6px}
body.port #stage{flex:none}
body.port #tools{order:2;grid-auto-flow:column;grid-auto-columns:48px;justify-content:center}
body.port #side{order:3;flex:1}
body.port #chips{flex-direction:row;max-height:none;overflow-x:auto;overflow-y:hidden;padding-top:6px}
body.port .chip{flex-direction:column;gap:0;padding:1px 4px 2px;width:68px}
body.port .chip .nm{font-size:12px;max-width:100%;text-align:center;flex:none}
body.port .chip .sc{font-size:14px}
body.port .chip .bd{left:auto;right:3px;top:-6px}
body.port #top{flex-wrap:wrap;height:auto;row-gap:6px}
body.port #hint{order:5;flex:1 0 calc(100% + 58px);margin-right:-58px;height:44px}
body.port #roundPill{margin-right:auto}
body.port.short #hint{height:40px}
body.short #chips{display:none}
body.land.short #top{height:48px}
body.short #roundPill{height:40px;font-size:14px}
#mute{position:fixed;top:max(9px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:20px;z-index:20;padding:0}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120px);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:9px 18px;border-radius:16px;z-index:50;transition:transform .25s cubic-bezier(.3,1.6,.5,1);max-width:86vw;text-align:center;font-size:15px}
#toast.on{transform:translateX(-50%) translateY(0)}
/* ---------- compact phone layouts ---------- */
@media (max-height:520px) and (orientation:landscape) and (min-width:560px){
  .card{padding:16px 16px 12px 42px}

  #lobby .card{width:min(780px,100%);display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
  #results .card{width:min(760px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:center}
  .title{font-size:44px}.sub{margin:4px 0 4px;font-size:14px}

  .code{font-size:40px}h2{font-size:30px}
}
@media (max-height:420px){

      <button id="btnSolo" class="btn blue">✏️ PRACTICE SOLO</button>

  </div>
</div>

<!-- ============ LOBBY ============ -->
<div id="lobby" class="screen">
  <div class="card paper"><div class="tape a"></div>

      <div class="sub" style="margin:0">Room code</div>

</div>

<div id="app">

// soft lo-fi procedural loop: pad + pluck melody + brush kick/hat, only while a turn is running
const MUSIC=(()=>{
  let step=0,next=0,noise=null;const BPM=96,SP=60/BPM/2;
  const CH=[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,65]];
  const MEL=[0,2,1,3,2,-1,1,0, 3,2,1,-1,2,1,0,-1];
  const hz=n=>440*Math.pow(2,(n-69)/12);
  function out(){return ac.destination}
  function note(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out());o.start(t);o.stop(t+d+.05)}
  function hat(t,v){if(!noise){noise=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;f.type='highpass';f.frequency.value=6000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);s.connect(f);f.connect(g);g.connect(out());s.start(t)}
  function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(out());o.start(t);o.stop(t+.22)}
  setInterval(()=>{
    if(!ac||ac.state!=='running'||muted||!(V.ph==='draw'||V.ph==='choose')||screen!=='game'){next=0;return}
    if(next<ac.currentTime)next=ac.currentTime+.05;
    while(next<ac.currentTime+.25){
      const bar=Math.floor(step/8)%4,s=step%8,ch=CH[bar];
      if(s===0){ch.forEach(n=>note(hz(n-12),next,SP*7,'sine',.018));note(hz(ch[0]-24),next,SP*3,'triangle',.07)}
      if(s===4)note(hz(ch[0]-24),next,SP*3,'triangle',.06);
      if(s%4===0)kick(next);
      if(s%2===1)hat(next,.025);
      const m=MEL[(step%16)];if(m>=0)note(hz(ch[m]+12),next,SP*1.4,'triangle',.03);
      next+=SP;step++}
  },80);
})();

const cv=$('board'),bctx=cv.getContext('2d',{willReadFrequently:true});
const board={
  ops:[],live:null,
  reset(){this.ops=[];this.live=null;bctx.globalCompositeOperation='source-over';bctx.clearRect(0,0,CW,CH)},
  style(c,w){const x=bctx;x.globalCompositeOperation=c<0?'destination-out':'source-over';x.strokeStyle=x.fillStyle=c<0?'#000':PAL[c];x.lineWidth=c<0?ERASE[w]:SIZES[w];x.lineCap='round';x.lineJoin='round'},
  dot(op){const p=op.p;bctx.beginPath();bctx.arc(p[0],p[1],bctx.lineWidth/2,0,Math.PI*2);bctx.fill()},
  quad(op,i){const p=op.p,x=bctx;
    const sx=i===1?p[0]:(p[2*i-2]+p[2*i])/2,sy=i===1?p[1]:(p[2*i-1]+p[2*i+1])/2;
    const ex=(p[2*i]+p[2*i+2])/2,ey=(p[2*i+1]+p[2*i+3])/2;
    x.beginPath();x.moveTo(sx,sy);x.quadraticCurveTo(p[2*i],p[2*i+1],ex,ey);x.stroke()},
  tail(op){const p=op.p,n=p.length/2;if(n<2)return;
    const sx=n>=3?(p[2*n-4]+p[2*n-2])/2:p[0],sy=n>=3?(p[2*n-3]+p[2*n-1])/2:p[1];
    bctx.beginPath();bctx.moveTo(sx,sy);bctx.lineTo(p[2*n-2],p[2*n-1]);bctx.stroke()},
  drawFull(op){this.style(op.c,op.w);this.dot(op);const n=op.p.length/2;for(let i=1;i<=n-2;i++)this.quad(op,i);this.tail(op)},
  begin(id,c,w,x,y){if(this.live)this.end(this.live.id);const op={k:'s',id,c,w,p:[x,y],q:0};this.live=op;this.style(c,w);this.dot(op)},
  add(id,pts){const op=this.live;if(!op||op.id!==id)return;for(let i=0;i+1<pts.length;i+=2)op.p.push(pts[i],pts[i+1]);
    this.style(op.c,op.w);const n=op.p.length/2;while(op.q+1<=n-2){op.q++;this.quad(op,op.q)}},
  end(id){const op=this.live;if(!op||op.id!==id)return;this.style(op.c,op.w);this.tail(op);this.live=null;delete op.q;this.ops.push(op)},
  endLive(){if(this.live)this.end(this.live.id)},
  fill(x,y,c){this.endLive();const op={k:'f',x,y,c};this.ops.push(op);this.applyFill(op)},
  applyFill(op){flood(op.x,op.y,PAL[op.c]);op.snap=bctx.getImageData(0,0,CW,CH);
    const snaps=this.ops.filter(o=>o.snap);if(snaps.length>6)delete snaps[0].snap},
  clear(){this.endLive();this.ops.push({k:'c'});bctx.globalCompositeOperation='source-over';bctx.clearRect(0,0,CW,CH)},
  undo(){this.endLive();if(!this.ops.length)return;this.ops.pop();this.redraw()},
  redraw(){
    let s=0;for(let i=this.ops.length-1;i>=0;i--)if(this.ops[i].k==='c'){s=i+1;break}
    let j=-1;for(let i=this.ops.length-1;i>=s;i--)if(this.ops[i].snap){j=i;break}

    if(j>=0)bctx.putImageData(this.ops[j].snap,0,0);else bctx.clearRect(0,0,CW,CH);

  serialize(){return{ops:this.ops.map(o=>o.k==='s'?{k:'s',c:o.c,w:o.w,p:o.p}:o.k==='f'?{k:'f',x:o.x,y:o.y,c:o.c}:{k:'c'}),live:this.live?{id:this.live.id,c:this.live.c,w:this.live.w,p:this.live.p.slice()}:null}},

// scanline flood fill; compares colours composited over white, then grows the fill 1px to swallow anti-aliased edges
function flood(x,y,hex){
  x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=CW||y>=CH)return;
  const img=bctx.getImageData(0,0,CW,CH),d=img.data,N=CW*CH;
  const n=parseInt(hex.slice(1),16),fr=n>>16,fg=n>>8&255,fb=n&255;
  const comp=i=>{const a=d[i+3]/255;return[d[i]*a+255*(1-a),d[i+1]*a+255*(1-a),d[i+2]*a+255*(1-a)]};
  const [tr,tg,tb]=comp((y*CW+x)*4);
  if(Math.abs(tr-fr)+Math.abs(tg-fg)+Math.abs(tb-fb)<6&&d[(y*CW+x)*4+3]>250)return;
  const mask=new Uint8Array(N),TOL=100;
  const match=p=>{if(mask[p])return false;const i=p*4,a=d[i+3]/255,ia=255*(1-a);
    return Math.abs(d[i]*a+ia-tr)+Math.abs(d[i+1]*a+ia-tg)+Math.abs(d[i+2]*a+ia-tb)<=TOL};
  const st=[x,y];
  while(st.length){
    const cy=st.pop(),cx=st.pop(),row=cy*CW;
    if(!match(row+cx))continue;
    let l=cx,r=cx;while(l>0&&match(row+l-1))l--;while(r<CW-1&&match(row+r+1))r++;
    for(let i=l;i<=r;i++)mask[row+i]=1;
    for(const ny of [cy-1,cy+1]){if(ny<0||ny>=CH)continue;const nr=ny*CW;let span=false;
      for(let i=l;i<=r;i++){const ok=match(nr+i);if(ok&&!span){st.push(i,ny);span=true}else if(!ok)span=false}}
  }
  const paint=p=>{const i=p*4;d[i]=fr;d[i+1]=fg;d[i+2]=fb;d[i+3]=255};
  for(let p=0;p<N;p++){if(mask[p]===1){paint(p);const px=p%CW;
    if(px>0&&!mask[p-1]){mask[p-1]=2;paint(p-1)}if(px<CW-1&&!mask[p+1]){mask[p+1]=2;paint(p+1)}
    if(p>=CW&&!mask[p-CW]){mask[p-CW]=2;paint(p-CW)}if(p<N-CW&&!mask[p+CW]){mask[p+CW]=2;paint(p+CW)}}}
  bctx.putImageData(img,0,0);
}
// apply a network draw message (host and clients run the exact same replay)
function applyDraw(m){
  if(m.a==='p'){if(!m.p||m.p.length<2)return;let pts=m.p;
    if(!board.live||board.live.id!==m.id){board.begin(m.id,m.c,m.w,pts[0],pts[1]);pts=pts.slice(2)}
    board.add(m.id,pts)}
  else if(m.a==='e')board.end(m.id);
  else if(m.a==='f')board.fill(m.x,m.y,m.c);
  else if(m.a==='u')board.undo();
  else if(m.a==='c')board.clear();
}

function send(conn,m){try{if(conn&&conn.open)conn.send(m)}catch(e){}}
// deliver to everyone (incl. this host) / to selected player ids
function deliver(m){for(const c of conns)send(c,m);onMsg(m)}

function hostGame(tries=0){
  audio();cleanupNet();S.role='host';S.code=genCode();S.players=[];G=null;const gen=++S.gen;
  toast('Creating room…');
  try{peer=new Peer(PREFIX+S.code,{config:{iceServers:ICE}})}catch(e){toast('Network not available');S.role=null;return}
  const pr=peer;
  pr.on('open',()=>{if(gen!==S.gen)return;const p=mkP(S.nextId++,getName(),0);S.me=p.id;S.players=[p];S.chatLog=[];toLobby()});
  pr.on('connection',c=>{if(gen===S.gen)onConn(c,gen)});
  pr.on('error',e=>{if(gen!==S.gen)return;
    if(e.type==='unavailable-id'&&tries<5)hostGame(tries+1);
    else if(screen==='menu'){toast('Could not create room ('+e.type+')');cleanupNet();S.role=null}
    else toast('Network hiccup: '+e.type)});
  pr.on('disconnected',()=>{if(gen===S.gen&&!pr.destroyed){try{pr.reconnect()}catch(e){}}});
}
function onConn(conn,gen){
  conn.on('data',m=>{if(gen===S.gen&&S.role==='host')hostMsg(conn,m)});
  conn.on('close',()=>{if(gen===S.gen)dropConn(conn)});
  conn.on('error',()=>{if(gen===S.gen)dropConn(conn)});
}
function freeCi(){const u=S.players.map(p=>p.ci);let c=0;while(u.includes(c))c++;return c}
function hostMsg(conn,m){
  if(!m||typeof m!=='object')return;
  const p=conn._p;
  if(m.t==='join'){
    if(p)return;
    if(S.players.length>=MAXP){send(conn,{t:'full',why:'Room is full'});setTimeout(()=>conn.close(),300);return}
    const np=mkP(S.nextId++,String(m.name||'Doodler').slice(0,10),freeCi(),conn);
    conn._p=np;conns.push(conn);S.players.push(np);
    send(conn,{t:'welcome',id:np.id});
    if(G){send(conn,stateFor(np.id));send(conn,{t:'board',d:board.serialize()});send(conn,{t:'hist',log:S.chatLog.slice(-20)});
      sysChat(`👋 ${np.name} joined the game!`,'dim');pushState()}
    else sendLobby();
    toast(np.name+' joined!');SFX.join();
  }else if(!p)return;
  else if(m.t==='g')hostGuess(p.id,m.text);
  else if(m.t==='pick'){if(G&&G.ph==='choose'&&G.artist===p.id)pickWord(m.i|0)}
  else if(m.t==='d'){
    if(!G||G.ph!=='draw'||G.artist!==p.id)return;
    applyDraw(m);for(const c of conns)if(c!==conn)send(c,m);
  }
}
function dropConn(conn){
  const p=conn._p;conns=conns.filter(c=>c!==conn);if(!p)return;conn._p=null;
  S.players=S.players.filter(q=>q!==p);
  toast(p.name+' left');
  if(!G){sendLobby();return}
  sysChat(`🚪 ${p.name} left`,'dim');
  if(G.ph!=='end'){
    if(S.players.length<2){endGame();return}
    if(G.artist===p.id&&(G.ph==='choose'||G.ph==='draw')){endTurn('left');return}
    if(G.ph==='draw'&&allGuessed())G.tl=Math.min(G.tl,1);
  }
  pushState();
}
function joinGame(code){
  audio();code=(code||'').toUpperCase().trim();if(!/^[A-Z]{4}$/.test(code)){toast('Enter the 4-letter code');return}
  cleanupNet();S.role='client';S.code=code;S.players=[];G=null;toast('Connecting…');const gen=++S.gen;
  try{peer=new Peer(undefined,{config:{iceServers:ICE}})}catch(e){toast('Network not available');S.role=null;return}
  const pr=peer,name=getName();let ok=false;
  const fail=msg=>{if(ok||gen!==S.gen)return;toast(msg);leave()};
  const to=setTimeout(()=>fail('Could not connect. Check the code and try again'),15000);
  pr.on('open',()=>{if(gen!==S.gen)return;
    const c=pr.connect(PREFIX+code,{reliable:true});hostConn=c;
    c.on('open',()=>{if(gen!==S.gen)return;ok=true;clearTimeout(to);send(c,{t:'join',name})});
    c.on('data',m=>{if(gen===S.gen)onMsg(m)});
    c.on('close',()=>{if(gen===S.gen&&S.role==='client'){toast('The host left the game');leave()}});
  });
  pr.on('error',e=>{if(gen!==S.gen)return;if(e.type==='peer-unavailable')fail('Room '+code+' not found');else if(!ok)fail('Network error: '+e.type)});
  pr.on('disconnected',()=>{if(gen===S.gen&&!pr.destroyed){try{pr.reconnect()}catch(e){}}});
}
function cleanupNet(){
  try{if(hostConn)hostConn.close()}catch(e){}try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}
  peer=null;hostConn=null;conns=[];
}
function leave(){
  S.gen++;S.role=null;cleanupNet();S.players=[];S.me=-1;G=null;out=null;drawPid=null;
  V={ph:'menu',turn:-1,players:[]};board.reset();$('chat').innerHTML='';setScreen('menu');
}

/* ---------- messages (clients, and the host's own copy) ---------- */
function onMsg(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'welcome':S.me=m.id;$('chat').innerHTML='';break;
    case 'full':toast(m.why);leave();break;
    case 'lobby':if(!isHost()){S.code=m.code;S.rounds=m.rounds;S.drawTime=m.time;S.players=m.players.map(a=>({id:a[0],name:a[1],ci:a[2]}))}
      V={ph:'lobby',turn:-1,players:[]};setScreen('lobby');renderLobby();break;
    case 'st':applyState(m);break;
    case 'board':board.load(m.d);break;
    case 'd':if(!isHost())applyDraw(m);break;
    case 'chat':addChat(m);break;
    case 'hist':for(const c of m.log)addChat(c,true);break;
    case 'ev':onEvent(m);break;
  }
}

/* ===================== host game logic ===================== */
function toLobby(){G=null;for(const p of S.players){p.score=p.artPts=p.guessPts=p.firsts=0}sendLobby()}
function sendLobby(){
  const m={t:'lobby',code:S.code,rounds:S.rounds,time:S.drawTime,players:S.players.map(p=>[p.id,p.name,p.ci])};
  for(const c of conns)send(c,m);onMsg(m);
}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const dp=[];for(let i=0;i<=a.length;i++){dp[i]=[i];for(let j=1;j<=b.length;j++)dp[i][j]=i?Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return dp[a.length][b.length]}
function pickChoices(){
  const out=[];for(const d of ['e','m','h']){const pool=WORDS[d].filter(w=>!G.used.has(w));const list=pool.length?pool:WORDS[d];
    const w=list[Math.random()*list.length|0];G.used.add(w);out.push({w,d})}
  return out;
}
function startGame(){
  if(!isHost())return;audio();
  if(S.role==='host'&&S.players.length<2){toast('Need at least 2 players');return}
  for(const p of S.players){p.score=p.artPts=p.guessPts=p.firsts=0}
  G={ph:'',round:1,rounds:S.role==='solo'?1:S.rounds,drawT:S.drawTime,order:S.players.map(p=>p.id),turnIdx:-1,artist:-1,word:'',diff:'e',
     choices:[],tl:0,T:1,revealed:new Set(),maxRev:0,guessed:new Map(),gains:{},turn:0,used:new Set(),sync:0,reason:''};
  S.chatLog=[];deliver({t:'chat',k:'clear'});
  nextTurn();wake();
}
function nextTurn(){
  G.turnIdx++;
  if(S.role==='solo'){G.order=[S.me];G.turnIdx=0}
  else{
    if(S.players.length<2){endGame();return}
    for(let guard=0;guard<64;guard++){
      if(G.turnIdx>=G.order.length){G.round++;if(G.round>G.rounds){endGame();return}G.order=S.players.map(p=>p.id);G.turnIdx=0}
      if(pById(G.order[G.turnIdx]))break;G.turnIdx++;
    }
  }
  G.artist=G.order[G.turnIdx];G.choices=pickChoices();G.ph='choose';G.tl=G.T=15;G.turn++;G.word='';G.revealed=new Set();
  G.guessed=new Map();G.gains={};G.reason='';
  pushState();
}
function pickWord(i){
  if(!G||G.ph!=='choose')return;const ch=G.choices[Math.max(0,Math.min(2,i))];
  G.word=ch.w;G.diff=ch.d;G.ph='draw';G.tl=G.T=G.drawT;
  const letters=G.word.replace(/ /g,'').length;G.maxRev=Math.min(3,Math.max(1,Math.floor(letters*.4)));
  const a=pById(G.artist);
  if(S.role!=='solo')sysChat(`✏️ ${a?a.name:'Someone'} is drawing!`,'');
  pushState();
}
function hintMask(){return G.word.split('').map((ch,i)=>ch===' '?' ':G.revealed.has(i)?ch:'_').join('')}
function hintCheck(){
  if(S.role==='solo')return;
  const frac=G.tl/G.T,th=[.55,.35,.18];let want=0;for(let i=0;i<G.maxRev;i++)if(frac<th[i])want++;
  let changed=false;
  while(G.revealed.size<want){const hidden=[];for(let i=0;i<G.word.length;i++)if(G.word[i]!==' '&&!G.revealed.has(i))hidden.push(i);
    if(hidden.length<=1)break;G.revealed.add(hidden[Math.random()*hidden.length|0]);changed=true}
  if(changed){pushState();deliver({t:'ev',k:'hint'})}
}
function allGuessed(){return S.players.filter(p=>p.id!==G.artist).every(p=>G.guessed.has(p.id))}
function endTurn(reason){
  if(!G)return;G.ph='reveal';G.reason=reason;G.tl=G.T=S.role==='solo'?9999:6;
  pushState();
}
function endGame(){if(!G)return;G.ph='end';G.tl=0;pushState()}
function hostTick(dt){
  if(!G)return;
  const timed=G.ph==='choose'||G.ph==='draw'||(G.ph==='reveal'&&S.role!=='solo');
  if(!timed)return;
  G.tl-=dt;G.sync-=dt;
  if(G.ph==='draw')hintCheck();
  if(G.tl<=0){
    if(G.ph==='choose')pickWord(Math.random()*3|0);
    else if(G.ph==='draw')endTurn(G.guessed.size&&allGuessed()?'all':'time');
    else if(G.ph==='reveal')nextTurn();
  }else if(G.sync<=0){G.sync=1;pushState()}
}
function stateFor(pid){
  const showWord=G.ph==='reveal'||G.ph==='end'||pid===G.artist||G.guessed.has(pid);
  return{t:'st',ph:G.ph,round:G.round,rounds:G.rounds,artist:G.artist,tl:Math.max(0,G.tl),T:G.T,turn:G.turn,diff:G.diff,
    hint:G.word?hintMask():'',word:showWord?G.word:'',choices:G.ph==='choose'&&pid===G.artist?G.choices:null,reason:G.reason,
    solo:S.role==='solo',firstTurn:G.turnIdx===0,
    players:S.players.map(p=>[p.id,p.name,p.ci,p.score,G.guessed.has(p.id)?1:0,G.gains[p.id]||0,p.artPts,p.guessPts,p.firsts])};
}
function pushState(){if(!G)return;G.sync=1;for(const c of conns)if(c._p)send(c,stateFor(c._p.id));applyState(stateFor(S.me))}
function chatMsg(p,text,k){return{t:'chat',k,id:p?p.id:0,name:p?p.name:'',ci:p?p.ci:0,text}}
function sysChat(text,k){const m={t:'chat',k:'sys',sub:k||'',text};S.chatLog.push(m);if(S.chatLog.length>40)S.chatLog.shift();deliver(m)}
function hostGuess(pid,text){
  const p=pById(pid);if(!p)return;text=String(text||'').trim().slice(0,60);if(!text)return;
  const now=performance.now();if(now-p.lastMsg<350)return;p.lastMsg=now;
  if(G&&G.ph==='draw'){
    const insider=pid===G.artist||G.guessed.has(pid);
    if(insider){deliverTo([G.artist,...G.guessed.keys()],chatMsg(p,text,'sec'));return}
    const g=norm(text),w=norm(G.word),gs=g.replace(/ /g,''),ws=w.replace(/ /g,'');
    if(gs===ws||gs===ws+'s'||gs+'s'===ws||gs===ws+'es'||(' '+g+' ').includes(' '+w+' ')){correct(p);return}
    const d=lev(gs,ws);
    const m=chatMsg(p,text,'g');S.chatLog.push(m);if(S.chatLog.length>40)S.chatLog.shift();deliver(m);
    if(gs.length>=3&&d<=(ws.length>=5?2:1))deliverTo([pid],{t:'chat',k:'close',text});
    return;
  }
  const m=chatMsg(p,text,'g');S.chatLog.push(m);if(S.chatLog.length>40)S.chatLog.shift();deliver(m);
}
function correct(p){
  const frac=Math.max(0,G.tl/G.T),mul=DIFF[G.diff].mul,order=G.guessed.size;
  const pts=Math.round((60+190*frac)*mul/5)*5+(order===0?40:order===1?20:0);
  p.score+=pts;p.guessPts+=pts;if(order===0)p.firsts++;
  G.guessed.set(p.id,pts);G.gains[p.id]=pts;
  const a=pById(G.artist);let apts=0;
  if(a){apts=Math.round((25+40*frac)*mul/5)*5;a.score+=apts;a.artPts+=apts;G.gains[a.id]=(G.gains[a.id]||0)+apts}
  sysChat(`🎉 ${p.name} guessed the word! +${pts}`,'ok');
  deliver({t:'ev',k:'ok',id:p.id,pts,aid:a?a.id:0,apts});
  if(allGuessed())G.tl=Math.min(G.tl,1.2);
  pushState();
}

/* ===================== client view ===================== */
function applyState(m){
  const prev=V;
  if(m.turn!==prev.turn){board.reset();out=null;drawPid=null;closePop()}
  V=Object.assign({},m);
  V.players=m.players.map(a=>({id:a[0],name:a[1],ci:a[2],score:a[3],guessed:!!a[4],gain:a[5],artPts:a[6],guessPts:a[7],firsts:a[8]}));
  const changed=m.ph!==prev.ph||m.turn!==prev.turn;
  if(changed){
    if(m.ph==='choose'){
      if(m.firstTurn&&!m.solo)banner('ROUND '+m.round);
      if(m.artist===S.me){SFX.turn();if(!m.firstTurn||m.solo)banner('YOUR TURN!')}
    }
    if(m.ph==='draw'){SFX.go();if(m.artist===S.me)setTool(tool.t==='fill'?'brush':tool.t)}
    if(m.ph==='reveal')SFX.reveal();
    if(m.ph==='end'){SFX.end();setTimeout(()=>confetti(innerWidth/2,innerHeight*.3,90),250)}
  }
  setScreen(m.ph==='end'?'results':'game');
  if(m.ph==='end')renderResults();else renderGame();
}
function setScreen(s){
  screen=s;
  $('menu').classList.toggle('on',s==='menu');$('lobby').classList.toggle('on',s==='lobby');
  $('results').classList.toggle('on',s==='results');$('app').classList.toggle('on',s==='game');
  if(s==='game'){wake();layout()}
  if(s!=='game'&&document.activeElement&&document.activeElement.id==='guess')document.activeElement.blur();
}
function renderLobby(){
  const host=S.role==='host';
  $('lobCode').textContent=S.code;
  $('lobHint').textContent=host?'Share the link, then hit start!':'Waiting for the host to start…';
  $('btnShare').style.display=host?'block':'none';

    for(const v of vals){const b=document.createElement('button');b.textContent=fmt(v);b.className=v===cur?'sel':'';if(host)b.onclick=()=>{set(v);SFX.click();sendLobby()};el.appendChild(b)}};
  seg($('segRounds'),[2,3],S.rounds,v=>v,v=>S.rounds=v);

  paintSwatch();layout();
}
function renderHint(){

  if(ph==='choose'){h.innerHTML=`<span class="msg">${art?'Pick a word!':esc(a?a.name:'')+' is choosing…'}</span>`;return}

    if(ch===' ')tiles+='<i class="sp"></i>';else{const shown=word?word[i]:(mask[i]==='_'?'':mask[i]);tiles+=`<i class="${!word&&shown?'r':''}">${esc(shown.toUpperCase())}</i>`}}

  else{d.className='sys'+(m.sub?' '+m.sub:'');d.textContent=m.text}

/* ===================== layout (portrait + landscape + soft keyboard) ===================== */
function layout(){
  const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight,app=$('app');
  app.style.height=h+'px';app.style.width=w+'px';app.style.top=(vv?vv.offsetTop:0)+'px';app.style.left=(vv?vv.offsetLeft:0)+'px';
  const land=w>=h*1.05,b=document.body.classList;
  b.toggle('land',land);b.toggle('port',!land);b.toggle('short',land?h<300:h<470);
  if(screen!=='game')return;
  const stage=$('stage'),tools=$('tools'),art=b.contains('artist');
  if(land){
    stage.style.height='';
    const mh=$('main').clientHeight,nt=[...tools.children].filter(e=>getComputedStyle(e).display!=='none').length;
    tools.classList.toggle('two',nt*54>mh+6);
  }else{
    tools.classList.remove('two');
    const topH=$('top').offsetHeight,toolsH=art?54:0,sideMin=b.contains('short')?104:(V.solo?120:170);
    const pad=parseFloat(getComputedStyle(app).paddingTop)+parseFloat(getComputedStyle(app).paddingBottom);
    const avail=h-pad-topH-6-toolsH-sideMin-12;
    stage.style.height=Math.max(90,Math.min((w-24)*.75+8,avail))+'px';
  }
  const sw=stage.clientWidth,sh=stage.clientHeight-8;let pw=sw,ph=pw*.75;if(ph>sh){ph=sh;pw=ph*4/3}
  const p=$('paper');p.style.width=Math.floor(pw)+'px';p.style.height=Math.floor(ph)+'px';
  if(V.ph==='draw'||V.ph==='reveal')renderHintFit();
}
function renderHintFit(){const t=$('tiles');if(!t)return;const h=$('hint'),n=t.children.length;if(!n)return;
  const lab=h.querySelector('.lab'),cnt=h.querySelector('.cnt');const avail=h.clientWidth-24-(lab?lab.offsetWidth+8:0)-(cnt?cnt.offsetWidth+8:0);
  t.style.setProperty('--fs',Math.max(12,Math.min(26,avail/(n*1.0+.3)))+'px')}

/* ===================== fx: confetti ===================== */
const fx=$('fx'),fctx=fx.getContext('2d');let parts=[],fxDirty=false;
function sizeFx(){const dpr=Math.min(innerWidth>1200?1.25:1.5,devicePixelRatio||1);fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;fctx.setTransform(dpr,0,0,dpr,0,0)}
sizeFx();addEventListener('resize',sizeFx);
function confetti(x,y,n){const cols=['#ff6fb5','#4cc9ff','#ffd23f','#8be04e','#ffa23f','#b388ff'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=180+Math.random()*420;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-280,r:Math.random()*6,vr:(Math.random()-.5)*14,c:cols[i%cols.length],w:6+Math.random()*6,h:4+Math.random()*5,life:1.6+Math.random()})}}
let lastR=performance.now();
function render(){
  const now=performance.now(),dt=Math.min(.05,(now-lastR)/1000);lastR=now;
  if(parts.length||fxDirty){fctx.clearRect(0,0,innerWidth,innerHeight);fxDirty=parts.length>0;
    for(const p of parts){p.vy+=900*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.life-=dt;
      fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);fctx.scale(1,Math.cos(p.r*1.7));fctx.fillStyle=p.c;fctx.globalAlpha=Math.min(1,p.life*2);fctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);fctx.restore()}
    parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40)}
}
(function loop(){render();requestAnimationFrame(loop)})();

/* ===================== main update ===================== */
let lastSec=-1;
function update(dt){
  if(isHost()&&G){hostTick(dt);if(G&&(V.ph==='choose'||V.ph==='draw'||V.ph==='reveal'))V.tl=Math.max(0,G.tl)}
  else if(V.ph==='choose'||V.ph==='draw'||V.ph==='reveal')V.tl=Math.max(0,V.tl-dt);
  if(screen==='game'){
    const sec=Math.ceil(V.tl||0),timed=!(V.solo&&V.ph==='reveal');
    $('timerN').textContent=timed?Math.min(999,sec):'✓';
    const t=$('timer');t.style.setProperty('--p',timed?Math.max(0,Math.min(1,V.tl/(V.T||1))):1);
    t.classList.toggle('hurry',V.ph==='draw'&&V.tl<=10);
    if(V.ph==='choose')$('chooseT').textContent=`Auto-pick in ${sec}s`;
    if(sec!==lastSec){if(V.ph==='draw'&&sec<=10&&sec>0)SFX.tick();lastSec=sec}
  }
}
let lastU=performance.now();
setInterval(()=>{const now=performance.now(),dt=Math.min(.5,(now-lastU)/1000);lastU=now;update(dt)},100);

}
