<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Blob Tycoon</title>
<meta name="apple-mobile-web-app-title" content="Blob Tycoon">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--card:#fffdf6;--dim:#5d5a80;--yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a;--red:#ff4d6d;--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#5ec2ff,#c9f0ff);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;font-weight:600;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:var(--ink)}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(14px,var(--sr)) 10px max(14px,var(--sl));overflow:auto;-webkit-overflow-scrolling:touch;z-index:10}
.screen.on{display:flex}.screen.dim{background:rgba(29,27,58,.35)}
.card{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:18px 20px 14px;width:min(500px,100%);box-shadow:0 9px 0 var(--ink);margin:auto;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.card.wide{width:min(780px,100%)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(40px,10vw,60px);line-height:.92;letter-spacing:1px;text-align:center;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
h1 span{color:var(--pink)}
h2{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:28px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.sub{text-align:center;color:var(--dim);margin:8px 0 10px;font-size:14px}
label{display:block;font-size:13px;color:var(--dim);margin:8px 0 4px;letter-spacing:.6px;text-transform:uppercase}
input[type=text],textarea{width:100%;font:600 18px 'Fredoka',sans-serif;color:var(--ink);background:#eef6ff;border:3px solid var(--ink);border-radius:16px;padding:9px 14px;outline:none;user-select:text;-webkit-user-select:text;min-height:48px}
textarea{font-size:13px;height:80px;resize:none;word-break:break-all}
.btn{display:block;width:100%;font:400 20px 'Lilita One',sans-serif;letter-spacing:.5px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:9px;margin-top:8px;cursor:pointer;box-shadow:0 5px 0 var(--ink);text-align:center;text-decoration:none;min-height:48px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.ghost{background:#fff}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.red{background:#ff8fa3}
.btn.sm{font-size:16px;padding:5px 10px;margin-top:6px}
.btn small{display:block;font:600 12px 'Fredoka',sans-serif;color:var(--dim);-webkit-text-stroke:0;margin-top:1px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.join{display:flex;gap:10px;margin-top:8px}
.join input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Lilita One',sans-serif;font-size:22px;padding:6px}
.join .btn{width:auto;margin:0;padding:0 22px;flex:none}
.invite{background:#fff2b8;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;margin:6px 0;text-align:center;font-size:15px}
.code{font-family:'Lilita One',sans-serif;font-size:46px;letter-spacing:10px;text-align:center;color:var(--blue);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin:0}
.tcols{display:flex;gap:18px;align-items:center}.tcols>div{flex:1;min-width:0}
.slot{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:18px;padding:7px 10px;background:#fff;margin-top:8px;box-shadow:0 4px 0 var(--ink);cursor:pointer;min-height:56px}
.slot.sel{background:#fff2b8}.slot .ic{font-size:28px;width:40px;text-align:center}
.slot .inf{flex:1;min-width:0}.slot .inf b{font:400 18px 'Lilita One';display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .inf span{font-size:13px;color:var(--dim)}.slot.empty{opacity:.75}
.slotbtns{display:flex;gap:6px}.slotbtns .btn{width:auto;margin:0;padding:4px 10px;font-size:15px;min-width:48px}
.colors{display:flex;gap:10px;justify-content:center;margin:4px 0}
.colors div{width:48px;height:48px;border-radius:50%;border:4px solid var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.colors div.sel{transform:translateY(-4px) scale(1.08);outline:4px solid var(--yellow)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{min-height:48px;min-width:48px;padding:4px 10px;border:3px solid var(--ink);border-radius:14px;background:#fff;font:400 15px 'Lilita One';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 0 var(--ink)}
.chip.sel{background:var(--yellow)}.chip.lock{opacity:.4}
.recap{background:#eaf9ff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.35;margin:8px 0;text-align:left}
.recap b{font:400 16px 'Lilita One'}
.scen{display:flex;gap:8px;align-items:center;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px 10px;margin-top:6px;cursor:pointer;min-height:52px}
.scen.sel{background:#fff2b8}.scen .ic{font-size:26px}.scen b{font:400 16px 'Lilita One';display:block}.scen span{font-size:12px;color:var(--dim)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
body.playing #hud{display:block}
.pane{background:rgba(255,253,246,.95);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink)}
#top{position:absolute;left:max(6px,var(--sl));right:max(6px,var(--sr));top:max(5px,env(safe-area-inset-top));display:flex;gap:5px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:48px;height:48px;flex:none;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ib:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}.ib.sel{background:var(--yellow)}
.tc{height:48px;padding:0 9px;display:flex;align-items:center;gap:5px;font:400 17px 'Lilita One';cursor:pointer;white-space:nowrap;background:rgba(255,253,246,.95);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink)}
.tc .v{line-height:1.05}
#spacer{flex:1;pointer-events:none!important}
#players{display:flex;gap:4px}.pl{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink)}
#goalchip{position:absolute;left:max(6px,var(--sl));top:calc(max(5px,env(safe-area-inset-top)) + 56px);max-width:230px;padding:4px 10px;pointer-events:auto;cursor:pointer;font-size:12px;line-height:1.2}
#goalchip b{font:400 13px 'Lilita One';color:#7b5cff;display:block}
#goalchip .gp{height:8px;border-radius:5px;background:#e1dff0;border:2px solid var(--ink);margin-top:3px;overflow:hidden}#goalchip .gp i{display:block;height:100%;background:var(--green)}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 max(6px,var(--sr)) max(4px,var(--sb)) max(6px,var(--sl));pointer-events:none}
#items{display:none;gap:6px;overflow-x:auto;padding:6px;margin-bottom:5px;pointer-events:auto;-webkit-overflow-scrolling:touch}
#items.on{display:flex}
.it{flex:none;width:84px;height:72px;border:3px solid var(--ink);border-radius:12px;background:#fff;text-align:center;cursor:pointer;padding:2px;font-size:12px;line-height:1.1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ink)}
.it i{font-style:normal;font-size:26px;line-height:1.1}.it b{font:400 12px 'Lilita One';display:block;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.it.sel{background:var(--yellow)}.it.lock{opacity:.5;background:#ddd}.it.poor{color:var(--red)}
#cats{display:flex;gap:6px;align-items:center;pointer-events:auto}
#cats .ib{width:58px;flex-direction:column;gap:0;font-size:18px;line-height:1}#cats .ib span{font-size:12px;display:block;font-family:'Lilita One';line-height:1;margin-top:1px}
#tool{font-size:13px;margin-left:6px;flex:1;min-width:0;pointer-events:none;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 4px #fff}
#placebar{position:absolute;right:max(8px,var(--sr));bottom:calc(64px + var(--sb));display:none;gap:6px;pointer-events:auto}
#placebar.on{display:flex}#placebar .ib{width:54px;height:54px}
#placebar.up{bottom:calc(142px + var(--sb))}
#cbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + var(--sb));display:none;gap:5px;padding:5px;pointer-events:auto;align-items:center}
#cbar.on{display:flex}#cbar .ib{width:50px;height:50px;font-size:18px}#cbar .tx{font-size:12px;max-width:130px;line-height:1.1}
#info{position:absolute;right:max(6px,var(--sr));top:calc(max(5px,env(safe-area-inset-top)) + 56px);width:min(250px,48vw);max-height:calc(100% - 150px);overflow:auto;padding:8px 10px;display:none;pointer-events:auto;font-size:13px;line-height:1.3}
#info.on{display:block}
#info h3{font:400 18px 'Lilita One';margin:0 0 3px;padding-right:44px}
#info .x{position:absolute;right:3px;top:3px;width:48px;height:48px;font-size:16px}
.stat{display:flex;justify-content:space-between;gap:6px}.stat b{font-weight:700}
.bar{height:9px;border-radius:6px;background:#e1dff0;border:2px solid var(--ink);overflow:hidden;flex:1;margin:3px 0}.bar i{display:block;height:100%}
.nrow{display:flex;align-items:center;gap:6px;font-size:12px}.nrow span{width:56px}
.mini{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:48px;padding:0 8px;border:3px solid var(--ink);border-radius:12px;background:#fff;font:400 16px 'Lilita One';cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.mini:active{transform:translateY(2px)}.mini.g{background:var(--green)}.mini.r{background:#ff8fa3}.mini.y{background:var(--yellow)}
.brow{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
#bubbles,#ftexts,#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.bub{position:absolute;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:2px 7px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);max-width:200px;display:none}
.bub:after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.ft{position:absolute;font:400 18px 'Lilita One';color:#ffd23f;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;transform:translate(-50%,-50%);transition:transform 1s ease-out,opacity 1s}
.tag{position:absolute;font:400 12px 'Lilita One';color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;transform:translate(-50%,-100%);display:none}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:rgba(29,27,58,.35);padding:max(8px,env(safe-area-inset-top)) max(10px,var(--sr)) max(8px,var(--sb)) max(10px,var(--sl))}
#panel.on{display:flex}
#pcard{background:var(--card);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);width:min(820px,100%);display:flex;flex-direction:column;margin:auto;animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
#phead{position:sticky;top:0;z-index:2;border-radius:18px 18px 0 0;display:flex;align-items:center;gap:8px;padding:6px 8px 5px 14px;border-bottom:3px solid var(--ink);background:#fff2b8}
#ptitle{font:400 22px 'Lilita One';flex:none}
#ptabs{display:flex;gap:5px;overflow-x:auto;flex:1;padding:2px}
#pbody{padding:10px 12px 14px;flex:1;font-size:14px}small{font-size:12px}body.pan #hud{visibility:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.cardm{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:7px 9px}
.cardm h4{margin:0 0 2px;font:400 16px 'Lilita One'}.cardm .mini{margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td{padding:3px 4px;border-bottom:1px solid #e2e0f0}.tbl td:last-child{text-align:right;font-weight:700}
#banner{position:fixed;left:0;right:0;top:28%;text-align:center;pointer-events:none;z-index:6;display:none}
#banner .t{font:400 clamp(30px,7vw,56px) 'Lilita One';color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);line-height:1}
#banner .s{font:700 17px 'Fredoka';color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;margin-top:6px}
#rotate{position:fixed;inset:0;background:linear-gradient(#5ec2ff,#c9f0ff);z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px;font:400 28px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#rotate .ph{font-size:76px;animation:rot 1.6s ease-in-out infinite;-webkit-text-stroke:0}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.playing.touch #rotate{display:flex}}
@media (max-width:540px){#cats{max-width:calc(100vw - 12px);overflow-x:auto;scrollbar-width:none}#cats .ib{width:50px;height:46px}#top{flex-wrap:wrap}}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120px);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:7px 16px;border-radius:16px;z-index:50;transition:transform .25s cubic-bezier(.3,1.6,.5,1);max-width:90vw;text-align:center;font-size:15px;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60;background:linear-gradient(#5ec2ff,#c9f0ff);font:400 34px 'Lilita One';color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
@media (max-height:460px){
 h1{font-size:40px}h2{font-size:22px}.card{padding:10px 14px 8px;border-radius:22px}.btn{font-size:17px;padding:5px;margin-top:6px}.sub{margin:4px 0 6px;font-size:13px}
 .code{font-size:34px}.tc{font-size:15px;padding:0 7px}.it{height:64px;width:80px}.it i{font-size:22px}.colors div{width:44px;height:44px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
}
</style>
</head>
<body>
<div id="loading">Loading park…</div>
<canvas id="gl"></canvas>
<div id="bubbles"></div><div id="ftexts"></div><div id="tags"></div>
<div id="hud">
 <div id="top">
  <button class="ib" id="bMenu" aria-label="menu">☰</button>
  <div class="tc" id="cMoney"><span>💰</span><div class="v" id="vMoney">$0</div></div>
  <div class="tc" id="cRate"><span>⭐</span><div class="v" id="vRate">0</div></div>
  <div class="tc" id="cGuests"><span>👥</span><div class="v" id="vGuests">0</div></div>
  <div class="tc" id="cTime"><span id="vWx">☀️</span><div class="v" id="vTime">Y1</div></div>
  <div id="spacer"></div>
  <div id="players"></div>
  <button class="ib" id="bSpeed" aria-label="speed">▶</button>
  <button class="ib" id="mute" aria-label="sound">🔊</button>
 </div>
 <div id="goalchip" class="pane"></div>
 <div id="info" class="pane"></div>
 <div id="placebar"><button class="ib" id="bRot" aria-label="rotate">⟳</button><button class="ib" id="bNo" aria-label="cancel">✕</button><button class="ib" id="bOk" aria-label="place" style="background:var(--green)">✓</button></div>
 <div id="cbar" class="pane"></div>
 <div id="bottom">
  <div id="items" class="pane"></div>
  <div id="cats"></div>
 </div>
</div>

<div id="title" class="screen on"><div class="card"><div class="tcols"><div>
  <h1>BLOB<br><span>TYCOON</span></h1>
  <div class="sub">Build a wild theme park with friends: rides, shops, happy guests and a roller coaster!</div>
  <div id="inviteBox" class="invite" style="display:none">Invited to park <b id="invCode"></b></div>
  </div><div>
  <button id="btnCont" class="btn green">CONTINUE<small id="contInfo"></small></button>
  <button id="btnNew" class="btn">NEW PARK</button>
  <div class="join"><input id="joinCode" type="text" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="btnJoin" class="btn ghost">JOIN</button></div>
  <div class="row2"><button id="btnSaves" class="btn ghost sm">💾 SAVES</button><button id="btnProf" class="btn ghost sm">🙂 ME</button><a class="btn ghost sm" href="../" id="btnArcade">◀ Arcade</a></div>
</div></div></div></div>

<div id="saves" class="screen"><div class="card wide"><div class="tcols" style="align-items:flex-start"><div>
  <h2>SAVE SLOTS</h2><div class="sub" style="margin:0">Parks are saved on the host's phone.</div><div id="slotList"></div></div>
  <div><label for="impTxt">Save code (export shows it here; paste one to import into the selected slot)</label>
  <textarea id="impTxt" placeholder="Paste a BT save code here" spellcheck="false"></textarea>
  <div class="row2"><button id="btnImp" class="btn blue sm">📥 IMPORT</button><button id="btnSavesBack" class="btn ghost sm">◀ BACK</button></div></div>
</div></div></div>

<div id="newgame" class="screen"><div class="card wide"><div class="tcols" style="align-items:flex-start"><div>
  <h2 id="ngTitle">NEW PARK</h2><div id="ngScens"></div></div><div>
  <label for="ngPark">Park name</label><input id="ngPark" type="text" maxlength="18" autocomplete="off" spellcheck="false">
  <label for="ngName">Your name</label><input id="ngName" type="text" maxlength="10" autocomplete="off" spellcheck="false">
  <label>Color</label><div class="colors" id="ngColors"></div>
  <label>Role</label><div class="chips" id="ngRoles"></div>
  <div class="row2"><button id="btnNgGo" class="btn green">START</button><button id="btnNgBack" class="btn ghost" style="flex:.5">Back</button></div>
</div></div></div></div>

<div id="playmode" class="screen"><div class="card"><div class="tcols"><div>
  <h2 id="pmTitle">WELCOME BACK!</h2><div id="pmRecap" class="recap"></div>
  </div><div>
  <button id="btnSolo" class="btn green">PLAY SOLO<small>Just you</small></button>
  <button id="btnHost" class="btn pink">HOST FOR FRIENDS<small>Up to 4 players, share a code</small></button>
  <button id="btnPmBack" class="btn ghost sm">◀ BACK</button>
</div></div></div></div>

<div id="results" class="screen dim"><div class="card">
  <h2 id="resTitle">YOU DID IT!</h2><div class="sub" id="resSub"></div>
  <button id="btnResOk" class="btn green">KEEP PLAYING</button>
</div></div>

<div id="panel" class="screen dim"><div id="pcard"><div id="phead"><div id="ptitle"></div><div id="ptabs"></div><button class="ib" id="pClose" aria-label="close">✕</button></div><div id="pbody"></div></div></div>
<div id="banner"><div class="t" id="banT"></div><div class="s" id="banS"></div></div>
<div id="rotate"><div class="ph">📱</div>Rotate your phone sideways</div>
<div id="toast"></div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {mergeVertices,mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
'use strict';
/* BLOB TYCOON - co-op cartoon theme park builder */
const $=id=>document.getElementById(id);
const IS_TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
