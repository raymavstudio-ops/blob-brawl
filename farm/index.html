<style>
:root{--ink:#1d1b3a;--card:#fffdf6;--dim:#5d5a80;--yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a;--orange:#ffa23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#7fd0ff,#d8f5c8);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;font-weight:600;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch;z-index:20}
.screen.on{display:flex}
#title{background:linear-gradient(180deg,rgba(127,208,255,.0),rgba(216,245,200,.0));z-index:25}
#panel{z-index:30;background:rgba(29,27,58,.38)}
.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:16px 18px 14px;width:min(480px,100%);box-shadow:0 8px 0 var(--ink);margin:auto;animation:pop .3s cubic-bezier(.3,1.6,.5,1);max-height:calc(100vh - 20px);display:flex;flex-direction:column}
.card.wide{width:min(660px,100%)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(44px,11vw,64px);line-height:.92;letter-spacing:1px;text-align:center;color:#8be04e;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-3deg)}
h1 span{color:var(--yellow)}
h2{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:32px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.sub{text-align:center;color:var(--dim);margin:8px 0 10px;font-size:15px}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px;letter-spacing:.6px;text-transform:uppercase}
input[type=text],textarea{width:100%;font:600 18px 'Fredoka',sans-serif;color:var(--ink);background:#eef6ff;border:3px solid var(--ink);border-radius:14px;padding:9px 13px;outline:none;user-select:text;-webkit-user-select:text}
textarea{font-size:13px;height:110px;resize:none;word-break:break-all}
input[type=text]:focus,textarea:focus{background:#fff;box-shadow:0 0 0 4px rgba(76,201,255,.45)}
.btn{display:block;width:100%;font:400 20px 'Lilita One',sans-serif;letter-spacing:.5px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:15px;padding:10px;margin-top:9px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-height:48px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.ghost{background:#fff}
.btn.sm{font-size:16px;padding:6px 12px;margin-top:0;min-height:48px;width:auto;box-shadow:0 4px 0 var(--ink)}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.join{display:flex;gap:10px;margin-top:9px}
.join input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Lilita One',sans-serif;font-size:22px;padding:8px}
.join .btn{width:auto;margin:0;padding:0 22px;flex:none}
.invite{background:#fff2b8;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:6px;text-align:center;font-size:15px}
.slots{display:grid;gap:8px;margin:8px 0}
.slot-c{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:15px;background:#fff;border:3px solid var(--ink);cursor:pointer;min-height:56px}
.slot-c.sel{background:#fff2b8;box-shadow:0 4px 0 var(--ink);transform:translateY(-2px)}
.slot-c .si{font-size:28px;width:38px;text-align:center}
.slot-c small{display:block;color:var(--dim);font-size:12px;font-weight:600}
.slot-c b{font-family:'Lilita One',sans-serif;font-weight:400;font-size:17px}
.code{font-family:'Lilita One',sans-serif;font-size:50px;letter-spacing:10px;text-align:center;color:var(--blue);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin:0;cursor:pointer}
.pbody{overflow:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding:2px}
.ptabs{display:flex;gap:6px;margin:4px 0 8px;overflow-x:auto;flex:none}
.ptab{flex:none;font:400 15px 'Lilita One',sans-serif;padding:6px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;cursor:pointer;min-height:48px}
.ptab.sel{background:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.cell{position:relative;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px 4px 4px;text-align:center;cursor:pointer;min-height:84px}
.cell .ci{font-size:30px;line-height:1.15;height:40px;display:flex;align-items:center;justify-content:center}
.cell .ci img{width:38px;height:38px;object-fit:contain}
.cell .cn{font-size:12px;line-height:1.1;margin-top:1px}
.cell .cq{position:absolute;right:4px;top:2px;font:400 14px 'Lilita One',sans-serif;background:var(--yellow);border:2px solid var(--ink);border-radius:9px;padding:0 5px;min-width:22px}
.cell.sel{background:#fff2b8;box-shadow:0 3px 0 var(--ink)}
.cell.dim{opacity:.4}
.cell .seedb{position:absolute;left:3px;top:3px;font-size:13px}
.lr{display:flex;align-items:center;gap:10px;padding:7px 10px;border:3px solid var(--ink);border-radius:14px;background:#fff;margin-bottom:7px}
.lr .ico{flex:none;width:44px;height:44px;font-size:30px;display:flex;align-items:center;justify-content:center}
.lr .ico img{width:40px;height:40px;object-fit:contain}
.lr .tx{flex:1;min-width:0;font-size:15px;line-height:1.15}
.lr .tx small{display:block;color:var(--dim);font-size:12px;font-weight:600;margin-top:2px}
.lr.done{background:#e4ffd8}.lr.cur{background:#fff2b8}
.bar{height:12px;border:2.5px solid var(--ink);border-radius:8px;background:#e6e8f2;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green);width:0}
.hearts{letter-spacing:1px;font-size:15px;color:#ff4f81}
.speech{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;margin:8px 0;font-size:16px;line-height:1.25}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:2px solid var(--ink);background:#eef;margin-left:4px}
.pill.g{background:#d6ffc9}.pill.r{background:#ffd0d0}
.note{font-size:13px;color:var(--dim);text-align:center;margin:6px 0}
/* HUD */
#hud,#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:6}
body.playing #hud{display:block}
body.pan #hud,body.pan #touch,body.pan #tags,body.pan #fishUI{visibility:hidden}
body.playing.touch #touch{display:block}
.chip{position:absolute;display:flex;align-items:center;gap:7px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 11px;font:600 15px 'Fredoka',sans-serif;box-shadow:0 3px 0 var(--ink);min-height:34px;white-space:nowrap}
#topL{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px}
#topL .chip{position:static}
#cLvl{cursor:pointer;pointer-events:auto}
.xpbar{width:54px;height:10px;border:2.5px solid var(--ink);border-radius:6px;background:#e6e8f2;overflow:hidden}.xpbar i{display:block;height:100%;width:0;background:var(--blue)}
#topC{left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);font-size:14px;pointer-events:auto;cursor:pointer}
#quest{left:max(8px,env(safe-area-inset-left));top:max(50px,calc(env(safe-area-inset-top) + 46px));max-width:min(300px,52vw);font-size:12px;white-space:normal;line-height:1.15;padding:3px 9px;pointer-events:auto;cursor:pointer;min-height:30px}
#quest b{color:#e0457b}
#buffs{position:absolute;left:50%;transform:translateX(-50%);top:max(46px,calc(env(safe-area-inset-top) + 44px));display:flex;gap:5px}
.bf{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:0 7px;font-size:13px;min-height:26px;display:flex;align-items:center;gap:3px}
#roomChip{right:max(8px,env(safe-area-inset-right));top:max(60px,calc(env(safe-area-inset-top) + 58px));font-size:12px;min-height:28px;padding:1px 9px;display:none}
#topR{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
.rb{width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:21px;cursor:pointer;padding:0;position:relative}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.rb .bdg{position:absolute;right:-6px;top:-8px;background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:10px;font:400 12px 'Lilita One',sans-serif;padding:0 5px;display:none}
#hot{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:2px;pointer-events:auto;background:rgba(255,255,255,.55);padding:3px;border-radius:16px;border:3px solid var(--ink)}
.hs{position:relative;width:48px;height:48px;border-radius:11px;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:25px;cursor:pointer;padding:0}
.hs img{width:36px;height:36px;object-fit:contain;pointer-events:none}
.hs.sel{background:#fff2b8;border-color:#e0457b;transform:translateY(-5px);box-shadow:0 5px 0 var(--ink)}
.hs .q{position:absolute;right:1px;bottom:-1px;font:400 12px 'Lilita One',sans-serif;background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:0 4px;line-height:14px}
.hs .k{position:absolute;left:3px;top:0;font:600 12px 'Fredoka',sans-serif;color:var(--dim)}
.hs.zero{opacity:.5}
body.touch .hs .k{display:none}
#actBtn{pointer-events:auto;position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--ink);touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;line-height:1}
#actBtn:active,#actBtn.held{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#actBtn #actIco{font-size:28px;line-height:1.05}
#actBtn #actIco img{width:34px;height:34px;object-fit:contain}
#actBtn b{font:400 15px 'Lilita One',sans-serif;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;letter-spacing:.4px}
#actBtn.off{background:#b9b7cf;filter:saturate(.5)}
.jbase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:4px solid rgba(29,27,58,.55);background:rgba(255,255,255,.3);display:none}
.jknob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#jhint{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:84px;font-size:12px;color:rgba(29,27,58,.6);background:rgba(255,255,255,.55);padding:2px 9px;border-radius:9px}
#tags,#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.tag{position:absolute;transform:translate(-50%,-100%);font:600 13px 'Fredoka',sans-serif;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:0 8px;white-space:nowrap;will-change:left,top}
.tag.npc{background:#fff2b8}
.tag.sp{white-space:normal;width:max-content;max-width:170px;text-align:center;font-size:12px;line-height:1.15;border-radius:12px;padding:3px 9px}
.tag small{font-size:11px;color:#e0457b}
.pop{position:absolute;transform:translate(-50%,-50%);font:400 22px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;animation:rise 1.3s ease-out forwards;white-space:nowrap}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-64px}}
#fishUI{position:fixed;right:max(120px,calc(env(safe-area-inset-right) + 118px));top:50%;transform:translateY(-50%);display:none;z-index:8;pointer-events:auto;align-items:flex-end;gap:8px}
#fishUI.on{display:flex}
#fbar{position:relative;width:46px;height:min(250px,64vh);border:4px solid var(--ink);border-radius:16px;background:linear-gradient(#aee6ff,#4fb6f0);overflow:hidden;box-shadow:0 5px 0 var(--ink);touch-action:none}
#fzone{position:absolute;left:0;right:0;background:rgba(126,227,106,.78);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
#ffish{position:absolute;left:5px;width:30px;height:30px;font-size:24px;line-height:30px;text-align:center}
#fprog{width:16px;height:min(250px,64vh);border:3px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden;position:relative}
#fprog i{position:absolute;left:0;right:0;bottom:0;background:var(--orange);height:0}
#fmsg{position:fixed;left:50%;top:26%;transform:translateX(-50%);font:400 36px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);display:none;z-index:8;pointer-events:none}
#fmsg.on{display:block}
#fade{position:fixed;inset:0;background:#1d1b3a;opacity:0;pointer-events:none;z-index:35;transition:opacity .28s}
#fade.on{opacity:1}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%) translateY(-160px);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 16px;border-radius:15px;z-index:40;transition:transform .25s cubic-bezier(.3,1.6,.5,1);max-width:88vw;text-align:center;font-size:15px;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
#rotate{position:fixed;inset:0;background:linear-gradient(#7fd0ff,#d8f5c8);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px;font:400 28px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#rotate .ph{font-size:76px;animation:rot 1.6s ease-in-out infinite;-webkit-text-stroke:0}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.touch.playing #rotate{display:flex}}
@media (max-width:440px){#hot{transform:translateX(-50%) scale(.78);transform-origin:50% 100%}}
#lvlpop{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:31;display:none;text-align:center;pointer-events:none}
#lvlpop.on{display:block;animation:lv 2.4s ease-out forwards}
#lvlpop b{font:400 54px 'Lilita One',sans-serif;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);display:block}
#lvlpop span{font:400 20px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
@keyframes lv{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
@media (max-height:420px){h1{font-size:34px!important;transform:none}.sub{margin:3px 0 3px;font-size:13px}.card{padding:8px 14px 8px;border-radius:20px}.btn{padding:3px 8px;margin-top:6px;font-size:17px}input[type=text]{padding:4px 12px}.slots{margin:4px 0;gap:5px}.slot-c{min-height:50px;padding:4px 10px}.code{font-size:34px}label{margin:3px 0 2px}.join{margin-top:6px}.join input{padding:4px}h2{font-size:24px;margin-bottom:2px}.ptabs{margin:2px 0 4px}.grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}.cell{min-height:76px}.lr{padding:4px 8px;margin-bottom:5px}#tcard{width:min(780px,100%);display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}.tcol{min-width:0}}
@media (max-height:380px){.chip{min-height:30px;padding:2px 9px;font-size:14px}#quest{top:44px}#toast{top:56px}}
</style>
</head>

<script type="module">
'use strict';
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {mergeGeometries,mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const IS_TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);

function dayKey(t){return Math.floor((t-new Date().getTimezoneOffset()*60000)/864e5)}
function weekKey(t){return Math.floor((dayKey(t)+3)/7)}
function hasCat(id,cat){const it=ITEMS[id];if(!it)return false;if(cat==='fruit')return !!it.fruit;return it.cat===cat}
function requestFor(vk,day,w){const r=mulberry(hash(vk,day,'req')),v=VILL[vk];
  const crops=Object.keys(CROPS),cur=crops.filter(k=>CROPS[k].s.includes(seasonAt(day*864e5+864e5/2)));
  const mineOn=w&&w.built&&w.built.mine,hasA=w&&w.animals&&w.animals.some(a=>a.t==='chicken'),hasC=w&&w.animals&&w.animals.some(a=>a.t==='cow');
  let item,n,txt;const pickCrop=()=>cur[Math.floor(r()*cur.length)];
  if(vk==='poppy'){const o=r();if(o<.4&&hasA){item='egg';n=2+Math.floor(r()*3);txt=`I’m low on eggs. Could you spare ${n}?`}else if(o<.6&&hasC){item='milk';n=2;txt='Two bottles of milk for the dough, please!'}else{item=pickCrop();n=3+Math.floor(r()*3);txt=`I need ${n}x ${CROPS[item].n} for today’s special!`}}
  else if(vk==='gus'){const o=r();if(o<.5){item='@fish';n=2;txt='Bring me 2 fish, any kind. Don’t tell the wife.'}else{item='@fish';n=3;txt='I’m hosting a fish fry. 3 fish, any kind!'}}
  else if(vk==='juniper'){item=pickCrop();n=3+Math.floor(r()*4);txt=`Studying ${CROPS[item].n}s! Can you bring me ${n}?`}
  else{if(mineOn&&r()<.7){item=r()<.5?'stone':'copper';n=item==='stone'?5:3;txt=`Need ${n} ${ITEMS[item].n}. For... art.`}else{item='@crop';n=3;txt='A hungry miner needs 3 crops, any kind!'}}
  const rew=60+n*(item==='@fish'?40:item==='@crop'?20:Math.round((ITEMS[item]?ITEMS[item].price:30)*.5))+Math.floor(r()*40);
  return{item,n,txt,rew};}
function giftScore(vk,id){const v=VILL[vk],it=ITEMS[id];if(!it||it.tool)return 0;if(v.loves.includes(id))return 80;if(v.likes.includes(id))return 45;if(v.hates.includes(id))return -40;
  if(vk==='gus'&&it.cat==='fish')return 45;if(it.cat==='crop'||it.cat==='meal')return 20;if(it.cat==='ore'&&vk==='bo')return 45;return 12}

let clockOff=0;const nowMs=()=>Date.now()+clockOff;
let W=null; // active world
const epoch=()=>W?W.epoch:0;
function seasonAt(t){const e=W?W.epoch:0;return((Math.floor((t-e)/SEASON_MS)%4)+4)%4}
function weatherAt(t){const slot=Math.floor(t/SLOT_MS),s=seasonAt(t),h=hash(slot,s,'wx')%100,rc=[28,14,28,0][s],sc=[0,0,0,30][s];
  if(h<rc)return'rain';if(h<rc+sc)return'snow';if(h<rc+sc+16)return'cloud';return'clear'}
const hourOf=t=>((t%DAY_MS)/DAY_MS)*24;
function rainSegs(a,b){const out=[];let s=Math.floor(a/SLOT_MS);for(;s*SLOT_MS<b;s++){const t0=s*SLOT_MS;if(weatherAt(t0+1)==='rain')out.push([Math.max(a,t0),Math.min(b,t0+SLOT_MS)])}return out}
function unionLen(segs){segs.sort((x,y)=>x[0]-y[0]);let tot=0,cs=-1,ce=-1;for(const[a,b] of segs){if(b<=a)continue;if(a>ce){if(ce>cs)tot+=ce-cs;cs=a;ce=b}else if(b>ce)ce=b}if(ce>cs)tot+=ce-cs;return tot}
function wetMs(tile,a,b){if(b<=a)return 0;if(tile.sp)return b-a;const segs=rainSegs(a,b);if(tile.wu>a&&tile.wf<b)segs.push([Math.max(a,tile.wf||0),Math.min(b,tile.wu)]);return unionLen(segs)}
function wetNow(tile,t){return !!tile&&(!!tile.sp||t<(tile.wu||0)||weatherAt(t)==='rain')}
const cropValidAt=(cid,t,gh)=>gh||CROPS[cid].s.includes(seasonAt(t));
function growthDelta(tile,c,a,b,gh){ // wet ms in valid seasons between a and b
  let tot=0,t=a;while(t<b){const s=Math.floor((t-W.epoch)/SEASON_MS),end=Math.min(b,W.epoch+(s+1)*SEASON_MS);if(cropValidAt(c.id,t+1,gh))tot+=wetMs(tile,t,end);t=end}return tot}
const cropTotal=c=>CROPS[c].min*60000;
function cropStage(c){if(!c)return 0;const tot=cropTotal(c.id);if(c.g>=tot)return 4;return Math.min(3,Math.floor(c.g/tot*4))}

  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}

const MUSIC=(()=>{let step=0,next=0;const BPM=84,SP=60/BPM/2,hz=n=>440*Math.pow(2,(n-69)/12);
  const PROG=[[48,52,55],[45,48,52],[41,45,48],[43,47,50]],NIGHT=[[45,48,52],[41,45,48],[40,44,47],[43,47,50]];
  const SCALE=[0,2,4,7,9];
  function note(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
  setInterval(()=>{if(!ac||ac.state!=='running'||muted||!window.__musicOn){next=0;return}
    if(next<ac.currentTime)next=ac.currentTime+.05;const night=window.__night;
    while(next<ac.currentTime+.25){const bar=Math.floor(step/8)%4,s=step%8,ch=(night?NIGHT:PROG)[bar];
      if(s===0)note(hz(ch[0]-12),next,SP*6,'triangle',.07);

      next+=SP;step++}},70);return{}})();

let wl=null;async function wake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
async function encodeSave(obj){const json=JSON.stringify(obj);let bytes=new TextEncoder().encode(json),pre='BF0:';
  if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer());pre='BF1:'}catch(e){pre='BF0:';bytes=new TextEncoder().encode(json)}}
  let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return pre+btoa(s)}
async function decodeSave(str){str=String(str).trim().replace(/\s+/g,'');const pre=str.slice(0,4);if(pre!=='BF0:'&&pre!=='BF1:')throw new Error('bad code');
  const bin=atob(str.slice(4));let bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(pre==='BF1:'){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer())}
  const s=JSON.parse(new TextDecoder().decode(bytes));if(!s||typeof s!=='object'||!s.inv)throw new Error('bad save');return migrate(s)}

  if(up){SFX.lvl();$('lvtxt').textContent=LVL_UNLOCK[up]?'Unlocked: '+LVL_UNLOCK[up]:'Farm level '+up;const p=$('lvlpop');p.classList.remove('on');void p.offsetWidth;p.classList.add('on');if(avatars.me)burstAt(ME.x,.9,ME.z,'#ffd23f',24,4,.9);saveNow()}updHud()}
const invN=id=>SAVE.inv[id]||0;
function invAdd(id,n=1){if(!ITEMS[id])return;const had=SAVE.inv[id]||0;SAVE.inv[id]=had+n;if(SAVE.inv[id]<=0)delete SAVE.inv[id];
  if(had===0&&n>0&&(ITEMS[id].tool||ITEMS[id].seed||ITEMS[id].deco)&&!SAVE.hot.includes(id)){const i=SAVE.hot.indexOf(null);if(i>=0)SAVE.hot[i]=id}
  const it=ITEMS[id];if(n>0){if(it.cat==='crop')collect('crop',id,n);else if(it.cat==='fish')collect('fish',id,n);else if(it.cat==='ore')collect('ore',id,n);else if(it.cat==='meal')collect('meal',id,n)}
  drawHot()}
function invTake(id,n=1){if(invN(id)<n)return false;SAVE.inv[id]-=n;if(SAVE.inv[id]<=0)delete SAVE.inv[id];drawHot();return true}
function collect(kind,id,n){const c=SAVE.col[kind];if(!c[id]){c[id]=0;const nm=ITEMS[id]?ITEMS[id].n:id;setTimeout(()=>toast('📖 New in your collection: '+nm+'!'),600);}c[id]+=n}
function catItems(cat){return Object.keys(SAVE.inv).filter(id=>SAVE.inv[id]>0&&hasCat(id,cat)).sort((a,b)=>ITEMS[a].price-ITEMS[b].price)}
function catCount(cat){return catItems(cat).reduce((s,id)=>s+SAVE.inv[id],0)}
function takeCat(cat,n){const out=[];for(const id of catItems(cat)){while(n>0&&invN(id)>0){invTake(id);out.push(id);n--}if(n<=0)break}return out}
const buffOn=b=>(SAVE&&SAVE.buffs[b]||0)>nowMs();
const selItem=()=>{const id=SAVE.hot[SAVE.sel];return id&&(ITEMS[id].tool||invN(id)>0)?id:null};

function demandOf(t){const d=dayKey(t),pool=Object.keys(CROPS).concat(['egg','milk','wool','tuna','trout','stew','pie']);return pool[hash(d,'demand')%pool.length]}
function applyBuff(k,mins=6){const t=nowMs()+mins*60000;if(k==='all'){for(const b of['speed','xp','fish','yield','charm'])SAVE.buffs[b]=t}else SAVE.buffs[k]=t;updHud()}

function dayList(src,kind,k){const r=mulberry(hash(kind,k)),pool=src.slice(),out=[],tier=Math.min(src===DAILY?2:1,Math.floor(SAVE.lvl/6));
  const cnt=src===DAILY?3:3;for(let i=0;i<cnt&&pool.length;i++){const g=pool.splice(Math.floor(r()*pool.length),1)[0];out.push({id:g.id,tier:Math.min(tier,g.n.length-1)})}return out}
function ensureGoals(){const t=nowMs(),g=SAVE.goals,dk=dayKey(t),wk=weekKey(t);
  if(g.daily.k!==dk){g.daily={k:dk,list:dayList(DAILY,'d',dk),base:{},cl:{}};for(const e of g.daily.list)g.daily.base[e.id]=SAVE.st[DAILY.find(x=>x.id===e.id).st]||0}
  if(g.weekly.k!==wk){g.weekly={k:wk,list:dayList(WEEKLY,'w',wk),base:{},cl:{}};for(const e of g.weekly.list)g.weekly.base[e.id]=SAVE.st[WEEKLY.find(x=>x.id===e.id).st]||0}}
function goalInfo(kind,e){const def=(kind==='daily'?DAILY:WEEKLY).find(x=>x.id===e.id),n=def.n[e.tier],cur=(SAVE.st[def.st]||0)-(SAVE.goals[kind].base[e.id]||0);return{def,n,cur:Math.min(n,Math.max(0,cur)),r:def.r[e.tier],t:def.t.replace('%n',n),done:cur>=n,cl:!!SAVE.goals[kind].cl[e.id]}}

  if(kind==='daily'||kind==='weekly'){const e=g[kind].list.find(x=>x.id===id);if(!e)return;const gi=goalInfo(kind,e);if(!gi.done||gi.cl)return;g[kind].cl[id]=1;r=gi.r}
  else{const def=LONG.find(x=>x.id===id);if(!def||g.long[id]||!def.f(SAVE))return;g.long[id]=1;r=def.r}
  SFX.coin();addCoins(r);addXp(Math.ceil(r/6));toast('Goal reward: +'+r+' 💰');updHud()}

function hostExec(kind,a,pid){const now=nowMs(),R=ok=>Object.assign({ok:ok?1:0},ok&&typeof ok==='object'?ok:{});

  switch(kind){

  case'water':{const k=key(a.x,a.z),t=W.tiles[k];if(!t||!t.t)return{ok:0,msg:'Till the soil first'};const nt=Object.assign({},t);if(!(nt.wu>now))nt.wf=now;nt.wu=now+WET_MS;setTile(k,nt,'water');return{ok:1,xp:1}}
  case'plant':{const k=key(a.x,a.z),t=W.tiles[k],cr=CROPS[a.crop];if(!t||!t.t||!cr)return{ok:0,msg:'Needs tilled soil'};if(t.c)return{ok:0,msg:'Already planted'};

    for(const[x,z] of list){const k=key(x,z),t=W.tiles[k];if(!t||!t.c)continue;const c=t.c;if(cropStage(c)<4)continue;const cr=CROPS[c.id];any++;
      let n=1+(a.luck&&Math.random()<.4?1:0);g.push([c.id,n]);xp+=cr.xp;
      const nt=Object.assign({},t);if(cr.rg)nt.c={id:c.id,p:c.p,g:Math.max(0,cropTotal(c.id)-cr.rg*60000),l:now,st:2};else delete nt.c;nt.c&&(nt.c.st=cropStage(nt.c));setTile(k,nt.c||nt.t||nt.sp?nt:null,'harvest')}

function genCode(){const a='ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.random()*a.length|0];return s}
function netCleanup(){try{if(NET.host)NET.host.close()}catch(e){}try{if(NET.peer&&!NET.peer.destroyed)NET.peer.destroy()}catch(e){}NET.peer=null;NET.host=null;NET.conns=[]}

function addPlayer(id,name,ci,hat,lvl){let p=NET.players.get(id);if(p){if(p.ci!==ci||p.hat!==hat){p.ci=ci;p.hat=hat;scene.remove(p.av.g);p.av=makeBlob(BODY_COLS[ci%8],hat);p.av.yawNow=p.yaw||0;scene.add(p.av.g)}p.name=name;p.lvl=lvl;return p}
  const av=makeBlob(BODY_COLS[ci%8],hat);av.yawNow=0;scene.add(av.g);const tag=document.createElement('div');tag.className='tag';tag.style.borderColor=BODY_COLS[ci%8];tag.textContent=name;$('tags').appendChild(tag);
  p={id,name,ci,hat,lvl,x:6.5,z:8.5,tx:6.5,tz:8.5,yaw:0,av,tag,mv:false,seen:false,conn:null};NET.players.set(id,p);return p}

function netUI(){const on=!!NET.role;$('roomChip').style.display=on&&G.mode==='play'?'flex':'none';$('roomChip').textContent=on?`🌍 ${NET.code} · ${NET.players.size+1} player${NET.players.size?'s':''}${NET.role==='client'?' · guest':' · host'}`:''}
function hostGame(tries=0){if(typeof Peer==='undefined'){toast('Online play is unavailable right now');return}if(NET.role==='client'){toast('Leave this farm first');return}if(NET.role==='host'&&!tries){toast('Already hosting: '+NET.code);return}
  netCleanup();clearPlayers();NET.role='host';NET.code=genCode();NET.nextId=2;const gen=++NET.gen;toast('Opening your farm…');
  let pr;try{pr=NET.peer=new Peer(PREFIX+NET.code,{config:{iceServers:ICE}})}catch(e){toast('Network not available');NET.role=null;return}
  pr.on('open',()=>{if(gen!==NET.gen)return;NET.id=1;netUI();toast('Farm open! Code '+NET.code);history.replaceState(null,'',location.pathname+location.search+'#'+NET.code)});
  pr.on('connection',c=>{if(gen!==NET.gen)return;c.on('data',m=>{if(gen===NET.gen)hostMsg(c,m)});c.on('close',()=>{if(gen===NET.gen)dropConn(c)});c.on('error',()=>{if(gen===NET.gen)dropConn(c)})});
  pr.on('error',e=>{if(gen!==NET.gen)return;if(e.type==='unavailable-id'&&tries<5)hostGame(tries+1);else if(!NET.id){toast('Could not open farm ('+e.type+')');netCleanup();NET.role=null;netUI()}else toast('Network hiccup: '+e.type)});
  pr.on('disconnected',()=>{if(gen===NET.gen&&!pr.destroyed){try{pr.reconnect()}catch(e){}}})}
function rosterMsg(){return{t:'roster',code:NET.code,players:[{id:NET.id,name:SAVE.name,ci:SAVE.ci,hat:SAVE.hat,lvl:SAVE.lvl},...[...NET.players.values()].map(p=>({id:p.id,name:p.name,ci:p.ci,hat:p.hat,lvl:p.lvl}))]}}

function hostMsg(conn,m){if(!m||typeof m!=='object')return;
  if(m.t==='hello'){if(conn._id)return;if(NET.players.size>=3){send(conn,{t:'roomfull'});setTimeout(()=>conn.close(),300);return}
    const id=NET.nextId++;conn._id=id;NET.conns.push(conn);const p=addPlayer(id,String(m.name||'Friend').slice(0,10),clamp(m.ci|0,0,7),HATS[m.hat]?m.hat:'none',m.lvl|0);p.conn=conn;
    send(conn,{t:'welcome',id,code:NET.code,now:Date.now(),w:W,host:SAVE.name,hci:SAVE.ci,hhat:SAVE.hat});sendRoster();toast(p.name+' joined your farm!');SFX.coin();return}
  const id=conn._id;if(!id)return;const p=NET.players.get(id);if(!p)return;
  switch(m.t){
  case'req':{const r=hostExec(m.k,m.a||{},id);send(conn,{t:'res',id:m.id,r});break}
  case'pos':p.tx=+m.x||0;p.tz=+m.z||0;p.yawT=+m.y||0;p.mv=!!m.m;if(!p.seen){p.seen=true;p.x=p.tx;p.z=p.tz;p.av.yawNow=p.yawT}m.id=id;bcast(m,conn);break;
  case'swing':case'held':m.id=id;if(m.t==='swing')remoteSwing(p,m);else setHeld(p.av,m.h||null);bcast(m,conn);break;
  case'prof':addPlayer(id,String(m.name||p.name).slice(0,10),clamp(m.ci|0,0,7),HATS[m.hat]?m.hat:'none',p.lvl);m.id=id;sendRoster();break;
  case'to':{const dest=m.to===NET.id?null:NET.players.get(m.to);if(m.to===NET.id){m.m.from=m.m.from||p.name;onMsg(m.m)}else if(dest&&dest.conn)send(dest.conn,m.m);break}
  case'lvl':p.lvl=m.lvl|0;sendRoster();break}}
function dropConn(conn){NET.conns=NET.conns.filter(c=>c!==conn);const id=conn._id;if(!id)return;conn._id=0;const p=NET.players.get(id);if(!p)return;dropPlayer(p);toast(p.name+' left');sendRoster()}
function joinGame(code){code=String(code||'').toUpperCase().trim();if(!/^[A-Z]{4}$/.test(code)){toast('Enter the 4-letter code');return}if(typeof Peer==='undefined'){toast('Online play is unavailable right now');return}
  if(NET.role)netLeave(true);netCleanup();clearPlayers();NET.role='client';NET.code=code;NET.id=0;const gen=++NET.gen;toast('Connecting to '+code+'…');
  let pr;try{pr=NET.peer=new Peer(undefined,{config:{iceServers:ICE}})}catch(e){toast('Network not available');NET.role=null;return}
  let ok=false;const fail=msg=>{if(ok||gen!==NET.gen)return;toast(msg);netLeave(false)};const to=setTimeout(()=>fail('Could not connect. Check the code and try again'),15000);
  pr.on('open',()=>{if(gen!==NET.gen)return;const c=pr.connect(PREFIX+code,{reliable:true});NET.host=c;
    c.on('open',()=>{if(gen!==NET.gen)return;ok=true;clearTimeout(to);send(c,{t:'hello',name:SAVE.name,ci:SAVE.ci,hat:SAVE.hat,lvl:SAVE.lvl})});

  pr.on('error',e=>{if(gen!==NET.gen)return;if(e.type==='peer-unavailable')fail('Farm '+code+' not found');else if(!ok)fail('Network error: '+e.type)})}
function netLeave(manual){const was=NET.role;NET.gen++;netCleanup();clearPlayers();NET.role=null;NET.code='';NET.id=0;NET.pending.forEach(r=>r({ok:0,msg:'Disconnected'}));NET.pending.clear();

function remoteSwing(p,m){const av=p.av;av.yawNow=Math.atan2(m.x+.5-p.x,m.z+.5-p.z);startSwing(av,m.k||'poke',.62,.48,()=>{})}
function onMsg(m){if(!m||typeof m!=='object')return;switch(m.t){
  case'welcome':{NET.id=m.id;clockOff=m.now-Date.now();W=m.w;G.inside=false;ME.x=6.5;ME.z=8.5;ME.vx=ME.vz=0;camTarget.set(6.5,0,8.5);loadWorldVisuals();netUI();toast(`Joined ${m.host||'the'} farm ${NET.code}!`);SFX.coin();syncHeld();updHud();break}
  case'roomfull':toast('That farm is full (4 players max)');netLeave(false);break;
  case'roster':{if(NET.role!=='client')break;const ids=new Set();for(const q of m.players){if(q.id===NET.id)continue;ids.add(q.id);addPlayer(q.id,q.name,q.ci,q.hat,q.lvl)}for(const p of[...NET.players.values()])if(!ids.has(p.id)){toast(p.name+' left');dropPlayer(p)}netUI();break}
  case'pos':{const p=NET.players.get(m.id);if(!p)break;p.tx=+m.x||0;p.tz=+m.z||0;p.yawT=+m.y||0;p.mv=!!m.m;if(!p.seen){p.seen=true;p.x=p.tx;p.z=p.tz;p.av.yawNow=p.yawT}break}
  case'swing':{const p=NET.players.get(m.id);if(p)remoteSwing(p,m);break}
  case'held':{const p=NET.players.get(m.id);if(p)setHeld(p.av,m.h||null);break}
  case'op':if(isClient())applyOp(m.o);break;
  case'full':if(isClient()){W=m.w;loadWorldVisuals()}break;
  case'an':if(isClient())for(const[id,x,z,y,mv] of m.a){const rt=animRT.get(id);if(rt){rt.tx=x;rt.tz=z;rt.yaw=y;rt.mv=mv}}break;
  case'res':{const f=NET.pending.get(m.id);if(f){NET.pending.delete(m.id);f(m.r)}break}
  case'gift':{if(!ITEMS[m.item])break;const n=clamp(m.n|0,1,999);invAdd(m.item,n);SFX.coin();toast(`🎁 ${m.from||'A friend'} sent you ${n}× ${ITEMS[m.item].e} ${ITEMS[m.item].n}!`,3500);drawHot();break}}}
function updRemote(dt,t){for(const p of NET.players.values()){const dx=p.tx-p.x,dz=p.tz-p.z;const d=Math.hypot(dx,dz);const k=Math.min(1,dt*10);p.x+=dx*k;p.z+=dz*k;if(d>8){p.x=p.tx;p.z=p.tz}
  const mv=d>.05||p.mv&&d>.01;if(mv&&d>.05&&!p.av.swing)p.av.yawNow=turnTo(p.av.yawNow,Math.atan2(dx,dz),dt*12);else if(!p.av.swing)p.av.yawNow=turnTo(p.av.yawNow,p.yawT||0,dt*8);p.moving=mv;p.av.g.position.set(p.x,0,p.z);animAvatar(p.av,t,dt,mv)}}
