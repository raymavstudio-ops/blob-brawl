function monH(){const m=monBy(PS.mon.uid);if(!m){closeP();return''}tickMon(m,now());const sp=SPECIES[m.sp],st=mStats(m),pr=PERS[m.pers];P.title=m.name;
 if(PS.mon.sub==='rename')return`<div class="box"><b>Rename ${esc(m.name)}</b><input type="text" id="rnIn" maxlength="12" value="${esc(m.name)}"><button class="btn green" data-a="renameOk">Save name</button><button class="btn ghost" data-a="monSub" data-v="">Cancel</button></div>`;
 if(PS.mon.sub==='feed'){const foods=Object.keys(S.items).filter(k=>FOODS[k]||k==='tonic');return`<div class="row"><img class="pic" src="${portrait(m)}"><div style="flex:1">Hunger ${bar(m.hun,100,'#ff9f43')}<div class="note">Mood ${bar(m.mood,100,'#ff6fb5')}</div></div></div>${Hh('Choose food')}<div class="grid">${foods.map(k=>`<div class="mc" data-a="feedWith" data-v="${k}"><div style="font-size:34px;width:46px;text-align:center">${ITEMS[k].ic}</div><div class="t"><b>${ITEMS[k].n} ×${S.items[k]}</b>${ITEMS[k].d}${ITEMS[k].el===sp.el?' <b style="color:#e0508f">Favorite!</b>':''}</div></div>`).join('')||'<div class="note">No food. Visit the Food Shop!</div>'}</div><button class="btn ghost" data-a="monSub" data-v="">Back</button>`}
 const need=m.stage<2?`Evolves at Lv ${STAGE_LV[m.stage+1]} with bond ❤${STAGE_BOND[m.stage+1]}`:'Fully evolved';
 return`<div class="two"><div class="a"><div style="text-align:center"><img class="pic big" src="${portrait(m)}" alt=""></div><div style="text-align:center;margin-top:4px">${elChip(sp.el)} <span class="el" style="background:#8a8fb0">${m.pers}</span>${m.sh?' <span class="el" style="background:#e8a000">✨ Shiny</span>':''}</div>
  <div class="note" style="text-align:center">${esc(stageName(m))} · stage ${m.stage+1}<br>${need}</div>
  <div class="stat"><span>Level</span>${bar(m.xp,m.lvl>=50?1:xpNeed(m.lvl),'#7ee36a')}<span>${m.lvl}</span></div>
  <div class="stat"><span>Hunger</span>${bar(m.hun,100,'#ff9f43')}<span></span></div><div class="stat"><span>Mood</span>${bar(m.mood,100,'#ff6fb5')}<span>${{happy:'😊',ok:'🙂',sleepy:'😴',grumpy:'😠'}[moodOf(m)]}</span></div>
  <div class="stat"><span>Energy</span>${bar(m.sta,100,'#4cc9ff')}<span></span></div><div class="stat"><span>Bond</span><span style="grid-column:span 2">${heartsH(m)}</span></div></div>
 <div class="b">${STN.map((n,i)=>`<div class="stat"><span style="color:${STC[i]}">${n}</span>${bar(st[i],i?260:520,STC[i])}<span>${st[i]}</span></div>`).join('')}<div class="note">Training bonus: ${m.tp.map((x,i)=>STN[i][0]+x).join(' ')}${m.pers?` · ${m.pers}: ▲${STN[pr[0]]} ▼${STN[pr[1]]}`:''}</div>
  ${Hh('Moves')}<div>${m.moves.map(id=>{const mv=MV[id];return`<span class="el" style="background:${EL[mv.el].c};margin:2px;padding:2px 8px;font-size:13px">${mv.n}${mv.k==='a'?' '+mv.p:''}</span>`}).join('')}</div>
  <div class="note">Bond move: ${MV['b_'+sp.el].n} (needs ❤2)</div>
  <button class="btn green" data-a="monSub" data-v="feed">🍎 Feed</button><button class="btn pink" data-a="petGo">❤ Pet</button>
  <div class="row"><button class="btn sm ghost" data-a="monSub" data-v="rename">✏️ Rename</button><button class="btn sm ${S.team.includes(m.uid)?'blue':'ghost'}" data-a="teamTog" data-v="${m.uid}">⚔️ ${S.team.includes(m.uid)?'In team':'Add to team'}</button><button class="btn sm ${m.out?'blue':'ghost'}" data-a="outTog" data-v="${m.uid}">🌿 ${m.out?'In pasture':'In barn'}</button><button class="btn sm ${S.lead===m.uid?'blue':'ghost'}" data-a="leadTog" data-v="${m.uid}">🐾 Follow me</button></div>
  <button class="btn sm red" data-a="relGo">${PS.mon.conf?'Really release?':'Release'}</button></div></div>`}
ACT.monSub=v=>{PS.mon.sub=v;PS.mon.conf=0;renderP()};
ACT.petGo=()=>{const m=monBy(PS.mon.uid);if(m){petMon(m);renderP()}};
ACT.feedWith=v=>{const m=monBy(PS.mon.uid);if(!m)return;if(v==='tonic'){if(S.items.tonic){m.sta=Math.min(100,m.sta+50);addItem('tonic',-1);SFX.heal();toast(m.name+' feels energized!')}}else feedMon(m,v);PS.mon.sub='';renderP()};
ACT.renameOk=()=>{const m=monBy(PS.mon.uid),v=$('rnIn').value.trim().slice(0,12);if(m&&v){m.name=v;saveDirty=true;const p=R.pm.get(m.uid);}PS.mon.sub='';renderP()};
ACT.teamTog=v=>{v=+v;const i=S.team.indexOf(v);const m=monBy(v);if(i>=0){if(S.team.length>1)S.team.splice(i,1);else toast('You need at least one monster in your team')}else{if(m&&m.exp){toast('That monster is on an expedition');return}if(S.team.length>=3)toast('Team is full (3). Remove one first.');else S.team.push(v)}saveDirty=true;renderP()};
ACT.outTog=v=>{const m=monBy(+v);if(!m)return;if(!m.out&&S.mons.filter(x=>x.out&&!x.exp).length>=outCap()){toast('Pasture is full ('+outCap()+')');return}m.out=!m.out;if(!m.out&&S.lead===m.uid)S.lead=0;syncPasture();saveDirty=true;renderP()};
ACT.leadTog=v=>{v=+v;S.lead=S.lead===v?0:v;const m=monBy(v);if(m&&!m.out){m.out=true}syncPasture();saveDirty=true;renderP()};
ACT.relGo=()=>{const m=monBy(PS.mon.uid);if(!m)return;if(S.mons.length<=1){toast('You need to keep one monster!');return}if(!PS.mon.conf){PS.mon.conf=1;renderP();return}
 const rw=m.lvl*5+10;S.mons.splice(S.mons.indexOf(m),1);S.team=S.team.filter(u=>u!==m.uid);if(S.lead===m.uid)S.lead=0;if(!S.team.length&&S.mons[0])S.team.push(S.mons[0].uid);addCoins(rw);syncPasture();toast(m.name+' went to a loving home. +'+rw+' coins');closeP();ACT.barn()};
/* ---- shop ---- */
ACT.shop=()=>{PS.shop.tab='food';openP('Food Shop',shopH);tutAdv(3)};
ACT.shopTab=v=>{PS.shop.tab=v;renderP()};
const SHOPFOOD=['apple','stew','s_fire','s_water','s_leaf','s_spark','s_rock','s_spirit','tonic','warmer','cake'];
const EGGEL=[['leaf',1],['fire',1],['water',1],['spark',3],['rock',3],['spirit',6]];
function shopH(){const t=PS.shop.tab,tabs=tabsH(t,[['food','🍎 Food'],['eggs','🥚 Eggs'],['kitchen','🍳 Kitchen'],['sell','💰 Sell']],'shopTab');
 const own=k=>S.items[k]||0;
 if(t==='food')return tabs+`<div class="grid">${SHOPFOOD.map(k=>`<div class="mc" data-a="buy" data-v="${k}"><div style="font-size:34px;width:46px;text-align:center">${ITEMS[k].ic}</div><div class="t"><b>${ITEMS[k].n}</b>${ITEMS[k].d}<br>💰${ITEMS[k].pr} · own ${own(k)}</div></div>`).join('')}</div>`;
 if(t==='eggs')return tabs+`<div class="note">Mystery eggs hatch in a few minutes in the Incubator. Stored eggs: ${S.eggs.length}/8</div><div class="grid">${EGGEL.map(([e,l])=>{const lock=S.rl<l;return`<div class="mc ${lock?'dis':''}" data-a="buyEgg" data-v="${e}" style="${lock?'opacity:.5':''}"><div style="font-size:36px;width:46px;text-align:center">🥚</div><div class="t"><b>${EL[e].n} Egg</b>${lock?'🔒 Ranch Lv '+l:'💰90'}</div></div>`}).join('')}</div>`;
 if(t==='kitchen')return tabs+`<div class="note">Mix ingredients from expeditions into training treats!</div><div class="grid">${RECIPES.map(r=>{const ok=own(r[1])&&own(r[2]);return`<div class="mc" data-a="craft" data-v="${r[0]}" style="${ok?'':'opacity:.55'}"><div style="font-size:34px;width:46px;text-align:center">${ITEMS[r[0]].ic}</div><div class="t"><b>${ITEMS[r[0]].n}</b>${ITEMS[r[1]].ic}${ITEMS[r[1]].n} + ${ITEMS[r[2]].ic}${ITEMS[r[2]].n}<br>own ${own(r[0])}</div></div>`}).join('')}</div>`;
 const ing=Object.keys(S.items).filter(k=>ITEMS[k].ing);return tabs+`<div class="grid">${ing.map(k=>`<div class="mc" data-a="sell" data-v="${k}"><div style="font-size:34px;width:46px;text-align:center">${ITEMS[k].ic}</div><div class="t"><b>${ITEMS[k].n} ×${S.items[k]}</b>Sell 1 for 💰${ITEMS[k].pr}</div></div>`).join('')||'<div class="note">No ingredients. Send monsters on expeditions!</div>'}</div>`}
ACT.buy=k=>{const it=ITEMS[k];if(S.coins<it.pr){toast('Not enough coins');SFX.no();return}addCoins(-it.pr);addItem(k,1);SFX.coin();renderP()};
ACT.buyEgg=e=>{const l=EGGEL.find(x=>x[0]===e)[1];if(S.rl<l)return;if(S.coins<90){toast('Not enough coins');SFX.no();return}if(S.eggs.length>=8){toast('Egg storage full');return}
 const pool=SPL.filter(s=>s.el===e&&s.tier<2&&(s.tier===0||S.rl>=4));addCoins(-90);S.eggs.push(mkEgg(pick(pool).id));SFX.ok();toast('🥚 Got a '+EL[e].n+' egg!');renderP()};
ACT.craft=id=>{const r=RECIPES.find(x=>x[0]===id);if(!S.items[r[1]]||!S.items[r[2]]){toast('Missing ingredients');SFX.no();return}addItem(r[1],-1);addItem(r[2],-1);addItem(id,1);SFX.ok();toast('Cooked '+ITEMS[id].n+'!');renderP()};
ACT.sell=k=>{if(!S.items[k])return;addItem(k,-1);addCoins(ITEMS[k].pr,true);renderP()};
/* ---- incubator ---- */
ACT.inc=()=>openP('Incubator',incH);
function incH(){let h='<div class="note">Eggs hatch in real time, even when you are away.</div><div class="grid">';
 for(let i=0;i<incSlots();i++){const s=S.inc[i];if(!s){h+=`<div class="mc" style="cursor:default"><div class="pic" style="display:flex;align-items:center;justify-content:center;font-size:28px">➕</div><div class="t"><b>Slot ${i+1}</b>Empty</div></div>`;continue}
  const left=s.egg.dur-(now()-s.t0),rd=left<=0;h+=`<div class="mc" style="flex-wrap:wrap"><img src="${eggPortrait(s.egg)}" alt=""><div class="t" style="flex:1"><b>${rd?'Ready to hatch!':fmtT(left)}</b>${bar(s.egg.dur-Math.max(0,left),s.egg.dur,'#ffd23f')}</div>${rd?`<button class="btn sm pink" data-a="hatch" data-v="${i}">Hatch!</button>`:S.items.warmer?`<button class="btn sm" data-a="warm" data-v="${i}">♨️ Warm (${S.items.warmer})</button>`:''}</div>`}
 h+=`</div>${Hh('Stored eggs ('+S.eggs.length+')')}<div class="grid">${S.eggs.map((e,i)=>`<div class="mc" data-a="place" data-v="${i}"><img src="${eggPortrait(e)}" alt=""><div class="t"><b>${e.sh?'✨ ':''}Egg</b>${fmtT(e.dur)}<br>Tap to incubate</div></div>`).join('')||'<div class="note">No stored eggs. Buy one, breed, or explore!</div>'}</div>`;return h}
ACT.place=i=>{i=+i;const e=S.eggs[i];const s=S.inc.slice(0,incSlots()).findIndex(x=>!x);if(!e)return;if(s<0){toast('All incubator slots are full');return}S.eggs.splice(i,1);S.inc[s]={egg:e,t0:now()};SFX.ok();saveDirty=true;renderP()};
ACT.warm=i=>{const s=S.inc[+i];if(!s||!S.items.warmer)return;s.t0-=10*60e3;addItem('warmer',-1);SFX.heal();renderP()};
ACT.hatch=i=>{i=+i;const s=S.inc[i];if(!s||now()-s.t0<s.egg.dur)return;if(S.mons.length>=cap()){toast('Your barn is full! Release or rest someone first.');return}closeP();S.inc[i]=null;const e=s.egg;
 const m=newMon(e.sp,{iv:e.iv,hue:e.hue,pat:e.pat,pc:e.pc,sh:e.sh,moves:e.moves,inh:e.moves});m.out=S.mons.filter(x=>x.out).length<outCap();addMon(m);bump('hatched');if(m.sh)toast('✨ SHINY!!',3000);addRanchXp(8);tutAdv(5);syncPasture();G.queue.unshift(()=>cinHatch(m,e));saveDirty=true;saveNow()};

const TGAMES=[['Tap Race','Tap fast to build endurance'],['Power Smash','Stop the bar in the green'],['Rock Block','Tap lanes to block rocks'],['Hurdle Dash','Tap to jump the hurdles'],['Cup Shuffle','Find the ball under the cups']];
ACT.train=()=>{PS.train.uid=0;openP('Training Grounds',trainH)};
function trainH(){const m=monBy(PS.train.uid);
 if(!m)return`<div class="note">Training uses ⚡25 energy. Rest to recover energy over time.</div><div class="grid">${S.mons.filter(x=>!x.exp).map(x=>{tickMon(x,now());return monCard(x,'trainPick',false,` ⚡${Math.floor(x.sta)}`)}).join('')}</div>`;
 tickMon(m,now());return`<div class="row"><img class="pic" src="${portrait(m)}"><div style="flex:1"><b>${esc(m.name)}</b> Lv ${m.lvl}${bar(m.sta,100,'#4cc9ff')}<div class="note">Energy ${Math.floor(m.sta)}/100</div></div><button class="btn sm ghost" data-a="trainPick" data-v="0">Change</button></div>${Hh('Choose a drill')}<div class="grid">${TGAMES.map((g,i)=>`<div class="mc" data-a="trainGo" data-v="${i}" style="${m.sta<25?'opacity:.5':''}"><div class="t"><b style="color:${STC[i]}">${STN[i]}: ${g[0]}</b>${g[1]}<br>Trained +${m.tp[i]}/120</div></div>`).join('')}</div>`}
ACT.trainPick=v=>{PS.train.uid=+v;renderP()};
ACT.trainGo=v=>{const m=monBy(PS.train.uid);if(!m)return;tickMon(m,now());if(m.sta<25){toast(m.name+' is too tired. Let it rest!');SFX.no();return}if(m.hun<10){toast(m.name+' is too hungry to train!');return}
 startMini(+v,m,score=>{m.sta-=25;const i=+v,g=Math.round(2+score*9+(moodOf(m)==='happy'?1:0));const real=Math.min(120,m.tp[i]+g)-m.tp[i];m.tp[i]+=real;m.mood=Math.min(100,m.mood+4);m.bond+=1;m.hun=Math.max(0,m.hun-6);const x=gainXp(m,8+Math.round(score*16),true);bump('trained');addRanchXp(4);
  const rank=score>.85?'PERFECT!':score>.6?'Great!':score>.3?'Good':'Keep trying';toast(`${rank} ${m.name}: ${STN[i]} +${real}`+(x.lv?` · Level up! Lv ${m.lvl}`:''),3400);if(x.lv)SFX.lvl();saveNow();renderP()})};

ACT.arena=()=>openP('Arena',arenaH);
ACT.arTab=v=>{PS.arena.tab=v;renderP()};
const TIERS=[['Rookie',0],['Bronze',50],['Silver',150],['Gold',300],['Platinum',500],['Master',800]];
const tierOf=p=>{let t=0;TIERS.forEach((x,i)=>{if(p>=x[1])t=i});return t};
function teamH(){return`<div class="note">Your battle team (up to 3). Tap to add or remove.</div><div class="grid">${S.mons.filter(m=>!m.exp).map(m=>monCard(m,'teamTog2',S.team.includes(m.uid),S.team.includes(m.uid)?' ⚔️':'')).join('')}</div>`}
ACT.teamTog2=v=>{ACT.teamTog(v)};
function arenaH(){const t=PS.arena.tab,tabs=tabsH(t,[['cups','🏆 Cups'],['weekly','📅 Weekly Cup'],['league','🏅 League'],['team','⚔️ Team']],'arTab');const tm=S.team.map(monBy).filter(Boolean);
 const tb=`<div class="row" style="margin-bottom:6px">${tm.map(m=>`<img class="pic" style="width:44px;height:44px" src="${portrait(m)}">`).join('')}<div class="note">Team Lv ${tm.length?Math.round(tm.reduce((a,m)=>a+m.lvl,0)/tm.length):0}</div></div>`;
 if(t==='team')return tabs+teamH();
 if(t==='cups')return tabs+tb+CUPS.map((c,i)=>{const lock=S.rl<c.rl||(i>0&&!S.cups[CUPS[i-1].id]);return`<div class="box row"><div style="font-size:36px">${c.ic}</div><div style="flex:1"><b>${c.n}</b> ${S.cups[c.id]?'✅':''}<div class="note">Opponents Lv ${c.lvl[0]}–${c.lvl[1]} · 3 rounds · Prize 💰${c.pr}${lock?' · 🔒 '+(S.rl<c.rl?'Ranch Lv '+c.rl:'Win the previous cup'):''}</div></div><button class="btn sm ${lock?'dis':''}" data-a="cupGo" data-v="${c.id}">Enter</button></div>`}).join('');
 if(t==='weekly'){const w=weekId();if(S.weekly.week!==w)S.weekly={week:w,done:false,claimed:false,best:0};const r=mulberry(w*7919);const opp=[0,1,2].map(()=>SPL[(r()*SPL.length)|0]);
  return tabs+tb+`<div class="box"><b>🌟 Weekly Cup #${w}</b><div class="note">Everyone gets the same seeded bracket this week! 3 rounds, opponents scale with your team. One attempt per week.</div><div class="row">${opp.map(o=>`<img class="pic" style="width:50px;height:50px" src="${dexPortrait(o.id,1)}"><span class="note">${o.names[1]}</span>`).join('')}</div>
  <div class="note">Best this week: ${S.weekly.best}/3 rounds ${S.weekly.done?'· attempted':''}</div><button class="btn pink ${S.weekly.done?'dis':''}" data-a="weeklyGo">${S.weekly.done?'Come back next week':'Enter Weekly Cup'}</button></div>${boardH()}`}
 const tr=tierOf(S.league.pts),cs=Math.floor(weekId()/4),old=S.league.season<cs;
 return tabs+`<div class="box"><b>🏅 League Season ${S.league.season+1}</b><div class="note">Earn points from cups, weekly cups and PvP. Seasons last 4 weeks.</div><div style="font:400 28px 'Lilita One'">${TIERS[tr][0]} · ${S.league.pts} pts</div>${bar(S.league.pts,TIERS[Math.min(5,tr+1)][1]||1,'#ffd23f')}<div class="note">${tr<5?'Next: '+TIERS[tr+1][0]+' at '+TIERS[tr+1][1]+' pts':'Top rank!'}</div>
  ${old?`<button class="btn pink" data-a="seasonClaim">Claim season reward 💰${tr*300+100}${tr>=3?' + egg':''}</button>`:'<div class="note">Season reward arrives when the season ends.</div>'}</div>`}
function boardH(){const b=Object.assign({},net.role==='client'&&net.townView?net.townView.board:S.town.board);const rows=Object.entries(b).sort((x,y)=>y[1]-x[1]);return rows.length?`<div class="box"><b>Town leaderboard (weekly)</b>${rows.map(r=>`<div class="note">${esc(r[0])}: ${r[1]}/3</div>`).join('')}</div>`:''}
ACT.seasonClaim=()=>{const tr=tierOf(S.league.pts);addCoins(tr*300+100,true);if(tr>=3&&S.eggs.length<8)S.eggs.push(mkEgg(pick(SPL.filter(s=>s.tier===1)).id,{}));S.league={season:Math.floor(weekId()/4),pts:0};toast('Season reward claimed!');renderP()};

ACT.map=()=>{PS.map.party=[];openP('Explorer Tent',mapH)};
ACT.mapSel=v=>{PS.map.sel=+v;renderP()};ACT.mapDur=v=>{PS.map.dur=+v;renderP()};
ACT.mapParty=v=>{v=+v;const a=PS.map.party,i=a.indexOf(v);if(i>=0)a.splice(i,1);else if(a.length<3)a.push(v);renderP()};
function mapH(){const sel=AREAS[PS.map.sel],lock=a=>S.rl<a.lv;let svg='<svg viewBox="0 0 100 50" preserveAspectRatio="none"><path d="M10,34 C25,10 30,20 38,17 S50,36 58,33 S70,10 76,15 S86,30 88,34" fill="none" stroke="#c79d63" stroke-width="2.5" stroke-dasharray="1 2" stroke-linecap="round"/><ellipse cx="50" cy="48" rx="70" ry="9" fill="#7fd3ff" opacity=".6"/></svg>';
 const busy=S.exps.length,fin=S.exps.filter(e=>now()>=e.t0+e.dur);
 let h=`<div class="map">${svg}${AREAS.map(a=>`<button class="node ${lock(a)?'lock':''} ${a.id===PS.map.sel?'sel':''}" data-a="mapSel" data-v="${a.id}" style="left:${a.x}%;top:${a.y}%" aria-label="${a.n}">${a.ic}</button>`).join('')}</div>`;
 h+=`<div class="box"><b>${sel.ic} ${sel.n}</b> ${lock(sel)?'🔒 Ranch Lv '+sel.lv:''}<div class="note">Wild monsters Lv ${sel.lvl[0]}–${sel.lvl[1]} · ${sel.els.map(e=>EL[e].i).join('')} · Finds: ${sel.ing.map(i=>ITEMS[i].ic).join(' ')} eggs</div>
 <button class="btn pink ${lock(sel)?'dis':''}" data-a="wildGo" data-v="${sel.id}">⚔️ Wild battle (your team)</button></div>`;
 if(!lock(sel)){h+=`<div class="box"><b>Send an expedition</b> (${S.exps.length}/${expSlots()} out)<div class="tabs" style="margin-top:6px">${DUR.map((d,i)=>`<button class="tab ${PS.map.dur===i?'on':''}" data-a="mapDur" data-v="${i}">${d[1]}<br><small>${fmtT(d[0]*1000)}</small></button>`).join('')}</div><div class="note">Choose up to 3 monsters. Matching elements find more!</div><div class="grid">${S.mons.filter(m=>!m.exp).map(m=>monCard(m,'mapParty',PS.map.party.includes(m.uid),` ⚡${Math.floor(m.sta)}`)).join('')}</div>

ACT.friend=id=>{PS.friends.focus=+id;openP('Friends & Co-op',friendsH)};
function friendsH(){let h='';
 if(!net.role){return`<div class="note">Play together! The host owns the shared ranch town. Everyone keeps their own monsters and items on their own phone. Up to 4 players.</div><button class="btn pink" data-a="hostGo">🏠 Host a ranch town</button><div class="row" style="margin-top:8px"><input type="text" id="joinIn" maxlength="4" placeholder="CODE" style="text-transform:uppercase;text-align:center;letter-spacing:6px;font-family:'Lilita One'"><button class="btn blue" style="width:auto;margin:0" data-a="joinGo">Join</button></div><div class="note">Or open a friend's invite link. Solo play is always available.</div>`}
 h+=`<div class="box" style="text-align:center"><div class="note">${net.role==='host'?'You are hosting. Friends join with this code:':'Joined ranch'}</div><div style="font:400 44px 'Lilita One';letter-spacing:8px;color:#4cc9ff;-webkit-text-stroke:2px #1d1b3a;paint-order:stroke fill">${net.code||'····'}</div>${net.role==='host'?'<button class="btn sm green" data-a="shareLink">📨 Share invite link</button>':''}<button class="btn sm red" data-a="leaveGo">${net.role==='host'?'Stop hosting':'Leave'}</button></div>`;
 const others=net.plist.filter(p=>p.id!==net.id);h+=Hh('Players ('+net.plist.length+'/4)')+(others.length?'':'<div class="note">Waiting for friends to join...</div>');
 h+=others.map(p=>{const l=p.lite||{top:[],rl:1,n:0};return`<div class="box"><div class="row"><b style="flex:1;font:400 20px 'Lilita One';color:${PCOL[p.ci%4]};-webkit-text-stroke:.6px #1d1b3a;paint-order:stroke fill">${esc(p.name)}</b><span class="note">Ranch Lv ${l.rl} · ${l.n} monsters</span></div><div class="row">${l.top.map(x=>`<img class="pic" style="width:44px;height:44px" src="${portrait(x)}" alt="">`).join('')}</div>
  <button class="btn sm" data-a="visitGo" data-v="${p.id}">🏡 Visit</button><button class="btn sm" data-a="giftGo" data-v="${p.id}">🎁 Gift</button><button class="btn sm pink" data-a="challengeGo" data-v="${p.id}">⚔️ Challenge</button><button class="btn sm blue" data-a="tradeGo" data-v="${p.id}">🔄 Trade</button></div>`}).join('');return h}
ACT.hostGo=()=>{hostGame();renderP()};ACT.joinGo=()=>{const v=$('joinIn').value;joinGame(v)};ACT.leaveGo=()=>{leaveNet('Left the session');renderP()};
ACT.shareLink=async()=>{const url=location.href.split('#')[0].split('?')[0]+'#'+net.code,txt='Join my Monster Ranch! Code '+net.code;try{if(navigator.share){await navigator.share({title:'Monster Ranch',text:txt,url});return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(url);toast('Invite link copied!')}catch(e){toast(url,6000)}};
ACT.visitGo=id=>{net.sendTo(+id,{t:'rosterReq'});toast('Visiting...')};
function rosterH(){const r=PS.friends.roster;return`<div class="note">${esc(r.name)} · Ranch Lv ${r.rl} · ${r.mons.length} monsters. Their monsters are wandering in the shared pasture too!</div><div class="grid">${r.mons.map(x=>`<div class="mc" style="cursor:default"><img src="${portrait(x)}" alt=""><div class="t"><b>${esc(x.name)}${x.sh?' ✨':''}</b>Lv ${x.lvl} ${EL[SPECIES[x.sp].el].i} ${x.pers}<br>HP${x.st[0]} P${x.st[1]} G${x.st[2]} S${x.st[3]}</div></div>`).join('')}</div><button class="btn" data-a="friends">Back</button>`}
ACT.giftGo=id=>{PS.friends.gift=+id;openP('Send a gift',giftH)};
function giftH(){const ks=Object.keys(S.items);return`<div class="note">Give 1 item to ${esc(plName(PS.friends.gift))}.</div><div class="grid">${ks.map(k=>`<div class="mc" data-a="giftSend" data-v="${k}"><div style="font-size:34px;width:46px;text-align:center">${ITEMS[k].ic}</div><div class="t"><b>${ITEMS[k].n} ×${S.items[k]}</b>Tap to send 1</div></div>`).join('')||'<div class="note">Nothing to give.</div>'}</div><button class="btn" data-a="friends">Back</button>`}
ACT.giftSend=k=>{if(!S.items[k])return;addItem(k,-1);net.sendTo(PS.friends.gift,{t:'gift',item:k,n:1});SFX.ok();toast('Gift sent!');renderP()};
ACT.challengeGo=id=>{if(!S.team.length){toast('Build a team first');return}net.sendTo(+id,{t:'chal'});closeP();toast('Challenge sent to '+plName(+id)+'...')};
ACT.tradeGo=id=>{TR={peer:+id,role:'tx',mine:0};openP('Trade: choose your monster',tradeTxH)};
function tradeTxH(){if(!TR)return'';if(TR.step==='confirm'){const o=monBy(TR.mine),t=TR.theirs;return`<div class="row"><div class="box" style="flex:1;text-align:center"><img class="pic" src="${portrait(o)}"><br>${esc(o.name)} Lv${o.lvl}</div><div style="font-size:26px">🔄</div><div class="box" style="flex:1;text-align:center"><img class="pic" src="${portrait(t)}"><br>${esc(t.name)} Lv${t.lvl}</div></div><button class="btn green" data-a="tradeConfirm">Confirm trade</button><button class="btn ghost" data-a="tradeCancel">Cancel</button>`}
 if(TR.step==='wait')return`<div class="note">Waiting for ${esc(plName(TR.peer))} to pick a monster...</div><button class="btn ghost" data-a="tradeCancel">Cancel</button>`;
 return`<div class="note">Pick a monster to offer to ${esc(plName(TR.peer))}. They will choose one to swap back.</div><div class="grid">${S.mons.filter(m=>!m.exp).map(m=>monCard(m,'tradeOffer')).join('')}</div>`}
ACT.tradeOffer=v=>{if(S.mons.length<=1){toast('Keep at least one monster!');return}TR.mine=+v;TR.step='wait';net.sendTo(TR.peer,{t:'tradeOffer',mon:fullMon(monBy(+v))});renderP()};
function tradeRxH(){if(!TR)return'';const t=TR.theirs;return`<div class="box" style="text-align:center"><b>${esc(plName(TR.peer))} offers</b><br><img class="pic" src="${portrait(t)}"><br>${esc(t.name)} Lv${t.lvl} ${EL[SPECIES[t.sp].el].i} ${t.pers}</div><div class="note">Choose one of your monsters to offer back:</div><div class="grid">${S.mons.filter(m=>!m.exp).map(m=>monCard(m,'tradeCounter')).join('')}</div><button class="btn ghost" data-a="tradeDecline">Decline</button>`}
ACT.tradeCounter=v=>{if(S.mons.length<=1){toast('Keep at least one monster!');return}TR.mine=+v;net.sendTo(TR.peer,{t:'tradeCounter',mon:fullMon(monBy(+v))});openP('Waiting...',()=>`<div class="note">Waiting for ${esc(plName(TR.peer))} to confirm...</div><button class="btn ghost" data-a="tradeCancel">Cancel</button>`)};
ACT.tradeDecline=()=>{if(TR)net.sendTo(TR.peer,{t:'tradeNo'});TR=null;closeP()};ACT.tradeCancel=()=>{if(TR)net.sendTo(TR.peer,{t:'tradeNo'});TR=null;closeP()};
ACT.tradeConfirm=()=>{const o=monBy(TR.mine);if(!o){TR=null;closeP();return}const peer=TR.peer,got=fullMon(TR.theirs);net.sendTo(peer,{t:'tradeFinal',mon:fullMon(o)});S.mons.splice(S.mons.indexOf(o),1);S.team=S.team.filter(u=>u!==o.uid);if(S.lead===o.uid)S.lead=0;got.exp=false;got.out=false;got.t=now();addMon(got);if(!S.team.length)S.team.push(got.uid);bump('trades');syncPasture();SFX.win();toast('Trade complete! Welcome '+got.name+'!',3500);saveNow();TR=null;closeP()};
/* ================= title / start ================= */
const PT={newSlot:-1,del:-1,msg:''};
function renderSlots(){let h='';if(PT.newSlot>=0)h=`<div class="slot" style="display:block"><b style="font:400 20px 'Lilita One'">Name your rancher</b><input type="text" id="newName" maxlength="12" placeholder="Rancher name" value="${esc(localStorage.getItem('mr_name')||'')}"><button class="btn green" data-a="slotStart" data-v="${PT.newSlot}">Start ranch!</button><button class="btn ghost" data-a="slotCancel">Cancel</button></div>`;
 else for(let i=0;i<3;i++){const m=slotMeta(i);h+=m?`<div class="slot"><div class="t"><b>${esc(m.name)}</b>Ranch Lv ${m.rl} · ${m.n} monsters · 💰${m.coins}<br>${new Date(m.t).toLocaleDateString()}</div><button class="btn" data-a="slotCont" data-v="${i}">Continue</button><button class="btn ghost" data-a="slotDel" data-v="${i}" aria-label="delete">${PT.del===i?'Sure?':'🗑'}</button></div>`:`<div class="slot"><div class="t"><b>Slot ${i+1}</b>Empty</div><button class="btn pink" data-a="slotNew" data-v="${i}">New Ranch</button></div>`}
 $('slots').innerHTML=h+(PT.msg?`<div class="note">${PT.msg}</div>`:'')}
ACT.slotNew=v=>{PT.newSlot=+v;renderSlots()};ACT.slotCancel=()=>{PT.newSlot=-1;renderSlots()};
ACT.slotStart=v=>{const n=($('newName').value||'').trim().slice(0,12)||'Rancher';try{localStorage.setItem('mr_name',n)}catch(e){}PT.newSlot=-1;startGame(+v,n)};
ACT.slotCont=v=>startGame(+v);
ACT.slotDel=v=>{v=+v;if(PT.del!==v){PT.del=v;renderSlots();return}try{localStorage.removeItem(SLOTK(v))}catch(e){}PT.del=-1;renderSlots()};
ACT.import=()=>openP('Import save',()=>`<div class="note">Paste a save code, then choose a slot.</div><textarea id="impBox" spellcheck="false" placeholder="MR1:..."></textarea><div class="note">${PT.impMsg||''}</div>${[0,1,2].map(i=>`<button class="btn ${slotMeta(i)?'ghost':'green'}" data-a="impSlot" data-v="${i}">Into slot ${i+1}${slotMeta(i)?' (replaces '+esc(slotMeta(i).name)+')':''}</button>`).join('')}`);
ACT.impSlot=async v=>{try{const s=await decodeSave($('impBox').value);if(!s.mons)throw 0;localStorage.setItem(SLOTK(+v),JSON.stringify(s));PT.impMsg='';closeP();renderSlots();toast('Imported into slot '+(+v+1))}catch(e){PT.impMsg='That code could not be read.';renderP()}};
const STARTERS=[{sp:'emberpup',hue:0,pat:0,pc:0,sh:0},{sp:'splishy',hue:0,pat:0,pc:0,sh:0},{sp:'sproutle',hue:0,pat:0,pc:0,sh:0}];
function starterH(){return`<div style="text-align:center;font:400 22px 'Lilita One'">Pick your first egg!</div><div class="note" style="text-align:center">It hatches right away. Choose the element you like.</div><div class="grid">${STARTERS.map(s=>`<div class="mc" data-a="starter" data-v="${s.sp}"><img src="${eggPortrait(Object.assign({},s,{pat:1}))}" alt=""><div class="t"><b>${EL[SPECIES[s.sp].el].i} ${EL[SPECIES[s.sp].el].n} egg</b>${SPECIES[s.sp].names[0]}</div></div>`).join('')}</div>`}
ACT.starter=sp=>{const e=mkEgg(sp,{sh:0,dur:1,hue:0,pat:1,pc:0});const m=newMon(sp,{sh:0,iv:e.iv,hue:0,pat:0,pc:0,lvl:3});m.out=true;addMon(m);S.lead=m.uid;S.tut=1;S.team=[m.uid];bump('hatched');syncPasture();closeP();G.queue.unshift(()=>cinHatch(m,e));saveNow()};
async function startGame(i,name){audio();G.fast=G.fast||false;let away=0;try{if(name!==undefined){S=newSave(name)}else{S=migrate(JSON.parse(localStorage.getItem(SLOTK(i))));away=now()-S.t}}catch(e){PT.msg='That save could not be loaded.';renderSlots();return}
 SLOT=i;G.ph='ranch';G.queue=[];G.busy=false;ensureWorld();document.body.classList.add('playing');$('title').classList.remove('on');setMode('ranch');R.me.x=0;R.me.z=9;R.me.ry=Math.PI;R.cam.tx=0;R.cam.tz=9;setAvatarColor(0);R.av.visible=true;
 S.mons.forEach(m=>{if(m.exp&&!S.exps.some(e=>e.uids.includes(m.uid)))m.exp=false;tickMon(m,now())});applyTown(S.town);syncPasture();rollQuests();hud();wake();MUSIC.set('ranch');saveNow();
 if(S.tut===0){openP('Welcome to Monster Ranch!',starterH,()=>{if(S.tut===0)setTimeout(()=>openP('Welcome to Monster Ranch!',starterH),50)})}
 else{if(!showRecap(away)&&daily().can)ACT.dailyOpen()}
 const jc=G.joinCode;if(jc){G.joinCode=null;history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>joinGame(jc),400)}}
function toTitle(){leaveNet();G.ph='title';document.body.classList.remove('playing');document.body.classList.remove('inbattle');$('title').classList.add('on');setMode('title');R.av.visible=false;R.pm.forEach(p=>world.remove(p.g));R.pm.clear();PT.newSlot=-1;renderSlots();S=null;hud0()}
const hud0=()=>{};
let wl=null;async function wake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();else wake()});addEventListener('pagehide',saveNow);
/* ================= boot ================= */
function render(){renderer.render(scene,camera)}
let lastT=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-lastT)/1000);lastT=t;try{update(dt);render()}catch(e){if(!loop.err){loop.err=1;console.error(e);window.__loopErr=String(e.stack)}}}
async function boot(){try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))])}catch(e){}
 try{ensureWorld();R.av.visible=false;setMode('title')}catch(e){console.error(e);$('slots').innerHTML='<div class="note">3D graphics are not available on this device.</div>';return}
 G.queue=[];renderSlots();const h=location.hash.replace('#','').toUpperCase();if(/^[A-Z]{4}$/.test(h)){G.joinCode=h;const b=$('joinBanner');b.style.display='block';b.innerHTML='Joining friend\'s ranch <b>'+h+'</b>.<br>Choose your save slot below.'}
 requestAnimationFrame(loop)}
boot();
window.__game={G,R,BT,net,update,render,get S(){return S},setS(s){S=s},ACT,startGame,hud,teamB,runBattle,step,bnew,mkB,aiAct,newMon,mkEgg,buildMon,buildAvatar,portrait,SPECIES,SPL,MV,mStats,gainXp,cinHatch,cinEvolve,genFoes,foeMon,addMon,syncPasture,resolveCol,saveNow,encodeSave,decodeSave,openP,closeP,startMini,world,stage,scene,camera,renderer,NEAR,colC,colB,PAST,toTitle,joinGame,hostGame,mulberry,weekId,tutAdv,actionBtn,runCup,
 skew(ms){G.skew+=ms},ff(sec){const n=Math.round(sec*30);for(let i=0;i<n;i++)update(1/30)}};
</script>
