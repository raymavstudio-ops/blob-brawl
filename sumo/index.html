<style>

#mute{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:20px;z-index:6;padding:0;cursor:pointer}
#quit{position:fixed;top:max(8px,env(safe-area-inset-top));right:calc(max(10px,env(safe-area-inset-right)) + 56px);width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font:400 20px 'Lilita One',sans-serif;color:var(--ink);z-index:6;padding:0;cursor:pointer;display:none}

      <button id="btnHost" class="btn">HOST A GAME</button>

  </div>
</div>

<div id="results" class="screen">
  <div class="card">
    <h2 id="resTitle">YOU WIN!</h2>

    <div class="res" id="resList"></div>

  </div>
</div>

<div id="toast"></div>

    if(S.arena==='bumpers'&&p.y<.9){

        const nx=dx/d,nz2=dz/d;p.x=B[0]+nx*rs;p.z=B[1]+nz2*rs;const vn=p.vx*nx+p.vz*nz2;if(vn<0){p.vx-=2*vn*nx;p.vz-=2*vn*nz2}
        p.vx+=nx*7.5*(S.sd?1.4:1);p.vz+=nz2*7.5*(S.sd?1.4:1);p.kb=.35;if(p.bt<=0){p.bt=.15;emit({k:'bump',i,x:r2(p.x),z:r2(p.z),id:p.id})}});
    }else if(S.arena==='sweeper'){
      { // hub
        const d=Math.hypot(p.x,p.z),rs=p.r+.95;if(d<rs&&d>1e-4&&p.y<1){const nx=p.x/d,nz2=p.z/d;p.x=nx*rs;p.z=nz2*rs;const vn=p.vx*nx+p.vz*nz2;if(vn<0){p.vx-=1.6*vn*nx;p.vz-=1.6*vn*nz2}}
      }
      if(p.y<.75){
        const ux=Math.cos(S.sw),uz=Math.sin(S.sw),L2=8.9;let t=clamp(p.x*ux+p.z*uz,-L2,L2);const cx=ux*t,cz=uz*t;
        let dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz);const rs=p.r+.3;
        if(d<rs){if(d<1e-4){dx=-uz;dz=ux;d=1}const nx=dx/d,nz2=dz/d;p.x=cx+nx*rs;p.z=cz+nz2*rs;
          const bvx=-S.swW*cz,bvz=S.swW*cx,rv=(p.vx-bvx)*nx+(p.vz-bvz)*nz2;
          if(rv<0){p.vx-=TUNE.swR*rv*nx;p.vz-=TUNE.swR*rv*nz2;p.vx+=nx*TUNE.swK*(S.sd?1.4:1);p.vz+=nz2*TUNE.swK*(S.sd?1.4:1);p.kb=.35;
            if(p.bt<=0&&-rv>2.5){p.bt=.2;emit({k:'bonk',x:r2(p.x),y:.5,z:r2(p.z),a:p.id,b:-1,f:r1(-rv)})}}}
      }
    }
  }
  // repel field
  for(const p of L){if(p.pw!=='magnet')continue;
    for(const q of L){if(q===p)continue;const dx=q.x-p.x,dz=q.z-p.z,d=Math.hypot(dx,dz);if(d>3.8||d<1e-3)continue;
      const f=26*(1-d/3.8)/q.m*dt;q.vx+=dx/d*f;q.vz+=dz/d*f;if(f>.08){q.lastHit=p.id;q.lastHitT=S.at}}}
}
function ko(p){
  p.alive=false;p.fall=false;p.falls++;
  const k=p.lastHit>=0&&S.at-p.lastHitT<5?pById(p.lastHit):null;if(k&&k!==p)k.kos++;
  emit({k:'ko',id:p.id,by:k?k.id:-1,x:r2(p.x),z:r2(p.z)});
}
function pickups(dt){
  S.pickT-=dt;
  if(S.pickT<=0&&S.picks.length<2){
    S.pickT=6+Math.random()*3;
    const R=S.arena==='shrink'?S.rr:S.arena==='crumble'?RING[1]:ARENAS[S.arena].R;
    for(let t=0;t<25;t++){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*R*.62,x=Math.cos(a)*r,z=Math.sin(a)*r;
      if(!supported(x,z)||edgeDist(x,z)<1.5)continue;
      if(S.arena==='bumpers'&&BUMP.some(B=>Math.hypot(x-B[0],z-B[1])<B[2]+1))continue;
      if(S.arena==='sweeper'&&r<1.6)continue;
      S.picks.push({id:S.pickId++,type:PW_KEYS[Math.random()*4|0],x:r2(x),z:r2(z)});break}
  }
  for(let i=S.picks.length-1;i>=0;i--){const k=S.picks[i];
    if(!supported(k.x,k.z)){S.picks.splice(i,1);continue}
    for(const p of S.players){if(!p.alive||p.fall||p.y>1.8||Math.hypot(p.x-k.x,p.z-k.z)>p.r+.5)continue;
      p.pw=k.type;p.pwT=PW[k.type].t;S.picks.splice(i,1);emit({k:'pick',id:p.id,t:k.type,x:k.x,z:k.z});break}}
}

/* ================= bots ================= */
function botThink(b,dt){
  const ai=b.ai;ai.t-=dt;ai.cc=(ai.cc||0)-dt;b.jumpReq=false;
  const others=S.players.filter(q=>q!==b&&q.alive&&!q.fall);
  if(ai.t<=0){ai.t=.25+Math.random()*.3;
    let best=null,bs=1e9;for(const q of others){const s=Math.hypot(q.x-b.x,q.z-b.z)*.4+edgeDist(q.x,q.z)*.9+(q.id===ai.tgt?-.6:0)+Math.random()*.5;if(s<bs){bs=s;best=q}}
    ai.tgt=best?best.id:-1;ai.want=.35+Math.random()*.6;}
  const tg=pById(ai.tgt);
  let ox=0,oz=0;
  const px=b.x+b.vx*.45,pz=b.z+b.vz*.45,ed=edgeDist(b.x,b.z);
  const danger=!supported(px,pz)||ed<1.1;
  if(danger){
    let bd=-1,bx=0,bz=0,cl=Math.hypot(b.x,b.z)||1;
    for(let i=0;i<16;i++){const a=i*Math.PI/8,dx=Math.cos(a),dz=Math.sin(a),s=probe(b.x,b.z,dx,dz,5)+(-(dx*b.x+dz*b.z)/cl)*.8;if(s>bd){bd=s;bx=dx;bz=dz}}
    ox=bx;oz=bz;
    if(b.hold&&!supported(b.x+b.vx*.25,b.z+b.vz*.25)){b.ix=ox;b.iz=oz;b.hold=false;return} // emergency dash back to safety
    if(b.hold&&b.ch<.2)b.hold=false;
  }else if(tg){
    const dx=tg.x-b.x,dz=tg.z-b.z,d=Math.hypot(dx,dz)||1,cl=Math.hypot(tg.x,tg.z)||1,outx=tg.x/cl,outz=tg.z/cl;
    let ax=tg.x-outx*1.8,az=tg.z-outz*1.8;if(d<2.6){ax=tg.x;az=tg.z}
    ox=ax-b.x;oz=az-b.z;
    const pushOut=(dx*outx+dz*outz)/d;
    if(!b.hold&&b.cd<=0&&d<5.5&&d>1.2&&!b.air&&ai.cc<=0&&(pushOut>.15||Math.random()<.01))b.hold=true;
    if(b.hold){const lead=.25;ox=dx+tg.vx*lead;oz=dz+tg.vz*lead;if(b.ch>=ai.want||d<1.4+b.ch*2.4){b.hold=false;ai.cc=TUNE.botCd*(.6+Math.random()*.8)}}
    if(!b.air&&!b.hold){let near=0;for(const q of others)if(Math.hypot(q.x-b.x,q.z-b.z)<2.6)near++;if(near&&Math.random()<dt*(.6+near*.4)){b.jumpReq=true;ai.pnd=true}}
  }else{ox=-b.x;oz=-b.z}
  if(b.air&&ai.pnd&&b.vy<1.5&&!b.pound){b.jumpReq=true;ai.pnd=false}
  if(!b.air&&!b.jumpReq)ai.pnd=false; // (was cleared on the very frame the jump was requested, so bots never ground-pounded)
  // hazards: jump over the sweeper, dodge charging blobs
  if(!b.air&&!b.hold){
    if(S.arena==='sweeper'){const d=Math.hypot(b.x,b.z);if(d>1.4){let ph=Math.atan2(b.z,b.x)-S.sw;ph=((ph%Math.PI)+Math.PI)%Math.PI;if(ph/S.swW<.22+Math.random()*.08)b.jumpReq=true}}
    for(const q of others){if(q.dashT<=0)continue;const dx=b.x-q.x,dz=b.z-q.z,d=Math.hypot(dx,dz);if(d<3&&(q.vx*dx+q.vz*dz)/d>4&&Math.random()<.25){if(Math.random()<.5)b.jumpReq=true;else{ox=-dz;oz=dx}}}
  }
  if(!danger&&ed<2.4){const cl=Math.hypot(b.x,b.z)||1;ox-=b.x/cl*(2.4-ed);oz-=b.z/cl*(2.4-ed)}
  const n=Math.hypot(ox,oz);b.ix=n>1e-3?ox/n:0;b.iz=n>1e-3?oz/n:0;
}

/* ================= snapshots ================= */
function flags(p){return(p.alive?1:0)|(p.fall?2:0)|(p.air?4:0)|(p.pound?8:0)|(p.dashT>0?16:0)|(p.stun>0?32:0)|(p.hold?64:0)}
function pushSnap(force){
  if(!conns.length){evq=[];return}
  bcast({t:'s',ph:S.ph,rd:S.round,ar:S.arena,tm:r2(S.tm),at:r1(S.at),sd:S.sd?1:0,w:S.winner,sw:r2(S.sw),sww:r2(S.swW),rr:r2(S.rr),
    tl:S.arena==='crumble'?S.tiles.map(v=>v<0?-1:r1(v)):0,
    p:S.players.map(p=>[p.id,r2(p.x),r2(p.y),r2(p.z),r1(p.vx),r1(p.vz),flags(p),r2(p.ch),r2(p.r),PW_KEYS.indexOf(p.pw),r1(p.pwT),p.wins,p.kos,r2(p.fx),r2(p.fz),p.falls]),
    k:S.picks.map(k=>[k.id,PW_KEYS.indexOf(k.type),k.x,k.z]),ev:evq});
  evq=[];
}

/* ================= lobby / network ================= */
function addBotsTo(n){const used=S.players.map(p=>p.ci);while(S.players.length<n){let ci=0;while(used.includes(ci))ci++;used.push(ci);S.players.push(mk(S.nextId++,BOT_NAMES[ci],ci,true))}}
function syncBots(){S.players=S.players.filter(p=>!p.bot);if(S.role==='solo'||S.botFill)addBotsTo(4);S.players.sort((a,b)=>a.ci-b.ci)}
function lobbyMsg(){return{t:'lobby',code:S.code,botFill:S.botFill,players:S.players.map(p=>({id:p.id,name:p.name,ci:p.ci,bot:p.bot}))}}
function sendLobby(){bcast(lobbyMsg());renderLobby()}
function freeCi(){const u=S.players.filter(p=>!p.bot).map(p=>p.ci);let c=0;while(u.includes(c))c++;return c}
function hostGame(tries=0){
  audio();cleanupNet();S.role='host';S.code=genCode();S.players=[];conns=[];S.botFill=true;const gen=++S.gen;
  toast('Creating room…');
  try{peer=new Peer(PEER_PREFIX+S.code,{config:{iceServers:ICE}})}catch(e){toast('Network not available');S.role=null;return}
  const pr=peer;
  pr.on('open',()=>{if(gen!==S.gen)return;const p=mk(S.nextId++,getName(),0,false);S.me=p.id;S.players=[p];syncBots();setPhase('lobby');renderLobby()});
  pr.on('connection',c=>{if(gen===S.gen)onConn(c)});
  pr.on('error',e=>{if(gen!==S.gen)return;
    if(e.type==='unavailable-id'&&tries<5)hostGame(tries+1);
    else if(S.ph==='menu'){toast('Could not create room ('+e.type+')');cleanupNet();S.role=null}
    else toast('Network hiccup: '+e.type)});
  pr.on('disconnected',()=>{if(gen===S.gen&&!pr.destroyed){try{pr.reconnect()}catch(e){}}});
}
function onConn(conn){conn.on('data',m=>hostMsg(conn,m));conn.on('close',()=>dropConn(conn));conn.on('error',()=>dropConn(conn))}
function hostMsg(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    if(conn._p)return;const humans=S.players.filter(p=>!p.bot).length;
    if(isPlaying()){send(conn,{t:'full',why:'Match in progress — try again in a moment'});setTimeout(()=>conn.close(),300);return}
    if(humans>=4){send(conn,{t:'full',why:'Room is full'});setTimeout(()=>conn.close(),300);return}
    S.players=S.players.filter(p=>!p.bot);
    const p=mk(S.nextId++,String(m.name||'Player').slice(0,10),freeCi(),false,conn);
    conn._p=p;conns.push(conn);S.players.push(p);syncBots();send(conn,{t:'welcome',id:p.id});
    if(S.ph==='podium')setPhase('lobby');
    sendLobby();toast(p.name+' joined!');
  }else if(m.t==='in'&&conn._p){
    const p=conn._p,c=v=>clamp(+v||0,-1,1);p.ix=c(m.ix);p.iz=c(m.iz);p.hold=!!m.h;p.inT=time;
    if(p.jseq===null){p.jseq=m.j|0;p.rseq=m.r|0;return}
    if((m.j|0)>p.jseq){p.jseq=m.j|0;if(S.ph==='play')p.jumpReq=true}
    if((m.r|0)>p.rseq){p.rseq=m.r|0;if(S.ph==='play')p.relReq=true}
  }
}
function dropConn(conn){
  const p=conn._p;conns=conns.filter(c=>c!==conn);if(!p)return;conn._p=null;
  if(S.ph==='lobby'||S.ph==='podium'){S.players=S.players.filter(q=>q!==p);syncBots();if(S.ph==='lobby')sendLobby()}
  else{p.bot=true;p.conn=null}
  toast(p.name+' left'+(isPlaying()?' — a bot takes over':''));
}
function joinGame(code){
  audio();code=(code||'').toUpperCase().trim();if(!/^[A-Z]{4}$/.test(code)){toast('Enter the 4-letter code');return}
  cleanupNet();S.role='client';S.code=code;S.players=[];toast('Connecting…');const gen=++S.gen;
  try{peer=new Peer(undefined,{config:{iceServers:ICE}})}catch(e){toast('Network not available');S.role=null;return}
  const pr=peer,name=getName();let ok=false;
  const fail=msg=>{if(ok||gen!==S.gen)return;toast(msg);leave()};
  const to=setTimeout(()=>fail('Could not connect. Check the code and try again'),15000);
  pr.on('open',()=>{if(gen!==S.gen)return;
    const c=pr.connect(PEER_PREFIX+code,{reliable:true});hostConn=c;
    c.on('open',()=>{ok=true;clearTimeout(to);send(c,{t:'join',name})});
    c.on('data',m=>{if(gen===S.gen)clientMsg(m)});
    c.on('close',()=>{if(gen===S.gen&&S.role==='client'){toast('Host left the game');leave()}})});
  pr.on('error',e=>{if(gen!==S.gen)return;if(e.type==='peer-unavailable')fail('Room '+code+' not found');else if(!ok)fail('Network error: '+e.type)});
}
function clientMsg(m){
  if(!m)return;
  if(m.t==='welcome')S.me=m.id;
  else if(m.t==='full'){toast(m.why);leave()}
  else if(m.t==='lobby'){
    S.code=m.code;S.botFill=m.botFill;
    S.players=m.players.map(q=>{const p=S.players.find(o=>o.id===q.id)||mk(q.id,q.name,q.ci,q.bot);p.name=q.name;p.ci=q.ci;p.bot=q.bot;return p});
    if(S.ph!=='lobby')setPhase('lobby');renderLobby();
  }else if(m.t==='s'){
    const newRound=m.rd!==S.round||m.ar!==S.arena;
    S.tm=m.tm;S.at=m.at;S.sd=!!m.sd;S.winner=m.w;S.sw=m.sw;S.swW=m.sww;S.rr=m.rr;
    if(newRound){S.round=m.rd;S.arena=m.ar;resetArena();S.at=m.at;S.sw=m.sw;S.rr=m.rr;if(FX)FX.buildArena()}
    if(m.tl)S.tiles=m.tl;
    for(const e of m.p){
      const p=pById(e[0]);if(!p)continue;
      p.sx=e[1];p.sy=e[2];p.sz=e[3];p.vx=e[4];p.vz=e[5];const f=e[6];
      p.alive=!!(f&1);p.fall=!!(f&2);p.air=!!(f&4);p.pound=!!(f&8);p.dashT=f&16?.1:0;p.stun=f&32?.1:0;p.hold=!!(f&64);
      p.ch=e[7];p.r=e[8];p.pw=PW_KEYS[e[9]]||'';p.pwT=e[10];p.wins=e[11];p.kos=e[12];p.fx=e[13];p.fz=e[14];p.falls=e[15];p.snapT=0;
      if(!p.seen||newRound||m.ph==='intro'||Math.hypot(p.sx-p.x,p.sz-p.z)>3){p.x=p.sx;p.y=p.sy;p.z=p.sz;p.seen=true}
    }
    S.picks=m.k.map(k=>({id:k[0],type:PW_KEYS[k[1]],x:k[2],z:k[3]}));
    for(const e of m.ev)fx(e);
    if(m.ph!==S.ph)setPhase(m.ph);
  }
}
function cleanupNet(){try{if(hostConn)hostConn.close()}catch(e){}try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}peer=null;hostConn=null;conns=[]}
function leave(){S.gen++;S.role=null;cleanupNet();S.players=[];S.me=-1;S.picks=[];setPhase('menu')}
function soloGame(){audio();cleanupNet();S.gen++;S.role='solo';S.code='';conns=[];const p=mk(S.nextId++,getName(),0,false);S.me=p.id;S.players=[p];syncBots();setPhase('lobby');renderLobby()}

/* ================= UI ================= */
function setPhase(ph){

  const on=(id,v)=>$(id).classList.toggle('on',v);

  if(ph==='podium')buildResults();

  else Music.start();

  else joyReset();

}

}

const BN={t:0,a:'',b:'',life:0};
function showBanner(a,b,dur){BN.a=a;BN.b=b;BN.t=dur;BN.life=0}
function updateBanner(dt){

  if(BN.t>0){BN.t-=dt;BN.life+=dt;a=BN.a;b=BN.b;age=BN.life}
  else if(S.ph==='intro'){const ar=ARENAS[S.arena];age=3.2-S.tm;
    if(S.tm>1.1){a='ROUND '+S.round;b=ar.e+' '+ar.name+'!';if(S.players.some(p=>p.wins===WIN_ROUNDS-1))b+=' · MATCH POINT'}
    else{a=String(Math.max(1,Math.ceil(S.tm*2)));b='Get ready…';age=(1.1-S.tm)%.5}}
  else if(S.ph==='rend'){const w=pById(S.winner);age=3.2-S.tm;a=w?(w.id===S.me?'YOU WIN THE ROUND!':w.name.toUpperCase()+' WINS!'):'DRAW!';b=w?'★ '+w.wins+' / '+WIN_ROUNDS:'Everybody splashed'}
  const el=$('banner');
  if(!a){if(el.style.display!=='none')el.style.display='none';return}
  el.style.display='block';
  if(el.firstChild.textContent!==a)el.firstChild.textContent=a;if(el.lastChild.textContent!==b)el.lastChild.textContent=b;
  const s=age<.25?.4+age/.25*.75:age<.4?1.15-(age-.25)/.15*.15:1;el.style.transform=`scale(${s.toFixed(3)}) rotate(-2deg)`;
}

let netT=0,inT=0,chgSnd=0,lastSent='';
function update(dt){
  time+=dt;
  shake*=Math.exp(-dt*7);shake=Math.max(0,shake-dt*.05);
  readInput();
  const m=me(),playing=isPlaying();
  if(S.role==='host'||S.role==='solo'){
    if(m){
      if(S.ph==='play'){m.ix=inp.ix;m.iz=inp.iz;m.hold=inp.hold;if(inp.jseq!==inp.lj)m.jumpReq=true;if(inp.rseq!==inp.lr)m.relReq=true}
      else{m.ix=m.iz=0;m.hold=false}
    }
    inp.lj=inp.jseq;inp.lr=inp.rseq;
    if(playing){const n=Math.max(1,Math.ceil(dt/(1/60)-.01));for(let i=0;i<n;i++)simulate(dt/n);netT+=dt;if(netT>=.05){netT=0;pushSnap()}}
    else if(S.ph==='podium'){netT+=dt;if(netT>=.5){netT=0;pushSnap()}}
  }else if(S.role==='client'){
    inT+=dt;
    const msg={t:'in',ix:+inp.ix.toFixed(2),iz:+inp.iz.toFixed(2),h:inp.hold?1:0,j:inp.jseq,r:inp.rseq},key=msg.h+'|'+msg.j+'|'+msg.r;
    if(playing&&(inT>=.033||key!==lastSent)){inT=0;lastSent=key;send(hostConn,msg)}
    const k=Math.min(1,dt*16);
    for(const p of S.players){p.snapT+=dt;const la=Math.min(p.snapT,.12),tx=p.sx+p.vx*la,tz=p.sz+p.vz*la;
      p.x+=(tx-p.x)*k;p.z+=(tz-p.z)*k;p.y+=(p.sy-p.y)*Math.min(1,dt*20)}
  }
  if(m&&S.ph==='play'&&m.ch>0&&m.alive){chgSnd-=dt;if(chgSnd<=0){chgSnd=.11;SFX.chg(m.ch)}}else chgSnd=0;
  for(let i=0;i<5;i++)S.bumpF[i]=Math.max(0,S.bumpF[i]-dt);
  let fc=false;for(let i=S.feed.length-1;i>=0;i--){S.feed[i].l-=dt;if(S.feed[i].l<=0){S.feed.splice(i,1);fc=true}}if(fc)renderFeed();
  if(playing){renderChips();updateBanner(dt)}else $('banner').style.display='none';
  if(m&&IS_TOUCH){const c=m.ch||0;bC.style.background=c>0?`conic-gradient(#ff3d5a ${Math.round(c*360)}deg,var(--pink) 0)`:'';}
  if(FX)FX.tick(dt);
}

  if(S.arena==='crumble'||ARENAS[S.arena].lava){lavaTex.offset.x=t*.01;lavaTex.offset.y=Math.sin(t*.3)*.02}else{waterTex.offset.x=t*.012;waterTex.offset.y=t*.006}

    const sc=(pod?.6:(p.r||.6))/.47;/* podium: normal size (a leftover Giant power-up made blobs overflow their step) */o.g.position.set(x,0,z);o.rig.position.y=Math.max(y,-3);o.rig.scale.setScalar(sc);

    {const hc=o.body.position.y,a=o.yawA,f=o.flip,sf=Math.sin(f);o.yaw.rotation.order='YXZ';o.yaw.rotation.x=f;
     o.yaw.position.set(-hc*sf*Math.sin(a),hc*(1-Math.cos(f)),-hc*sf*Math.cos(a))}

    o.feet.forEach((f,i)=>{f.position.z=.05+(moving?Math.sin(o.bob+i*Math.PI)*.15:0);f.position.y=.08+(moving?Math.max(0,Math.sin(o.bob+i*Math.PI))*.06:0)+(p.pw==='spring'?.2:0);f.coil.visible=p.pw==='spring';f.coil.position.y=f.position.y-.02;f.coil.position.z=f.position.z});
    if(p.pw==='spring')o.body.position.y+=.2;

    if(ch>.02){o.chRing.scale.setScalar(.7+ch*.9);tmpC.set(0xffd23f).lerp(RED,ch);o.chMat.color.copy(tmpC);o.arrow.position.z=1+ch*.8;o.arrow.scale.setScalar(.8+ch*.7)}

    const pow=p.pw==='speed'||p.pw==='giant'||ch>.6;o.bodyMat.emissive.set(pow?(ch>.6?0xff3d3d:COLORS[p.ci]):0x000000);o.bodyMat.emissiveIntensity=pow?.2+Math.sin(t*(ch>.6?30:12))*.15:0;
    // name tag
    if((playing||pod)&&p.alive&&!p.fall){const s=project(x,y+(pod?1.45:1.25)*sc*.47/.6+.4,z);if(s){
      const txt=p.name+(p.pw?' '+PW[p.pw].e:'');if(o.tagTxt!==txt){o.tagTxt=txt;o.tag.textContent=txt}
      o.tag.style.display='block';o.tag.style.transform=`translate(${(s.x).toFixed(1)}px,${(s.y).toFixed(1)}px) translate(-50%,-100%)`}}
  }
  for(const[id,o]of pm)if(!seen.has(id))dropBlob(id);

  /* pickups */
  const ps=new Set();
  if(playing)for(const k of S.picks){ps.add(k.id);let o=pickM.get(k.id);
    if(!o){const g=new THREE.Group(),icon=pickIcon(k.type),b=new THREE.Mesh(bubbleG,bubbleMat);g.add(icon);g.add(b);const sh=new THREE.Mesh(shadowG,shadowM);sh.rotation.x=-Math.PI/2;scene.add(g);scene.add(sh);o={g,icon,sh,born:t};pickM.set(k.id,o)}

  for(const[id,o]of pickM)if(!ps.has(id)){scene.remove(o.g);scene.remove(o.sh);pickM.delete(id)}

  else{
