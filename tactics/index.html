<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Blob Tactics</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--card:#fffdf6;--text:#1d1b3a;--dim:#5d5a80;--yellow:#ffd23f;--pink:#ff6fb5;--blue:#4cc9ff;--green:#7ee36a;--red:#ff5a6e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#5ec2ff,#c9f0ff);color:var(--text);font-family:'Fredoka',system-ui,sans-serif;font-weight:600;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body:not(.playing) #gl,body:not(.playing) #ov{display:none}
body:not(.playing){background:radial-gradient(circle at 15% 85%,#8be04e 0 90px,transparent 91px),radial-gradient(circle at 88% 78%,#ff9fcf 0 70px,transparent 71px),radial-gradient(circle at 80% 15%,#fff 0 60px,transparent 61px),radial-gradient(circle at 12% 12%,#fff 0 45px,transparent 46px),linear-gradient(#5ec2ff,#c9f0ff)}
canvas.gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));overflow:auto;z-index:5}
.screen.on{display:flex}
.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:16px 18px 14px;width:min(480px,100%);box-shadow:0 8px 0 var(--ink);margin:auto;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.card.wide{width:min(900px,100%)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(40px,10vw,60px);line-height:.92;text-align:center;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-3deg)}
h1 span{color:var(--pink)}
h2{font-family:'Lilita One',Impact,sans-serif;font-weight:400;margin:0 0 6px;font-size:30px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
h3{font-family:'Lilita One',sans-serif;font-weight:400;margin:6px 0 4px;font-size:19px}
.sub{text-align:center;color:var(--dim);margin:8px 0;font-size:14px}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px;letter-spacing:.6px;text-transform:uppercase}
input[type=text],textarea,select{width:100%;font:600 17px 'Fredoka',sans-serif;color:var(--ink);background:#eef6ff;border:3px solid var(--ink);border-radius:14px;padding:9px 12px;outline:none;user-select:text;-webkit-user-select:text}
textarea{height:110px;font-size:13px;resize:none}
.btn{display:block;width:100%;font:400 20px 'Lilita One',sans-serif;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:15px;padding:10px;margin-top:9px;cursor:pointer;box-shadow:0 5px 0 var(--ink);min-height:48px;text-align:center;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.btn.ghost{background:#fff}.btn.green{background:var(--green)}.btn.red{background:var(--red);color:#fff}
.btn.sm{font-size:16px;padding:6px 10px;margin-top:6px;width:auto;display:inline-block;min-width:48px}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.join{display:flex;gap:10px;margin-top:9px}.join input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Lilita One',sans-serif;font-size:22px}
.join .btn{width:auto;margin:0;padding:0 20px;flex:none}
.code{font-family:'Lilita One',sans-serif;font-size:46px;letter-spacing:8px;text-align:center;color:var(--blue);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);margin:0;cursor:pointer}
.invite{background:#fff2b8;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;text-align:center;font-size:14px;display:none;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.chip{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px 10px;font-size:14px;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.chip.sel{background:var(--yellow);transform:translateY(-2px)}
.chip.lock{opacity:.4;pointer-events:none}
.chip i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);flex:none}
.pill{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 12px;font-size:14px;display:inline-block}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.uc{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px;cursor:pointer;display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 var(--ink);min-height:56px}
.uc.sel{background:#fff2b8}.uc.down{opacity:.55}
.av{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:22px;flex:none}
.uc small{display:block;color:var(--dim);font-size:12px;font-weight:600}
.bar{height:10px;border-radius:6px;background:#d9d9e8;border:2px solid var(--ink);overflow:hidden;margin-top:3px}.bar>i{display:block;height:100%;background:var(--green)}
.bar.xp>i{background:var(--blue)}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tab{flex:1;min-width:64px;font:400 16px 'Lilita One',sans-serif;padding:8px 6px;border:3px solid var(--ink);border-radius:13px;background:#fff;cursor:pointer;text-align:center;min-height:48px;display:grid;place-items:center}
.tab.on{background:var(--yellow);box-shadow:0 3px 0 var(--ink)}
.camp{align-items:stretch}.camp .card{width:min(980px,100%);display:flex;flex-direction:column;max-height:100%;margin:0 auto}
#cbody{overflow:auto;flex:1;min-height:0;padding:2px}
.hdr{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.reg{margin-bottom:10px}.reg h3{color:var(--pink);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.nodes{display:flex;gap:8px;flex-wrap:wrap}
.node{width:92px;min-height:76px;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:5px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--ink);font-size:12px}
.node b{display:block;font:400 22px 'Lilita One';line-height:1}.node.lock{opacity:.4;pointer-events:none;filter:grayscale(1)}.node.done{background:#d8ffd0}.node.next{background:var(--yellow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.two{grid-template-columns:1fr}}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:13px;text-align:center;margin:6px 0}.st div{background:#eef6ff;border:2px solid var(--ink);border-radius:10px;padding:2px}
.ab{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:5px 8px;margin:4px 0;font-size:13px}.ab b{font-family:'Lilita One';font-weight:400;font-size:15px}
.rar0{color:#555}.rar1{color:#1f8ee0}.rar2{color:#a43be0}.rar3{color:#e08a00}
.switch{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:8px 12px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-size:15px;cursor:pointer;min-height:48px}
.switch span.t{flex:none;width:50px;height:28px;border-radius:14px;background:#d6d6e6;border:2.5px solid var(--ink);position:relative}
.switch span.t:after{content:'';position:absolute;left:2px;top:2px;width:19px;height:19px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);transition:.15s}
.switch.on span.t{background:var(--green)}.switch.on span.t:after{left:22px}
.pl{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-size:15px;margin:5px 0}
.pl i{width:16px;height:16px;border-radius:50%;background:currentColor;border:2.5px solid var(--ink);flex:none}.pl small{margin-left:auto;color:var(--dim)}
.rk{display:flex;gap:10px;align-items:center;padding:6px 12px;border-radius:14px;background:#fff;border:3px solid var(--ink);margin:5px 0;font-size:15px}
.rk span.n{margin-left:auto;font-family:'Lilita One';font-size:17px}
#hud{position:fixed;inset:0;display:none;pointer-events:none;z-index:4}
body.playing #hud{display:block}
#hud button,#hud #bar,#hud #info{pointer-events:auto}
#topL{position:absolute;left:max(8px,env(safe-area-inset-left));top:max(6px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:42vw}
.hp{background:#fff;border:3px solid var(--ink);border-radius:13px;padding:3px 10px;font:400 16px 'Lilita One';box-shadow:0 3px 0 var(--ink)}
.hp.team0{background:var(--blue)}.hp.team1{background:var(--red);color:#fff}
#objPill{font:600 13px 'Fredoka'}
#hint{font:600 13px 'Fredoka';background:#fff2b8;border:3px solid var(--ink);border-radius:12px;padding:3px 9px;display:none;max-width:42vw}
#topR{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(6px,env(safe-area-inset-top));display:flex;gap:6px}
@media (max-width:520px){#topR{top:calc(max(6px,env(safe-area-inset-top)) + 86px);flex-direction:column}#topL{max-width:80vw}}
.ib{width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:20px;cursor:pointer;padding:0}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#preview{position:absolute;left:50%;top:max(6px,env(safe-area-inset-top));transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 12px;font-size:14px;text-align:center;display:none;box-shadow:0 4px 0 var(--ink);max-width:30vw}
#info{position:absolute;left:max(8px,env(safe-area-inset-left));top:46%;transform:translateY(-50%);width:210px;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:8px 10px;font-size:13px;display:none;box-shadow:0 4px 0 var(--ink);max-height:58vh;overflow:auto}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(6px,env(safe-area-inset-bottom));gap:6px;align-items:stretch;background:rgba(255,253,246,.94);border:3px solid var(--ink);border-radius:18px;padding:5px 7px;box-shadow:0 4px 0 var(--ink);max-width:calc(100vw - 16px);display:none}
#ucard{min-width:112px;max-width:150px;font-size:12px;line-height:1.15;display:flex;flex-direction:column;justify-content:center}
#ucard b{font:400 15px 'Lilita One'}
.ab-btn{min-width:60px;height:56px;border:3px solid var(--ink);border-radius:13px;background:#fff;font:600 12px 'Fredoka';padding:2px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:0 3px 0 var(--ink);position:relative}
.ab-btn span{font-size:20px}.ab-btn.on{background:var(--yellow);transform:translateY(-3px)}.ab-btn.off{opacity:.4}
.ab-btn em{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;border-radius:9px;font-style:normal;font-size:11px;padding:0 5px;border:2px solid var(--ink)}
.ab-btn.end{background:var(--green)}
#modal{z-index:12;background:rgba(29,27,58,.45)}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-100px);background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 16px;border-radius:14px;z-index:30;transition:transform .25s cubic-bezier(.3,1.6,.5,1);max-width:90vw;text-align:center;pointer-events:none}
#toast.on{transform:translateX(-50%) translateY(0)}
#mute{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));left:max(8px,env(safe-area-inset-left));z-index:6}
body.playing #mute,body:has(#camp.on) #mute,body:has(#brief.on) #mute{display:none}
#rotate{position:fixed;inset:0;background:linear-gradient(#5ec2ff,#c9f0ff);z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font:400 28px 'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
@media (orientation:portrait){body.playing.touch #rotate{display:flex}}
@media (max-height:480px){.card{padding:10px 14px}h1{font-size:34px;transform:none}.btn{padding:4px 8px;margin-top:6px;font-size:17px}h2{font-size:24px}.sub{margin:4px 0}.code{font-size:30px}input[type=text]{padding:4px 10px}.node{min-height:64px}}
.btn,.chip,.tab,.switch,input[type=text],select,.btn.sm{min-height:54px}.ib{width:54px;height:54px}.ab-btn{min-width:62px;height:58px}.hp,#hint{min-height:0}
.btn.sm{padding:6px 12px}
@media (max-height:480px){.btn,.chip,.tab,.switch,input[type=text],select,.btn.sm{min-height:54px;padding-top:2px;padding-bottom:2px}.node{min-height:60px}}
small{font-size:12px}.chip{min-width:54px}
</style>
</head>
<body>
<canvas id="gl" class="gl"></canvas><canvas id="ov"></canvas>
<div id="hud">
 <div id="topL"><div class="hp" id="turnPill"></div><div class="hp" id="objPill"></div><div id="hint"></div></div>
 <div id="topR"><button class="ib" id="bRotL" aria-label="rotate left">⟲</button><button class="ib" id="bRotR" aria-label="rotate right">⟳</button><button class="ib" id="bZoom" aria-label="zoom">🔍</button><button class="ib" id="bMute" aria-label="sound">🔊</button><button class="ib" id="bPause" aria-label="menu">⏸</button></div>
 <div id="preview"></div><div id="info"></div>

</div>
<button class="ib" id="mute" aria-label="sound">🔊</button>

 <h1>BLOB<br><span>TACTICS</span></h1><div class="sub">Command a squad of blobs in cartoon turn-based battles</div>

 <button id="btnInvite" class="btn pink" style="display:none">JOIN THE BATTLE</button>

 <a class="btn ghost" href="../" style="margin-top:9px">◀ Arcade</a>
</div></div>

<div id="brief" class="screen"><div class="card wide" id="briefCard"></div></div>
<div id="lobby" class="screen"><div class="card wide" id="lobbyCard"></div></div>

function aiUnit(u){const beh=u.ai==='boss'&&!u.aggro?'def':u.ai==='boss'?'agg':u.ai;if(u.hp<u.mhp)u.aggro=true;
 const rc=reach(u),enemies=B.units.filter(e=>foe(e,u)&&e.hp>0&&!e.tur),allies=B.units.filter(a=>!foe(a,u)&&a!==u&&a.hp>0&&!a.tur);

   for(const[tx,ty]of abTargets(u,id,x,y)){const P=plan(u,id,tx,ty,x,y);let s=scoreAb(u,id,P,x,y);if(s<=0)continue;s=s*(beh==='sup'&&!P.res.some(r=>r.heal!==undefined)?.7:1)+pos+rnd()*1.2-(rc.dist[si]>0?.1:0);

 let srcs=enemies.map(e=>[e.x,e.y]);if(beh==='sup'&&allies.length)srcs=allies.filter(a=>a.hp<a.mhp||true).map(a=>[a.x,a.y]);

function genMap(o){const R=mkRng(o.seed),w=o.w,h=o.h,N=w*h,t=new Array(N).fill('.'),H=new Array(N).fill(0),hp=new Array(N).fill(0),own=new Array(N).fill(-1),I=(x,y)=>y*w+x;
 const rx=(a,b)=>a+Math.floor(R()*(b-a+1)),mid=h>>1,fr=x=>x>=3&&x<w-3;
 const hills=o.hi||3;for(let k=0;k<hills;k++){const cx=rx(3,w-4),cy=rx(1,h-2),r=R()<.5?2:1;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const d=Math.abs(x-cx)+Math.abs(y-cy);if(d<=r&&H[I(x,y)]<1)H[I(x,y)]=1;if(d===0&&r===2)H[I(x,y)]=2}}
 const ponds=o.wa||(o.th==='marsh'?5:2);for(let k=0;k<ponds;k++){let cx=rx(4,w-5),cy=rx(0,h-1);const n=rx(2,5);for(let j=0;j<n;j++){if(fr(cx)&&inb2(cx,cy)&&Math.abs(cy-mid)>=0){t[I(cx,cy)]='w';H[I(cx,cy)]=0}cx+=rx(-1,1);cy+=rx(-1,1)}}
 function inb2(x,y){return x>=0&&y>=0&&x<w&&y<h}
 const fo=o.f||(o.th==='marsh'?7:4);for(let k=0;k<fo;k++){let cx=rx(1,w-2),cy=rx(0,h-1);const n=rx(3,6);for(let j=0;j<n;j++){if(inb2(cx,cy)&&t[I(cx,cy)]==='.')t[I(cx,cy)]='f';cx+=rx(-1,1);cy+=rx(-1,1)}}
 const wl=o.wl||2;for(let k=0;k<wl;k++){let x=rx(3,w-4),y=rx(0,h-1);const ln=rx(2,3),hz=R()<.5;for(let j=0;j<ln;j++){const xx=hz?x+j:x,yy=hz?y:y+j;if(inb2(xx,yy)&&fr(xx)&&t[I(xx,yy)]!=='w'){t[I(xx,yy)]='#';hp[I(xx,yy)]=3;H[I(xx,yy)]=0}}}
 for(let k=0;k<3;k++){const x=rx(3,w-4),y=rx(0,h-1);if(t[I(x,y)]==='.'){t[I(x,y)]='r';H[I(x,y)]=0}}
 if(o.mirror){for(let y=0;y<h;y++)for(let x=0;x<w>>1;x++){const a=I(x,y),b=I(w-1-x,y);t[b]=t[a];H[b]=H[a];hp[b]=hp[a]}}
 const zone=[];let exit=null;
 if(o.obj==='hold'){const cx=w>>1,cy=mid;for(const[dx,dy]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const x=cx+dx,y=cy+dy;t[I(x,y)]='.';hp[I(x,y)]=0;H[I(x,y)]=1;zone.push([x,y])}
  for(const[dx,dy]of[[2,0],[-2,0],[0,2],[0,-2],[1,1],[-1,-1],[1,-1],[-1,1]]){const x=cx+dx,y=cy+dy;if(inb2(x,y)&&H[I(x,y)]<1&&t[I(x,y)]!=='#')H[I(x,y)]=1;if(inb2(x,y)&&(t[I(x,y)]==='w'||t[I(x,y)]==='r'))t[I(x,y)]='.'}}
 if(o.obj==='escort'){exit=[w-1,mid];t[I(w-1,mid)]='.';H[I(w-1,mid)]=0;hp[I(w-1,mid)]=0}
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!fr(x)){const i=I(x,y);if(t[i]==='w'||t[i]==='#'||t[i]==='r'){t[i]='.';hp[i]=0}}}
 const wk=i=>t[i]!=='w'&&t[i]!=='#'&&t[i]!=='r';
 const ok=(a,b)=>{const seen=new Set([a]),q=[a];while(q.length){const c=q.shift(),cx=c%w,cy=(c/w)|0;if(c===b)return true;for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy;if(!inb2(nx,ny))continue;const n=I(nx,ny);if(seen.has(n)||!wk(n)||Math.abs(H[n]-H[c])>1)continue;seen.add(n);q.push(n)}}return false};
 for(let tries=0;tries<3;tries++){if(!ok(I(0,mid),I(w-1,mid))){for(let x=0;x<w;x++){const i=I(x,mid);if(t[i]==='w'||t[i]==='#'||t[i]==='r')t[i]='.';hp[i]=0;H[i]=Math.min(H[i],x>0&&x<w-1?1:0);if(x>0&&Math.abs(H[i]-H[i-1])>1)H[i]=H[i-1]}}}
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=I(x,y);for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(inb2(nx,ny)&&Math.abs(H[I(nx,ny)]-H[i])>1&&H[i]>H[I(nx,ny)])H[i]=H[I(nx,ny)]+1}}
 const pick=(xs)=>{const out=[];for(const x of xs)for(let k=0;k<h;k++){const y=(mid+(k%2?1:-1)*Math.ceil(k/2)+h)%h;const i=I(x,y);if(wk(i)&&!(exit&&exit[0]===x&&exit[1]===y))out.push([x,y])}return out};
 const spP=pick([0,1,2]),spE=pick([w-1,w-2,w-3]);
 return{w,h,t,ht:H,hp,own,th:o.th,traps:[],zone,exit,spP,spE}}
function enemyPool(m,minx){const out=[];for(let x=m.w-1;x>=minx;x--)for(let y=0;y<m.h;y++){const i=y*m.w+x;if(m.t[i]!=='w'&&m.t[i]!=='#'&&m.t[i]!=='r'&&!(m.exit&&m.exit[0]===x&&m.exit[1]===y))out.push([x,y])}return out}

function createBattle(cfg){const mis=cfg.mis?MIS.find(m=>m.id===cfg.mis):null,pvp=!mis;
 const o=mis?{w:mis.w,h:mis.h,seed:mis.seed+(cfg.kind==='replay'?0:0),th:REG[mis.r].th,obj:mis.obj,f:mis.f,wa:mis.wa,wl:mis.wl,hi:mis.hi}:{w:13,h:10,seed:cfg.seed,th:['meadow','marsh','crags'][cfg.seed%3],obj:'rout',mirror:true};
 const m=genMap(o);B={kind:cfg.kind,mis:mis?mis.id:0,seed:o.seed,rs:(cfg.seed||o.seed)|0,m,units:[],nid:1,turn:1,phase:0,stage:'ai',aiq:[],evq:[],cmdq:[],over:null,fog:!!cfg.fog,perma:!!cfg.perma,
  seats:cfg.seats.map(s=>({name:s.name,team:s.team,present:s.present!==false,ended:false})),stats:{kills:0,dead:[]},waves:mis&&mis.waves?clone(mis.waves):null,vipLost:false,
  obj:{type:mis?mis.obj:'pvp',goal:mis?mis.goal:0,prog:0,zone:m.zone,exit:m.exit,par:mis?mis.par:0},my:cfg.my||0};
 const sp0=m.spP.slice(),sp1=pvp?m.spE.slice():null;
 cfg.seats.forEach((s,si)=>{for(const d of (s.squad||[])){const sp=(s.team===0?sp0:sp1).shift();if(!sp)break;const u=mkUnit(d,s.team,si,sp[0],sp[1]);B.units.push(u)}});
 if(mis){if(mis.obj==='escort'){const sp=sp0.shift();const v=mkUnit({cls:'scout',name:mis.id===2?'Pip':mis.id===7?'Mossbottom':'Ember Sage',lv:mis.r*3+1,vip:1,color:'#ffd23f',hat:'crown',promo:-1,items:[]},0,0,sp[0],sp[1]);v.hp=v.mhp=Math.round(v.mhp*1.3);v.sz=.95;B.units.push(v)}
  const pool=enemyPool(m,Math.floor(m.w*.55)),R=mkRng(mis.seed+9);pool.sort(()=>R()-.5);
  const list=mis.e.split(',');list.forEach(e=>{let z;if(e.includes('boss'))z=pool.find(p=>p[0]>=m.w-3&&Math.abs(p[1]-(m.h>>1))<=2)||pool[0];else z=pool.find(p=>p[0]>=m.w*.55);if(!z)return;pool.splice(pool.indexOf(z),1);B.units.push(mkUnit(enemyDto(e),1,-1,z[0],z[1]))})}
 else{const eq=cfg.seats.some(s=>s.team===1)?null:cfg.eSquad;(cfg.seats.filter(s=>s.team===1).length?[]:[0]).forEach(()=>{for(const d of eq||[]){const sp=sp1.shift();if(!sp)break;B.units.push(mkUnit(d,1,-1,sp[0],sp[1]))}})}

 if(banner.t>0){const k=Math.min(1,banner.t*3,(1.25-banner.t+.001)*5),y=innerHeight*.4;oc.globalAlpha=Math.min(1,banner.t*2);const s=Math.min(innerWidth/9,64)*(.8+.2*Math.min(1,k));oc.font=`400 ${s}px 'Lilita One',Impact,sans-serif`;oc.lineWidth=9;oc.strokeStyle='#1d1b3a';oc.fillStyle=banner.col;oc.strokeText(banner.txt,innerWidth/2,y);oc.fillText(banner.txt,innerWidth/2,y);
  if(banner.sub){oc.font=`400 ${s*.4}px 'Lilita One',sans-serif`;oc.lineWidth=5;oc.fillStyle='#fff';oc.strokeText(banner.sub,innerWidth/2,y+s*.5);oc.fillText(banner.sub,innerWidth/2,y+s*.5)}oc.globalAlpha=1}}
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth>1200?1.25:1.5));renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();const dpr=Math.min(devicePixelRatio||1,innerWidth>1200?1.25:1.5);ov.width=w*dpr;ov.height=h*dpr;if(built)fitCamKeep()}
function fitCamKeep(){}
addEventListener('resize',resize);resize();
/* ================= input ================= */
const ray=new THREE.Raycaster(),ptrs=new Map();let down=null,holdT=0,pinch=0;
function pick(cx,cy){if(!built||!B)return null;ray.setFromCamera(new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1),camera);const objs=[tops];for(const w of wallM.values())objs.push(w.o);for(const m of meshes.values())if(!m.dying&&m.root.visible)objs.push(m.root);
 const hs=ray.intersectObjects(objs,true);for(const h of hs){const o=h.object;if(o.userData.unit!==undefined){const u=B.units.find(x=>x.id===o.userData.unit);if(u)return[u.x,u.y]}if(o.userData.tile)return o.userData.tile;if(o===tops&&h.instanceId!==undefined)return[h.instanceId%B.m.w,(h.instanceId/B.m.w)|0]}return null}
glc.addEventListener('pointerdown',e=>{if(!document.body.classList.contains('playing'))return;try{glc.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){down={x:e.clientX,y:e.clientY,moved:false,held:false,btn:e.button};clearTimeout(holdT);holdT=setTimeout(()=>{if(down&&!down.moved&&ptrs.size===1){down.held=true;const t=pick(down.x,down.y);if(t)UI.hold(t[0],t[1])}},450)}
 else{const a=[...ptrs.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(down)down.moved=true}});
glc.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size>=2){const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch>0)cam.tdist=Math.max(cam.minD,Math.min(cam.maxD,cam.tdist*pinch/d));pinch=d;cam.last=performance.now();return}
 if(down){if(!down.moved&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>9)down.moved=true;if(down.moved){const k=cam.dist*.0014,dy2=dy*1.2;cam.tx+=(-Math.cos(cam.yaw)*dx-Math.sin(cam.yaw)*dy2)*k;cam.tz+=(Math.sin(cam.yaw)*dx-Math.cos(cam.yaw)*dy2)*k;cam.last=performance.now()}}});
const endP=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);clearTimeout(holdT);if(ptrs.size===0&&down){const d=down;down=null;if(!d.moved&&!d.held&&e.type==='pointerup'&&d.btn!==2){const t=pick(e.clientX,e.clientY);if(t)UI.tap(t[0],t[1]);else{UI.tap(-1,-1)}}}if(ptrs.size<2)pinch=0};
glc.addEventListener('pointerup',endP);glc.addEventListener('pointercancel',endP);glc.addEventListener('contextmenu',e=>e.preventDefault());
glc.addEventListener('wheel',e=>{e.preventDefault();cam.tdist=Math.max(cam.minD,Math.min(cam.maxD,cam.tdist*(1+Math.sign(e.deltaY)*.1)))},{passive:false});
/* ================= loop ================= */
let lt=0;function loop(t){requestAnimationFrame(loop);const dt=(t-lt)/1000;lt=t;if(!document.body.classList.contains('playing')&&!(B&&built))return;frame(dt||.016);draw()}
requestAnimationFrame(loop);
window.__game={get B(){return B},UI,R,update(dt){frame(dt)},render(){draw()},meshes,cam,scene,camera,SFX,ABIL,CLS,get blockT(){return blockT},evq,tasks};
R.ready=true;
}catch(err){console.error('Renderer failed',err);R.error=err;window.__game={error:String(err)};setTimeout(()=>toast('Graphics failed to start (WebGL needed)'),500)}
